<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 712" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="tf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="tf-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="tf-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1300" height="712" fill="#fbfbfa"/>
<text x="650.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">传书主流程：入库 → 母版库 → 优化 → 加入读器</text>
<text x="650.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">三个动作互相独立：入库不强制优化，优化后不强制落库；母版永久保留，落库只是复制</text>
<rect x="30" y="96" width="220" height="330" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="140.0" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">① 入库（原样，不转换）</text>
<rect x="46" y="136" width="188" height="52" rx="7" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.1"/>
<text x="140.0" y="154.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">网页上传</text>
<text x="140.0" y="178.5" text-anchor="middle" font-size="9.5" fill="#4a4a4a">多文件 · 进度 · 同名同大小去重</text>
<rect x="46" y="198" width="188" height="52" rx="7" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.1"/>
<text x="140.0" y="216.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">抓网文</text>
<text x="140.0" y="240.5" text-anchor="middle" font-size="9.5" fill="#4a4a4a">Readability 组 EPUB，可选同步优化</text>
<rect x="46" y="260" width="188" height="52" rx="7" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.1"/>
<text x="140.0" y="278.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">scp 进 inbox/</text>
<text x="140.0" y="302.5" text-anchor="middle" font-size="9.5" fill="#4a4a4a">追平队列（设备端）</text>
<text x="140" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">只收 EPUB / PDF</text>
<text x="140" y="362" text-anchor="middle" font-size="10" fill="#4a4a4a">入库时按规则整理书名：</text>
<text x="140" y="377" text-anchor="middle" font-size="10" fill="#4a4a4a">“书名 - 02卷”（数字在前）</text>
<text x="140" y="395" text-anchor="middle" font-size="10" fill="#4a4a4a">撞名各自入库，回执会说明</text>
<rect x="300" y="86" width="330" height="470" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="465.0" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">② 母版库（中间层暂存池）</text>
<text x="465.0" y="132.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">~/.local/state/shelf/books/staging/</text>
<text x="465.0" y="146.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">母版永久保留，可反复落库、两读器对照</text>
<rect x="316" y="168" width="298" height="150" rx="8" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
<text x="465.0" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">③ 优化（可选，手动点或批量）</text>
<text x="465.0" y="212" text-anchor="middle" font-size="10" fill="#4a4a4a">EPUB：清洗 + 排版规则(外链 css)</text>
<text x="465.0" y="225" text-anchor="middle" font-size="10" fill="#4a4a4a">+ 目录重建 + 保证有效封面声明</text>
<text x="465.0" y="238" text-anchor="middle" font-size="10" fill="#4a4a4a">漫画：自动识别，保画质、裁边、</text>
<text x="465.0" y="251" text-anchor="middle" font-size="10" fill="#4a4a4a">  单趟缩放、图片并行(内存有预算)</text>
<text x="465.0" y="264" text-anchor="middle" font-size="10" fill="#4a4a4a">优化不改格式，漫画仍是 EPUB</text>
<rect x="316" y="336" width="298" height="118" rx="8" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
<text x="465.0" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">PDF 的「优化」</text>
<text x="465.0" y="380" text-anchor="middle" font-size="10" fill="#4a4a4a">有文字层 → 按原格式重排成 EPUB</text>
<text x="465.0" y="393" text-anchor="middle" font-size="10" fill="#4a4a4a">（颜色、图片位置与比例、链接；原 PDF 备份 7 天）</text>
<text x="465.0" y="406" text-anchor="middle" font-size="10" fill="#4a4a4a">无文字层 / 漫画 → 只裁边，仍是 PDF</text>
<text x="465" y="490" text-anchor="middle" font-size="10" fill="#4a4a4a">每条目旁记「落库记录」边车：</text>
<text x="465" y="505" text-anchor="middle" font-size="10" fill="#4a4a4a">已加入哪个读器、渲染自检结果</text>
<text x="465" y="525" text-anchor="middle" font-size="10" fill="#4a4a4a">单选一本可「下载原件」「改名」</text>
<polyline points="250,260 300,260" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#tf-a)"/>
<text x="275" y="250" text-anchor="middle" font-size="10.5" fill="#555">原样入库</text>
<rect x="700" y="86" width="570" height="404" rx="12" fill="#fff8f4" stroke="#c0602d" stroke-width="1.6"/>
<text x="985.0" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">④ 加入 xochitl（原生阅读器）—— 按体积走三条路</text>
<rect x="718" y="132" width="534" height="84" rx="8" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.3"/>
<text x="985.0" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">≤ 90MB（nativeUploadLimitMb）：流式 /upload</text>
<text x="985.0" y="176" text-anchor="middle" font-size="10" fill="#4a4a4a">文件夹留空＝书库根；不存在会经 QML 代理先建</text>
<text x="985.0" y="189" text-anchor="middle" font-size="10" fill="#4a4a4a">投完起线程等 xochitl 渲染，页数对比预期 → 徽章 ok/warn</text>
<rect x="718" y="230" width="534" height="120" rx="8" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="985.0" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">&gt; 90MB：大文件通道（优先，不分卷；上限 1 GiB）</text>
<text x="985.0" y="274" text-anchor="middle" font-size="10" fill="#4a4a4a">① 上传几 KB 占位文档（EPUB 占位带真书名+封面）</text>
<text x="985.0" y="287" text-anchor="middle" font-size="10" fill="#4a4a4a">② 在书库里认出新文档  ③ 复制真文件为 .new 并校验大小</text>
<text x="985.0" y="300" text-anchor="middle" font-size="10" fill="#4a4a4a">④ EPUB 删渲染缓存 / PDF 改写 .content 页表</text>
<text x="985.0" y="313" text-anchor="middle" font-size="10" fill="#4a4a4a">⑤ 原子 rename 替换；EPUB 首次打开约 25 秒重新渲染</text>
<rect x="718" y="364" width="534" height="112" rx="8" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="985.0" y="382.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">回退：占位通道不可用（本机无书库目录 / 造占位失败）</text>
<text x="985.0" y="407.0" text-anchor="middle" font-size="10" fill="#4a4a4a">漫画 EPUB / PDF：按卷拆分，逐份上传并等渲染确认</text>
<text x="985.0" y="420.0" text-anchor="middle" font-size="10" fill="#4a4a4a">非漫画 / 无可用目录：拒绝，提示改用 KOReader 或自行分割</text>
<polyline points="630,240 700,240" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#tf-a)"/>
<polyline points="630,546 700,546" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#tf-a)"/>
<polyline points="465,318 465,336" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#tf-a)"/>
<rect x="700" y="506" width="570" height="90" rx="12" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="985.0" y="526" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">⑤ 加入 KOReader</text>
<text x="985.0" y="552.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">koreader-serve 做本地同分区文件拷贝，不经过优化器</text>
<text x="985.0" y="566.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">同一份母版字节可分别投两边对照阅读；文件夹留空＝根目录</text>
<text x="985.0" y="579.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">放进 漫画/ 目录的书按漫画方案打开，其余按文字书方案</text>
<rect x="30" y="626" width="1240" height="64" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="650.0" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">批量队列（网关）：勾选后一次排队，服务端顺序逐本执行「优化 / 加入 xochitl / 加入 KOReader」</text>
<text x="650.0" y="670.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">每一本先过并发/内存预算闸门；状态落盘，关掉浏览器或网关重启后续跑；可随时“全部中止”</text>
</svg>
