<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ul-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<text x="700.0" y="34" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">绕开 xochitl 上传体积上限：占位 + 磁盘替换</text>
<text x="700.0" y="58" font-size="12" fill="#6B7280" text-anchor="middle">book-serve 跑在设备上，能直接写 xochitl 的书库目录；网页上传接口只用来传一个几 KB 的替身</text>
<rect x="40" y="80" width="1320" height="66" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="700.0" y="106" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">问题：xochitl 的网页 /upload 约 100MB 硬限，超了直接断连（2026-09-19 真机实测）</text>
<text x="700.0" y="128" font-size="11" fill="#1F2937" text-anchor="middle">book-serve 对超过 90MB 的书走下面的通道：整本进，上限 1GB（以前的按卷拆分 2026-09-30 已移除）</text>
<rect x="40" y="176" width="200" height="136" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="140.0" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">① 造占位</text>
<text x="140.0" y="222" font-size="11" fill="#1F2937" text-anchor="middle">EPUB：几 KB 的最小 EPUB，</text>
<text x="140.0" y="240" font-size="11" fill="#1F2937" text-anchor="middle">带真书名（dc:title）+ 真封面</text>
<text x="140.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle">PDF：几 KB 空白 PDF，</text>
<text x="140.0" y="276" font-size="11" fill="#1F2937" text-anchor="middle">显示名取上传文件名</text>
<rect x="264" y="176" width="200" height="136" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="364.0" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">② 上传占位</text>
<text x="364.0" y="222" font-size="11" fill="#1F2937" text-anchor="middle">走普通 /upload，</text>
<text x="364.0" y="240" font-size="11" fill="#1F2937" text-anchor="middle">xochitl 建好书库条目</text>
<text x="364.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle">（对它来说就是一本小书）</text>
<path d="M240,244 H262" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ul-a)"/>
<rect x="488" y="176" width="200" height="136" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="588.0" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">③ 认新文档</text>
<text x="588.0" y="222" font-size="11" fill="#1F2937" text-anchor="middle">在上传前快照之外、</text>
<text x="588.0" y="240" font-size="11" fill="#1F2937" text-anchor="middle">按占位字节数找刚出现的那份</text>
<text x="588.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle">（/upload 不回 uuid）</text>
<text x="588.0" y="276" font-size="11" fill="#1F2937" text-anchor="middle">等书库变化通知，不轮询</text>
<path d="M464,244 H486" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ul-a)"/>
<rect x="712" y="176" width="200" height="136" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="812.0" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">④ 复制真文件</text>
<text x="812.0" y="222" font-size="11" fill="#1F2937" text-anchor="middle">把母版复制成 .new</text>
<text x="812.0" y="240" font-size="11" fill="#1F2937" text-anchor="middle">（隐藏名，xochitl 不当文档）</text>
<text x="812.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle">校验大小一致</text>
<path d="M688,244 H710" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ul-a)"/>
<rect x="936" y="176" width="200" height="136" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="1036.0" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">⑤ 改元数据</text>
<text x="1036.0" y="222" font-size="11" fill="#1F2937" text-anchor="middle">EPUB：删渲染缓存</text>
<text x="1036.0" y="240" font-size="11" fill="#1F2937" text-anchor="middle">（.pdf / .epubindex）</text>
<text x="1036.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle">PDF：改写 .content 的</text>
<text x="1036.0" y="276" font-size="11" fill="#1F2937" text-anchor="middle">页数 / 页表 / 大小</text>
<path d="M912,244 H934" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ul-a)"/>
<rect x="1160" y="176" width="200" height="136" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="1260.0" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">⑥ 原子 rename</text>
<text x="1260.0" y="222" font-size="11" fill="#1F2937" text-anchor="middle">.new 覆盖占位文件</text>
<text x="1260.0" y="240" font-size="11" fill="#1F2937" text-anchor="middle">不需要重启 xochitl</text>
<text x="1260.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle">之后记「已加入」</text>
<text x="1260.0" y="276" font-size="11" fill="#1F2937" text-anchor="middle">和渲染徽章</text>
<path d="M1136,244 H1158" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ul-a)"/>
<text x="40" y="352" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">两种格式的差别（真机验证过）</text>
<rect x="40" y="366" width="650" height="130" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="365.0" y="392" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">EPUB（153MB 实测可开）</text>
<text x="365.0" y="413" font-size="11" fill="#1F2937" text-anchor="middle">占位时的渲染缓存必须删掉，否则页数还是占位的</text>
<text x="365.0" y="432" font-size="11" fill="#1F2937" text-anchor="middle">首次打开 xochitl 自己重新渲染（146MB 约 25 秒），之后走缓存</text>
<text x="365.0" y="451" font-size="11" fill="#1F2937" text-anchor="middle">此前没打开过的书重启后也能渲染（pageCount 2 → 268 等）</text>
<text x="365.0" y="470" font-size="11" fill="#1F2937" text-anchor="middle">列表里徽章先记「打开后显示」，打开后页数一变自动显示真页数</text>
<rect x="710" y="366" width="650" height="130" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="1035.0" y="392" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">PDF（154MB / 349 页实测可开）</text>
<text x="1035.0" y="413" font-size="11" fill="#1F2937" text-anchor="middle">.content 里有逐页 UUID 表、页数、大小，必须一并改写</text>
<text x="1035.0" y="432" font-size="11" fill="#1F2937" text-anchor="middle">否则界面仍显示占位的页数</text>
<text x="1035.0" y="451" font-size="11" fill="#1F2937" text-anchor="middle">列表里的页数 / 大小要用户点开后才刷新</text>
<text x="1035.0" y="470" font-size="11" fill="#1F2937" text-anchor="middle">缩略图打开时按页生成，占位不需要带内容</text>
<text x="40" y="536" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">踩过的坑与已知限制</text>
<rect x="40" y="550" width="650" height="160" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="365.0" y="576" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">占位必须带真书名和真封面</text>
<text x="365.0" y="597" font-size="11" fill="#1F2937" text-anchor="middle">xochitl 用占位 EPUB 的 dc:title 当显示名，</text>
<text x="365.0" y="616" font-size="11" fill="#1F2937" text-anchor="middle">导入时按占位的封面生成 cover.png；</text>
<text x="365.0" y="635" font-size="11" fill="#1F2937" text-anchor="middle">替换成大文件后它不会改名、也不会补生成封面</text>
<text x="365.0" y="654" font-size="11" fill="#1F2937" text-anchor="middle">（真机踩过：显示成「上传限制实验-EPUB」且没有封面）</text>
<text x="365.0" y="673" font-size="11" fill="#1F2937" text-anchor="middle">所以占位的 dc:title 用书里自己的书名（与普通上传一致，10-07 起）</text>
<rect x="710" y="550" width="650" height="160" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1035.0" y="576" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">已知限制</text>
<text x="1035.0" y="597" font-size="11" fill="#1F2937" text-anchor="middle">占位上传后出错：书库里会残留占位文档，回执提示手动删除</text>
<text x="1035.0" y="616" font-size="11" fill="#1F2937" text-anchor="middle">（不做危险的「回滚删除」）</text>
<text x="1035.0" y="635" font-size="11" fill="#1F2937" text-anchor="middle">本机没有书库目录（非设备环境）或造不出占位 → 整本拒绝</text>
<text x="1035.0" y="654" font-size="11" fill="#1F2937" text-anchor="middle">超过 1GB 的首次渲染内存 / 耗时没验证过，不走这条通道</text>
<text x="1035.0" y="673" font-size="11" fill="#1F2937" text-anchor="middle">同一时间只走一本（锁一直拿到替换完成，避免两本 PDF 认到同一个占位）</text>
<text x="700" y="750" font-size="11" fill="#6B7280" text-anchor="middle">代码：rmsvc-core/src/xochitl/mod.rs（Xochitl::upload_large）· shelf/services/book-serve/src/delivery.rs · shelf/crates/shelf-conv/src/placeholder.rs</text>
</svg>
