<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.5;}
      .dev{fill:#eef4ff;stroke:#2b5fb3;}
      .pc{fill:#fff8e6;stroke:#b3862b;}
      .tun{fill:#f3f0fb;stroke:#6b4fa3;}
      .out{fill:#eafaef;stroke:#2b8f4e;}
      .name{font-size:15px;font-weight:600;fill:#1a1a1a;}
      .sub{font-size:12px;fill:#666;}
      .edge{stroke:#555;stroke-width:1.6;fill:none;}
      .elbl{font-size:12px;fill:#555;}
      .title{font-size:18px;font-weight:600;fill:#1a1a1a;}
    </style>
  </defs>

  <text x="20" y="30" class="title">网络拓扑（USB CDC 旁路由：设备把 PC 当默认网关 + DNS）</text>

  <!-- reMarkable -->
  <rect class="box dev" x="250" y="58" width="320" height="56" rx="10"/>
  <text x="410" y="82" text-anchor="middle" class="name">reMarkable（usb1: 10.11.99.1/27）</text>
  <text x="410" y="102" text-anchor="middle" class="sub">设备是该 USB 链路的 DHCP 服务器</text>

  <path class="edge" d="M410,114 L410,152" marker-end="url(#arrow)"/>
  <text x="422" y="138" class="elbl">USB CDC</text>

  <!-- PC -->
  <rect class="box pc" x="210" y="156" width="400" height="60" rx="10"/>
  <text x="410" y="180" text-anchor="middle" class="name">PC（enp…u1c2）</text>
  <text x="410" y="200" text-anchor="middle" class="sub">10.11.99.2/24 + 30.1.11.46/24（UAT 工作网段）</text>

  <path class="edge" d="M410,216 L410,254" marker-end="url(#arrow)"/>
  <text x="422" y="240" class="elbl">策略路由（mihomo auto-route, table 2022）</text>

  <!-- Meta TUN -->
  <rect class="box tun" x="250" y="258" width="320" height="60" rx="10"/>
  <text x="410" y="282" text-anchor="middle" class="name">Meta TUN（28.0.0.1/30）</text>
  <text x="410" y="302" text-anchor="middle" class="sub">fake-ip 段 28.0.0.1/8</text>

  <path class="edge" d="M410,318 L410,356" marker-end="url(#arrow)"/>

  <!-- mihomo -->
  <rect class="box tun" x="250" y="360" width="320" height="50" rx="10"/>
  <text x="410" y="390" text-anchor="middle" class="name">mihomo（按规则分流）</text>

  <!-- 出口分叉 -->
  <path class="edge" d="M570,385 C630,385 660,400 690,424" marker-end="url(#arrow)"/>
  <rect class="box out" x="600" y="430" width="200" height="50" rx="10"/>
  <text x="700" y="455" text-anchor="middle" class="name">wlan0 / 代理节点</text>
  <text x="700" y="472" text-anchor="middle" class="sub">家庭 Wi-Fi 出网</text>

  <!-- 直连分叉 -->
  <path class="edge" d="M250,385 C180,385 150,405 120,428" marker-end="url(#arrow)"/>
  <rect class="box" x="20" y="432" width="220" height="50" rx="10"/>
  <text x="130" y="454" text-anchor="middle" class="sub">命中 route-exclude（10/8·30/8…）</text>
  <text x="130" y="472" text-anchor="middle" class="sub">→ 不进 TUN、PC 直连</text>
</svg>
