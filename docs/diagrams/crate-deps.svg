<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.6;}
      .core{fill:#eafaef;stroke:#2b8f4e;}
      .weread{fill:#eef4ff;stroke:#2b5fb3;}
      .pkm{fill:#f3f0fb;stroke:#6b4fa3;}
      .name{font-size:16px;font-weight:600;fill:#1a1a1a;}
      .sub{font-size:12px;fill:#666;}
      .edge{stroke:#555;stroke-width:1.8;fill:none;}
      .devedge{stroke:#888;stroke-width:1.6;fill:none;stroke-dasharray:6 4;}
      .elbl{font-size:12px;fill:#555;}
      .title{font-size:18px;font-weight:600;fill:#1a1a1a;}
      .forbid{font-size:13px;fill:#c5221f;font-weight:600;}
    </style>
  </defs>

  <text x="20" y="30" class="title">crate 依赖图（单向、无环）</text>

  <!-- weread-device (top-left) -->
  <rect class="box weread" x="90" y="70" width="230" height="64" rx="10"/>
  <text x="205" y="98" text-anchor="middle" class="name">weread-device</text>
  <text x="205" y="118" text-anchor="middle" class="sub">块3 阅读</text>

  <!-- pkm-device (top-right) -->
  <rect class="box pkm" x="580" y="70" width="230" height="64" rx="10"/>
  <text x="695" y="98" text-anchor="middle" class="name">pkm-device</text>
  <text x="695" y="118" text-anchor="middle" class="sub">块5 PKM</text>

  <!-- device-core (bottom-center, base) -->
  <rect class="box core" x="335" y="300" width="230" height="64" rx="10"/>
  <text x="450" y="328" text-anchor="middle" class="name">device-core</text>
  <text x="450" y="348" text-anchor="middle" class="sub">共享底座 · 谁都不依赖</text>

  <!-- normal deps: 指向被依赖方（device-core） -->
  <path class="edge" d="M215,134 C255,210 330,255 400,298" marker-end="url(#arrow)"/>
  <text x="255" y="235" class="elbl">依赖（normal）</text>

  <path class="edge" d="M690,134 C650,210 570,255 500,298" marker-end="url(#arrow)"/>
  <text x="560" y="235" text-anchor="end" class="elbl">依赖（normal）</text>

  <!-- dev-dependency: pkm → weread（仅测试，虚线） -->
  <path class="devedge" d="M580,92 L322,92" marker-end="url(#arrowdash)"/>
  <text x="450" y="82" text-anchor="middle" class="elbl">dev-dependency（仅 1 个 fixture 测试用）</text>

  <!-- 禁止边说明 -->
  <text x="450" y="392" text-anchor="middle" class="forbid">✗ reading 不反向依赖 pkm —— 无 weread-device → pkm-device 这条边</text>
</svg>
