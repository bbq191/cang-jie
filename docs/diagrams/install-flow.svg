<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 836" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="if-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="836" fill="#fbfbfa"/>
<text x="500.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">一条命令装完：install-all.sh 的流程</text>
<text x="500.0" y="56" text-anchor="middle" font-size="13" fill="#666">电脑通过 USB 连设备（10.11.99.1）；可先 --dry-run 纯本机预演；每步幂等，失败不自动重试、不静默跳过</text>
<rect x="30" y="76" width="940" height="132" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="46" y="98" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">① 手动前置：属于设备生态、不属于本项目，install-all.sh 不代装（缺了会在对应步骤清楚报错）</text>
<rect x="46" y="110" width="217" height="84" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="154.5" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">vellum add xovi</text>
<text x="154.5" y="154" text-anchor="middle" font-size="12" fill="#444">扩展加载框架</text>
<text x="154.5" y="171" text-anchor="middle" font-size="12" fill="#444">几乎所有功能的基础</text>
<rect x="273" y="110" width="217" height="84" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="381.5" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">vellum add qt-resource-rebuilder</text>
<text x="381.5" y="154" text-anchor="middle" font-size="12" fill="#444">界面 QML 补丁加载器</text>
<text x="381.5" y="171" text-anchor="middle" font-size="12" fill="#444">字体菜单/回收站等依赖它</text>
<rect x="500" y="110" width="217" height="84" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="608.5" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">vellum add appload（≥ 0.6.0）</text>
<text x="608.5" y="154" text-anchor="middle" font-size="12" fill="#444">第三方 App 加载器</text>
<text x="608.5" y="171" text-anchor="middle" font-size="12" fill="#444">3.28 固件必须 ≥ 0.6.0</text>
<rect x="727" y="110" width="217" height="84" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="835.5" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">经 appload 侧载 KOReader</text>
<text x="835.5" y="154" text-anchor="middle" font-size="12" fill="#444">第二个阅读器</text>
<text x="835.5" y="171" text-anchor="middle" font-size="12" fill="#444">（可选）装 WeRead 多一个入口</text>
<polyline points="500,208 500,232" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#if-m)"/>
<rect x="30" y="232" width="940" height="92" rx="10" fill="#fdf3dc" stroke="#b8860b" stroke-width="1.6"/>
<text x="500" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">装前检查（任一项不过：一步都不执行，设备上什么都没改）</text>
<text x="46" y="276" text-anchor="start" font-size="12.3" fill="#444">① ssh 连通（require_device）：连不上 → 中文排查步骤，退出 1</text>
<text x="46" y="296" text-anchor="start" font-size="12.3" fill="#444">② 固件安全门：sha256(/usr/bin/xochitl) 对照 firmware-allowlist.txt；不在表内默认拒装，确认无误后 --force</text>
<text x="46" y="316" text-anchor="start" font-size="12.3" fill="#444">③ 设备预检（只读）：root、/home 可写、剩余空间 &lt;50MB 拒装 / &lt;200MB 警告；报告 xovi · QML 补丁加载器 · appload · verity 现状</text>
<polyline points="500,324 500,348" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#if-m)"/>
<rect x="30" y="348" width="940" height="324" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="46" y="370" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">② 按步骤表（lib.sh 的 STEP_ORDER）依次执行 —— 共 11 步，卸载用同一张表<tspan font-weight="bold">逆序</tspan>做</text>
<rect x="46" y="384" width="217" height="240" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="154" y="408" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">A · 系统小配置</text>
<text x="154" y="427" text-anchor="middle" font-size="12" fill="#555">不依赖 xovi</text>
<text x="58" y="456" text-anchor="start" font-size="12.2" fill="#222">1  chrony-cn</text>
<text x="58" y="478" text-anchor="start" font-size="12.2" fill="#222">2  chrony-boot-wakelock</text>
<text x="58" y="500" text-anchor="start" font-size="12.2" fill="#222">3  timezone-cn</text>
<text x="58" y="522" text-anchor="start" font-size="12.2" fill="#222">4  battop（不随开机自启）</text>
<text x="58" y="544" text-anchor="start" font-size="12.2" fill="#222">5  wifi-watch</text>
<rect x="273" y="384" width="217" height="240" rx="10" fill="#eef3fa" stroke="#4a72b0" stroke-width="1.6"/>
<text x="381" y="408" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">B · xovi 层</text>
<text x="381" y="427" text-anchor="middle" font-size="12" fill="#555">需要 vellum add xovi</text>
<text x="285" y="456" text-anchor="start" font-size="12.2" fill="#222">6  xovi-persist（开机补 xovi）</text>
<text x="285" y="478" text-anchor="start" font-size="12.2" fill="#222">7  hl-snap *</text>
<text x="285" y="500" text-anchor="start" font-size="12.2" fill="#222">8  handwriting-stroke *</text>
<text x="285" y="522" text-anchor="start" font-size="12.2" fill="#222">9  sidebar-entry *</text>
<rect x="500" y="384" width="217" height="240" rx="10" fill="#f1edf9" stroke="#6d4ab0" stroke-width="1.6"/>
<text x="608" y="408" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">C · shelf</text>
<text x="608" y="427" text-anchor="middle" font-size="12" fill="#555">网关 + 8 个领域服务</text>
<text x="512" y="456" text-anchor="start" font-size="12.2" fill="#222">10  shelf *（仅其 qmd）</text>
<text x="512" y="478" text-anchor="start" font-size="12.2" fill="#222">   gateway :443</text>
<text x="512" y="500" text-anchor="start" font-size="12.2" fill="#222">   book · koreader</text>
<text x="512" y="522" text-anchor="start" font-size="12.2" fill="#222">   font · wallpaper</text>
<text x="512" y="544" text-anchor="start" font-size="12.2" fill="#222">   ink · transcribe</text>
<text x="512" y="566" text-anchor="start" font-size="12.2" fill="#222">   mind · note</text>
<rect x="727" y="384" width="217" height="240" rx="10" fill="#fdf0eb" stroke="#c0602d" stroke-width="1.6"/>
<text x="835" y="408" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">D · 按需生效</text>
<text x="835" y="427" text-anchor="middle" font-size="12" fill="#555">看"待生效标记"，最多重启一次</text>
<text x="739" y="456" text-anchor="start" font-size="12.2" fill="#222">11  xovi-apply</text>
<text x="739" y="476" text-anchor="start" font-size="12.2" fill="#222">   有标记/待换入或 xovi 未生效才动：</text>
<text x="739" y="496" text-anchor="start" font-size="12.2" fill="#222">   先提示"将打断阅读"，等 5 秒</text>
<text x="739" y="516" text-anchor="start" font-size="12.2" fill="#222">   已生效 → systemctl restart</text>
<text x="739" y="536" text-anchor="start" font-size="12.2" fill="#222">   换了 .so → stop→换入→start</text>
<text x="739" y="556" text-anchor="start" font-size="12.2" fill="#222">   没生效 → xovi/start</text>
<text x="739" y="576" text-anchor="start" font-size="12.2" fill="#222">   无标记且已生效 → 不重启</text>
<text x="739" y="596" text-anchor="start" font-size="12.2" fill="#222">   （--force-apply 强制重启）</text>
<polyline points="263,500 273,500" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#if-m)"/>
<polyline points="490,500 500,500" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#if-m)"/>
<polyline points="717,500 727,500" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#if-m)"/>
<text x="500" y="644" text-anchor="middle" font-size="11.8" fill="#555">* 只落盘（DEFER_XOVI_START=1），且仅在文件内容真的变了时，在设备 /run/cangjie-pending-apply/ 记一个"待生效标记"（设备重启即清）。</text>
<text x="500" y="662" text-anchor="middle" font-size="11.8" fill="#555">xovi 没有"只重载一个扩展"的机制：全部落盘后由第 11 步统一重启一次，避免短时间多次重启撞 xochitl 的重启保护；重复运行、无改动时不再闪屏。</text>
<polyline points="500,672 500,696" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#if-m)"/>
<rect x="30" y="696" width="460" height="96" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="260" y="718" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">③ 收尾汇总</text>
<text x="260" y="740" text-anchor="middle" font-size="12.5" fill="#444">已安装 / 已跳过（--skip）/ 已跳过（前置条件不满足）/ 失败</text>
<text x="260" y="757" text-anchor="middle" font-size="12.5" fill="#444">"前置条件不满足"会写明原因（如没装 appload、verity 开着）</text>
<text x="260" y="774" text-anchor="middle" font-size="12.5" fill="#444">失败项看该步骤的原始报错，修好后整条重跑即可</text>
<rect x="510" y="696" width="460" height="96" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="740" y="718" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">④ 浏览器验证</text>
<text x="740" y="740" text-anchor="middle" font-size="12.5" fill="#444">https://10.11.99.1/  默认密码 shelf，首次登录强制改密</text>
<text x="740" y="757" text-anchor="middle" font-size="12.5" fill="#444">再肉眼确认侧栏 KOReader 入口（脚本代替不了）</text>
<text x="500" y="814" text-anchor="middle" font-size="12.5" fill="#555">反悔：sh uninstall-all.sh &lt;host&gt;（先 --dry-run；逆序；--purge 才删 battop 数据；chrony-cn / timezone-cn / xovi-apply 不卸）</text>
<text x="500" y="830" text-anchor="middle" font-size="11.8" fill="#a33">⚠ 卸载全流程、"无改动不重启"、换 .so 的 stop→换入→start（09-24）目前只有本机模拟验证，未在真机走过</text>
</svg>
