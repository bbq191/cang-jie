<path d="M920,250 V288" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#at-a)"/>
<text x="700" y="274" font-size="11" fill="#6B7280" text-anchor="middle">按注册表反代 /api/&lt;seg&gt;/*</text>
