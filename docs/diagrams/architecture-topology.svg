<text x="730.0" y="526" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">rmsvc-core 共享基座（Rust 库，编进网关和每个服务，不单独运行）</text>
<text x="730.0" y="548" font-size="11" fill="#1F2937" text-anchor="middle">服务注册表 · HTTP 路由 · SSE 事件总线 · xochitl 模块（设文件夹 + /upload + 认领、书库查询）· fswatch · XDG 路径 · TLS</text>
