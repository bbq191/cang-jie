<text x="1292.5" y="365" font-size="11" fill="#1F2937" text-anchor="middle">DashScope · OpenAI</text>
<text x="1292.5" y="381" font-size="11" fill="#1F2937" text-anchor="middle">Gemini · DeepSeek</text>
<text x="1292.5" y="397" font-size="11" fill="#1F2937" text-anchor="middle">设备 WiFi 直连</text>
