<text x="860.0" y="376" font-size="11" fill="#1F2937" text-anchor="middle">/api/transcribe</text>
<text x="860.0" y="392" font-size="11" fill="#1F2937" text-anchor="middle">订阅 ink 事件</text>
<text x="860.0" y="408" font-size="11" fill="#1F2937" text-anchor="middle">裁图→视觉模型</text>
<text x="860.0" y="424" font-size="11" fill="#1F2937" text-anchor="middle">草稿经 HTTP 写回</text>
