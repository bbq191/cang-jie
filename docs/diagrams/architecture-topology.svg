<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 945" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="at-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<text x="700.0" y="34" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">核心架构：设备上有什么、谁和谁说话</text>
<text x="700.0" y="58" font-size="12" fill="#6B7280" text-anchor="middle">所有服务都在设备上；只有网关对外，其余只听 127.0.0.1；服务经 xochitl 自己的 /upload 与书库目录跟它交互</text>
<rect x="20" y="110" width="220" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="130.0" y="132" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">手机 / 电脑浏览器</text>
<text x="130.0" y="150" font-size="11" fill="#1F2937" text-anchor="middle">https://10.11.99.1/（USB）</text>
<text x="130.0" y="166" font-size="11" fill="#1F2937" text-anchor="middle">https://shelf.local/（同一 WiFi）</text>
<text x="130.0" y="182" font-size="11" fill="#1F2937" text-anchor="middle">装一次设备的 CA 证书</text>
<rect x="20" y="212" width="220" height="100" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="130.0" y="234" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">电脑端 sheng-ren</text>
<text x="130.0" y="252" font-size="11" fill="#1F2937" text-anchor="middle">优化书（独立项目，不在本仓库）</text>
<text x="130.0" y="268" font-size="11" fill="#1F2937" text-anchor="middle">直接导入 / 原地替换</text>
<text x="130.0" y="284" font-size="11" fill="#1F2937" text-anchor="middle">ssh -L 直连 :8790 /import</text>
<rect x="20" y="815" width="220" height="100" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="130.0" y="837" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">安装用电脑</text>
<text x="130.0" y="855" font-size="11" fill="#1F2937" text-anchor="middle">packaging/install-all.sh</text>
<text x="130.0" y="871" font-size="11" fill="#1F2937" text-anchor="middle">交叉编译 → ssh 装到设备</text>
<text x="130.0" y="887" font-size="11" fill="#1F2937" text-anchor="middle">日常使用不需要它</text>
<rect x="265" y="80" width="915" height="835" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="277" y="100" font-size="12" font-weight="bold" fill="#6B7280" text-anchor="start">reMarkable Paper Pro Move · 固件 3.28.0.172（不改 xochitl 本体）</text>
<rect x="300" y="110" width="860" height="140" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="730.0" y="138" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">gateway · 0.0.0.0:443（唯一对外入口）</text>
<text x="730.0" y="160" font-size="11" fill="#1F2937" text-anchor="middle">HTTPS（设备自签的私有 CA）· 登录密码（按来源 IP 限速）· 托管网页（传书 / 笔记 / 其他 / 管理）</text>
<text x="730.0" y="180" font-size="11" fill="#1F2937" text-anchor="middle">反向代理 /api/&lt;seg&gt;/* → 注册表里的服务（127.0.0.1:&lt;端口&gt;）</text>
<text x="730.0" y="200" font-size="11" fill="#1F2937" text-anchor="middle">SSE 事件汇聚 /api/events · 批量队列 /api/batch · 管理台 / 设备健康 / OTA 提示</text>
<text x="730.0" y="220" font-size="11" fill="#1F2937" text-anchor="middle">ExecStartPre 跑 lo-alias.sh：让 10.11.99.1 拔掉 USB 也可达</text>
<path d="M240,150 H298" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#at-a)"/>
<text x="270" y="143" font-size="11" fill="#6B7280" text-anchor="middle">HTTPS</text>
