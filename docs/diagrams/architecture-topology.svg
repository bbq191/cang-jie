<text x="705.0" y="150.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">HTTPS（私有 CA）+ 登录密码 · 网页 UI · /api/&lt;服务&gt;/* 反向代理 · 服务注册表发现</text>
<text x="705.0" y="164.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">批量队列（落盘续跑）· 并发/内存预算闸门 · SSE 事件汇聚 · 系统增强开关</text>
