<text x="976.0" y="408" font-size="11" fill="#1F2937" text-anchor="middle">无事件流</text>
<rect x="1038" y="320" width="108" height="140" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="1092.0" y="342" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">note-serve</text>
