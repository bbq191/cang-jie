<text x="482.5" y="408" font-size="11" fill="#1F2937" text-anchor="middle">xochitl 界面字体</text>
<rect x="544" y="320" width="111" height="140" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="599.5" y="342" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">wallpaper-serve</text>
<text x="599.5" y="360" font-size="11" fill="#1F2937" text-anchor="middle">:8793</text>
<text x="599.5" y="376" font-size="11" fill="#1F2937" text-anchor="middle">/api/wallpapers</text>
<text x="599.5" y="392" font-size="11" fill="#1F2937" text-anchor="middle">休眠壁纸池</text>
