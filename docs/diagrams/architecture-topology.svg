<text x="580.0" y="665" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">网页上传口 10.11.99.1:80  POST /upload</text>
<text x="580.0" y="684" font-size="11" fill="#1F2937" text-anchor="middle">约 100MB 上限；不回新文档的 uuid，要自己在书库里认</text>
