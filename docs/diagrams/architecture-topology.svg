<text x="445.0" y="769" font-size="11" fill="#1F2937" text-anchor="middle">漫画页边距 · 阅读位置</text>
<text x="445.0" y="785" font-size="11" fill="#1F2937" text-anchor="middle">单击翻页 · 字体菜单</text>
<text x="445.0" y="801" font-size="11" fill="#1F2937" text-anchor="middle">界面字体令牌</text>
<text x="445.0" y="817" font-size="11" fill="#1F2937" text-anchor="middle">由 qt-resource-rebuilder 载入</text>
