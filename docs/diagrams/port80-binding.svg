<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.5;}
      .accent{fill:#eef4ff;stroke:#2b5fb3;}
      .done{fill:#eafaef;stroke:#2b8f4e;}
      .fail{fill:#fdeceb;stroke:#c5221f;}
      .name{font-size:14px;font-weight:600;fill:#1a1a1a;}
      .sub{font-size:12px;fill:#666;}
      .edge{stroke:#555;stroke-width:1.6;fill:none;}
      .elbl{font-size:12px;fill:#555;}
      .title{font-size:17px;font-weight:600;fill:#1a1a1a;}
      .failtxt{font-size:12px;fill:#c5221f;}
    </style>
  </defs>

  <text x="20" y="28" class="title">xochitl :80 Web UI 绑定链（每次启动经 ExecStartPre 补 usb1 alias）</text>

  <!-- 1 ExecStartPre -->
  <rect class="box accent" x="20" y="56" width="250" height="70" rx="10"/>
  <text x="145" y="82" text-anchor="middle" class="name">xochitl.service ExecStartPre</text>
  <text x="145" y="102" text-anchor="middle" class="sub">ip addr add 10.11.99.1/32</text>
  <text x="145" y="118" text-anchor="middle" class="sub">dev usb1（-前缀，幂等）</text>

  <path class="edge" d="M270,91 L318,91" marker-end="url(#arrow)"/>

  <!-- 2 xochitl 启动接口选择 -->
  <rect class="box" x="320" y="56" width="270" height="70" rx="10"/>
  <text x="455" y="82" text-anchor="middle" class="name">xochitl 启动·选接口</text>
  <text x="455" y="102" text-anchor="middle" class="sub">0x71e070: usb0 无 carrier</text>
  <text x="455" y="118" text-anchor="middle" class="sub">→ 落 usb1 fallback（不查 carrier）</text>

  <path class="edge" d="M590,91 L638,91" marker-end="url(#arrow)"/>

  <!-- 3 HttpListener -->
  <rect class="box done" x="640" y="56" width="240" height="70" rx="10"/>
  <text x="760" y="82" text-anchor="middle" class="name">HttpListener 绑定</text>
  <text x="760" y="102" text-anchor="middle" class="sub">usb1 的 10.11.99.1:80</text>
  <text x="760" y="118" text-anchor="middle" class="sub">/upload 可用</text>

  <path class="edge" d="M760,126 L760,168" marker-end="url(#arrow)"/>
  <rect class="box done" x="560" y="172" width="320" height="42" rx="10"/>
  <text x="720" y="198" text-anchor="middle" class="sub">墨香下书 · ★待办 · cardhw · 多格式转换 /upload 全部可用</text>

  <!-- 缺口对照 -->
  <rect class="box fail" x="20" y="172" width="500" height="96" rx="10"/>
  <text x="40" y="196" class="name">若缺 ExecStartPre（旧时序缺口）</text>
  <text x="40" y="220" class="failtxt">中途 systemctl restart xochitl（部署常做）不重跑 xovi pre-start 脚本；</text>
  <text x="40" y="238" class="failtxt">期间插拔 USB 又重置 usb1 → usb1 无 IPv4 → xochitl 绑不上 :80，</text>
  <text x="40" y="256" class="failtxt">所有 /upload 静默失败直到下次真重启。（lo 的 alias 只保「已绑后」可达，不触发绑定。）</text>
</svg>
