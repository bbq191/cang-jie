<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Noto Sans CJK SC, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">设备开机时序（2026-09-24 真机重启实测）</text>
<text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#6b7280">journalctl -b -o short-monotonic 与 systemctl 的启动时间戳；横轴 = 开机后秒数</text>
<line x1="250" y1="78" x2="950" y2="78" stroke="#9ca3af"/>
<line x1="250.0" y1="74" x2="250.0" y2="440" stroke="#eef0f3"/>
<text x="250.0" y="70" text-anchor="middle" font-size="11" fill="#6b7280">0s</text>
<line x1="337.5" y1="74" x2="337.5" y2="440" stroke="#eef0f3"/>
<text x="337.5" y="70" text-anchor="middle" font-size="11" fill="#6b7280">5s</text>
<line x1="425.0" y1="74" x2="425.0" y2="440" stroke="#eef0f3"/>
<text x="425.0" y="70" text-anchor="middle" font-size="11" fill="#6b7280">10s</text>
<line x1="512.5" y1="74" x2="512.5" y2="440" stroke="#eef0f3"/>
<text x="512.5" y="70" text-anchor="middle" font-size="11" fill="#6b7280">15s</text>
<line x1="600.0" y1="74" x2="600.0" y2="440" stroke="#eef0f3"/>
<text x="600.0" y="70" text-anchor="middle" font-size="11" fill="#6b7280">20s</text>
<line x1="687.5" y1="74" x2="687.5" y2="440" stroke="#eef0f3"/>
<text x="687.5" y="70" text-anchor="middle" font-size="11" fill="#6b7280">25s</text>
<line x1="775.0" y1="74" x2="775.0" y2="440" stroke="#eef0f3"/>
<text x="775.0" y="70" text-anchor="middle" font-size="11" fill="#6b7280">30s</text>
<line x1="862.5" y1="74" x2="862.5" y2="440" stroke="#eef0f3"/>
<text x="862.5" y="70" text-anchor="middle" font-size="11" fill="#6b7280">35s</text>
<line x1="950.0" y1="74" x2="950.0" y2="440" stroke="#eef0f3"/>
<text x="950.0" y="70" text-anchor="middle" font-size="11" fill="#6b7280">40s</text>
<text x="238" y="105" text-anchor="end" font-size="12.5" fill="#1f2937">xochitl（原厂状态）</text>
<text x="238" y="145" text-anchor="end" font-size="12.5" fill="#1f2937">/home 挂载</text>
<text x="238" y="185" text-anchor="end" font-size="12.5" fill="#1f2937">xovi-reenable</text>
<text x="238" y="225" text-anchor="end" font-size="12.5" fill="#1f2937">xochitl（带 xovi）</text>
<text x="238" y="265" text-anchor="end" font-size="12.5" fill="#1f2937">书架/笔记/增强常驻服务</text>
<text x="238" y="305" text-anchor="end" font-size="12.5" fill="#1f2937">NetworkManager-wait-online</text>
<text x="238" y="345" text-anchor="end" font-size="12.5" fill="#1f2937">chrony-boot-wakelock</text>
<text x="238" y="385" text-anchor="end" font-size="12.5" fill="#1f2937">multi-user.target</text>
<rect x="320.7" y="92" width="56.0" height="18" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/><text x="382.7" y="105" font-size="11" fill="#333">4.04s 起，不等 /home</text>
<line x1="342.1" y1="130" x2="342.1" y2="152" stroke="#374151" stroke-width="2.5"/><text x="348.1" y="145" font-size="11" fill="#333">5.26s</text>
<rect x="345.6" y="172" width="35.5" height="18" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="387.1" y="185" font-size="11" fill="#333">5.46–7.49s 重跑 xovi/start</text>
<rect x="379.5" y="212" width="570.5" height="18" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="385.5" y="225" font-size="11" fill="#14532d">7.40s 起，三个 hook 装上</text>
<rect x="381.8" y="252" width="26.4" height="18" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="414.2" y="265" font-size="11" fill="#333">7.53–9.04s（改前 ≈11.6s）</text>
<rect x="446.0" y="276" width="7.0" height="12" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5,3"/><text x="459.0" y="286" font-size="10.5" fill="#b45309">改前：等 wait-online 后才起</text>
<rect x="388.8" y="292" width="73.1" height="18" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="467.9" y="305" font-size="11" fill="#333">7.9–12.1s，已不在我们的关键路径上</text>
<rect x="319.5" y="332" width="585.0" height="18" rx="3" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
<text x="460.0" y="345" font-size="11" fill="#831843">持 wakelock 到 NTP 校时完成（有意设计：防开机头几十秒自动休眠打断校时）</text>
<line x1="904.5" y1="370" x2="904.5" y2="392" stroke="#be185d" stroke-width="2.5"/><text x="898" y="385" text-anchor="end" font-size="11" fill="#333">37.4s（被上一行拖住，设计如此）</text>
<rect x="40" y="420" width="920" height="126" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="56" y="442" font-size="12" fill="#111827" font-weight="bold">09-24 调整（只改我们自己单元的 After=，不给 xochitl 加任何依赖——红线）：</text>
<text x="56" y="464" font-size="12" fill="#374151">① 常驻服务（实测时 9 个，09-29 撤 koreader-serve 后 8 个）After=xovi-reenable.service：xochitl 先带 xovi 重启完，它们再起，不抢 CPU。</text>
<text x="56" y="486" font-size="12" fill="#374151">② 不再 Wants/After=network-online.target：只监听回环/0.0.0.0，不等 WiFi；改前 11.6s 才起（虚线），没 WiFi 时要等到 wait-online 超时。</text>
<text x="56" y="508" font-size="12" fill="#374151">③ xovi-reenable 加 TimeoutStartSec=120（缺省 infinity，卡住会让服务永远等）；④ 网关 After=NetworkManager；fc-cache 挪到 font-serve（约 1.5s）。</text>
<text x="56" y="530" font-size="12" fill="#374151">xochitl 原厂启动（4.04s）早于 /home（5.26s），这一点没变——xochitl 永远不等 /home 上的任何东西。</text>
</svg>