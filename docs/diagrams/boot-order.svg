<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="bo-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="bo-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="bo-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<text x="600" y="36" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="bold">设备开机时序（2026-09-24 真机重启实测）</text>
<text x="600" y="60" font-size="12" fill="#6B7280" text-anchor="middle">来源：journalctl -b -o short-monotonic 与 systemctl 的启动时间戳；横轴 = 开机后秒数</text>
<line x1="280" y1="92" x2="280" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="280" y="86" font-size="11" fill="#6B7280" text-anchor="middle">0s</text>
<line x1="390" y1="92" x2="390" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="390" y="86" font-size="11" fill="#6B7280" text-anchor="middle">5s</text>
<line x1="500" y1="92" x2="500" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="500" y="86" font-size="11" fill="#6B7280" text-anchor="middle">10s</text>
<line x1="610" y1="92" x2="610" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="610" y="86" font-size="11" fill="#6B7280" text-anchor="middle">15s</text>
<line x1="720" y1="92" x2="720" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="720" y="86" font-size="11" fill="#6B7280" text-anchor="middle">20s</text>
<line x1="830" y1="92" x2="830" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="830" y="86" font-size="11" fill="#6B7280" text-anchor="middle">25s</text>
<line x1="940" y1="92" x2="940" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="940" y="86" font-size="11" fill="#6B7280" text-anchor="middle">30s</text>
<line x1="1050" y1="92" x2="1050" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="1050" y="86" font-size="11" fill="#6B7280" text-anchor="middle">35s</text>
<line x1="1160" y1="92" x2="1160" y2="460" stroke="#E5E7EB" stroke-width="1"/>
<text x="1160" y="86" font-size="11" fill="#6B7280" text-anchor="middle">40s</text>
<text x="266" y="124" font-size="12" fill="#1F2937" text-anchor="end">xochitl（原厂状态）</text>
<rect x="368.88" y="109" width="73.92" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="450.8" y="124" font-size="11" fill="#6B7280" text-anchor="start">4.04s 起，不等 /home</text>
<text x="266" y="168" font-size="12" fill="#1F2937" text-anchor="end">/home 挂载</text>
<line x1="395.72" y1="153" x2="395.72" y2="175" stroke="#CBD5E1" stroke-width="3"/>
<text x="403.72" y="168" font-size="11" fill="#6B7280" text-anchor="start">5.26s</text>
<text x="266" y="212" font-size="12" fill="#1F2937" text-anchor="end">xovi-reenable</text>
<rect x="400.12" y="197" width="44.66" height="22" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="452.78" y="212" font-size="11" fill="#6B7280" text-anchor="start">5.46–7.49s：重跑 xovi/start</text>
<text x="266" y="256" font-size="12" fill="#1F2937" text-anchor="end">xochitl（带 xovi）</text>
<rect x="442.8" y="241" width="717.2" height="22" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="452.8" y="256" font-size="11" fill="#1F2937" text-anchor="start">7.40s 起，当时的三个 hook 装上</text>
<text x="266" y="300" font-size="12" fill="#1F2937" text-anchor="end">书架/笔记/增强常驻服务</text>
<rect x="445.66" y="285" width="33.22" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="543.2" y="300" font-size="11" fill="#6B7280" text-anchor="start">7.53–9.04s（虚线 = 调整前约 11.6s 才起）</text>
<text x="266" y="344" font-size="12" fill="#1F2937" text-anchor="end">NetworkManager-wait-online</text>
<rect x="453.8" y="329" width="92.4" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="554.2" y="344" font-size="11" fill="#6B7280" text-anchor="start">7.9–12.1s，已不在常驻服务的启动路径上</text>
<text x="266" y="388" font-size="12" fill="#1F2937" text-anchor="end">chrony-boot-wakelock</text>
<rect x="367.34" y="373" width="735.46" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="735.07" y="388" font-size="11" fill="#1F2937" text-anchor="middle">持唤醒锁直到 NTP 首次校时完成（防开机头几十秒自动休眠打断校时）</text>
<text x="266" y="432" font-size="12" fill="#1F2937" text-anchor="end">multi-user.target</text>
<line x1="1102.8" y1="417" x2="1102.8" y2="439" stroke="#EF4444" stroke-width="3"/>
<text x="1094.8" y="432" font-size="11" fill="#6B7280" text-anchor="end">37.4s：被上一行拖住，有意如此</text>
<line x1="535.2" y1="285" x2="535.2" y2="307" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="40" y="478" width="1120" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="52" y="506.038" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">09-24 的调整：只改本项目自己单元的排序，不给 xochitl 加任何依赖</text>
<text x="52" y="524.337" font-size="11.5" fill="#6B7280" text-anchor="start">① 常驻服务 After=xovi-reenable.service：等 xochitl 带着 xovi 起完再起，不抢 CPU（实测时 9 个，含已撤的 koreader-serve；现为 8 个）</text>
<text x="52" y="542.163" font-size="11.5" fill="#6B7280" text-anchor="start">② 不再等 network-online.target：服务只监听回环或 0.0.0.0、调云端按需重试；调整前要等 wait-online，没 WiFi 时等到超时</text>
<text x="52" y="559.987" font-size="11.5" fill="#6B7280" text-anchor="start">③ xovi-reenable 加 TimeoutStartSec=120（oneshot 缺省不超时，卡住会让所有服务一起等）</text>
<text x="52" y="577.812" font-size="11.5" fill="#6B7280" text-anchor="start">④ 网关 After=NetworkManager.service；fc-cache 从网关挪到 font-serve（省约 1.5 秒）</text>
<text x="52" y="595.637" font-size="11.5" fill="#6B7280" text-anchor="start">xochitl 原厂启动（4.04s）早于 /home 挂载（5.26s）：xochitl 永远不等 /home 上的任何东西（红线）</text>
</svg>
