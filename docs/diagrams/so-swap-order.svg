<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Noto Sans CJK SC, sans-serif">
<defs>
<marker id="ss-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="ss-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker>
<marker id="ss-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="520" fill="#fbfbfa"/>
<text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">更新扩展 .so：先停、再换、再起</text>
<text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">xovi-ext-install.sh + devlib.sh（2026-09-24）；hl-snap、handwriting-stroke 都走这条路</text>

<text x="30" y="88" font-size="13" font-weight="bold" fill="#333">一、装新版 .so 时先看三种情况</text>
<rect x="30" y="100" width="300" height="84" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.5"/>
<text x="180" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">和已装的逐字节相同</text>
<text x="180" y="148" text-anchor="middle" font-size="11.5" fill="#444">什么都不动</text>
<text x="180" y="166" text-anchor="middle" font-size="11.5" fill="#444">（顺手撤掉过时的待换入版本）</text>
<rect x="350" y="100" width="300" height="84" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
<text x="500" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">运行中的 xochitl 正在用旧版</text>
<text x="500" y="148" text-anchor="middle" font-size="11.5" fill="#444">新版先放进待换入区</text>
<text x="500" y="166" text-anchor="middle" font-size="11.5" fill="#444">~/.cangjie-stage/so-pending/（不在 extensions.d）</text>
<rect x="670" y="100" width="300" height="84" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.5"/>
<text x="820" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl 没在用它</text>
<text x="820" y="148" text-anchor="middle" font-size="11.5" fill="#444">当场原子替换：先写暂存</text>
<text x="820" y="166" text-anchor="middle" font-size="11.5" fill="#444">再 rename 进 extensions.d</text>

<text x="30" y="224" font-size="13" font-weight="bold" fill="#333">二、重启 xochitl 让它生效（中间那种情况）</text>

<rect x="30" y="236" width="940" height="100" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="46" y="258" font-size="12.5" font-weight="bold" fill="#b0451f">旧做法（已废弃）：换完文件再 restart</text>
<rect x="46" y="270" width="190" height="50" rx="8" fill="#ffffff" stroke="#c0602d" stroke-width="1.3"/>
<text x="141" y="300" text-anchor="middle" font-size="11.5" fill="#333">换掉 extensions.d 里的 .so</text>
<rect x="276" y="270" width="190" height="50" rx="8" fill="#ffffff" stroke="#c0602d" stroke-width="1.3"/>
<text x="371" y="300" text-anchor="middle" font-size="11.5" fill="#333">systemctl restart xochitl</text>
<rect x="506" y="270" width="190" height="50" rx="8" fill="#ffffff" stroke="#c0602d" stroke-width="1.3"/>
<text x="601" y="292" text-anchor="middle" font-size="11.5" fill="#333">旧进程退出时崩溃</text>
<text x="601" y="309" text-anchor="middle" font-size="11" fill="#666">（SEGV）</text>
<rect x="736" y="270" width="220" height="50" rx="8" fill="#fbe3da" stroke="#b0451f" stroke-width="1.5"/>
<text x="846" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b0451f">整机自动重启</text>
<text x="846" y="309" text-anchor="middle" font-size="11" fill="#666">OnFailure=emergency.target</text>
<polyline points="236,295 276,295" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#ss-r)"/>
<polyline points="466,295 506,295" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#ss-r)"/>
<polyline points="696,295 736,295" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#ss-r)"/>

<rect x="30" y="352" width="940" height="100" rx="10" fill="#f3faf4" stroke="#3f9a55" stroke-width="1.4"/>
<text x="46" y="374" font-size="12.5" font-weight="bold" fill="#2f6f40">现做法：stop → 换入 → start</text>
<rect x="46" y="386" width="190" height="50" rx="8" fill="#ffffff" stroke="#3f9a55" stroke-width="1.3"/>
<text x="141" y="408" text-anchor="middle" font-size="11.5" fill="#333">提示“将打断阅读”</text>
<text x="141" y="425" text-anchor="middle" font-size="11" fill="#666">等 5 秒</text>
<rect x="276" y="386" width="190" height="50" rx="8" fill="#ffffff" stroke="#3f9a55" stroke-width="1.3"/>
<text x="371" y="416" text-anchor="middle" font-size="11.5" fill="#333">systemctl stop xochitl</text>
<rect x="506" y="386" width="190" height="50" rx="8" fill="#ffffff" stroke="#3f9a55" stroke-width="1.3"/>
<text x="601" y="408" text-anchor="middle" font-size="11.5" fill="#333">待换入区 → extensions.d</text>
<text x="601" y="425" text-anchor="middle" font-size="11" fill="#666">（原子 rename）</text>
<rect x="736" y="386" width="220" height="50" rx="8" fill="#e3f2e6" stroke="#2f7d45" stroke-width="1.5"/>
<text x="846" y="408" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6f40">systemctl start xochitl</text>
<text x="846" y="425" text-anchor="middle" font-size="11" fill="#666">再做健康检查</text>
<polyline points="236,411 276,411" fill="none" stroke="#2f7d45" stroke-width="1.6" marker-end="url(#ss-g)"/>
<polyline points="466,411 506,411" fill="none" stroke="#2f7d45" stroke-width="1.6" marker-end="url(#ss-g)"/>
<polyline points="696,411 736,411" fill="none" stroke="#2f7d45" stroke-width="1.6" marker-end="url(#ss-g)"/>

<text x="500" y="478" text-anchor="middle" font-size="11.8" fill="#555">待换入区在 /home：设备中途重启也不丢，下次重启 xochitl 时照样换入；在那之前 xochitl 仍用旧版。</text>
<text x="500" y="498" text-anchor="middle" font-size="11.8" fill="#a33">⚠ 旧做法两次真机整机重启（09-21 appload、09-24 hw-stroke）；新做法只有本机模拟测试，真机还没用“有变化的 .so”走过</text>
</svg>
