<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Noto Sans CJK SC, sans-serif">
<defs>
<marker id="ss-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="ss-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker>
<marker id="ss-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="700" fill="#fbfbfa"/>
<text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">让扩展 / 界面补丁生效：换入后整机重启</text>
<text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">devlib.sh 的 cj_xochitl_apply + xovi-reenable.service（2026-09-25 起）；hl-snap、handwriting-stroke、各 qmd 都走这条路</text>

<text x="30" y="88" font-size="13" font-weight="bold" fill="#333">一、装新版 .so 时先看三种情况</text>
<rect x="30" y="100" width="300" height="84" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.5"/>
<text x="180" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">和已装的逐字节相同</text>
<text x="180" y="148" text-anchor="middle" font-size="11.5" fill="#444">什么都不动</text>
<text x="180" y="166" text-anchor="middle" font-size="11.5" fill="#444">（顺手撤掉过时的待换入版本）</text>
<rect x="350" y="100" width="300" height="84" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
<text x="500" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">运行中的 xochitl 正在用旧版</text>
<text x="500" y="148" text-anchor="middle" font-size="11.5" fill="#444">新版先放进待换入区</text>
<text x="500" y="166" text-anchor="middle" font-size="11.5" fill="#444">~/.cangjie-stage/so-pending/（不在 extensions.d）</text>
<rect x="670" y="100" width="300" height="84" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.5"/>
<text x="820" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl 没在用它</text>
<text x="820" y="148" text-anchor="middle" font-size="11.5" fill="#444">当场原子替换：先写暂存</text>
<text x="820" y="166" text-anchor="middle" font-size="11.5" fill="#444">再 rename 进 extensions.d</text>

<text x="30" y="222" font-size="13" font-weight="bold" fill="#333">二、为什么不再单独重启 xochitl</text>
<rect x="30" y="234" width="455" height="112" rx="10" fill="#fbecE6" stroke="#b0451f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="257" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3316">已废弃：restart / stop → 换 → start</text>
<text x="257" y="282" text-anchor="middle" font-size="11.5" fill="#444">停止 xochitl 本身就有概率在退出途中崩溃（SEGV）</text>
<text x="257" y="300" text-anchor="middle" font-size="11.5" fill="#444">→ OnFailure → rm-emergency → 整机重启（不在预期内）</text>
<text x="257" y="318" text-anchor="middle" font-size="11.5" fill="#444">跟换没换 .so 无关：09-25 只换 qmd 的普通 restart 也崩</text>
<text x="257" y="336" text-anchor="middle" font-size="11" fill="#6a6a6a">memfault 5 份栈：3 份在 xochitl 线程池，2 份在 libQt6Gui</text>
<rect x="515" y="234" width="455" height="112" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.5"/>
<text x="742" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c30">现做法：直接干净地整机重启</text>
<text x="742" y="282" text-anchor="middle" font-size="11.5" fill="#444">结果确定：不走崩溃 + 应急路径、不留 core dump</text>
<text x="742" y="300" text-anchor="middle" font-size="11.5" fill="#444">约 20–60 秒回来；开机后 xovi-reenable 恢复 xovi</text>
<text x="742" y="318" text-anchor="middle" font-size="11.5" fill="#444">代价：比 restart 顺利时（几秒）打断更久</text>
<text x="742" y="336" text-anchor="middle" font-size="11" fill="#6a6a6a">没装 xovi-reenable 且 xovi 未生效时才走 xovi/start</text>

<text x="30" y="384" font-size="13" font-weight="bold" fill="#333">三、生效流程（部署最后一步 xovi-apply，或单独部署一个扩展时）</text>
<text x="30" y="402" font-size="11.5" fill="#6a6a6a">换入 → 清标记 → 排重启 是关键区：忽略 HUP / PIPE / INT / TERM，host 侧 Ctrl-C 或断线也一定把重启排上</text>
<rect x="30" y="416" width="150" height="70" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.5"/>
<text x="105" y="444" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">提示将打断阅读</text>
<text x="105" y="466" text-anchor="middle" font-size="11.5" fill="#444">等 5 秒可取消</text>
<line x1="180" y1="451" x2="208" y2="451" stroke="#555" stroke-width="1.5" marker-end="url(#ss-a)"/>
<rect x="210" y="416" width="170" height="70" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
<text x="295" y="444" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">待换入区 → extensions.d</text>
<text x="295" y="466" text-anchor="middle" font-size="11.5" fill="#444">（原子 rename）</text>
<line x1="380" y1="451" x2="408" y2="451" stroke="#555" stroke-width="1.5" marker-end="url(#ss-a)"/>
<rect x="410" y="416" width="170" height="70" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.5"/>
<text x="495" y="444" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">清掉待生效标记</text>
<text x="495" y="466" text-anchor="middle" font-size="11" fill="#444">含 /home 退路目录，防重启循环</text>
<line x1="580" y1="451" x2="608" y2="451" stroke="#555" stroke-width="1.5" marker-end="url(#ss-a)"/>
<rect x="610" y="416" width="170" height="70" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.5"/>
<text x="695" y="444" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">systemctl reboot</text>
<text x="695" y="466" text-anchor="middle" font-size="11" fill="#444">先打印 CJ-APPLY-REBOOTING</text>
<line x1="780" y1="451" x2="808" y2="451" stroke="#2f7d45" stroke-width="1.5" marker-end="url(#ss-g)"/>
<rect x="810" y="416" width="160" height="70" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.5"/>
<text x="890" y="444" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">开机：xovi-reenable</text>
<text x="890" y="466" text-anchor="middle" font-size="11" fill="#444">xovi/start 载入新版</text>
<text x="695" y="508" text-anchor="middle" font-size="11" fill="#6a6a6a">host 侧 run_apply 认出标记：ssh 随重启断开不算失败，</text>
<text x="695" y="524" text-anchor="middle" font-size="11" fill="#6a6a6a">提示回来后跑 verify-on-device.sh</text>

<text x="30" y="562" font-size="13" font-weight="bold" fill="#333">四、待换入区的收尾规则</text>
<rect x="30" y="574" width="300" height="84" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.5"/>
<text x="180" y="598" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">自己 reboot 也会换入</text>
<text x="180" y="620" text-anchor="middle" font-size="11.5" fill="#444">xovi-reenable 的 ExecStartPre 在 xovi/start 前</text>
<text x="180" y="638" text-anchor="middle" font-size="11.5" fill="#444">把剩下的待换入 .so 挪进 extensions.d</text>
<rect x="350" y="574" width="300" height="84" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.5"/>
<text x="500" y="598" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">卸载时一并撤掉</text>
<text x="500" y="620" text-anchor="middle" font-size="11.5" fill="#444">uninstall-all 删同名待换入版本，</text>
<text x="500" y="638" text-anchor="middle" font-size="11.5" fill="#444">否则下次开机会被装回来</text>
<rect x="670" y="574" width="300" height="84" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.5"/>
<text x="820" y="598" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">同一新版已在待换入区</text>
<text x="820" y="620" text-anchor="middle" font-size="11.5" fill="#444">重复 --no-restart 部署：</text>
<text x="820" y="638" text-anchor="middle" font-size="11.5" fill="#444">不再备份、不再重放</text>
<text x="500" y="686" text-anchor="middle" font-size="11.5" fill="#6a6a6a">待换入区在 /home：设备中途重启也不丢；在换入之前 xochitl 仍用旧版。</text>
</svg>
