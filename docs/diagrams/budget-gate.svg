<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="bg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="bg-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="bg-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1200" height="640" fill="#fbfbfa"/>
<text x="600.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">并发闸门（网关 budget.rs）</text>
<text x="600.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">设备只有约 2GB 内存：当年设备上优化大书会内存叠加，于是加了这道闸；2026-10-07 起只拦「加入 xochitl」</text>
<rect x="30" y="96" width="210" height="190" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="135.0" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">要过闸的请求</text>
<text x="135.0" y="142.5" text-anchor="middle" font-size="10.5" fill="#8a8a8a">（优化 10-07 已删）</text>
<text x="135.0" y="156.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">加入 xochitl</text>
<text x="135.0" y="183.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">（单条点击和批量队列</text>
<text x="135.0" y="196.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">走同一道闸门）</text>
<rect x="290" y="96" width="250" height="190" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="415.0" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">admit(档位, 书名)</text>
<text x="415.0" y="142.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">按文件体积定档位</text>
<text x="415.0" y="156.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">有空名额 → 立刻放行</text>
<text x="415.0" y="169.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">没有 → 在条件变量上等</text>
<text x="415.0" y="183.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">每次唤醒重新判断一次</text>
<polyline points="240,190 290,190" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#bg-a)"/>
<text x="415" y="306" text-anchor="middle" font-size="10.5" fill="#6a6a6a">等待名单 pending（可被取消）</text>
<rect x="600" y="96" width="570" height="90" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="885.0" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">大档：体积 &gt; 90MB · 同一时刻最多 1 个</text>
<rect x="620" y="132" width="240" height="40" rx="6" fill="#ffffff" stroke="#c0602d" stroke-width="1.2"/>
<text x="740.0" y="149.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">名额 1：正在跑的大书</text>
<text x="1010" y="158" text-anchor="middle" font-size="10.5" fill="#4a4a4a">例：漫画合集 150MB</text>
<rect x="600" y="206" width="570" height="110" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="885.0" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">小档：体积 ≤ 90MB · 同一时刻最多 3 个</text>
<rect x="620" y="244" width="168" height="40" rx="6" fill="#ffffff" stroke="#3f9a55" stroke-width="1.2"/>
<text x="704.0" y="261.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">名额 1</text>
<rect x="802" y="244" width="168" height="40" rx="6" fill="#ffffff" stroke="#3f9a55" stroke-width="1.2"/>
<text x="886.0" y="261.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">名额 2</text>
<rect x="984" y="244" width="168" height="40" rx="6" fill="#ffffff" stroke="#3f9a55" stroke-width="1.2"/>
<text x="1068.0" y="261.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">名额 3</text>
<text x="885" y="304" text-anchor="middle" font-size="10.5" fill="#4a4a4a">大档与小档各自计数，互不占用对方名额</text>
<polyline points="540,150 600,150" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#bg-a)"/>
<polyline points="540,236 600,236" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#bg-a)"/>
<text x="570" y="140" text-anchor="middle" font-size="10.5" fill="#c0602d">大</text>
<text x="570" y="226" text-anchor="middle" font-size="10.5" fill="#2f7d45">小</text>
<text x="30" y="372" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">等待的三种结局</text>
<rect x="30" y="386" width="370" height="110" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="215.0" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">超时</text>
<text x="215.0" y="432.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">最多等 30 分钟</text>
<text x="215.0" y="446.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">超时给出明确报错：</text>
<text x="215.0" y="459.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">“排队等待并发处理名额超时”</text>
<rect x="415" y="386" width="370" height="110" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="600.0" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">取消排队</text>
<text x="600.0" y="432.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">单条“取消排队”或批量“全部中止”</text>
<text x="600.0" y="446.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">→ 立即退出等待</text>
<text x="600.0" y="459.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">→ “已取消排队”，不占名额</text>
<rect x="800" y="386" width="370" height="110" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="985.0" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">放行与释放</text>
<text x="985.0" y="432.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">拿到名额后才真正调 book-serve</text>
<text x="985.0" y="446.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">异步任务：查到这本书 busy=false 才归还</text>
<text x="985.0" y="459.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">查询连续失败 6 次才放名额（防提前放行）</text>
<text x="985.0" y="473.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">归还时唤醒所有排队者重新判断</text>
<rect x="30" y="520" width="1140" height="92" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="600.0" y="539" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">为什么放在网关</text>
<text x="600.0" y="564.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">book-serve 与 gateway 是各自独立的进程，进程内的忙锁天然不跨进程；book-serve 的忙锁又只按“书名”加，点不同的书互不阻塞。</text>
<text x="600.0" y="578.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">网关是所有请求唯一的转发关口，用进程内的锁就能全局限流，不需要跨进程锁或共享内存。两档数字是保守经验值，不是按内存精算的模型。</text>
</svg>
