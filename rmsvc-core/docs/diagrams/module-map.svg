<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="mm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="mm-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="640.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">rmsvc-core：四个顶层项目共用的服务基座</text>
<text x="640.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">纯基础设施，不含"书 / 笔记 / 字体"业务；消费方单向 path 依赖它（没有根 workspace），它不认识任何消费方</text>
<rect x="30" y="78" width="290" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">shelf/ 书架</text>
<text x="42" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">book-serve（母版库、加入 xochitl）</text>
<text x="42" y="137" text-anchor="start" font-size="11.0" fill="#6B7280">常用：http · asset · xochitl · fswatch · wire</text>
<polyline points="175,178 175,206" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#mm-arr)"/>
<rect x="340" y="78" width="290" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="352" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">notes/ 笔记</text>
<text x="352" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">ink · transcribe · mind · note-serve</text>
<text x="352" y="137" text-anchor="start" font-size="11.5" fill="#1F2937">crates：vendorcfg · notesvc</text>
<text x="352" y="154" text-anchor="start" font-size="11.0" fill="#6B7280">常用：http · registry · xochitl · config</text>
<polyline points="485,178 485,206" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#mm-arr)"/>
<rect x="650" y="78" width="290" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="662" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">enhance/ 系统增强</text>
<text x="662" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">font-serve · wallpaper-serve</text>
<text x="662" y="137" text-anchor="start" font-size="11.0" fill="#6B7280">常用：asset · proc · fswatch · xochitl_conf</text>
<polyline points="795,178 795,206" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#mm-arr)"/>
<rect x="960" y="78" width="290" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="972" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">gateway/ 网关</text>
<text x="972" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">唯一对外入口 :443</text>
<text x="972" y="137" text-anchor="start" font-size="11.5" fill="#1F2937">打开 gateway feature</text>
<text x="972" y="154" text-anchor="start" font-size="11.0" fill="#6B7280">常用：http · registry · events · auth · tls</text>
<polyline points="1105,178 1105,206" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#mm-arr)"/>
<rect x="30" y="208" width="1220" height="520" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="46" y="232" font-size="12.5" font-weight="700" fill="#6B7280">rmsvc-core（22 个公开模块；auth / tls / mdns / netinfo 只在 gateway feature 下编；另有内部 sys）</text>
<rect x="46" y="246" width="590" height="200" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="58" y="268" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">服务骨架</text>
<text x="60" y="292" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">service</text>
<text x="166" y="292" text-anchor="start" font-size="11.5" fill="#1F2937">启动模板：--bind → 建目录 → 登记注册表 → 起服务器，自带 /health</text>
<text x="60" y="313" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">registry</text>
<text x="166" y="313" text-anchor="start" font-size="11.5" fill="#1F2937">注册与发现；SvcClient 调别的服务（try_get_typed 带对方状态码）</text>
<text x="60" y="334" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">http</text>
<text x="166" y="334" text-anchor="start" font-size="11.5" fill="#1F2937">tiny_http 唯一适配层：Router、Reply / Body、ApiError、守卫、TLS</text>
<text x="60" y="355" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937"></text>
<text x="166" y="355" text-anchor="start" font-size="11.5" fill="#1F2937">每连接 60 秒读空闲超时、并发上限 64、panic 兜成 JSON 500</text>
<text x="60" y="376" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">events</text>
<text x="166" y="376" text-anchor="start" font-size="11.5" fill="#1F2937">EventBus + SSE（sse_reply_for）；follow 订阅别的服务；Wake</text>
<text x="60" y="397" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">proc</text>
<text x="166" y="397" text-anchor="start" font-size="11.5" fill="#1F2937">带超时的子进程、读 /proc（开机秒数、按名找进程）</text>
<rect x="650" y="246" width="584" height="200" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="662" y="268" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">文件与数据</text>
<text x="664" y="292" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">paths</text>
<text x="770" y="292" text-anchor="start" font-size="11.5" fill="#1F2937">XDG 唯一路径表（目录名仍叫 shelf）；测试用 Paths::sandbox</text>
<text x="664" y="313" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">fs</text>
<text x="770" y="313" text-anchor="start" font-size="11.5" fill="#1F2937">原子写（可带权限）、单段文件名、同名不覆盖、fs_space</text>
<text x="664" y="334" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">config</text>
<text x="770" y="334" text-anchor="start" font-size="11.5" fill="#1F2937">JSON 配置读写；load_or_seed 遇损坏留 .corrupt 副本</text>
<text x="664" y="355" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">multipart</text>
<text x="770" y="355" text-anchor="start" font-size="11.5" fill="#1F2937">流式 multipart 解析，边读边落盘；下载头 content_disposition</text>
<text x="664" y="376" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">asset</text>
<text x="770" y="376" text-anchor="start" font-size="11.5" fill="#1F2937">上传流程模板：UploadTarget + AssetUploadFlow（FlowError）</text>
<text x="664" y="397" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">formats</text>
<text x="770" y="397" text-anchor="start" font-size="11.5" fill="#1F2937">格式白名单唯一事实源（书只收 EPUB / PDF）、mime_of、sniff</text>
<text x="664" y="418" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">wire · cache</text>
<text x="770" y="418" text-anchor="start" font-size="11.5" fill="#1F2937">线上状态枚举（含 Unknown 兜底）· TTL / 文件戳缓存</text>
<rect x="46" y="460" width="590" height="160" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="58" y="482" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">和 xochitl 打交道</text>
<text x="60" y="506" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">xochitl</text>
<text x="166" y="506" text-anchor="start" font-size="11.5" fill="#1F2937">"设文件夹 → /upload"（进程内锁 + 跨进程 flock）</text>
<text x="60" y="527" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937"></text>
<text x="166" y="527" text-anchor="start" font-size="11.5" fill="#1F2937">目标只收 Folder（根 / 校验过的 uuid）；upload_and_claim 认领</text>
<text x="60" y="548" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937"></text>
<text x="166" y="548" text-anchor="start" font-size="11.5" fill="#1F2937">upload_large：&gt;100MB 占位 + 磁盘替换；书库只读查询、PageTable</text>
<text x="60" y="569" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">xochitl_conf</text>
<text x="166" y="569" text-anchor="start" font-size="11.5" fill="#1F2937">改 xochitl.conf [General] 单键（不打印、保留权限）</text>
<text x="60" y="590" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">fswatch</text>
<text x="166" y="590" text-anchor="start" font-size="11.5" fill="#1F2937">inotify 防抖监听：常驻 / 限时 / 等条件（wait_for）</text>
<rect x="650" y="460" width="584" height="160" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="662" y="482" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">对外与安全（gateway feature，默认不编）</text>
<text x="664" y="506" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">auth</text>
<text x="770" y="506" text-anchor="start" font-size="11.5" fill="#1F2937">PBKDF2、Basic / Cookie 解析、会话表、按 IP 限速、VerifyCache</text>
<text x="664" y="527" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">tls</text>
<text x="770" y="527" text-anchor="start" font-size="11.5" fill="#1F2937">带名称约束的私有 CA + 服务器证书（原子写、私钥 0600）</text>
<text x="664" y="548" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">mdns</text>
<text x="770" y="548" text-anchor="start" font-size="11.5" fill="#1F2937">shelf.local 应答器（内核报地址变化才重扫接口）</text>
<text x="664" y="569" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">netinfo</text>
<text x="770" y="569" text-anchor="start" font-size="11.5" fill="#1F2937">本机 IPv4 表（读 /proc，不 fork）</text>
<rect x="46" y="634" width="1188" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="58" y="656" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">小件</text>
<text x="60" y="680" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">clock · sync</text>
<text x="166" y="680" text-anchor="start" font-size="11.5" fill="#1F2937">unix 时间戳唯一出处 · 容忍 poison 的取锁 sync::lock</text>
<text x="60" y="701" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F2937">vendor/</text>
<text x="166" y="701" text-anchor="start" font-size="11.5" fill="#1F2937">tiny_http 0.12.0 本地副本：每连接读超时、accept 暂时性错误不退出、rustls 0.23.45</text>
<rect x="30" y="748" width="1220" height="74" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="42" y="770" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">rmsvc-core/epubpkg/：同目录下的独立小 crate（不依赖 rmsvc-core，也不是它的模块）</text>
<text x="42" y="790" text-anchor="start" font-size="11.5" fill="#1F2937">EPUB 容器 / OPF 只读解析（container.xml → OPF、manifest / spine / Dublin Core、href 解码、有上限地读 zip 条目）+ xochitl .epubindex 起始页表</text>
<text x="42" y="807" text-anchor="start" font-size="11.5" fill="#1F2937">谁在用：书架 shelf-conv 与 book-serve、笔记 epubmap；只依赖 regex / zip / flate2，纯解析库不连带编进 HTTP / TLS</text>
</svg>
