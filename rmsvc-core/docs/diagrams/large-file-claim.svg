<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="Noto Sans CJK SC, sans-serif">
<defs>
<marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker>
</defs>
<rect x="0" y="0" width="1080" height="500" fill="#fbfbfa"/>
<text x="540" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">大文件通道：为什么「传占位 → 认领 → 替换」要整段加锁</text>
<text x="540" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">upload_large_file 靠“刚进库 + 文件大小等于占位”认出自己那份；PDF 的占位是同一份固定字节，两本同时传就分不清</text>

<!-- 左：09-25 前 -->
<rect x="24" y="72" width="508" height="330" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="278" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">09-25 前：不加锁，两本大 PDF 并发</text>
<text x="150" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">线程 A（甲.pdf）</text>
<text x="406" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">线程 B（乙.pdf）</text>
<rect x="60" y="136" width="180" height="32" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
<text x="150" y="157" text-anchor="middle" font-size="11" fill="#3a3a3a">① 传占位 P → 条目 u1</text>
<rect x="316" y="136" width="180" height="32" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
<text x="406" y="157" text-anchor="middle" font-size="11" fill="#3a3a3a">① 传占位 P → 条目 u2</text>
<rect x="60" y="186" width="180" height="46" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
<text x="150" y="205" text-anchor="middle" font-size="11" fill="#3a3a3a">② 找“刚进库、大小 = P”</text>
<text x="150" y="222" text-anchor="middle" font-size="11" fill="#3a3a3a">→ 认领 u1</text>
<rect x="316" y="186" width="180" height="46" rx="6" fill="#ffffff" stroke="#b0451f" stroke-width="1.6"/>
<text x="406" y="205" text-anchor="middle" font-size="11" fill="#3a3a3a">② 同样的判据：u1、u2</text>
<text x="406" y="222" text-anchor="middle" font-size="11" fill="#b0451f">都符合 → 也可能认领 u1</text>
<rect x="60" y="250" width="180" height="32" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
<text x="150" y="271" text-anchor="middle" font-size="11" fill="#3a3a3a">③ 把甲换进 u1</text>
<rect x="316" y="250" width="180" height="32" rx="6" fill="#ffffff" stroke="#b0451f" stroke-width="1.6"/>
<text x="406" y="271" text-anchor="middle" font-size="11" fill="#b0451f">③ 把乙也换进 u1</text>
<line x1="150" y1="168" x2="150" y2="184" stroke="#555" stroke-width="1.4" marker-end="url(#mk)"/>
<line x1="150" y1="232" x2="150" y2="248" stroke="#555" stroke-width="1.4" marker-end="url(#mk)"/>
<line x1="406" y1="168" x2="406" y2="184" stroke="#555" stroke-width="1.4" marker-end="url(#mk)"/>
<line x1="406" y1="232" x2="406" y2="248" stroke="#555" stroke-width="1.4" marker-end="url(#mk)"/>
<rect x="44" y="300" width="468" height="88" rx="8" fill="#ffffff" stroke="#b0451f" stroke-width="1.4"/>
<text x="60" y="322" font-size="11.5" font-weight="bold" fill="#b0451f">结果</text>
<text x="60" y="342" font-size="11" fill="#3a3a3a">· u1 里最后是哪本书取决于谁后换完，另一本被覆盖掉</text>
<text x="60" y="360" font-size="11" fill="#3a3a3a">· u2 的占位永远留在书库里，没人认领</text>
<text x="60" y="378" font-size="11" fill="#3a3a3a">· 替换完成前 u1 仍是占位大小，所以只锁“认领”那一步不够</text>

<!-- 右：09-25 起 -->
<rect x="548" y="72" width="508" height="330" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="802" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">09-25 起：进程内一把锁，拿到替换完成</text>
<rect x="584" y="112" width="436" height="150" rx="8" fill="#ffffff" stroke="#2f7d45" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="802" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f7d45">线程 A 持锁（static Mutex LARGE）</text>
<text x="604" y="156" font-size="11" fill="#3a3a3a">① 传占位 P → u1</text>
<text x="604" y="178" font-size="11" fill="#3a3a3a">② 等 xochitl 建好条目，认领“刚进库、大小 = P”的 u1</text>
<text x="604" y="200" font-size="11" fill="#3a3a3a">③ 复制甲到 u1.pdf.new → 改 .content 页表 → 改名替换</text>
<text x="604" y="222" font-size="11" fill="#3a3a3a">④ 释放锁（此时 u1 已是甲的真实大小）</text>
<text x="604" y="246" font-size="10.5" fill="#6a6a6a">线程 B 一直等在锁外</text>
<line x1="802" y1="262" x2="802" y2="286" stroke="#2f7d45" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="584" y="288" width="436" height="42" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
<text x="802" y="306" text-anchor="middle" font-size="11" fill="#3a3a3a">线程 B 持锁：传占位 → u2；此时只有 u2 大小 = P</text>
<text x="802" y="322" text-anchor="middle" font-size="11" fill="#3a3a3a">→ 认领 u2 → 换成乙</text>
<rect x="568" y="342" width="468" height="46" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
<text x="584" y="362" font-size="11" fill="#3a3a3a">代价：第二本要等第一本整份复制、改名完才开始</text>
<text x="584" y="380" font-size="11" fill="#3a3a3a">大文件同时投递很少见，换来的是不会串书、不留孤儿占位</text>

<rect x="24" y="416" width="1032" height="68" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="40" y="438" font-size="11" fill="#3a3a3a">· 调用方只有 book-serve（母版库“加入”超过约 100 MB 的 EPUB/PDF）；锁只在进程内，跨进程不管。EPUB 占位带真书名和封面、大小通常不同，这个问题主要出在 PDF。</text>
<text x="40" y="458" font-size="11" fill="#3a3a3a">· 和 09-24 的“设文件夹 → /upload”锁是两把锁：那把只锁一次上传，这把锁住大文件通道的整个过程（占位上传本身仍会再拿那一把）。</text>
<text x="40" y="476" font-size="11" fill="#3a3a3a">· 验证：host 单测 concurrent_large_pdf_uploads_claim_distinct_entries（3 本并发、假 xochitl 延迟 300 ms 建条目）；未在真机上并发投递过。</text>
</svg>
