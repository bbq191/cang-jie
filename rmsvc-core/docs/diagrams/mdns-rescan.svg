<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="md-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="380" fill="#fbfbfa"/>
<text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">mDNS 应答器什么时候重扫网络接口</text>
<text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">rmsvc-core/src/mdns.rs · 网关用它让局域网里能用 shelf.local 找到设备</text>

<rect x="24" y="72" width="460" height="260" rx="10" fill="#f2f2f4" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="254" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">09-25 之前：定时轮询</text>
<text x="254" y="120" text-anchor="middle" font-size="12" fill="#555">5353 套接字读超时 60 秒，超时就顺带重扫一次接口</text>
<line x1="50" y1="180" x2="458" y2="180" stroke="#555" stroke-width="1.6" marker-end="url(#md-m)"/>
<text x="456" y="202" text-anchor="end" font-size="11" fill="#555">时间</text>
<g fill="#c0602d">
<circle cx="80" cy="180" r="5"/><circle cx="150" cy="180" r="5"/><circle cx="220" cy="180" r="5"/><circle cx="290" cy="180" r="5"/><circle cx="360" cy="180" r="5"/><circle cx="430" cy="180" r="5"/>
</g>
<text x="80" y="164" text-anchor="middle" font-size="11" fill="#c0602d">醒</text>
<text x="150" y="164" text-anchor="middle" font-size="11" fill="#c0602d">醒</text>
<text x="220" y="164" text-anchor="middle" font-size="11" fill="#c0602d">醒</text>
<text x="290" y="164" text-anchor="middle" font-size="11" fill="#c0602d">醒</text>
<text x="360" y="164" text-anchor="middle" font-size="11" fill="#c0602d">醒</text>
<text x="430" y="164" text-anchor="middle" font-size="11" fill="#c0602d">醒</text>
<text x="115" y="202" text-anchor="middle" font-size="10.5" fill="#6a6a6a">60 秒</text>
<text x="185" y="202" text-anchor="middle" font-size="10.5" fill="#6a6a6a">60 秒</text>
<text x="254" y="244" text-anchor="middle" font-size="12" fill="#3a3a3a">· 设备空闲时每小时也要醒 60 次</text>
<text x="254" y="266" text-anchor="middle" font-size="12" fill="#3a3a3a">· WiFi 刚连上 / 换了网：最多等 60 秒才能被解析</text>
<text x="254" y="288" text-anchor="middle" font-size="12" fill="#3a3a3a">· 网络没变化时，这些唤醒全是白费</text>

<rect x="508" y="72" width="468" height="260" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="742" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">09-25 起：内核说地址变了才扫</text>
<text x="742" y="120" text-anchor="middle" font-size="12" fill="#555">poll 同时等两个来源，没有超时</text>
<rect x="672" y="186" width="140" height="48" rx="10" fill="#ffffff" stroke="#3f9a55" stroke-width="1.6"/>
<text x="742" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">poll</text>
<text x="742" y="226" text-anchor="middle" font-size="11" fill="#3a3a3a">无限期等待</text>
<rect x="524" y="136" width="200" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="624" y="153" text-anchor="middle" font-size="11.5" fill="#1a1a1a">5353 套接字</text>
<text x="624" y="169" text-anchor="middle" font-size="10.5" fill="#555">有人问 shelf.local</text>
<rect x="760" y="136" width="200" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="860" y="153" text-anchor="middle" font-size="11.5" fill="#1a1a1a">netlink 地址通知</text>
<text x="860" y="169" text-anchor="middle" font-size="10.5" fill="#555">RTM_NEWADDR / RTM_DELADDR</text>
<polyline points="624,176 690,186" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#md-m)"/>
<polyline points="860,176 794,186" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#md-m)"/>
<rect x="524" y="250" width="200" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="624" y="267" text-anchor="middle" font-size="11.5" fill="#1a1a1a">回答</text>
<text x="624" y="283" text-anchor="middle" font-size="10.5" fill="#555">选与提问者同子网的本机 IPv4</text>
<rect x="760" y="250" width="200" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="860" y="267" text-anchor="middle" font-size="11.5" fill="#1a1a1a">重扫接口</text>
<text x="860" y="283" text-anchor="middle" font-size="10.5" fill="#555">新地址加入多播组</text>
<polyline points="700,234 640,250" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#md-m)"/>
<polyline points="784,234 844,250" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#md-m)"/>
<text x="742" y="314" text-anchor="middle" font-size="11.5" fill="#2f7d45">空闲零唤醒；拿到新地址立刻可解析；同 IP 重连也会重新入组</text>

<text x="500" y="360" text-anchor="middle" font-size="11.8" fill="#555">netlink 打不开时退回左边的旧做法（RESCAN_INTERVAL = 60 秒）并打一行日志。真机上没有专门触发过新行为。</text>
</svg>
