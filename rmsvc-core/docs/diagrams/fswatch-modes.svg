<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 530" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="fw-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="fw-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="620.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">fswatch：三种形态（rmsvc-core fswatch.rs）</text>
<text x="620.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">单层目录 inotify 监听：空闲时线程睡死、零唤醒；有写入后等防抖窗口静默，再回调一次（带上受影响的文件名）</text>
<rect x="30" y="80" width="380" height="160" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">watch_debounced(目录, 防抖, 回调)</text>
<text x="42" y="122" text-anchor="start" font-size="11.5" fill="#1F2937">常驻，不返回（inotify 起不来才返回）</text>
<text x="42" y="139" text-anchor="start" font-size="11.5" fill="#1F2937">有写入 → 等静默 → 回调 → 接着等</text>
<text x="42" y="156" text-anchor="start" font-size="11.5" fill="#1F2937">目录被删 / 挪走：1 秒起翻倍到 5 分钟</text>
<text x="42" y="173" text-anchor="start" font-size="11.5" fill="#1F2937">退避重挂，挂上后以空集合回调一次</text>
<text x="42" y="190" text-anchor="start" font-size="11.5" fill="#1F2937">用在：注册表唤醒、book-serve inbox、</text>
<text x="42" y="207" text-anchor="start" font-size="11.5" fill="#1F2937">ink-serve 书库（wallpaper-serve 用 watch_with）</text>
<rect x="430" y="80" width="380" height="160" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="442" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">watch_until(目录, 防抖, 超时, 回调)</text>
<text x="442" y="122" text-anchor="start" font-size="11.5" fill="#1F2937">限时：回调说"完了"返回 true；到点 false</text>
<text x="442" y="139" text-anchor="start" font-size="11.5" fill="#1F2937">有头有尾的等待，返回即撤掉监听</text>
<text x="442" y="156" text-anchor="start" font-size="11.5" fill="#1F2937">不给书库目录留常驻监听</text>
<text x="442" y="173" text-anchor="start" font-size="11.0" fill="#6B7280">（2026-10-10 时没有生产调用方，只有测试）</text>
<rect x="830" y="80" width="380" height="160" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="842" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">wait_for(目录, 防抖, 超时, check)</text>
<text x="842" y="122" text-anchor="start" font-size="11.5" fill="#1F2937">等某个条件成立：check 给 Some 就交回</text>
<text x="842" y="139" text-anchor="start" font-size="11.5" fill="#1F2937">先挂监听，再查一次（不漏中间的变化）</text>
<text x="842" y="156" text-anchor="start" font-size="11.5" fill="#1F2937">之后每次目录变化静默后再查，到点查最后一次</text>
<text x="842" y="173" text-anchor="start" font-size="11.5" fill="#1F2937">inotify 起不来时退化成每秒轮询</text>
<text x="842" y="190" text-anchor="start" font-size="11.5" fill="#1F2937">用在：upload_and_claim 认领、渲染自检、</text>
<text x="842" y="207" text-anchor="start" font-size="11.5" fill="#1F2937">建文件夹等待、大文件占位页数等待</text>
<text x="46" y="284" text-anchor="start" font-size="12.5" font-weight="700" fill="#1F2937">wait_for 的时间线</text>
<line x1="60" y1="320" x2="1180" y2="320" stroke="#64748B" stroke-width="1.5" marker-end="url(#fw-arr)"/>
<circle cx="80" cy="320" r="5" fill="#10B981"/>
<text x="80" y="306" text-anchor="middle" font-size="11.5" fill="#1F2937">① 挂上监听</text>
<circle cx="330" cy="320" r="5" fill="#10B981"/>
<text x="330" y="306" text-anchor="middle" font-size="11.5" fill="#1F2937">② check()</text>
<circle cx="620" cy="320" r="5" fill="#10B981"/>
<text x="620" y="306" text-anchor="middle" font-size="11.5" fill="#1F2937">③ 目录变化、静默后 check()</text>
<circle cx="960" cy="320" r="5" fill="#10B981"/>
<text x="960" y="306" text-anchor="middle" font-size="11.5" fill="#1F2937">④ 到点，最后一次 check()</text>
<text x="620" y="342" text-anchor="middle" font-size="11" fill="#6B7280">（可能重复多次）</text>
<rect x="30" y="370" width="1180" height="136" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="392" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">实现约定</text>
<text x="42" y="419" text-anchor="start" font-size="11.5" fill="#1F2937">· 每个监听只占调用方这一条线程：poll(inotify 描述符, 超时) 后非阻塞读，返回即释放；超时按毫秒向上取整，不会变成 poll(0) 忙等。</text>
<text x="42" y="443" text-anchor="start" font-size="11.5" fill="#1F2937">· 事件：CLOSE_WRITE / MOVED_TO / CREATE / DELETE / MOVED_FROM / MOVE_SELF，只看一层，不递归。</text>
<text x="42" y="467" text-anchor="start" font-size="11.5" fill="#1F2937">· WatchSpec 可改掩码与防抖（watch_with / watch_until_with / wait_for_with）；wallpaper-serve 用它只收壁纸目录的 CLOSE_NOWRITE、不防抖。</text>
<text x="42" y="491" text-anchor="start" font-size="11.5" fill="#1F2937">· 读事件出错时固定歇 5 秒再读，没有退避（已知，未改）。</text>
</svg>
