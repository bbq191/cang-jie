<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="af-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="af-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="620.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">网关登录与限速（gateway auth.rs + rmsvc-core auth）</text>
<text x="620.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">同样是"密码试错太多被锁"：网页登录口回 429，带 Basic 头的请求在锁定期回 401</text>
<rect x="30" y="80" width="230" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">一个请求进来</text>
<text x="42" y="122" text-anchor="start" font-size="11.5" fill="#1F2937">公开路径直接放行：</text>
<text x="42" y="139" text-anchor="start" font-size="11.5" fill="#1F2937">GET/POST /login · POST /logout</text>
<text x="42" y="156" text-anchor="start" font-size="11.5" fill="#1F2937">GET /ca.crt · /health</text>
<text x="42" y="173" text-anchor="start" font-size="11.5" fill="#1F2937">GET /favicon.ico</text>
<rect x="300" y="80" width="290" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="312" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">认身份</text>
<text x="312" y="122" text-anchor="start" font-size="11.5" fill="#1F2937">先看 Cookie shelf_session（内存会话表）</text>
<text x="312" y="139" text-anchor="start" font-size="11.5" fill="#1F2937">再看 Authorization: Basic</text>
<text x="312" y="156" text-anchor="start" font-size="11.5" fill="#1F2937">（Basic 先查本 IP 有没有被锁，</text>
<text x="312" y="173" text-anchor="start" font-size="11.5" fill="#1F2937">再查 10 分钟的"通过"缓存，最后算 PBKDF2）</text>
<rect x="630" y="80" width="270" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="642" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">身份 OK，但"必须改密码"？</text>
<text x="642" y="122" text-anchor="start" font-size="11.5" fill="#1F2937">默认密码 shelf 首登必改：</text>
<text x="642" y="139" text-anchor="start" font-size="11.5" fill="#1F2937">只放行 /password 与 GET /api/session</text>
<rect x="940" y="80" width="270" height="110" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="952" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">放行到路由</text>
<text x="952" y="122" text-anchor="start" font-size="11.5" fill="#1F2937">网关自有路由或反向代理</text>
<polyline points="260,135 300,135" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#af-arr)"/>
<polyline points="590,135 630,135" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#af-arr)"/>
<polyline points="900,135 940,135" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#af-arr)"/>
<text x="920" y="127" text-anchor="middle" font-size="11" fill="#6B7280">否</text>
<rect x="240" y="240" width="360" height="100" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="252" y="262" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">没认出身份</text>
<text x="252" y="282" text-anchor="start" font-size="11.5" fill="#1F2937">浏览器（Accept 含 text/html）→ 303 /login?next=&lt;原路径&gt;</text>
<text x="252" y="299" text-anchor="start" font-size="11.5" fill="#1F2937">其它请求 → 401 + WWW-Authenticate: Basic</text>
<text x="252" y="316" text-anchor="start" font-size="11.5" fill="#1F2937">密码错一次另外延时 500ms</text>
<rect x="640" y="240" width="360" height="110" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="652" y="262" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">仍是默认密码（必须改）</text>
<text x="652" y="282" text-anchor="start" font-size="11.5" fill="#1F2937">网页 → 303 /password</text>
<text x="652" y="299" text-anchor="start" font-size="11.5" fill="#1F2937">API → 403</text>
<text x="652" y="316" text-anchor="start" font-size="11.5" fill="#1F2937">Basic 可直接 POST /password（不用再填当前密码）</text>
<text x="652" y="333" text-anchor="start" font-size="11.5" fill="#1F2937">新密码 ≥6 位且不能是 shelf</text>
<polyline points="445,190 420,238" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#af-arr-r)"/>
<polyline points="765,190 800,238" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#af-arr-r)"/>
<text x="795" y="214" text-anchor="middle" font-size="11" fill="#6B7280">是</text>
<rect x="30" y="380" width="580" height="130" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="42" y="402" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">失败限速（按来源 IP，rmsvc-core IpFailLimiter）</text>
<text x="42" y="422" text-anchor="start" font-size="11.5" fill="#1F2937">同一 IP 60 秒内输错 5 次 → 锁这个 IP，最多 60 秒</text>
<text x="42" y="439" text-anchor="start" font-size="11.5" fill="#1F2937">锁定期内不做 PBKDF2、不累计（不会被无限续锁）</text>
<text x="42" y="456" text-anchor="start" font-size="11.5" fill="#1F2937">被锁时：POST /login、/password 回 429 + Retry-After；Basic 回 401</text>
<text x="42" y="473" text-anchor="start" font-size="11.5" fill="#1F2937">表最多 256 个 IP；USB 网段与 127.0.0.1 也不豁免</text>
<text x="42" y="490" text-anchor="start" font-size="11.5" fill="#1F2937">成功一次清零；重启网关全部清零</text>
<rect x="630" y="380" width="580" height="130" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="642" y="402" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">密码与会话</text>
<text x="642" y="422" text-anchor="start" font-size="11.5" fill="#1F2937">哈希：PBKDF2-HMAC-SHA256 60 万轮、16 字节随机盐</text>
<text x="642" y="439" text-anchor="start" font-size="11.5" fill="#1F2937">会话：32 字节随机令牌，只存内存，最多 64 个，30 天</text>
<text x="642" y="456" text-anchor="start" font-size="11.5" fill="#1F2937">Cookie：HttpOnly · SameSite=Strict · HTTPS 时 Secure</text>
<text x="642" y="473" text-anchor="start" font-size="11.5" fill="#1F2937">改密码后踢掉其它会话，清空 Basic 通过缓存</text>
<text x="642" y="490" text-anchor="start" font-size="11.5" fill="#1F2937">登录后跳转的 next 只认本站路径（拒 // \ 控制字符）</text>
</svg>
