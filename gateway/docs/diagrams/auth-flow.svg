<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1240" height="640" fill="#fbfbfa"/>
<text x="620.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">网关登录与限速（auth.rs + rmsvc-core/auth.rs）</text>
<text x="620.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">注意：同样是“密码试错太多被锁”，网页登录口回 429，而走 Authorization: Basic 的请求锁定期回的是 401</text>
<rect x="24" y="84" width="200" height="90" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="124.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">一个请求进来</text>
<text x="124.0" y="127" text-anchor="middle" font-size="10.5" fill="#3a3a3a">公开路径直接放行：</text>
<text x="124.0" y="142" text-anchor="middle" font-size="10.5" fill="#3a3a3a">GET /login · POST /login /logout</text>
<text x="124.0" y="157" text-anchor="middle" font-size="10.5" fill="#3a3a3a">GET /ca.crt /health /favicon.ico</text>
<polyline points="224,129 270,129" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="270" y="84" width="330" height="90" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="435.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">认身份（identify）</text>
<text x="435.0" y="127" text-anchor="middle" font-size="10" fill="#3a3a3a">先看 Cookie shelf_session（内存会话表，命中即通过）</text>
<text x="435.0" y="142" text-anchor="middle" font-size="10" fill="#3a3a3a">再看 Authorization: Basic *:&lt;密码&gt;</text>
<text x="435.0" y="157" text-anchor="middle" font-size="10" fill="#3a3a3a">（Basic 校验前先看有没有被锁）</text>
<polyline points="600,129 646,129" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="646" y="84" width="280" height="90" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="786.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">身份 OK 但“必须改密码”？</text>
<text x="786.0" y="127" text-anchor="middle" font-size="10" fill="#3a3a3a">默认密码 shelf 首登必改：</text>
<text x="786.0" y="142" text-anchor="middle" font-size="10" fill="#3a3a3a">只放行 /password 与 GET /api/session</text>
<rect x="950" y="84" width="266" height="90" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="1083.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">放行到路由</text>
<text x="1083.0" y="127" text-anchor="middle" font-size="10" fill="#3a3a3a">正常请求进入网关路由 / 反向代理</text>
<polyline points="926,129 950,129" fill="none" stroke="#2f7d45" stroke-width="1.6" marker-end="url(#mg)"/>
<text x="938" y="118" text-anchor="middle" font-size="11" fill="#2f7d45">否</text>
<rect x="24" y="214" width="380" height="150" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="36" y="234" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">没认出身份（Nobody）</text>
<text x="36" y="257" text-anchor="start" font-size="10.5" fill="#3a3a3a">浏览器（Accept 含 text/html）</text>
<text x="36" y="272" text-anchor="start" font-size="10.5" fill="#3a3a3a">  → 303 跳 /login?next=&lt;原路径&gt;</text>
<text x="36" y="287" text-anchor="start" font-size="10.5" fill="#3a3a3a">其它请求（API、curl）</text>
<text x="36" y="302" text-anchor="start" font-size="10.5" fill="#3a3a3a">  → 401 + WWW-Authenticate: Basic</text>
<text x="36" y="317" text-anchor="start" font-size="10.5" fill="#3a3a3a">（Basic 密码错还会额外延时 500ms）</text>
<rect x="430" y="214" width="380" height="150" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="442" y="234" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">仍是默认密码（必须改）</text>
<text x="442" y="257" text-anchor="start" font-size="10.5" fill="#3a3a3a">网页 → 303 跳 /password</text>
<text x="442" y="272" text-anchor="start" font-size="10.5" fill="#3a3a3a">API → 403“首次登录必须先改密码”</text>
<text x="442" y="287" text-anchor="start" font-size="10.5" fill="#3a3a3a">CLI 可 POST /password（Basic 已证明持有</text>
<text x="442" y="302" text-anchor="start" font-size="10.5" fill="#3a3a3a">当前密码，不用再填 current 字段）</text>
<text x="442" y="317" text-anchor="start" font-size="10.5" fill="#3a3a3a">新密码：≥6 位，且不能是 shelf</text>
<polyline points="435,174 214,214" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#mr)"/>
<polyline points="786,174 620,214" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#mr)"/>
<text x="836" y="200" text-anchor="middle" font-size="11" fill="#b0451f">是</text>
<rect x="24" y="400" width="1192" height="214" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="620.0" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">失败限速器 FailLimiter（全局计数，不分来源 IP）</text>
<rect x="44" y="440" width="360" height="150" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="56" y="460" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">规则</text>
<text x="56" y="483" text-anchor="start" font-size="10.5" fill="#3a3a3a">滑动窗口 60 秒内累计输错 5 次 → 锁 60 秒</text>
<text x="56" y="498" text-anchor="start" font-size="10.5" fill="#3a3a3a">每次输错还固定延时 500ms</text>
<text x="56" y="513" text-anchor="start" font-size="10.5" fill="#3a3a3a">锁定期内不再做密码校验（省 60 万轮 PBKDF2）</text>
<text x="56" y="528" text-anchor="start" font-size="10.5" fill="#3a3a3a">锁定期内不再累加，不会被无限续锁</text>
<text x="56" y="543" text-anchor="start" font-size="10.5" fill="#3a3a3a">成功一次清零；重启网关也清零</text>
<rect x="424" y="440" width="380" height="150" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="436" y="460" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">锁定期间各入口的回应</text>
<text x="436" y="483" text-anchor="start" font-size="10.5" fill="#3a3a3a">POST /login：429 + Retry-After（网页显示“请 N 秒后再试”）</text>
<text x="436" y="498" text-anchor="start" font-size="10.5" fill="#3a3a3a">POST /password（输密码改密）：同为 429</text>
<text x="436" y="513" text-anchor="start" font-size="10.5" fill="#3a3a3a">Basic 头的普通 API 请求：401（等同没认出身份）</text>
<text x="436" y="528" text-anchor="start" font-size="10.5" fill="#3a3a3a">会话 Cookie 有效的请求不受影响</text>
<rect x="824" y="440" width="372" height="150" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="836" y="460" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">密码与会话</text>
<text x="836" y="483" text-anchor="start" font-size="10" fill="#3a3a3a">哈希：PBKDF2-HMAC-SHA256，60 万轮，随机盐</text>
<text x="836" y="498" text-anchor="start" font-size="10" fill="#3a3a3a">（旧版单轮 SHA-256 哈希仍可校验，改密后自动升级）</text>
<text x="836" y="513" text-anchor="start" font-size="10" fill="#3a3a3a">会话令牌 32 字节随机，只存内存，重启即全部下线</text>
<text x="836" y="528" text-anchor="start" font-size="10" fill="#3a3a3a">会话有效期 30 天（gateway.json 的 sessionDays）</text>
<text x="836" y="543" text-anchor="start" font-size="10" fill="#3a3a3a">Cookie：HttpOnly · SameSite=Strict · HTTPS 时 Secure</text>
<text x="836" y="558" text-anchor="start" font-size="10" fill="#3a3a3a">改密后踢掉其它设备的会话</text>
</svg>
