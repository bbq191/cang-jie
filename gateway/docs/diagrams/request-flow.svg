<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 690" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="rf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="rf-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="640.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">网关：一个网址、一次登录，背后是 7 个只听本机的服务</text>
<text x="640.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">浏览器只认识网关（0.0.0.0:443）；各服务只监听 127.0.0.1，外面碰不到</text>
<rect x="30" y="110" width="210" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="132" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">浏览器 / 手机 / 脚本</text>
<text x="42" y="152" text-anchor="start" font-size="11.5" fill="#1F2937">https://shelf.local/</text>
<text x="42" y="169" text-anchor="start" font-size="11.5" fill="#1F2937">https://10.11.99.1/（USB）</text>
<text x="42" y="186" text-anchor="start" font-size="11.5" fill="#1F2937">https://&lt;WiFi IP&gt;/</text>
<text x="42" y="203" text-anchor="start" font-size="11.5" fill="#1F2937">网页：登录后带 Cookie</text>
<text x="42" y="220" text-anchor="start" font-size="11.5" fill="#1F2937">脚本：Basic 密码</text>
<rect x="30" y="290" width="210" height="92" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="42" y="312" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">首次使用</text>
<text x="42" y="332" text-anchor="start" font-size="11.5" fill="#1F2937">下载 /ca.crt 装进信任库</text>
<text x="42" y="349" text-anchor="start" font-size="11.5" fill="#1F2937">默认密码 shelf，登录后必改</text>
<rect x="275" y="82" width="560" height="556" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="290" y="104" font-size="12.5" font-weight="700" fill="#6B7280">gateway 进程（gateway/src，systemd: gateway.service）</text>
<rect x="295" y="118" width="520" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="307" y="140" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">① HTTPS + 登录守卫</text>
<text x="307" y="160" text-anchor="start" font-size="11.5" fill="#1F2937">私有 CA 签的证书（rmsvc-core tls）</text>
<text x="307" y="177" text-anchor="start" font-size="11.5" fill="#1F2937">auth.rs：认 Cookie / Basic，输错按来源 IP 限速</text>
<rect x="295" y="212" width="520" height="142" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="307" y="234" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">② 网关自己的路由（优先匹配）</text>
<text x="307" y="254" text-anchor="start" font-size="11.5" fill="#1F2937">/ 单页 UI（ui.rs，8 个脚本编译期拼成一个页面）</text>
<text x="307" y="271" text-anchor="start" font-size="11.5" fill="#1F2937">/login · /password · /api/session（auth.rs）</text>
<text x="307" y="288" text-anchor="start" font-size="11.5" fill="#1F2937">/api/services · /api/manage · /api/foundation（manage.rs）</text>
<text x="307" y="305" text-anchor="start" font-size="11.5" fill="#1F2937">/api/batch*（batch.rs 批量队列）</text>
<text x="307" y="322" text-anchor="start" font-size="11.5" fill="#1F2937">/api/enhance/*（系统增强开关） · /api/device/*（设备健康）</text>
<text x="307" y="339" text-anchor="start" font-size="11.5" fill="#1F2937">/api/events（events.rs：把各服务事件汇成一条 SSE）</text>
<rect x="295" y="374" width="520" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="307" y="396" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">③ 其余 /api/&lt;seg&gt;/* → 反向代理（proxy.rs）</text>
<text x="307" y="416" text-anchor="start" font-size="11.5" fill="#1F2937">MODULES 表（manage.rs）：seg → 服务名，例 books → book-serve</text>
<text x="307" y="433" text-anchor="start" font-size="11.5" fill="#1F2937">注册表：服务名 → 端口（$XDG_RUNTIME_DIR/shelf/services/）</text>
<text x="307" y="450" text-anchor="start" font-size="11.5" fill="#1F2937">剥掉 &lt;seg&gt; 转发；上传、大下载边读边转</text>
<rect x="295" y="484" width="250" height="134" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="307" y="506" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">批量队列 worker</text>
<text x="307" y="526" text-anchor="start" font-size="11.5" fill="#1F2937">一次一本「加入 xochitl」</text>
<text x="307" y="543" text-anchor="start" font-size="11.5" fill="#1F2937">直连 book-serve 提交并等结果</text>
<text x="307" y="560" text-anchor="start" font-size="11.5" fill="#1F2937">状态落盘 batch.json，</text>
<text x="307" y="577" text-anchor="start" font-size="11.5" fill="#1F2937">网关重启后续跑</text>
<text x="307" y="594" text-anchor="start" font-size="11.5" fill="#1F2937">每次落盘发 books/batch 事件</text>
<rect x="565" y="484" width="250" height="134" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="577" y="506" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">事件汇聚</text>
<text x="577" y="526" text-anchor="start" font-size="11.5" fill="#1F2937">每个有 /events 的服务一条</text>
<text x="577" y="543" text-anchor="start" font-size="11.5" fill="#1F2937">订阅线程（follow）</text>
<text x="577" y="560" text-anchor="start" font-size="11.5" fill="#1F2937">补上 svc、tab 后进总线</text>
<text x="577" y="577" text-anchor="start" font-size="11.5" fill="#1F2937">服务上下线 → manage 事件</text>
<polyline points="240,175 295,155" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<text x="262" y="155" text-anchor="middle" font-size="11" fill="#6B7280">HTTPS</text>
<polyline points="555,192 555,212" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<polyline points="555,354 555,374" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<text x="880" y="104" font-size="12.5" font-weight="700" fill="#6B7280">领域服务（各自独立进程，只听 127.0.0.1）</text>
<rect x="880" y="118" width="370" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="892" y="138" text-anchor="start" font-size="12.5" fill="#1F2937">books → book-serve :8790</text>
<text x="892" y="162" text-anchor="start" font-size="11" fill="#6B7280">母版库 / 加入 xochitl（shelf/）</text>
<rect x="880" y="180" width="370" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="892" y="200" text-anchor="start" font-size="12.5" fill="#1F2937">fonts → font-serve :8792</text>
<text x="892" y="224" text-anchor="start" font-size="11" fill="#6B7280">xochitl 字体（enhance/）</text>
<rect x="880" y="242" width="370" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="892" y="262" text-anchor="start" font-size="12.5" fill="#1F2937">wallpapers → wallpaper-serve :8793</text>
<text x="892" y="286" text-anchor="start" font-size="11" fill="#6B7280">休眠壁纸（enhance/）</text>
<rect x="880" y="304" width="370" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="892" y="324" text-anchor="start" font-size="12.5" fill="#1F2937">ink → ink-serve :8795</text>
<text x="892" y="348" text-anchor="start" font-size="11" fill="#6B7280">笔记条目库（notes/）</text>
<rect x="880" y="366" width="370" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="892" y="386" text-anchor="start" font-size="12.5" fill="#1F2937">transcribe → transcribe-serve :8796</text>
<text x="892" y="410" text-anchor="start" font-size="11" fill="#6B7280">手写转文字（notes/）</text>
<rect x="880" y="428" width="370" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="892" y="448" text-anchor="start" font-size="12.5" fill="#1F2937">mind → mind-serve :8797</text>
<text x="892" y="472" text-anchor="start" font-size="11" fill="#6B7280">问 AI，没有 /events（notes/）</text>
<rect x="880" y="490" width="370" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="892" y="510" text-anchor="start" font-size="12.5" fill="#1F2937">notes → note-serve :8798</text>
<text x="892" y="534" text-anchor="start" font-size="11" fill="#6B7280">笔记本 / 导出 md（notes/）</text>
<polyline points="815,419 850,419 850,146 878,146" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<line x1="850" y1="419" x2="850" y2="518" stroke="#64748B" stroke-width="1.5"/>
<polyline points="850,208 878,208" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<polyline points="850,270 878,270" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<polyline points="850,332 878,332" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<polyline points="850,394 878,394" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<polyline points="850,456 878,456" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<polyline points="850,518 878,518" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rf-arr)"/>
<polyline points="1000,546 1000,575 817,575" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rf-arr)"/>
<text x="830" y="594" text-anchor="start" font-size="11" fill="#6B7280">各服务 GET /events（SSE）</text>
<rect x="880" y="600" width="370" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="892" y="620" text-anchor="start" font-size="11.5" fill="#1F2937">服务启动时 service::run 自动登记注册表、自带 /health</text>
<text x="892" y="637" text-anchor="start" font-size="11.5" fill="#1F2937">端口是缺省值，代理按注册表里写的端口转发</text>
</svg>
