<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="#fbfbfa"/>
<text x="620.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">网关：一个入口，怎么把请求送到各个服务</text>
<text x="620.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">浏览器只认 https://shelf.local/（443）；后面的服务都只听本机 127.0.0.1，外面碰不到</text>
<rect x="24" y="90" width="170" height="190" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="109.0" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">浏览器 / 手机 / CLI</text>
<text x="109.0" y="133" text-anchor="middle" font-size="10.5" fill="#3a3a3a">网页：登录后带 Cookie</text>
<text x="109.0" y="148" text-anchor="middle" font-size="10.5" fill="#3a3a3a">命令行：Basic 认证</text>
<text x="109.0" y="163" text-anchor="middle" font-size="10.5" fill="#3a3a3a">（用户名随便，只认密码）</text>
<text x="109.0" y="178" text-anchor="middle" font-size="10.5" fill="#3a3a3a"></text>
<text x="109.0" y="193" text-anchor="middle" font-size="10.5" fill="#3a3a3a">第一次访问装一次 CA</text>
<text x="109.0" y="208" text-anchor="middle" font-size="10.5" fill="#3a3a3a">证书，就不再提示“不安全”</text>
<polyline points="194,185 236,185" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="236" y="76" width="500" height="600" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="486" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">gateway 进程（0.0.0.0:443，crate: gateway）</text>
<rect x="256" y="116" width="460" height="62" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="486.0" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">① HTTPS 终结 + 登录守卫（auth.rs）</text>
<text x="486.0" y="159" text-anchor="middle" font-size="10" fill="#3a3a3a">私有 CA（带名称约束）签证书；并发超 64 个请求回 503；公开：/login /logout /ca.crt /health 等</text>
<text x="486.0" y="174" text-anchor="middle" font-size="10" fill="#3a3a3a">未登录：浏览器 303→/login，其它 401；首登必改密码见下图</text>
<rect x="256" y="196" width="460" height="118" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="486.0" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">② 网关自己的路由（字面路径比 /api/{svc}/* 更具体，优先匹配）</text>
<text x="486.0" y="239" text-anchor="middle" font-size="10" fill="#3a3a3a">/  单页 UI · /ui/locales/{lang} · /ca.crt · /login /password /api/session</text>
<text x="486.0" y="254" text-anchor="middle" font-size="10" fill="#3a3a3a">/api/services（注册表）· /api/manage · /api/foundation（基石探测）</text>
<text x="486.0" y="269" text-anchor="middle" font-size="10" fill="#3a3a3a">/api/events（SSE 事件汇聚）</text>
<text x="486.0" y="284" text-anchor="middle" font-size="10" fill="#3a3a3a">/api/enhance/*（系统增强开关）· /api/device/*（健康 / OTA 横幅 / 清理）</text>
<text x="486.0" y="299" text-anchor="middle" font-size="10" fill="#3a3a3a">/api/batch* 批量队列 · /api/budget/* 并发闸门</text>
<rect x="256" y="332" width="460" height="190" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="268" y="352" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">③ 兜底：/api/&lt;seg&gt;/* 反向代理（proxy.rs）</text>
<text x="268" y="375" text-anchor="start" font-size="10" fill="#3a3a3a">1  seg → 服务名：查 manage.rs 的 MODULES 表（单一事实源）</text>
<text x="268" y="390" text-anchor="start" font-size="10" fill="#3a3a3a">     例：books→book-serve  ink→ink-serve  notes→note-serve</text>
<text x="268" y="405" text-anchor="start" font-size="10" fill="#3a3a3a">2  服务名 → 端口：查注册表 $XDG_RUNTIME_DIR/shelf/services/</text>
<text x="268" y="420" text-anchor="start" font-size="10" fill="#3a3a3a">3  剥掉 &lt;seg&gt;，转发到 http://127.0.0.1:&lt;端口&gt;/&lt;其余路径&gt;</text>
<text x="268" y="435" text-anchor="start" font-size="10" fill="#3a3a3a">     请求体流式转发；应答是 200 且带长度、又是下载或 &gt;256KB → 按定长边读边发</text>
<text x="268" y="450" text-anchor="start" font-size="10" fill="#3a3a3a">     其余（小 JSON、没有长度的）读完再回</text>
<text x="268" y="465" text-anchor="start" font-size="10" fill="#3a3a3a">     只回传 Content-Type / Content-Disposition 两个响应头</text>
<text x="268" y="480" text-anchor="start" font-size="10" fill="#3a3a3a">4  seg 不在表里 → 404“未知服务”；服务没起 → 404“未安装或未运行”</text>
<text x="268" y="495" text-anchor="start" font-size="10" fill="#3a3a3a">     后端连不上 → 502</text>
<rect x="256" y="540" width="460" height="122" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="268" y="560" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">例外：三个“吃内存”的 POST 先过闸门</text>
<text x="268" y="583" text-anchor="start" font-size="10" fill="#3a3a3a">book-serve  POST /staging/optimize</text>
<text x="268" y="598" text-anchor="start" font-size="10" fill="#3a3a3a">book-serve  POST /staging/deliver</text>
<text x="268" y="613" text-anchor="start" font-size="10" fill="#3a3a3a">koreader-serve  POST /books/adopt</text>
<text x="268" y="628" text-anchor="start" font-size="10" fill="#3a3a3a">→ 读小 JSON 拿书名 → budget::admit()（按体积分档、排队）再转发</text>
<polyline points="486,178 486,196" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="486,314 486,332" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="486,522 486,540" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<text x="770" y="100" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">领域服务（各自独立进程，只听 127.0.0.1，启动时自注册）</text>
<rect x="770" y="112" width="446" height="50" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="784" y="133" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/books/*</text>
<text x="784" y="151" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ book-serve  :8790  · 母版库 / 落原生</text>
<polyline points="743,137 768,137" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="770" y="170" width="446" height="50" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="784" y="191" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/koreader/*</text>
<text x="784" y="209" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ koreader-serve  :8791  · KOReader</text>
<polyline points="743,195 768,195" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="770" y="228" width="446" height="50" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="784" y="249" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/fonts/*</text>
<text x="784" y="267" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ font-serve  :8792  · xochitl 字体</text>
<polyline points="743,253 768,253" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="770" y="286" width="446" height="50" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="784" y="307" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/wallpapers/*</text>
<text x="784" y="325" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ wallpaper-serve  :8793  · 壁纸</text>
<polyline points="743,311 768,311" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="770" y="344" width="446" height="50" rx="10" fill="#f2eefa" stroke="#7a5cb0" stroke-width="1.6"/>
<text x="784" y="365" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/ink/*</text>
<text x="784" y="383" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ ink-serve  :8795  · 笔记·矿</text>
<polyline points="743,369 768,369" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="770" y="402" width="446" height="50" rx="10" fill="#f2eefa" stroke="#7a5cb0" stroke-width="1.6"/>
<text x="784" y="423" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/transcribe/*</text>
<text x="784" y="441" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ transcribe-serve  :8796  · 笔记·转写</text>
<polyline points="743,427 768,427" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="770" y="460" width="446" height="50" rx="10" fill="#f2eefa" stroke="#7a5cb0" stroke-width="1.6"/>
<text x="784" y="481" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/mind/*</text>
<text x="784" y="499" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ mind-serve  :8797  · 笔记·脑</text>
<polyline points="743,485 768,485" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="770" y="518" width="446" height="50" rx="10" fill="#f2eefa" stroke="#7a5cb0" stroke-width="1.6"/>
<text x="784" y="539" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">/api/notes/*</text>
<text x="784" y="557" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ note-serve  :8798  · 笔记·本</text>
<polyline points="743,543 768,543" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="716,427 743,427" fill="none" stroke="#555" stroke-width="1.6"/>
<polyline points="743,137 743,543" fill="none" stroke="#555" stroke-width="1.6"/>
<text x="993" y="592" text-anchor="middle" font-size="10.5" fill="#6a6a6a">端口是各服务的缺省值，实际以注册表里写的为准</text>
<rect x="770" y="610" width="446" height="66" rx="10" fill="#f1f1ef" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="993.0" y="630" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">为什么这样拆</text>
<text x="993.0" y="653" text-anchor="middle" font-size="10" fill="#3a3a3a">前端只认一个地址、一次登录；服务缺席时网页自动隐藏对应 tab</text>
<text x="993.0" y="668" text-anchor="middle" font-size="10" fill="#3a3a3a">（网页据 /api/services 判断），新增服务只需在 MODULES 加一行</text>
</svg>
