<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="bq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="bq-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="620.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">批量队列（gateway batch.rs）</text>
<text x="620.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">浏览器只负责提交和看进度；排队与执行都在网关进程里，关掉页面照跑。动作只剩「加入 xochitl」</text>
<text x="30" y="86" font-size="12.5" font-weight="700" fill="#6B7280">一、一批任务的生命周期</text>
<rect x="30" y="98" width="200" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="130.0" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">提交</text>
<text x="130.0" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937">POST /api/batch</text>
<text x="130.0" y="157" text-anchor="middle" font-size="11.5" fill="#1F2937">action: deliver</text>
<text x="130.0" y="174" text-anchor="middle" font-size="11.5" fill="#1F2937">names 点名 或 all:true</text>
<text x="130.0" y="191" text-anchor="middle" font-size="11.5" fill="#1F2937">folder（目标文件夹）</text>
<rect x="260" y="98" width="210" height="112" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="365.0" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">资格校验</text>
<text x="365.0" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937">先取 book-serve /staging</text>
<text x="365.0" y="157" text-anchor="middle" font-size="11.5" fill="#1F2937">只收 EPUB / PDF</text>
<text x="365.0" y="174" text-anchor="middle" font-size="11.5" fill="#1F2937">已在队列或处理中：跳过</text>
<text x="365.0" y="191" text-anchor="middle" font-size="11.5" fill="#1F2937">点名但不合格：计入 skipped</text>
<rect x="500" y="98" width="190" height="112" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="595.0" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">queue 排队</text>
<text x="595.0" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937">先进先出</text>
<text x="595.0" y="157" text-anchor="middle" font-size="11.5" fill="#1F2937">从空闲开始的入队</text>
<text x="595.0" y="174" text-anchor="middle" font-size="11.5" fill="#1F2937">开新一轮、计数清零</text>
<rect x="720" y="98" width="220" height="112" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="830.0" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">current 处理中</text>
<text x="830.0" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937">worker 线程一次一本</text>
<text x="830.0" y="157" text-anchor="middle" font-size="11.5" fill="#1F2937">等这本在 book-serve</text>
<text x="830.0" y="174" text-anchor="middle" font-size="11.5" fill="#1F2937">处理完才取下一本</text>
<rect x="980" y="98" width="230" height="50" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="1095.0" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">ok → done+1</text>
<rect x="980" y="160" width="230" height="50" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="1095.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">其余 → failed[]{name,message}</text>
<polyline points="230,154 260,154" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bq-arr)"/>
<polyline points="470,154 500,154" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bq-arr)"/>
<polyline points="690,154 720,154" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bq-arr)"/>
<polyline points="940,130 980,123" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bq-arr)"/>
<polyline points="940,180 980,185" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bq-arr)"/>
<polyline points="830,210 830,236 595,236 595,212" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#bq-arr)"/>
<text x="712" y="230" text-anchor="middle" font-size="11" fill="#6B7280">取下一本</text>
<text x="30" y="278" font-size="12.5" font-weight="700" fill="#6B7280">二、处理"一本书"的内部</text>
<rect x="30" y="290" width="330" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42" y="312" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">① 提交给 book-serve</text>
<text x="42" y="332" text-anchor="start" font-size="11.5" fill="#1F2937">直连 POST /staging/deliver {name, folder}</text>
<text x="42" y="349" text-anchor="start" font-size="11.5" fill="#1F2937">（不经网关自己的代理）</text>
<text x="42" y="366" text-anchor="start" font-size="11.5" fill="#1F2937">提交前先看「全部中止」标记：</text>
<text x="42" y="383" text-anchor="start" font-size="11.5" fill="#1F2937">已中止就不提交，记"已全部中止"</text>
<rect x="400" y="290" width="420" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="412" y="312" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">② 等这本处理完（poll_until_settled）</text>
<text x="412" y="332" text-anchor="start" font-size="11.5" fill="#1F2937">查 GET /staging 直到这本 busy=false 或已不在列表</text>
<text x="412" y="349" text-anchor="start" font-size="11.5" fill="#1F2937">事件唤醒（books_wake），没事件 30 秒兜底查一次</text>
<text x="412" y="366" text-anchor="start" font-size="11.5" fill="#1F2937">两次查询至少隔 5 秒；连续 6 次失败才放弃</text>
<text x="412" y="383" text-anchor="start" font-size="11.5" fill="#1F2937">最长 1 小时</text>
<rect x="860" y="290" width="350" height="110" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="872" y="312" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">③ 读结论（只认 ok）</text>
<text x="872" y="332" text-anchor="start" font-size="11.5" fill="#1F2937">从判定处理完的那份列表读 delivered.deliver</text>
<text x="872" y="349" text-anchor="start" font-size="11.5" fill="#1F2937">ok → 成功；failed → 带 book-serve 的原因</text>
<text x="872" y="366" text-anchor="start" font-size="11.5" fill="#1F2937">超时 / 查不到 / 条目消失 / 仍 pending →</text>
<text x="872" y="383" text-anchor="start" font-size="11.5" fill="#1F2937">记失败，提示去 xochitl 书库核对</text>
<polyline points="360,345 400,345" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bq-arr)"/>
<polyline points="820,345 860,345" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bq-arr)"/>
<text x="30" y="440" font-size="12.5" font-weight="700" fill="#6B7280">三、中止与重启续跑</text>
<rect x="30" y="452" width="580" height="120" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="42" y="474" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">全部中止（POST /api/batch/stop → {cleared}）</text>
<text x="42" y="494" text-anchor="start" font-size="11.5" fill="#1F2937">1. 清空还没开始的，总数同步扣掉</text>
<text x="42" y="511" text-anchor="start" font-size="11.5" fill="#1F2937">2. 已经交给 book-serve 的那本会跑完（上传没有安全的中断点）</text>
<text x="42" y="528" text-anchor="start" font-size="11.5" fill="#1F2937">3. 已出队、还没提交的那本：打"中止当前"标记，worker 提交前看到就不交</text>
<text x="42" y="545" text-anchor="start" font-size="11.5" fill="#1F2937">worker 内 panic 由 catch_unwind 兜住，只让这一本失败</text>
<rect x="640" y="452" width="570" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="652" y="474" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">落盘与续跑（~/.local/state/shelf/batch.json）</text>
<text x="652" y="494" text-anchor="start" font-size="11.5" fill="#1F2937">每次状态变化原子写一次（序列化与写盘同一把锁），并发 books/batch 事件</text>
<text x="652" y="511" text-anchor="start" font-size="11.5" fill="#1F2937">网关启动 resume：被打断的那本放回队首；先装进内存，</text>
<text x="652" y="528" text-anchor="start" font-size="11.5" fill="#1F2937">后台等 book-serve 注册（最长 30 分钟，期间 waitingService=true）</text>
<text x="652" y="545" text-anchor="start" font-size="11.5" fill="#1F2937">再按最新母版库剔除已不在的；等不到也保留队列，下次入队一起跑</text>
<text x="652" y="562" text-anchor="start" font-size="11.5" fill="#1F2937">文件损坏或格式不对 = 当作没有未完成的队列</text>
</svg>
