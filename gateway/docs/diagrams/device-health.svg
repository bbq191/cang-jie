<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="640" fill="#fbfbfa"/>
<text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">「管理 → 设备健康」：数据从哪来、什么时候采</text>
<text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">只在打开这一屏或点「刷新」时采集；没有定时器，也不跟 SSE 事件走 · gateway/src/device/</text>

<!-- 左：触发 -->
<text x="30" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">什么时候取</text>
<rect x="30" y="98" width="250" height="118" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="44" y="122" font-size="12.5" font-weight="bold" fill="#1a1a1a">进页 / 点「刷新」</text>
<text x="44" y="144" font-size="11" fill="#3a3a3a">GET /api/device/health</text>
<text x="44" y="160" font-size="10.5" fill="#6a6a6a">缓存 15 秒；刷新带 ?fresh=1 现采</text>
<text x="44" y="182" font-size="11" fill="#3a3a3a">GET /api/device/ota</text>
<text x="44" y="198" font-size="10.5" fill="#6a6a6a">缓存 30 秒；页头横幅也用它</text>

<rect x="30" y="232" width="250" height="84" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="44" y="256" font-size="12.5" font-weight="bold" fill="#1a1a1a">切到「清理」tab 时</text>
<text x="44" y="278" font-size="11" fill="#3a3a3a">GET /api/device/cleanup</text>
<text x="44" y="296" font-size="10.5" fill="#6a6a6a">只读列出，直接给右边「清理」tab</text>

<text x="30" y="346" font-size="10.5" fill="#6a6a6a">切其它二级 tab 不重取；</text>
<text x="30" y="362" font-size="10.5" fill="#6a6a6a">上次停留的 tab 记在 localStorage</text>
<text x="30" y="378" font-size="10.5" fill="#6a6a6a">（shelf.healthSub）</text>

<!-- 中：数据来源 -->
<text x="320" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">网关读什么（一次采集只 fork 两个子进程）</text>
<rect x="320" y="98" width="330" height="96" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="334" y="120" font-size="12" font-weight="bold" fill="#1a1a1a">子进程 ①  systemctl show</text>
<text x="334" y="140" font-size="10.5" fill="#3a3a3a">xochitl、xovi-reenable、gateway + MODULES 8 个服务</text>
<text x="334" y="157" font-size="10.5" fill="#3a3a3a">状态、重启次数、MainPID、进入运行的时刻与耗时</text>
<text x="334" y="176" font-size="12" font-weight="bold" fill="#1a1a1a">子进程 ②  journalctl -b -1 -n 20</text>

<rect x="320" y="206" width="330" height="170" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="334" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">直接读文件（不 fork）</text>
<text x="334" y="249" font-size="10.5" fill="#3a3a3a">/proc/uptime → 开机时长</text>
<text x="334" y="267" font-size="10.5" fill="#3a3a3a">/proc/&lt;pid&gt;/status → 内存 VmRSS / 峰值 VmHWM</text>
<text x="334" y="285" font-size="10.5" fill="#3a3a3a">xochitl 的 /proc/&lt;pid&gt;/maps → xovi、扩展、(deleted)</text>
<text x="334" y="301" font-size="10" fill="#6a6a6a">（每次现读：同一进程里 (deleted) 会变）</text>
<text x="334" y="321" font-size="10.5" fill="#3a3a3a">~/.cangjie-stage/so-pending/ → 待换入的扩展</text>
<text x="334" y="339" font-size="10.5" fill="#3a3a3a">statvfs(/home) → 剩余空间</text>
<text x="334" y="357" font-size="10.5" fill="#3a3a3a">/usr/lib/systemd/system/ → 单元在不在（OTA 判据）</text>

<rect x="320" y="388" width="330" height="58" rx="10" fill="#f1f1ef" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="334" y="410" font-size="12" font-weight="bold" fill="#1a1a1a">固件 sha256（/usr/bin/xochitl）</text>
<text x="334" y="430" font-size="10.5" fill="#3a3a3a">网关启动 30 秒后后台只算一次，常驻内存</text>

<!-- 右：五个 tab -->
<text x="690" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">页面上的五个二级 tab</text>
<rect x="690" y="98" width="280" height="58" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="704" y="120" font-size="12.5" font-weight="bold" fill="#1a1a1a">概览</text>
<text x="704" y="140" font-size="10.5" fill="#3a3a3a">开机时长、xochitl、xovi、/home、固件、OTA 判定</text>
<rect x="690" y="164" width="280" height="44" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="704" y="191" font-size="12.5" font-weight="bold" fill="#1a1a1a">服务</text>
<text x="744" y="191" font-size="10.5" fill="#3a3a3a">状态、重启次数、内存、启动耗时</text>
<rect x="690" y="216" width="280" height="44" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="704" y="243" font-size="12.5" font-weight="bold" fill="#1a1a1a">扩展</text>
<text x="744" y="243" font-size="10.5" fill="#3a3a3a">已映射、换了文件未生效、待换入</text>
<rect x="690" y="268" width="280" height="44" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="704" y="295" font-size="12.5" font-weight="bold" fill="#1a1a1a">日志</text>
<text x="744" y="295" font-size="10.5" fill="#3a3a3a">上次开机最后 20 行（冻机线索）</text>
<rect x="690" y="320" width="280" height="126" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="704" y="344" font-size="12.5" font-weight="bold" fill="#1a1a1a">清理（勾选 + 二次确认）</text>
<text x="704" y="366" font-size="10.5" fill="#3a3a3a">books/done/ 旧文件：网关逐个 remove_file，</text>
<text x="704" y="382" font-size="10.5" fill="#3a3a3a">只认单段文件名、不跟符号链接</text>
<text x="704" y="404" font-size="10.5" fill="#3a3a3a">书库同名副本：book-serve 排队 → xochitl 里</text>
<text x="704" y="420" font-size="10.5" fill="#3a3a3a">的回收站代理 moveEntriesToTrash（可恢复）</text>
<text x="704" y="436" font-size="10" fill="#6a6a6a">网关从不直接动 xochitl 目录</text>

<!-- 箭头 -->
<polyline points="280,157 320,157" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="650,146 670,146 670,127 690,127" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="650,290 670,290 670,238 690,238" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="650,417 670,417 670,160 690,160" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#mk)"/>

<!-- 底部：横幅 -->
<rect x="30" y="470" width="940" height="150" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="46" y="496" font-size="13" font-weight="bold" fill="#1a1a1a">页头「需要重新安装」横幅（与「概览」里的 OTA 判定同一接口）</text>
<text x="46" y="520" font-size="11" fill="#3a3a3a">触发：/usr 下我们的单元被 OTA 冲掉，或 xochitl 在跑却没加载 xovi。固件不在白名单只作附加说明，不单独触发（--force 装过的新固件会永久误报）。</text>
<text x="46" y="542" font-size="11" fill="#3a3a3a">恢复命令：缺单元 → 设备旁 xovi/rebuild_hashtable，电脑上 install-all.sh；只是 xovi 没生效 → deploy-xovi-apply.sh（换入后整机重启）。</text>
<text x="46" y="564" font-size="11" fill="#3a3a3a">点 × 只在本次会话里关掉；不轮询。判据细节见 ota-check.svg。</text>
<text x="46" y="596" font-size="10.5" fill="#6a6a6a">设计取舍：体检只读、按需采集——设备只有双核、靠电池，后台定时采样会白白唤醒 CPU；飞行记录仪的日志在宿主机上，网关读不到，所以只看设备自己的 journal。</text>
</svg>
