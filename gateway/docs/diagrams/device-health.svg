<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="dh-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="dh-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="620.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">「管理 → 设备健康」与页头 OTA 横幅（gateway/src/device/）</text>
<text x="620.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">只在打开这一屏、点「刷新」或打开页面时采集；没有定时器，也不跟 SSE 事件走</text>
<text x="30" y="86" font-size="12.5" font-weight="700" fill="#6B7280">什么时候取</text>
<rect x="30" y="98" width="300" height="128" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="42" y="120" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">进页 / 点「刷新」</text>
<text x="42" y="140" text-anchor="start" font-size="11.5" fill="#1F2937">GET /api/device/health</text>
<text x="42" y="157" text-anchor="start" font-size="11.5" fill="#1F2937">缓存 15 秒，刷新带 ?fresh=1 现采</text>
<text x="42" y="174" text-anchor="start" font-size="11.5" fill="#1F2937">GET /api/device/ota</text>
<text x="42" y="191" text-anchor="start" font-size="11.5" fill="#1F2937">缓存 30 秒；页头横幅同一接口</text>
<rect x="30" y="240" width="300" height="96" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="42" y="262" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">切到「清理」时</text>
<text x="42" y="282" text-anchor="start" font-size="11.5" fill="#1F2937">GET /api/device/cleanup（只读列出）</text>
<text x="42" y="299" text-anchor="start" font-size="11.5" fill="#1F2937">其它二级标签切换不重取</text>
<text x="370" y="86" font-size="12.5" font-weight="700" fill="#6B7280">网关读什么（一次采集只 fork 两个子进程）</text>
<rect x="370" y="98" width="440" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="382" y="120" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">子进程</text>
<text x="382" y="140" text-anchor="start" font-size="11.5" fill="#1F2937">systemctl show：xochitl、xovi-reenable、gateway + 7 个服务</text>
<text x="382" y="157" text-anchor="start" font-size="11.5" fill="#1F2937">（状态、重启次数、MainPID、启动耗时）</text>
<text x="382" y="174" text-anchor="start" font-size="11.5" fill="#1F2937">journalctl -b -1 -n 20：上次开机最后 20 行</text>
<rect x="370" y="208" width="440" height="128" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="382" y="230" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">直接读文件（不 fork）</text>
<text x="382" y="250" text-anchor="start" font-size="11.5" fill="#1F2937">/proc/uptime、/proc/&lt;pid&gt;/status（VmRSS / VmHWM）</text>
<text x="382" y="267" text-anchor="start" font-size="11.5" fill="#1F2937">xochitl 主进程的 maps → xovi、扩展、(deleted)</text>
<text x="382" y="284" text-anchor="start" font-size="11.5" fill="#1F2937">~/.cangjie-stage/so-pending/ → 待换入</text>
<text x="382" y="301" text-anchor="start" font-size="11.5" fill="#1F2937">statvfs(/home) → 剩余空间</text>
<text x="382" y="318" text-anchor="start" font-size="11.5" fill="#1F2937">/usr/lib/systemd/system/ → 单元在不在</text>
<rect x="370" y="350" width="440" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="382" y="372" text-anchor="start" font-size="12" font-weight="700" fill="#1F2937">固件 sha256（/usr/bin/xochitl）：启动 30 秒后后台只算一次</text>
<polyline points="330,160 370,160" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#dh-arr)"/>
<text x="850" y="86" font-size="12.5" font-weight="700" fill="#6B7280">页面上的五个二级标签</text>
<rect x="850" y="98" width="360" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="862" y="118" text-anchor="start" font-size="11.5" fill="#1F2937">概览：开机时长、xochitl、xovi、/home、固件、OTA 判定</text>
<rect x="850" y="148" width="360" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="862" y="168" text-anchor="start" font-size="11.5" fill="#1F2937">服务：状态、重启次数、内存、启动耗时</text>
<rect x="850" y="198" width="360" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="862" y="218" text-anchor="start" font-size="11.5" fill="#1F2937">扩展：已映射、换了文件未生效、待换入</text>
<rect x="850" y="248" width="360" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="862" y="268" text-anchor="start" font-size="11.5" fill="#1F2937">日志：上次开机最后 20 行（冻机线索）</text>
<rect x="850" y="298" width="360" height="92" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="862" y="320" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">清理（勾选 + 二次确认）</text>
<text x="862" y="340" text-anchor="start" font-size="11" fill="#1F2937">books/done/ 旧文件：网关逐个 remove_file</text>
<text x="862" y="357" text-anchor="start" font-size="11" fill="#1F2937">书库同名副本：排进 book-serve 回收站队列，</text>
<text x="862" y="374" text-anchor="start" font-size="11" fill="#1F2937">由 xochitl 里的回收站代理移进回收站（可恢复）</text>
<polyline points="810,200 848,200" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#dh-arr)"/>
<rect x="30" y="450" width="1180" height="246" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="46" y="474" font-size="12.5" font-weight="700" fill="#6B7280">页头"需要重新安装"横幅（GET /api/device/ota）</text>
<rect x="46" y="488" width="360" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="58" y="510" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">① 单元文件缺失</text>
<text x="58" y="530" text-anchor="start" font-size="11.5" fill="#1F2937">/usr/lib/systemd/system/ 下没有</text>
<text x="58" y="547" text-anchor="start" font-size="11.5" fill="#1F2937">gateway.service、shelf.target 或</text>
<text x="58" y="564" text-anchor="start" font-size="11.5" fill="#1F2937">二进制已装的某个服务的单元</text>
<rect x="436" y="488" width="360" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="448" y="510" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">② xovi 未生效</text>
<text x="448" y="530" text-anchor="start" font-size="11.5" fill="#1F2937">xochitl 主进程在跑，</text>
<text x="448" y="547" text-anchor="start" font-size="11.5" fill="#1F2937">但 maps 里没有 xovi.so</text>
<text x="448" y="564" text-anchor="start" font-size="11.5" fill="#1F2937">（xochitl 没在跑：不下结论）</text>
<rect x="826" y="488" width="368" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="838" y="510" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">③ 固件不在白名单</text>
<text x="838" y="530" text-anchor="start" font-size="11.5" fill="#1F2937">/usr/bin/xochitl 的 sha256 不在</text>
<text x="838" y="547" text-anchor="start" font-size="11.5" fill="#1F2937">firmware-allowlist.txt（构建时编进）</text>
<text x="838" y="564" text-anchor="start" font-size="11.5" fill="#1F2937">单独不触发；横幅已显示时提示加 --force</text>
<rect x="46" y="616" width="560" height="66" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="58" y="638" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">含 ① → OTA 恢复全流程</text>
<text x="58" y="658" text-anchor="start" font-size="11" fill="#1F2937">设备旁 xovi/rebuild_hashtable；电脑上 sh install-all.sh &lt;设备&gt;</text>
<rect x="636" y="616" width="558" height="66" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="648" y="638" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">只有 ② → 只让 xovi 生效</text>
<text x="648" y="658" text-anchor="start" font-size="11" fill="#1F2937">sh deploy-xovi-apply.sh &lt;设备&gt;（不给 xovi/start：会让 xochitl 崩溃）</text>
<polyline points="226,598 226,614" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#dh-arr)"/>
<polyline points="700,598 700,614" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#dh-arr)"/>
</svg>
