<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1240" height="560" fill="#fbfbfa"/>
<text x="620.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">事件汇聚：网页为什么不用轮询（events.rs + rmsvc-core/events.rs）</text>
<text x="620.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">各服务在“变更发生处”发一条极短的“该刷新了”信号；网关汇总后经一条 SSE 长连接推给所有网页</text>
<rect x="24" y="96" width="250" height="240" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="149.0" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">各领域服务</text>
<text x="149.0" y="139" text-anchor="middle" font-size="10.5" fill="#3a3a3a">book-serve · font-serve</text>
<text x="149.0" y="154" text-anchor="middle" font-size="10.5" fill="#3a3a3a">wallpaper-serve · ink-serve</text>
<text x="149.0" y="169" text-anchor="middle" font-size="10.5" fill="#3a3a3a">transcribe-serve · note-serve</text>
<text x="149.0" y="184" text-anchor="middle" font-size="9.5" fill="#8a8a8a">（koreader-serve 09-29 起不再订阅）</text>
<text x="149.0" y="199" text-anchor="middle" font-size="10.5" fill="#3a3a3a"></text>
<text x="149.0" y="214" text-anchor="middle" font-size="10.5" fill="#3a3a3a">每个都有 GET /events（SSE）</text>
<text x="149.0" y="229" text-anchor="middle" font-size="10.5" fill="#3a3a3a">事件：{"area":"books",</text>
<text x="149.0" y="244" text-anchor="middle" font-size="10.5" fill="#3a3a3a">"kind":"staging","at":&lt;秒&gt;}</text>
<text x="149.0" y="259" text-anchor="middle" font-size="10.5" fill="#3a3a3a"></text>
<text x="149.0" y="274" text-anchor="middle" font-size="10.5" fill="#3a3a3a">mind-serve 没有 /events</text>
<text x="149.0" y="289" text-anchor="middle" font-size="10.5" fill="#3a3a3a">（纯被动问答，网关不订阅）</text>
<rect x="340" y="96" width="330" height="240" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="352" y="116" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">网关 Hub（每个有事件流的服务一条线程）</text>
<text x="352" y="139" text-anchor="start" font-size="10" fill="#3a3a3a">events::follow(服务名)：</text>
<text x="352" y="154" text-anchor="start" font-size="10" fill="#3a3a3a">· 服务没起：等注册表目录 inotify，不轮询</text>
<text x="352" y="169" text-anchor="start" font-size="10" fill="#3a3a3a">· 连上：GET /events?ka=120（心跳 2 分钟一次）</text>
<text x="352" y="184" text-anchor="start" font-size="10" fill="#3a3a3a">· 断线：退避重连 3s→60s，撑过 10s 才重置</text>
<text x="352" y="199" text-anchor="start" font-size="10" fill="#3a3a3a">· 对方回 404：长等 10 分钟或等重新注册</text>
<text x="352" y="214" text-anchor="start" font-size="10" fill="#3a3a3a">收到事件补上 "svc":"&lt;seg&gt;" 后发进总线</text>
<text x="352" y="229" text-anchor="start" font-size="10" fill="#3a3a3a"></text>
<text x="352" y="244" text-anchor="start" font-size="10" fill="#3a3a3a">另有一条：监听注册表目录（inotify，防抖 500ms）</text>
<text x="352" y="259" text-anchor="start" font-size="10" fill="#3a3a3a">→ 服务上下线时发 {"area":"manage"}</text>
<rect x="736" y="96" width="210" height="110" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="841.0" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">EventBus 总线</text>
<text x="841.0" y="139" text-anchor="middle" font-size="10" fill="#3a3a3a">进程内广播</text>
<text x="841.0" y="154" text-anchor="middle" font-size="10" fill="#3a3a3a">每个订阅者一条有界队列(64)</text>
<text x="841.0" y="169" text-anchor="middle" font-size="10" fill="#3a3a3a">满了丢事件——它只是信号</text>
<rect x="736" y="226" width="210" height="110" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="841.0" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">网关自己也发事件</text>
<text x="841.0" y="269" text-anchor="middle" font-size="10" fill="#3a3a3a">batch.rs 队列状态变了</text>
<text x="841.0" y="284" text-anchor="middle" font-size="10" fill="#8a8a8a">（闸门 budget.rs 2026-10-07 删除）</text>
<text x="841.0" y="299" text-anchor="middle" font-size="10" fill="#3a3a3a">→ {"area":"books"}</text>
<rect x="1010" y="96" width="206" height="286" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="1113.0" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">浏览器 EventSource</text>
<text x="1113.0" y="139" text-anchor="middle" font-size="10" fill="#3a3a3a">GET /api/events?ka=60</text>
<text x="1113.0" y="154" text-anchor="middle" font-size="10" fill="#3a3a3a">（受登录守卫保护）</text>
<text x="1113.0" y="169" text-anchor="middle" font-size="10" fill="#3a3a3a"></text>
<text x="1113.0" y="184" text-anchor="middle" font-size="10" fill="#3a3a3a">收到事件 → 只刷新对应</text>
<text x="1113.0" y="199" text-anchor="middle" font-size="10" fill="#3a3a3a">区域（母版库 / 笔记 /</text>
<text x="1113.0" y="214" text-anchor="middle" font-size="10" fill="#3a3a3a">管理台），不整页刷</text>
<text x="1113.0" y="229" text-anchor="middle" font-size="10" fill="#3a3a3a"></text>
<text x="1113.0" y="244" text-anchor="middle" font-size="10" fill="#3a3a3a">断线（WiFi 掉、休眠醒来）：</text>
<text x="1113.0" y="259" text-anchor="middle" font-size="10" fill="#3a3a3a">浏览器自己重连并补刷；</text>
<text x="1113.0" y="274" text-anchor="middle" font-size="10" fill="#3a3a3a">浏览器放弃重连（CLOSED，</text>
<text x="1113.0" y="289" text-anchor="middle" font-size="10" fill="#3a3a3a">如网关重启后 401）：先查</text>
<text x="1113.0" y="304" text-anchor="middle" font-size="10" fill="#3a3a3a">/api/session，401 去登录；</text>
<text x="1113.0" y="319" text-anchor="middle" font-size="10" fill="#3a3a3a">否则 5 秒起翻倍、封顶 5 分钟</text>
<text x="1113.0" y="334" text-anchor="middle" font-size="10" fill="#3a3a3a">重开，页面隐藏时不重试（09-30）</text>
<text x="1113.0" y="349" text-anchor="middle" font-size="10" fill="#3a3a3a">60 秒一次心跳；页面隐藏</text>
<text x="1113.0" y="364" text-anchor="middle" font-size="10" fill="#3a3a3a">超 60 秒主动断开</text>
<polyline points="274,216 340,216" fill="none" stroke="#2f7d45" stroke-width="1.6" marker-end="url(#mg)"/>
<text x="307.0" y="208" text-anchor="middle" font-size="10" fill="#555">SSE</text>
<polyline points="670,150 736,150" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="841,226 841,206" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<polyline points="946,150 1010,150" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<text x="620" y="400" text-anchor="middle" font-size="11.5" fill="#3a3a3a">设计约束（用户 2026-09-06）：不轮询、不监听全盘、日志写入不触发；事件只来自服务代码里的变更点，加上上述两处 inotify。</text>
<rect x="24" y="430" width="1192" height="100" rx="10" fill="#f1f1ef" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="36" y="450" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">和批量队列的关系</text>
<text x="36" y="473" text-anchor="start" font-size="10.5" fill="#3a3a3a">网页在批量运行时不再每 3 秒轮询 /api/batch/status：batch.rs 每次落盘都会调 events::notify_books()（kind=batch，不带 svc），</text>
<text x="36" y="488" text-anchor="start" font-size="10.5" fill="#3a3a3a">网页收到后只拉一次 /api/batch/status（2026-10-07 前闸门还发 budget、网页多拉 /api/budget/status）。</text>
<text x="36" y="510" text-anchor="start" font-size="10.5" fill="#3a3a3a">反方向也用得上：book-serve 发来的 books 事件会唤醒批量 worker 里“等这本书处理完再取下一本”的等待（books_wake，没事件时 30 秒兜底查一次）。</text>
</svg>
