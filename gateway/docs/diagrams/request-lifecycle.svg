<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1240" height="760" fill="#fbfbfa"/>
<text x="620.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">一个请求在网关里要过的关（以“加入 xochitl”为例）</text>
<text x="620.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">左列是正常路径，右列是在这一关被拦下时浏览器收到什么；灰字标出代码位置</text>
<rect x="40" y="78" width="600" height="78" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="52" y="98" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">① 接入：拿并发名额 + 记下对端 IP</text>
<text x="52" y="120" text-anchor="start" font-size="10.5" fill="#3a3a3a">同时在处理的请求（含 SSE 长连接）最多 64 个</text>
<text x="52" y="135" text-anchor="start" font-size="10.5" fill="#3a3a3a">对端 IP 写进内部头 X-Rmsvc-Remote-Ip（客户端自带的同名头被丢掉）</text>
<text x="628" y="98" text-anchor="end" font-size="10" fill="#8a8a8a">rmsvc-core http/server.rs</text>
<rect x="700" y="86" width="500" height="62" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="712" y="106" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">超过 64 个</text>
<text x="712" y="128" text-anchor="start" font-size="10.5" fill="#3a3a3a">503 + Retry-After: 2，不开新线程</text>
<polyline points="640,117.0 700,117.0" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#mr)"/>
<polyline points="340.0,156 340.0,172" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="40" y="172" width="600" height="78" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="52" y="192" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">② 登录守卫</text>
<text x="52" y="214" text-anchor="start" font-size="10.5" fill="#3a3a3a">公开路径直接放行；其余认 Cookie shelf_session 或 Basic 密码（验过的密码缓存 10 分钟，免每次 60 万轮 PBKDF2）</text>
<text x="628" y="192" text-anchor="end" font-size="10" fill="#8a8a8a">gateway auth.rs</text>
<rect x="700" y="180" width="500" height="62" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="712" y="200" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">没认出身份 / 仍是默认密码</text>
<text x="712" y="222" text-anchor="start" font-size="10.5" fill="#3a3a3a">浏览器 303 → /login 或 /password；API 401 / 403</text>
<text x="712" y="237" text-anchor="start" font-size="10.5" fill="#3a3a3a">Basic 输错 5 次：这个 IP 锁到窗口滑出（期间 401）</text>
<polyline points="640,211.0 700,211.0" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#mr)"/>
<polyline points="340.0,250 340.0,266" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="40" y="266" width="600" height="78" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="52" y="286" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">③ 路由：最具体的优先</text>
<text x="52" y="308" text-anchor="start" font-size="10.5" fill="#3a3a3a">/api/batch、/api/enhance/… 等网关自有路由直接处理；</text>
<text x="52" y="323" text-anchor="start" font-size="10.5" fill="#3a3a3a">其余 /api/&lt;seg&gt;/* 进反向代理（proxy.rs）</text>
<text x="628" y="286" text-anchor="end" font-size="10" fill="#8a8a8a">rmsvc-core http/router.rs</text>
<rect x="700" y="274" width="500" height="62" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="712" y="294" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">处理函数 panic</text>
<text x="712" y="316" text-anchor="start" font-size="10.5" fill="#3a3a3a">兜成 JSON 500“服务内部错误”，名额照常归还</text>
<polyline points="640,305.0 700,305.0" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#mr)"/>
<polyline points="340.0,344 340.0,360" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="40" y="360" width="600" height="78" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="52" y="380" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">④ 找后端：seg → 服务名 → 端口</text>
<text x="52" y="402" text-anchor="start" font-size="10.5" fill="#3a3a3a">MODULES 表：books → book-serve</text>
<text x="52" y="417" text-anchor="start" font-size="10.5" fill="#3a3a3a">注册表 …/shelf/services/book-serve.json → 127.0.0.1:8790</text>
<text x="628" y="380" text-anchor="end" font-size="10" fill="#8a8a8a">gateway proxy.rs</text>
<rect x="700" y="368" width="500" height="62" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="712" y="388" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">seg 不认识 / 服务没起</text>
<text x="712" y="410" text-anchor="start" font-size="10.5" fill="#3a3a3a">404“未知服务” / 404“book-serve 未安装或未运行”</text>
<polyline points="640,399.0 700,399.0" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#mr)"/>
<polyline points="340.0,438 340.0,454" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="40" y="454" width="600" height="78" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="52" y="474" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">⑤ 转发请求</text>
<text x="52" y="496" text-anchor="start" font-size="10.5" fill="#3a3a3a">请求体边读边转发、一律不解析（上传大文件不占网关内存），超时 900 秒</text>
<text x="628" y="474" text-anchor="end" font-size="10" fill="#8a8a8a">gateway proxy.rs</text>
<rect x="700" y="462" width="500" height="62" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="712" y="482" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">后端连不上</text>
<text x="712" y="504" text-anchor="start" font-size="10.5" fill="#3a3a3a">502“book-serve 无响应”</text>
<polyline points="640,493 700,493" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#mr)"/>
<polyline points="340.0,532 340.0,548" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="40" y="548" width="600" height="86" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="52" y="568" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">⑥ 回应浏览器</text>
<text x="52" y="590" text-anchor="start" font-size="10.5" fill="#3a3a3a">200 且带长度，又是下载（原件、导出）或 &gt;256KB（壁纸原图等）→ 按定长边读边发；</text>
<text x="52" y="605" text-anchor="start" font-size="10.5" fill="#3a3a3a">其余（JSON 等小应答、没有长度的）读完再回——不借 SSE“读到连接关闭”的通道；</text>
<text x="52" y="620" text-anchor="start" font-size="10.5" fill="#3a3a3a">只带回 Content-Type / Content-Disposition 两个响应头</text>
<text x="628" y="568" text-anchor="end" font-size="10" fill="#8a8a8a">proxy.rs + http/server.rs</text>
<rect x="40" y="648" width="1160" height="94" rx="10" fill="#f3f3f1" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="52" y="668" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">已删除：并发/内存闸门（budget.rs，2026-10-07）</text>
<text x="52" y="690" text-anchor="start" font-size="10.5" fill="#3a3a3a">原来在 ④ 和转发之间还有一关：读小 JSON 拿书名，&gt;90MB 大档同时 1 本、其余 3 本，排队最长 30 分钟，可“取消排队”（409 / 503）。</text>
<text x="52" y="707" text-anchor="start" font-size="10.5" fill="#3a3a3a">书架不再优化书后加入是流式上传、只占几 MB，网页的「加入 xochitl」又只走批量队列（一本处理完才取下一本），闸门拦不到东西，删掉。</text>
<text x="52" y="724" text-anchor="start" font-size="10.5" fill="#3a3a3a">“等这本书处理完”的轮询（poll_until_settled：事件唤醒、30 秒兜底、两次查询≥5 秒、连续 6 次失败才放弃、最长 1 小时）挪进了 batch.rs。</text>
</svg>
