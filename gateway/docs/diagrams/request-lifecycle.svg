<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="rl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="rl-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="620.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">一个请求在网关里要过的关</text>
<text x="620.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">左列是正常路径（以经代理的 /api/books/… 为例），右列是被拦下时浏览器收到什么</text>
<rect x="40" y="78" width="720" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="52" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">① 接入：拿并发名额、记下对端 IP</text>
<text x="52" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">同时处理的请求最多 64 个（含 SSE 长连接）</text>
<text x="52" y="137" text-anchor="start" font-size="11.5" fill="#1F2937">对端 IP 写进内部头 X-Rmsvc-Remote-Ip，客户端伪造的同名头被丢掉</text>
<text x="748" y="100" text-anchor="end" font-size="11" fill="#6B7280">rmsvc-core http/server.rs</text>
<rect x="810" y="84" width="390" height="68" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="822" y="106" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">超过 64 个</text>
<text x="822" y="126" text-anchor="start" font-size="11" fill="#1F2937">503 + Retry-After: 2，不开新线程</text>
<polyline points="760,118 808,118" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#rl-arr-r)"/>
<polyline points="400,158 400,170" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rl-arr)"/>
<rect x="40" y="170" width="720" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="52" y="192" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">② 登录守卫</text>
<text x="52" y="212" text-anchor="start" font-size="11.5" fill="#1F2937">公开路径直接放行（/login /logout /ca.crt /health /favicon.ico）</text>
<text x="52" y="229" text-anchor="start" font-size="11.5" fill="#1F2937">其余要认出 Cookie shelf_session 或 Basic 密码</text>
<text x="748" y="192" text-anchor="end" font-size="11" fill="#6B7280">gateway auth.rs</text>
<rect x="810" y="176" width="390" height="68" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="822" y="198" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">没认出身份 / 仍是默认密码</text>
<text x="822" y="218" text-anchor="start" font-size="11" fill="#1F2937">网页 303 → /login 或 /password；API 401 / 403</text>
<text x="822" y="235" text-anchor="start" font-size="11" fill="#1F2937">同一 IP 输错太多：登录口 429，Basic 401</text>
<polyline points="760,210 808,210" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#rl-arr-r)"/>
<polyline points="400,250 400,262" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rl-arr)"/>
<rect x="40" y="262" width="720" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="52" y="284" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">③ 路由：最具体的优先</text>
<text x="52" y="304" text-anchor="start" font-size="11.5" fill="#1F2937">字面段多的胜、精确胜通配，与注册顺序无关</text>
<text x="52" y="321" text-anchor="start" font-size="11.5" fill="#1F2937">/api/batch、/api/enhance… 网关自己处理；其余进代理</text>
<text x="748" y="284" text-anchor="end" font-size="11" fill="#6B7280">rmsvc-core http/router.rs</text>
<rect x="810" y="268" width="390" height="68" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="822" y="290" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">处理函数或守卫 panic</text>
<text x="822" y="310" text-anchor="start" font-size="11" fill="#1F2937">兜成 JSON 500"服务内部错误"，名额照常归还</text>
<polyline points="760,302 808,302" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#rl-arr-r)"/>
<polyline points="400,342 400,354" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rl-arr)"/>
<rect x="40" y="354" width="720" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="52" y="376" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">④ 找后端：seg → 服务名 → 端口</text>
<text x="52" y="396" text-anchor="start" font-size="11.5" fill="#1F2937">MODULES：books → book-serve</text>
<text x="52" y="413" text-anchor="start" font-size="11.5" fill="#1F2937">注册表 book-serve.json → 127.0.0.1:8790</text>
<text x="748" y="376" text-anchor="end" font-size="11" fill="#6B7280">gateway proxy.rs</text>
<rect x="810" y="360" width="390" height="68" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="822" y="382" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">seg 不认识 / 服务没起</text>
<text x="822" y="402" text-anchor="start" font-size="11" fill="#1F2937">404"未知服务" / 404"&lt;服务&gt; 未安装或未运行"</text>
<polyline points="760,394 808,394" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#rl-arr-r)"/>
<polyline points="400,434 400,446" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rl-arr)"/>
<rect x="40" y="446" width="720" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="52" y="468" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">⑤ 转发请求</text>
<text x="52" y="488" text-anchor="start" font-size="11.5" fill="#1F2937">请求体边读边转、不解析；GET/DELETE 不带请求体也不带长度</text>
<text x="52" y="505" text-anchor="start" font-size="11.5" fill="#1F2937">只有空闲超时：连接 3 秒、读 900 秒、写 120 秒，不设总时长</text>
<text x="748" y="468" text-anchor="end" font-size="11" fill="#6B7280">gateway proxy.rs</text>
<rect x="810" y="452" width="390" height="68" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="822" y="474" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">后端连不上</text>
<text x="822" y="494" text-anchor="start" font-size="11" fill="#1F2937">502"&lt;服务&gt; 无响应"</text>
<polyline points="760,486 808,486" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#rl-arr-r)"/>
<polyline points="400,526 400,538" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#rl-arr)"/>
<rect x="40" y="538" width="720" height="80" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="52" y="560" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">⑥ 回应浏览器</text>
<text x="52" y="580" text-anchor="start" font-size="11.5" fill="#1F2937">200 且带长度、又是下载或 &gt;256KB → 按定长边读边发</text>
<text x="52" y="597" text-anchor="start" font-size="11.5" fill="#1F2937">其余读完再回；只带回 Content-Type、Content-Disposition 与 200 的 Cache-Control</text>
<text x="748" y="560" text-anchor="end" font-size="11" fill="#6B7280">proxy.rs + http/server.rs</text>
</svg>
