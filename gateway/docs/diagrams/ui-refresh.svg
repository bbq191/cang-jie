<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 566" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="ur-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="ur-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker>
</defs>
<text x="620.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">网页什么时候向网关要数据（gateway/ui/*.js）</text>
<text x="620.0" y="56" text-anchor="middle" font-size="12" fill="#6B7280">不轮询；只在"第一次看到""切回来""收到事件"三种时刻取数，而且只取受影响的那一块</text>
<rect x="30" y="78" width="370" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">① 打开页面</text>
<text x="42" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">取语言包 → /api/services（每项带 seg）</text>
<text x="42" y="137" text-anchor="start" font-size="11.5" fill="#1F2937">只渲染第一个标签「传书」</text>
<text x="42" y="154" text-anchor="start" font-size="11.5" fill="#1F2937">其余标签第一次切过去才渲染</text>
<text x="42" y="171" text-anchor="start" font-size="11.5" fill="#1F2937">后台标签不取数</text>
<rect x="435" y="78" width="370" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="447" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">② 切换标签</text>
<text x="447" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">第一次：渲染（渲染本身取一次数据）</text>
<text x="447" y="137" text-anchor="start" font-size="11.5" fill="#1F2937">之后：只刷新</text>
<text x="447" y="154" text-anchor="start" font-size="11.5" fill="#1F2937">每块刷新经 coalesce 合并：</text>
<text x="447" y="171" text-anchor="start" font-size="11.5" fill="#1F2937">同一块同一时刻最多一个刷新在飞</text>
<rect x="840" y="78" width="370" height="108" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="852" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">③ 事件到达（/api/events?ka=60）</text>
<text x="852" y="120" text-anchor="start" font-size="11.5" fill="#1F2937">按事件的 tab 找顶层标签</text>
<text x="852" y="137" text-anchor="start" font-size="11.5" fill="#1F2937">不在前台：只记"待刷"</text>
<text x="852" y="154" text-anchor="start" font-size="11.5" fill="#1F2937">页面隐藏：只记一笔，重新可见再补</text>
<text x="852" y="171" text-anchor="start" font-size="11.5" fill="#1F2937">agent-failed：全站横幅，与标签无关</text>
<text x="620" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">前台标签自己的 onEvent 按事件来源决定取多少</text>
<rect x="30" y="232" width="280" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="254" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">管理（manage 事件）</text>
<text x="42" y="274" text-anchor="start" font-size="11.5" fill="#1F2937">服务上下线 →</text>
<text x="42" y="291" text-anchor="start" font-size="11.5" fill="#1F2937">重取 /api/services</text>
<text x="42" y="308" text-anchor="start" font-size="11.5" fill="#1F2937">tab 集合变了整页重载</text>
<text x="42" y="325" text-anchor="start" font-size="11.5" fill="#1F2937">没变只刷管理台</text>
<rect x="330" y="232" width="280" height="140" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="342" y="254" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">传书 · 母版库三档</text>
<text x="342" y="274" text-anchor="start" font-size="11.5" fill="#1F2937">QUEUE：网关 batch 事件</text>
<text x="342" y="291" text-anchor="start" font-size="11.5" fill="#1F2937">→ 只取 /api/batch/status</text>
<text x="342" y="308" text-anchor="start" font-size="11.5" fill="#1F2937">LIST：staging / render</text>
<text x="342" y="325" text-anchor="start" font-size="11.5" fill="#1F2937">→ 母版库列表 + 批量状态</text>
<text x="342" y="342" text-anchor="start" font-size="11.5" fill="#1F2937">FULL：其余 → 再加</text>
<text x="342" y="359" text-anchor="start" font-size="11.5" fill="#1F2937">/api/books/status</text>
<rect x="630" y="232" width="280" height="140" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="642" y="254" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">其他（字体 / 壁纸）</text>
<text x="642" y="274" text-anchor="start" font-size="11.5" fill="#1F2937">按 svc 只刷发事件</text>
<text x="642" y="291" text-anchor="start" font-size="11.5" fill="#1F2937">那个服务的子面板</text>
<text x="642" y="308" text-anchor="start" font-size="11.5" fill="#1F2937">认不出来源才整块刷新</text>
<rect x="930" y="232" width="280" height="140" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="942" y="254" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">笔记（refreshGate）</text>
<text x="942" y="274" text-anchor="start" font-size="11.5" fill="#1F2937">hold：动作在跑或结果提示</text>
<text x="942" y="291" text-anchor="start" font-size="11.5" fill="#1F2937">停留中，挡住事件刷新</text>
<text x="942" y="308" text-anchor="start" font-size="11.5" fill="#1F2937">quiet：刚自己重取过，</text>
<text x="942" y="325" text-anchor="start" font-size="11.5" fill="#1F2937">1 秒内 entries 事件不理</text>
<text x="942" y="342" text-anchor="start" font-size="11.5" fill="#1F2937">editing：正在输入先记一笔</text>
<text x="942" y="359" text-anchor="start" font-size="11.5" fill="#1F2937">notebooks：只刷同步状态</text>
<polyline points="1025,186 1025,222 170,222 170,230" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ur-arr)"/>
<polyline points="470,222 470,230" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ur-arr)"/>
<polyline points="770,222 770,230" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ur-arr)"/>
<polyline points="1070,222 1070,230" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ur-arr)"/>
<rect x="30" y="400" width="580" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="422" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">事件流连接（dom.js liveStream）</text>
<text x="42" y="442" text-anchor="start" font-size="11.5" fill="#1F2937">页面隐藏超过 60 秒主动断开 SSE，重新可见时重连</text>
<text x="42" y="459" text-anchor="start" font-size="11.5" fill="#1F2937">重连成功：补查 /api/services、补刷当前标签</text>
<text x="42" y="476" text-anchor="start" font-size="11.5" fill="#1F2937">浏览器放弃重连（连上时回 401 / 503 → CLOSED）：</text>
<text x="42" y="493" text-anchor="start" font-size="11.5" fill="#1F2937">先查一次 /api/session（401 跳登录页），</text>
<text x="42" y="510" text-anchor="start" font-size="11.5" fill="#1F2937">否则 5 秒起、翻倍、封顶 5 分钟退避重开</text>
<text x="42" y="527" text-anchor="start" font-size="11.5" fill="#1F2937">页头圆点：绿 = 已连上，红 = 断开 / 重连中</text>
<rect x="640" y="400" width="570" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="652" y="422" text-anchor="start" font-size="13" font-weight="700" fill="#1F2937">管理页一次刷新取什么</text>
<text x="652" y="442" text-anchor="start" font-size="11.5" fill="#1F2937">并行取 /api/foundation、/api/enhance/status、/api/manage</text>
<text x="652" y="459" text-anchor="start" font-size="11.5" fill="#1F2937">/api/enhance/status 只取一次，结果同时给「基石与模块」、</text>
<text x="652" y="476" text-anchor="start" font-size="11.5" fill="#1F2937">「系统增强」「实验室」的开关与"已加载"徽章</text>
<text x="652" y="493" text-anchor="start" font-size="11.5" fill="#1F2937">设备健康：只在切到它或点刷新时取 health + ota；</text>
<text x="652" y="510" text-anchor="start" font-size="11.5" fill="#1F2937">「清理」二级标签在前台时才取 cleanup</text>
</svg>
