[package]
name = "shelf-core"
version = "0.1.0"
edition = "2021"
description = "书架各服务共享底座：XDG 路径、服务注册/发现、流式 multipart、资产仓库、HTTP 适配层、xochitl 注入、目录监听"
license = "MIT"

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
# 自签证书（首启生成，纯 Rust ring 后端）与密码哈希/Basic 认证
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
base64 = "0.22"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
inotify = { version = "0.11.5", default-features = false }

[dev-dependencies]
tempfile = "3"
