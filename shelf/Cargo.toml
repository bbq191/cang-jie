# shelf 书架：领域服务 + 书架内容层（shelf-conv）的内部 workspace（仓库根仍不建 workspace）。
# 2026-09-11：共享基座 crate 正名搬顶层 `../rmsvc-core`（原 crates/shelf-core，
# 三条线共用，不再是 shelf 私有——notes/ 早就在依赖它，gateway/ 也依赖它）；
# 网关本身也搬顶层 `../gateway`（原 services/shelf-gateway，它是 shelf/notes/
# enhance 三条线共用的唯一前端，不该继续算"shelf 的一个服务"）。两者都不再是
# 本 workspace 成员，各自独立 Cargo 项目，见各自 README。
# 2026-09-11 第二轮：`wallpaper-serve`/`font-serve` 挪进 `../enhance/`（概念上更贴近
# 系统增强，不是"书架内容管理"业务；wallpaper-serve 原依赖的 bookconv 两个屏幕尺寸
# 常量已复制成本地值，不再跨线依赖 bookconv）。
# 依赖方向单向无环：services/* → ../rmsvc-core；book-serve → shelf-conv。
# 2026-10-07：书架不再优化书——优化全部在电脑上用 sheng-ren 做，书架只把优化好的书投进 xochitl。本仓库自带的 crates/bookconv
# （v16）、入库 PDF 转换（pdf_ingest、pdf-extract-cj）、旧产物兼容、联网补封面、抓网文都已删除，见 git 历史。
# 同日去掉对 sheng-ren `bookconv` 的 git 依赖：书架只读 EPUB 的书名/封面/翻页方向/漫画页边距标记，shelf-conv 自带最小实现
#（本地 107 本 EPUB 与 bookconv 对拍一致），不再连带编进图片处理、网页抽取等用不上的依赖，也不用跟着 sheng-ren 的 master 走。
[workspace]
resolver = "2"
members = [
    "crates/shelf-conv",
    "services/book-serve",
]
# services/koreader-serve 2026-09-29 退役、2026-09-30 源码已从仓库删除，见 git 历史。

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# 与 reading/device-rs、knowledge/pkm 同款：设备端体积优先、全静态 musl。
[profile.release]
opt-level = "z"
lto = true
strip = true
# unwind（不是 abort）：book-serve 的落库在后台线程里用 catch_unwind 兜住 panic（损坏书触发的越界等），
# 失败只影响这一本；abort 下 catch_unwind 完全无效，一次 panic 会摔掉整个进程、卡住所有在途操作（2026-09-19《镖人》真机踩过）。
# 代价只是二进制略大，设备 /home 有几十 GB，可忽略。
panic = "unwind"
codegen-units = 1
