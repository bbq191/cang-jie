<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">两条线，一份规范：书怎么变成设备上好读的 EPUB</text>

  <!-- 输入 -->
  <rect x="30" y="80" width="150" height="70" rx="10" fill="#e8f1fb" stroke="#4a7bb7"/>
  <text x="105" y="110" text-anchor="middle" font-size="15" fill="#1f3f66">已有的 EPUB</text>
  <text x="105" y="132" text-anchor="middle" font-size="12" fill="#555">网上下载/出版社/calibre</text>
  <rect x="30" y="260" width="150" height="70" rx="10" fill="#fdf0e2" stroke="#c8812e"/>
  <text x="105" y="290" text-anchor="middle" font-size="15" fill="#6b4210">有文字层的 PDF</text>
  <text x="105" y="312" text-anchor="middle" font-size="12" fill="#555">Word/calibre 导出的</text>

  <!-- 线① -->
  <rect x="230" y="65" width="300" height="100" rx="10" fill="#f3f8fd" stroke="#4a7bb7"/>
  <text x="380" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3f66">① EPUB 优化线（清洗）</text>
  <text x="245" y="114" font-size="12.5" fill="#333">· 解锁字号/字体，保留颜色与加粗</text>
  <text x="245" y="134" font-size="12.5" fill="#333">· 排版规则写进外链 cangjie-wash.css</text>
  <text x="245" y="154" font-size="12.5" fill="#333">· 注释、目录、封面、空页、图片整理</text>

  <!-- 线② -->
  <rect x="230" y="245" width="300" height="100" rx="10" fill="#fdf7ef" stroke="#c8812e"/>
  <text x="380" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b4210">② PDF→EPUB 线（重排）</text>
  <text x="245" y="294" font-size="12.5" fill="#333">· 逐字抽取：文字 + 颜色 + 图片位置 + 链接</text>
  <text x="245" y="314" font-size="12.5" fill="#333">· 按版面重排成段落，图片按原比例</text>
  <text x="245" y="334" font-size="12.5" fill="#333">· 按书签切章，每页只进一章</text>

  <line x1="180" y1="115" x2="228" y2="115" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="180" y1="295" x2="228" y2="295" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 质量门 -->
  <rect x="590" y="140" width="170" height="130" rx="10" fill="#fff4f4" stroke="#c0392b"/>
  <text x="675" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e2a20">质量门 check</text>
  <text x="604" y="189" font-size="12" fill="#333">真 DRM</text>
  <text x="604" y="207" font-size="12" fill="#333">目录链接命中 &lt; 80%</text>
  <text x="604" y="225" font-size="12" fill="#333">同一标签两个 id</text>
  <text x="604" y="243" font-size="12" fill="#333">图片等引用命中 &lt; 80%</text>
  <text x="604" y="261" font-size="12" fill="#333">OPF 不是合法 XML</text>
  <line x1="530" y1="115" x2="588" y2="175" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="530" y1="295" x2="588" y2="240" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 出口 -->
  <rect x="800" y="95" width="140" height="70" rx="10" fill="#eaf7ee" stroke="#2e8b57"/>
  <text x="870" y="125" text-anchor="middle" font-size="15" fill="#1d5e3a">过门：替换原书</text>
  <text x="870" y="147" text-anchor="middle" font-size="12" fill="#555">再投递到阅读器</text>
  <rect x="800" y="245" width="140" height="70" rx="10" fill="#f6f6f6" stroke="#888"/>
  <text x="870" y="275" text-anchor="middle" font-size="15" fill="#444">不过门：拒绝</text>
  <text x="870" y="297" text-anchor="middle" font-size="12" fill="#555">原书一个字节不动</text>
  <line x1="760" y1="180" x2="798" y2="140" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="760" y1="235" x2="798" y2="270" stroke="#888" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 底部 -->
  <rect x="230" y="385" width="530" height="60" rx="10" fill="#fafafa" stroke="#bbb" stroke-dasharray="5,4"/>
  <text x="495" y="410" text-anchor="middle" font-size="13.5" fill="#333">两条线都要迁就同一个阅读器：xochitl 的十条实测规则（第 3 章）</text>
  <text x="495" y="431" text-anchor="middle" font-size="12.5" fill="#666">只认外链 CSS · 只认同文件锚点 · 跳转目标不能是空元素 · OPF 必须合法 XML …</text>
</svg>
