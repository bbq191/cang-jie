<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="sans-serif">
  <defs>
    <marker id="csd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#fbfbfa"/>
  <text x="520" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">超限漫画按卷拆分投递（comic_split::deliver_split_streaming）</text>
  <text x="520" y="50" text-anchor="middle" font-size="12.5" fill="#6a6a6a">2026-09-19 改流式：峰值≈单份体积（≤ native_limit 90MB），不是整本 785MB 一次性读进内存</text>

  <!-- entry -->
  <rect x="30" y="76" width="220" height="60" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="140" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">落库触发</text>
  <text x="140" y="116" text-anchor="middle" font-size="10" fill="#3a3a3a">体积 &gt; native_limit（90MB）</text>

  <line x1="250" y1="106" x2="300" y2="106" stroke="#555" stroke-width="1.5" marker-end="url(#csd-arrow)"/>

  <rect x="305" y="76" width="230" height="60" rx="8" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
  <text x="420" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">是否漫画 + 有 toc.ncx？</text>
  <text x="420" y="116" text-anchor="middle" font-size="10" fill="#4a4a4a">comic_detect::is_comic</text>

  <line x1="420" y1="136" x2="420" y2="160" stroke="#b5541f" stroke-width="1.4" marker-end="url(#csd-arrow)"/>
  <text x="500" y="152" font-size="10" fill="#8a4a20">否 → 退回整本拒绝（老行为，未改）</text>

  <line x1="535" y1="106" x2="600" y2="106" stroke="#3e8e51" stroke-width="1.5" marker-end="url(#csd-arrow)"/>
  <text x="565" y="96" text-anchor="middle" font-size="9.5" fill="#2a6a3a">是</text>

  <!-- phase 1 plan -->
  <rect x="605" y="76" width="410" height="60" rx="8" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.6"/>
  <text x="810" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">阶段一 · plan_pieces_sized：按第一层 NCX 规划分卷</text>
  <text x="810" y="116" text-anchor="middle" font-size="10" fill="#3a3a3a">单卷仍超限 → fixed_page_chunks_range_sized 按页贪心再切一刀</text>

  <line x1="810" y1="136" x2="810" y2="164" stroke="#555" stroke-width="1.5" marker-end="url(#csd-arrow)"/>

  <!-- loop box -->
  <rect x="300" y="166" width="620" height="270" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="610" y="188" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">阶段二 · 逐份循环（每份独立作用域，传完立刻丢）</text>

  <rect x="320" y="202" width="160" height="70" rx="6" fill="#ffffff" stroke="#c9971f" stroke-width="1"/>
  <text x="400" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">build_piece</text>
  <text x="400" y="238" text-anchor="middle" font-size="9.5" fill="#4a4a4a">按需重收这份图片</text>
  <text x="400" y="252" text-anchor="middle" font-size="9.5" fill="#4a4a4a">简化 body+补 comic.css</text>
  <text x="400" y="264" text-anchor="middle" font-size="9.5" fill="#4a4a4a">（贴边满屏修复）</text>

  <line x1="480" y1="237" x2="506" y2="237" stroke="#555" stroke-width="1.3" marker-end="url(#csd-arrow)"/>

  <rect x="510" y="202" width="160" height="70" rx="6" fill="#ffffff" stroke="#c9971f" stroke-width="1"/>
  <text x="590" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">upload_piece</text>
  <text x="590" y="238" text-anchor="middle" font-size="9.5" fill="#4a4a4a">Xochitl::upload</text>
  <text x="590" y="252" text-anchor="middle" font-size="9.5" fill="#4a4a4a">同一 folder，一份一份传</text>

  <line x1="670" y1="237" x2="696" y2="237" stroke="#555" stroke-width="1.3" marker-end="url(#csd-arrow)"/>

  <rect x="700" y="202" width="180" height="70" rx="6" fill="#ffffff" stroke="#c9971f" stroke-width="1"/>
  <text x="790" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">等渲染确认</text>
  <text x="790" y="238" text-anchor="middle" font-size="9.5" fill="#4a4a4a">render_check::probe</text>
  <text x="790" y="252" text-anchor="middle" font-size="9.5" fill="#4a4a4a">真出页数才传下一份</text>
  <text x="790" y="264" text-anchor="middle" font-size="9.5" fill="#4a4a4a">（超时不算失败，接着传）</text>

  <path d="M 790 272 L 790 300 L 400 300 L 400 272" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#csd-arrow)"/>
  <text x="595" y="315" text-anchor="middle" font-size="10" fill="#6a6a6a">下一份（idx+1），共 total 份</text>

  <rect x="340" y="328" width="540" height="90" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="610" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">每份成功后回调 upload_piece(name, bytes, idx, total)</text>
  <text x="610" y="366" text-anchor="middle" font-size="10" fill="#4a4a4a">写 sidecar.deliver = {status:"pending", progress:{done:idx,total}, message:"已加入：…"}</text>
  <text x="610" y="382" text-anchor="middle" font-size="10" fill="#4a4a4a">bus.publish("books","staging") → SSE → 网页立即看到进度推进</text>
  <text x="610" y="400" text-anchor="middle" font-size="10" fill="#b5541f">（漏推事件是真机踩过的坑：不发事件网页不知道要刷新，进度条冻结在第一份）</text>

  <line x1="610" y1="436" x2="610" y2="462" stroke="#555" stroke-width="1.5" marker-end="url(#csd-arrow)"/>

  <!-- outcome -->
  <rect x="410" y="464" width="400" height="60" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="610" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">聚合回执</text>
  <text x="610" y="504" text-anchor="middle" font-size="10" fill="#3a3a3a">delivered[] + failed[]；渲染自检对拆分份跳过（无母版库条目可挂）</text>

  <text x="150" y="500" text-anchor="middle" font-size="10.5" fill="#6a6a6a">原书母版字节</text>
  <text x="150" y="516" text-anchor="middle" font-size="10.5" fill="#6a6a6a">全程一份不动</text>
  <text x="150" y="532" text-anchor="middle" font-size="9.5" fill="#8a8a8a">拆分份只存在于内存</text>
</svg>
