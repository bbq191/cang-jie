<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="csd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="csd-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="620" fill="#fbfbfa"/>
  <text x="540" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">超限漫画按卷拆分投递（回退路径，流式）</text>
  <text x="540" y="52" text-anchor="middle" font-size="12" fill="#6a6a6a">EPUB：comic_split::deliver_split_streaming；带书签的自产漫画 PDF：comic_pdf::deliver_split_pdf_streaming；峰值 ≈ 单份体积</text>

  <!-- 触发 -->
  <rect x="30" y="78" width="200" height="78" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="130" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">落库触发</text>
  <text x="130" y="122" text-anchor="middle" font-size="10.5" fill="#4a4a4a">体积 &gt; 90MB 且大文件</text>
  <text x="130" y="138" text-anchor="middle" font-size="10.5" fill="#4a4a4a">占位通道用不了</text>
  <line x1="230" y1="117" x2="275" y2="117" stroke="#555" stroke-width="1.6" marker-end="url(#csd-arrow)"/>

  <!-- 判定 -->
  <rect x="275" y="78" width="300" height="78" rx="8" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
  <text x="425" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">是漫画吗？</text>
  <text x="425" y="120" text-anchor="middle" font-size="10.5" fill="#4a4a4a">EPUB：comic_detect::is_comic</text>
  <text x="425" y="136" text-anchor="middle" font-size="10.5" fill="#4a4a4a">PDF：必须带书签目录（自产漫画 PDF）</text>
  <line x1="575" y1="117" x2="620" y2="117" stroke="#555" stroke-width="1.6" marker-end="url(#csd-arrow)"/>
  <text x="597" y="108" text-anchor="middle" font-size="10.5" fill="#2f7d45">是</text>

  <line x1="425" y1="156" x2="425" y2="196" stroke="#b0451f" stroke-width="1.6" marker-end="url(#csd-red)"/>
  <text x="440" y="180" text-anchor="start" font-size="10.5" fill="#b0451f">否</text>
  <rect x="275" y="196" width="300" height="34" rx="6" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.4"/>
  <text x="425" y="217" text-anchor="middle" font-size="10.5" fill="#4a4a4a">退回整本拒绝（老行为不变，回执给出路）</text>

  <!-- 阶段一 -->
  <rect x="620" y="78" width="430" height="112" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
  <text x="835" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">阶段一 · 规划 plan_pieces_sized</text>
  <text x="835" y="122" text-anchor="middle" font-size="10.5" fill="#4a4a4a">按 NCX 第一层切卷；没有可用 NCX 则整本按页贪心切</text>
  <text x="835" y="140" text-anchor="middle" font-size="10.5" fill="#4a4a4a">某卷仍超预算 → 按页贪心再切一刀（标题 卷名（j/n））</text>
  <text x="835" y="158" text-anchor="middle" font-size="10.5" fill="#4a4a4a">单页本身超预算 → fits=false，如实计入“N 未投”</text>
  <text x="835" y="176" text-anchor="middle" font-size="10.5" fill="#4a4a4a">只读 html/opf/ncx，图片体积直接查 zip 目录</text>
  <line x1="835" y1="190" x2="835" y2="250" stroke="#555" stroke-width="1.6" marker-end="url(#csd-arrow)"/>

  <!-- 阶段二 -->
  <rect x="30" y="250" width="1020" height="250" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="540" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">阶段二 · 逐份循环（deliver_pieces：每份独立作用域，传完立刻丢）</text>

  <rect x="50" y="288" width="190" height="86" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="145" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">① 取消检查</text>
  <text x="145" y="327" text-anchor="middle" font-size="10" fill="#4a4a4a">份与份之间是安全中断点</text>
  <text x="145" y="342" text-anchor="middle" font-size="10" fill="#4a4a4a">命中 → 终态 cancelled</text>
  <text x="145" y="357" text-anchor="middle" font-size="10" fill="#4a4a4a">不算失败</text>
  <rect x="270" y="288" width="250" height="86" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="395" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">② build_piece</text>
  <text x="395" y="327" text-anchor="middle" font-size="10" fill="#4a4a4a">按需重收这份的图片，一张图一页</text>
  <text x="395" y="342" text-anchor="middle" font-size="10" fill="#4a4a4a">纯文字页原样保留；补目录</text>
  <text x="395" y="357" text-anchor="middle" font-size="10" fill="#4a4a4a">补外链 comic.css（贴边满屏）</text>
  <rect x="550" y="288" width="200" height="86" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="650" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">③ Xochitl::upload</text>
  <text x="650" y="327" text-anchor="middle" font-size="10" fill="#4a4a4a">同一 folder，一份一份传</text>
  <text x="650" y="342" text-anchor="middle" font-size="10" fill="#4a4a4a">PDF 分卷同理（mime 不同）</text>
  <rect x="780" y="288" width="250" height="86" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="905" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">④ 等 xochitl 渲染确认</text>
  <text x="905" y="327" text-anchor="middle" font-size="10" fill="#4a4a4a">render_check::probe 等出页数才传下一份</text>
  <text x="905" y="342" text-anchor="middle" font-size="10" fill="#4a4a4a">上限 90 秒；超时不算失败，接着传</text>
  <text x="905" y="357" text-anchor="middle" font-size="10" fill="#4a4a4a">（连续紧挨着传会冲垮 xochitl）</text>
  <line x1="240" y1="331" x2="270" y2="331" stroke="#555" stroke-width="1.4" marker-end="url(#csd-arrow)"/>
  <line x1="520" y1="331" x2="550" y2="331" stroke="#555" stroke-width="1.4" marker-end="url(#csd-arrow)"/>
  <line x1="750" y1="331" x2="780" y2="331" stroke="#555" stroke-width="1.4" marker-end="url(#csd-arrow)"/>
  <polyline points="905,374 905,392 145,392 145,376" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#csd-arrow)"/>
  <text x="525" y="409" text-anchor="middle" font-size="10.5" fill="#6a6a6a">下一份（idx+1），共 total 份（只数预算内、真会尝试上传的份数）</text>

  <rect x="50" y="420" width="980" height="66" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="540" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">每份成功后回调：写 sidecar.deliver = {status:"pending", progress:{done:idx,total}, message:"已加入：…"}</text>
  <text x="540" y="457" text-anchor="middle" font-size="10.5" fill="#4a4a4a">bus.publish("books","staging") → SSE → 网页立即看到进度推进</text>
  <text x="540" y="475" text-anchor="middle" font-size="10.5" fill="#b0451f">（漏推事件是真机踩过的坑：不发事件网页不知道要刷新，进度条冻结在第一份）</text>

  <line x1="540" y1="500" x2="540" y2="526" stroke="#555" stroke-width="1.6" marker-end="url(#csd-arrow)"/>
  <rect x="250" y="526" width="580" height="70" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="540" y="548" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">聚合回执</text>
  <text x="540" y="567" text-anchor="middle" font-size="10.5" fill="#4a4a4a">delivered[] + failed[]（“N 未投：…”）；一份都没投上 → 报错</text>
  <text x="540" y="583" text-anchor="middle" font-size="10.5" fill="#4a4a4a">渲染自检、页边距登记对拆分份都跳过（没有对应母版库条目可挂）</text>

  <text x="30" y="548" text-anchor="start" font-size="10.5" fill="#6a6a6a">原书母版字节全程不动</text>
  <text x="30" y="564" text-anchor="start" font-size="10.5" fill="#6a6a6a">拆分份只存在于内存</text>
  <text x="30" y="580" text-anchor="start" font-size="10.5" fill="#6a6a6a">上传即弃</text>
</svg>
