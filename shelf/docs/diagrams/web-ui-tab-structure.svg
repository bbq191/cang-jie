<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" font-family="Noto Sans CJK SC, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
</defs>
<rect x="0" y="0" width="1080" height="680" fill="#fbfbfa"/>
<text x="540" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">网页「秘密花园」：首层四个 tab 与二级 tab（2026-09-30 现状）</text>
<text x="540" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">https://shelf.local/（443）· 登录后进入 · 顶栏右侧小圆点 = 事件流（SSE）连接状态</text>

<rect x="20" y="76" width="1040" height="46" rx="10" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="540" y="104" text-anchor="middle" font-size="13" fill="#1a1a1a">首层 tab 由 /api/services 注册表决定：传书、管理固定存在；笔记、其他里的子项只在对应服务已装且在跑时才出现</text>

<line x1="145" y1="122" x2="145" y2="146" stroke="#555" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="405" y1="122" x2="405" y2="146" stroke="#555" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="665" y1="122" x2="665" y2="146" stroke="#555" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="925" y1="122" x2="925" y2="146" stroke="#555" stroke-width="1.6" marker-end="url(#ak)"/>

<!-- 传书 -->
<rect x="20" y="148" width="250" height="40" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="145" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">传书</text>
<rect x="20" y="204" width="250" height="190" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="34" y="228" font-size="13" font-weight="bold" fill="#1a1a1a">入库</text>
<text x="34" y="248" font-size="11.5" fill="#3a3a3a">上传（EPUB / PDF）· 抓网文（贴 URL）</text>
<text x="34" y="276" font-size="13" font-weight="bold" fill="#1a1a1a">母版库</text>
<text x="34" y="296" font-size="11.5" fill="#3a3a3a">勾选 + 底部三行操作栏、加入位置下拉</text>
<text x="34" y="314" font-size="11.5" fill="#3a3a3a">只选一本时：下载原件 / 改名</text>
<text x="34" y="332" font-size="11.5" fill="#3a3a3a">搜索 / 筛选 / 分页 / 处理进度</text>
<text x="34" y="358" font-size="11.5" font-weight="bold" fill="#1a1a1a">原 PDF 备份（转 EPUB 后留 7 天）</text>
<text x="34" y="376" font-size="11.5" fill="#3a3a3a">恢复回母版库 / 提前删除</text>

<rect x="280" y="148" width="250" height="40" rx="10" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="405" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">笔记</text>
<rect x="280" y="204" width="250" height="190" rx="10" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="294" y="228" font-size="12.5" fill="#1a1a1a">浏览 ｜ 整理 ｜ 回收站</text>
<text x="294" y="252" font-size="12.5" fill="#1a1a1a">全文搜索</text>
<text x="294" y="270" font-size="11.5" fill="#3a3a3a">勾画 / 手写转写 / 提问 / AI 回答</text>
<text x="294" y="294" font-size="12.5" fill="#1a1a1a">导入 md 文档</text>
<text x="294" y="312" font-size="11.5" fill="#3a3a3a">默认隐藏；开关在「管理→实验室」</text>
<text x="294" y="336" font-size="11" fill="#8a8a8a">（「导入 KOReader 批注」09-29 已删）</text>
<text x="294" y="366" font-size="11.5" fill="#3a3a3a">由笔记线服务注册，</text>
<text x="294" y="384" font-size="11.5" fill="#3a3a3a">详见 notes/README.md</text>

<rect x="540" y="148" width="250" height="40" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="665" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">其他</text>
<rect x="540" y="204" width="250" height="190" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="554" y="228" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl</text>
<text x="554" y="246" font-size="11.5" fill="#3a3a3a">字体上传 / 中文回退链 / 加粗开关</text>
<text x="554" y="276" font-size="13" font-weight="bold" fill="#1a1a1a">壁纸</text>
<text x="554" y="294" font-size="11.5" fill="#3a3a3a">壁纸池 / 模式（enhance 线服务）</text>
<text x="554" y="336" font-size="11" fill="#8a8a8a">（KOReader 子标签 09-29 已删）</text>
<text x="554" y="376" font-size="11.5" fill="#3a3a3a">只列已装且在跑的服务</text>

<rect x="800" y="148" width="250" height="40" rx="10" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.6"/>
<text x="925" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">管理</text>
<rect x="800" y="204" width="250" height="190" rx="10" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.6"/>
<text x="814" y="224" font-size="12" fill="#1a1a1a">基石与模块（探测 / 启停 / 卸载）</text>
<text x="814" y="244" font-size="12" fill="#1a1a1a">设备健康：概览/服务/扩展/日志/清理</text>
<text x="814" y="264" font-size="12" fill="#1a1a1a">模型管理（转写 / 问 AI）</text>
<text x="814" y="284" font-size="12" fill="#1a1a1a">系统增强：画线吸附、阅读器翻页、</text>
<text x="814" y="302" font-size="12" fill="#1a1a1a">　　　　　（漫画页边距等在实验室）</text>
<text x="814" y="320" font-size="11" fill="#3a3a3a">每项带加载徽章：已加载/待重启/未加载</text>
<text x="814" y="342" font-size="12" fill="#1a1a1a">实验室：漫画页边距、导入 md 文档</text>
<text x="814" y="364" font-size="11" fill="#8a4b00">09-30 已移除：电池刺客页与开关、</text>
<text x="814" y="380" font-size="11" fill="#8a4b00">　　　　　　　手写笔迹开关</text>


<!-- 底部：数据通路 -->
<rect x="20" y="424" width="1030" height="236" rx="10" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="535" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">页面怎么保持最新（无轮询）与怎么改设置</text>

<rect x="40" y="468" width="300" height="76" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="190" y="492" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">各领域服务（loopback）</text>
<text x="190" y="512" text-anchor="middle" font-size="11.5" fill="#3a3a3a">在变更发生处发事件</text>
<text x="190" y="530" text-anchor="middle" font-size="11.5" fill="#3a3a3a">GET /events</text>

<rect x="390" y="468" width="300" height="76" rx="8" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="540" y="492" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">网关 Hub 汇聚</text>
<text x="540" y="512" text-anchor="middle" font-size="11.5" fill="#3a3a3a">补 svc 字段后转发</text>
<text x="540" y="530" text-anchor="middle" font-size="11.5" fill="#3a3a3a">GET /api/events（SSE，需登录）</text>

<rect x="740" y="468" width="290" height="76" rx="8" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="885" y="492" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">浏览器 EventSource</text>
<text x="885" y="512" text-anchor="middle" font-size="11.5" fill="#3a3a3a">只刷对应 tab；不在前台的</text>
<text x="885" y="530" text-anchor="middle" font-size="11.5" fill="#3a3a3a">记脏，切过去再刷</text>

<line x1="340" y1="506" x2="388" y2="506" stroke="#555" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="690" y1="506" x2="738" y2="506" stroke="#555" stroke-width="1.6" marker-end="url(#ak)"/>

<text x="40" y="570" font-size="12" fill="#1a1a1a">批量队列 / 并发闸门：网关自己也发事件（area=books），母版库进度走同一条流。</text>
<text x="40" y="590" font-size="12" fill="#1a1a1a">注册表目录 inotify：服务启停 → manage 事件 → tab 集合变了就整页重载。</text>
<text x="40" y="610" font-size="12" fill="#1a1a1a">系统增强 / 实验室开关：PUT /api/enhance/qol → 整份 reading-qol.json 读入、只改指定键、原样写回。</text>
<text x="40" y="630" font-size="12" fill="#1a1a1a">事件流断开（如网关重启后 401）：先查 /api/session，未登录跳登录页；否则 5 秒起翻倍退避重连，最多 5 分钟；页面隐藏时不重试（09-30）。</text>
<text x="40" y="650" font-size="12" fill="#1a1a1a">语言：GET /ui/locales/{lang}（zh-CN / en-US），缺 key 显示 key 本身，不认识的语言落中文。</text>
</svg>
