<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="sans-serif">
<defs><marker id="ela-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ela-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="ela-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1080" height="640" fill="#fbfbfa"/>
<text x="540.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">传书模块 EPUB 线：系统架构</text>
<text x="540.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">bookconv 是进程内库，不是独立服务——真正跨进程的只有 book-serve、koreader-serve 和设备端两个读器</text>
<rect x="400" y="68" width="280" height="42" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="540" y="95" text-anchor="middle" font-size="13.5" fill="#1a1a1a">浏览器（母版库页面，登录墙后）</text>
<polyline points="540,110 540,132" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ela-a)"/>
<rect x="180" y="134" width="720" height="92" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="540.0" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">gateway :443（唯一 Web 前端）</text>
<text x="540.0" y="182.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">/api/books/* 反向代理到 book-serve：请求体流式转发，响应体整体缓冲</text>
<text x="540.0" y="196.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">批量队列 batch.rs（状态落盘、重启续跑）· 并发/内存预算闸门 budget.rs</text>
<text x="540.0" y="209.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">每一本的“优化 / 加入”都先过闸门，再调下游服务</text>
<polyline points="400,226 400,258" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ela-a)"/>
<polyline points="900,190 1050,190 1050,435 1020,435" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ela-a)"/>
<text x="1050" y="178" text-anchor="middle" font-size="10.5" fill="#555">代理</text>
<rect x="60" y="258" width="520" height="214" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="320.0" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">book-serve :8790</text>
<text x="320.0" y="307" text-anchor="middle" font-size="11" fill="#4a4a4a">母版库领域服务：入库 / 优化 / 落库 三个正交动作</text>
<rect x="80" y="318" width="232" height="100" rx="6" fill="#ffffff" stroke="#3e8e51" stroke-width="1"/>
<text x="196.0" y="336.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Staging</text>
<text x="196.0" y="360.8" text-anchor="middle" font-size="9.8" fill="#4a4a4a">OpRegistry：忙锁 + 取消标记（内存）</text>
<text x="196.0" y="373.6" text-anchor="middle" font-size="9.8" fill="#4a4a4a">sidecar：落库记录/进度（磁盘）</text>
<text x="196.0" y="386.40000000000003" text-anchor="middle" font-size="9.8" fill="#4a4a4a">spawn_bg 起异步任务，panic 兜底</text>
<text x="196.0" y="399.20000000000005" text-anchor="middle" font-size="9.8" fill="#4a4a4a">启动时把中断的 pending 修正为失败</text>
<rect x="328" y="318" width="232" height="100" rx="6" fill="#ffffff" stroke="#3e8e51" stroke-width="1"/>
<text x="444.0" y="336.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">MkdirQueue / TrashQueue</text>
<text x="444.0" y="360.8" text-anchor="middle" font-size="9.8" fill="#4a4a4a">代理队列——不能直写 xochitl 的</text>
<text x="444.0" y="373.6" text-anchor="middle" font-size="9.8" fill="#4a4a4a">.metadata（运行中会被写回来）</text>
<text x="444.0" y="386.40000000000003" text-anchor="middle" font-size="9.8" fill="#4a4a4a">设备端 qmd 轮询拉队列</text>
<text x="444.0" y="399.20000000000005" text-anchor="middle" font-size="9.8" fill="#4a4a4a">执行建文件夹 / 移入回收站</text>
<rect x="80" y="428" width="480" height="32" rx="6" fill="#ffffff" stroke="#3e8e51" stroke-width="1"/>
<text x="320" y="449" text-anchor="middle" font-size="10" fill="#4a4a4a">bookconv（库，进程内）：wash · imgopt · naming · pdf_ingest · comic_* · placeholder</text>
<rect x="720" y="258" width="300" height="110" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="870.0" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl（设备原生）</text>
<text x="870.0" y="304" text-anchor="middle" font-size="10" fill="#4a4a4a">10.11.99.1 · /upload /documents</text>
<text x="870.0" y="317" text-anchor="middle" font-size="10" fill="#4a4a4a">≤90MB：流式 upload_file</text>
<text x="870.0" y="330" text-anchor="middle" font-size="10" fill="#4a4a4a">&gt;90MB：占位 + 磁盘替换</text>
<text x="870.0" y="343" text-anchor="middle" font-size="10" fill="#4a4a4a">GET-then-upload 选定文件夹</text>
<polyline points="580,300 720,300" fill="none" stroke="#b0451f" stroke-width="1.6" marker-end="url(#ela-r)"/>
<text x="650" y="292" text-anchor="middle" font-size="10.5" fill="#b0451f">直连，不经网关</text>
<rect x="720" y="398" width="300" height="74" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="870.0" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">koreader-serve :8791</text>
<text x="870.0" y="444" text-anchor="middle" font-size="10" fill="#4a4a4a">母版库同分区拷贝进设备目录</text>
<text x="870.0" y="457" text-anchor="middle" font-size="10" fill="#4a4a4a">不依赖 bookconv，纯 fs::copy</text>
<polyline points="580,430 720,430" fill="none" stroke="#2f7d45" stroke-width="1.6" marker-end="url(#ela-g)"/>
<text x="650" y="422" text-anchor="middle" font-size="10.5" fill="#2f7d45">adopt 本地拷贝</text>
<rect x="60" y="500" width="960" height="38" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="540" y="524" text-anchor="middle" font-size="11" fill="#4a4a4a">共享底座 rmsvc-core：xochitl 注入/找书/流式上传 · multipart 流式解析 · events(SSE) · fswatch · paths(XDG)</text>
<text x="540" y="566" text-anchor="middle" font-size="11" fill="#6a6a6a">EPUB 走完整清洗 + 优化 + 图片处理管线；PDF 有文字层转 EPUB、无文字层仅裁边；bookconv 拆成独立服务已评估否决</text>
<text x="540" y="586" text-anchor="middle" font-size="10.5" fill="#8a8a8a">（库边界已够干净；拆服务只增加大文件跨进程序列化成本，设备 cgroup 内存限制本就不生效，隔离收益也打折）</text>
</svg>
