<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="sans-serif">
  <defs>
    <marker id="ela-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ela-arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e8e51"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#fbfbfa"/>
  <text x="520" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">传书模块 EPUB 线：系统架构</text>
  <text x="520" y="50" text-anchor="middle" font-size="12.5" fill="#6a6a6a">bookconv 是进程内库，不是独立服务——真正跨进程的只有"设备端两个原生读器"</text>

  <!-- client -->
  <rect x="380" y="66" width="280" height="42" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="520" y="92" text-anchor="middle" font-size="13.5" fill="#1a1a1a">浏览器（母版库页面，登录墙后）</text>
  <line x1="520" y1="108" x2="520" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#ela-arrow)"/>

  <!-- gateway -->
  <rect x="260" y="136" width="520" height="70" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="520" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">gateway :443（唯一 Web 前端）</text>
  <text x="520" y="180" text-anchor="middle" font-size="11.5" fill="#4a4a4a">/api/books/* → 反向代理到 book-serve loopback：请求体流式转发，响应体整体缓冲</text>
  <text x="520" y="196" text-anchor="middle" font-size="11" fill="#8a8a8a">（响应非流式是已知的注释/实现不一致，低优先级，未动）</text>

  <line x1="520" y1="206" x2="520" y2="234" stroke="#555" stroke-width="1.5" marker-end="url(#ela-arrow)"/>

  <!-- book-serve -->
  <rect x="180" y="236" width="400" height="180" rx="10" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.6"/>
  <text x="380" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">book-serve :8790</text>
  <text x="380" y="278" text-anchor="middle" font-size="11" fill="#3a3a3a">母版库领域服务：入库 / 优化 / 落库 三正交动作</text>

  <rect x="200" y="290" width="170" height="50" rx="6" fill="#ffffff" stroke="#3e8e51" stroke-width="1"/>
  <text x="285" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Staging</text>
  <text x="285" y="323" text-anchor="middle" font-size="9.8" fill="#4a4a4a">busy 锁（内存）+ sidecar（磁盘）</text>
  <text x="285" y="335" text-anchor="middle" font-size="9.8" fill="#4a4a4a">spawn_bg 起异步任务</text>

  <rect x="390" y="290" width="170" height="50" rx="6" fill="#ffffff" stroke="#3e8e51" stroke-width="1"/>
  <text x="475" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">MkdirQueue / TrashQueue</text>
  <text x="475" y="323" text-anchor="middle" font-size="9.8" fill="#4a4a4a">代理队列——不能直写 xochitl</text>
  <text x="475" y="335" text-anchor="middle" font-size="9.8" fill="#4a4a4a">.metadata，运行中会被覆写回来</text>

  <line x1="285" y1="340" x2="285" y2="360" stroke="#3e8e51" stroke-width="1.3" marker-end="url(#ela-arrow-g)"/>
  <rect x="200" y="362" width="170" height="42" rx="6" fill="#ffffff" stroke="#3e8e51" stroke-width="1"/>
  <text x="285" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">bookconv（库，进程内调用）</text>
  <text x="285" y="394" text-anchor="middle" font-size="9.8" fill="#4a4a4a">wash / htmlproc / imgopt / comic_*</text>

  <text x="475" y="378" text-anchor="middle" font-size="9.8" fill="#6a6a6a">设备端注入的 qmd</text>
  <text x="475" y="392" text-anchor="middle" font-size="9.8" fill="#6a6a6a">轮询拉队列执行建夹/回收站</text>

  <!-- book-serve -> xochitl (direct, bypass gateway) -->
  <line x1="580" y1="290" x2="726" y2="238" stroke="#b5541f" stroke-width="1.6" marker-end="url(#ela-arrow)"/>
  <text x="655" y="252" text-anchor="middle" font-size="10" fill="#8a4a20">直连不经网关</text>

  <!-- xochitl -->
  <rect x="730" y="170" width="230" height="90" rx="10" fill="#fdf3f0" stroke="#b5541f" stroke-width="1.6"/>
  <text x="845" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl（设备原生）</text>
  <text x="845" y="210" text-anchor="middle" font-size="10.5" fill="#5a3a2a">10.11.99.1 · /upload /documents</text>
  <text x="845" y="226" text-anchor="middle" font-size="10.5" fill="#5a3a2a">upload_file 流式 multipart</text>
  <text x="845" y="240" text-anchor="middle" font-size="10.5" fill="#5a3a2a">GET-then-upload 定文件夹</text>

  <!-- koreader-serve -->
  <line x1="580" y1="340" x2="726" y2="378" stroke="#555" stroke-width="1.5" marker-end="url(#ela-arrow)"/>
  <text x="655" y="368" text-anchor="middle" font-size="10" fill="#5a5a5a">adopt 本地拷贝</text>
  <rect x="730" y="352" width="230" height="70" rx="10" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.6"/>
  <text x="845" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">koreader-serve :8791</text>
  <text x="845" y="392" text-anchor="middle" font-size="10.5" fill="#3a3a3a">母版库同分区拷贝进设备目录</text>
  <text x="845" y="408" text-anchor="middle" font-size="10.5" fill="#3a3a3a">不依赖 bookconv，纯 fs::copy</text>

  <!-- shared base -->
  <line x1="380" y1="416" x2="380" y2="446" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="150" y="448" width="460" height="46" rx="8" fill="#f1f1f6" stroke="#7a7a8c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="380" y="476" text-anchor="middle" font-size="11.5" fill="#3a3a3a">共享底座 rmsvc-core：xochitl 注入/找书/流式上传 · multipart 流式解析 · events(SSE) · fswatch · paths(XDG)</text>

  <text x="520" y="530" text-anchor="middle" font-size="12" fill="#6a6a6a">EPUB 走完整清洗+优化+图片处理管线；PDF 只原样透传，不进 bookconv 处理</text>
  <text x="520" y="548" text-anchor="middle" font-size="11" fill="#8a8a8a">bookconv 拆独立服务已评估否决：库边界已够干净，拆服务只增加大文件跨进程序列化成本，设备 cgroup 内存限制本就不生效、隔离收益也打折</text>
</svg>
