<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="shkeep-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="shkeep-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="shkeep-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">原地替换后找回阅读位置：谁在什么时候做什么</text>
<text x="600.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">book-serve 只记「原来读到哪」；真正跳页由注入 xochitl 的 qmd 调它自己的 goToPage（外部改 .metadata 会被盖回去）</text>
<rect x="30" y="92" width="200" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="130.0" y="112.0" font-size="12.5" fill="#1F2937" text-anchor="middle">sheng-ren（电脑）</text>
<path d="M130.0,128 L130.0,600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="260" y="92" width="300" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="410.0" y="112.0" font-size="12.5" fill="#1F2937" text-anchor="middle">book-serve :8790</text>
<path d="M410.0,128 L410.0,600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="590" y="92" width="250" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="715.0" y="112.0" font-size="12.5" fill="#1F2937" text-anchor="middle">xochitl 书库目录</text>
<path d="M715.0,128 L715.0,600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="870" y="92" width="300" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1020.0" y="112.0" font-size="12.5" fill="#1F2937" text-anchor="middle">xochitl + keep-progress.qmd</text>
<path d="M1020.0,128 L1020.0,600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="30" y="146" width="200" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42.0" y="166.0" font-size="11.5" fill="#1F2937" text-anchor="start">① POST /import?uuid=…</text>
<text x="42.0" y="182.5" font-size="11.5" fill="#1F2937" text-anchor="start">（新 EPUB）</text>
<path d="M230.0,166.0 L260.0,166.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shkeep-a)"/>
<rect x="260" y="146" width="300" height="132" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="272.0" y="166.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">② finish_replace：先拍快照</text>
<text x="272.0" y="185.0" font-size="11.5" fill="#1F2937" text-anchor="start">读 lastOpenedPage（≤ 0 不存）</text>
<text x="272.0" y="201.5" font-size="11.5" fill="#1F2937" text-anchor="start">旧 .content 页表 + 旧 .epubindex →</text>
<text x="272.0" y="218.0" font-size="11.5" fill="#1F2937" text-anchor="start">所在章节文件、文件内比例、全书比例</text>
<text x="272.0" y="234.5" font-size="11.5" fill="#1F2937" text-anchor="start">→ progress/&lt;uuid&gt;.json；拍不成照常替换</text>
<path d="M560.0,250.0 L590.0,250.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shkeep-a)"/>
<rect x="590" y="222" width="250" height="92" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="602.0" y="242.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">③ 再换文件</text>
<text x="602.0" y="261.0" font-size="11.5" fill="#1F2937" text-anchor="start">删 &lt;uuid&gt;.pdf、&lt;uuid&gt;.epubindex</text>
<text x="602.0" y="277.5" font-size="11.5" fill="#1F2937" text-anchor="start">新 &lt;uuid&gt;.epub 原子换进来</text>
<text x="602.0" y="294.0" font-size="11.5" fill="#1F2937" text-anchor="start">.content / .metadata 不动</text>
<rect x="870" y="300" width="300" height="92" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="882.0" y="320.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">④ 用户打开这本书</text>
<text x="882.0" y="339.0" font-size="11.5" fill="#1F2937" text-anchor="start">xochitl 整本重排、按比例估一页</text>
<text x="882.0" y="355.5" font-size="11.5" fill="#1F2937" text-anchor="start">写出新 .epubindex</text>
<text x="882.0" y="372.0" font-size="11.5" fill="#1F2937" text-anchor="start">（真机：打开当场写）</text>
<rect x="870" y="408" width="300" height="70" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="882.0" y="428.0" font-size="11.5" fill="#1F2937" text-anchor="start">⑤ 开书 / 页数变化 / 目录到达各重启一个</text>
<text x="882.0" y="444.5" font-size="11.5" fill="#1F2937" text-anchor="start">2 秒单次计时器，到点 GET /progress/{uuid}</text>
<path d="M870.0,443.0 L560.0,443.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shkeep-a)"/>
<rect x="260" y="398" width="300" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="272.0" y="418.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">book-serve 怎么回</text>
<text x="272.0" y="437.0" font-size="11.5" fill="#1F2937" text-anchor="start">没有快照 → 404：qmd 收工</text>
<text x="272.0" y="453.5" font-size="11.5" fill="#1F2937" text-anchor="start">新 .epubindex 不在或早于快照 → 202</text>
<text x="272.0" y="470.0" font-size="11.5" fill="#1F2937" text-anchor="start">出来了 → 200 {page}（换算后的页序）</text>
<text x="272.0" y="486.5" font-size="11.5" fill="#1F2937" text-anchor="start">（202：qmd 每 5 秒再问，约 60 秒放弃）</text>
<path d="M560.0,490.0 L870.0,490.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shkeep-a)"/>
<text x="715.0" y="484.0" font-size="11" fill="#6B7280" text-anchor="middle">200 {page}</text>
<rect x="870" y="500" width="300" height="74" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="882.0" y="520.0" font-size="11.5" fill="#1F2937" text-anchor="start">⑥ sceneView.goToPage(page)</text>
<text x="882.0" y="536.5" font-size="11.5" fill="#1F2937" text-anchor="start">日志 CJ-KEEP-PROGRESS: &lt;uuid&gt; -&gt; &lt;页&gt;</text>
<text x="882.0" y="553.0" font-size="11.5" fill="#1F2937" text-anchor="start">15 秒内被 xochitl 跳走就跳回（≤ 3 次）</text>
<path d="M870.0,556.0 L560.0,556.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shkeep-a)"/>
<text x="715.0" y="550.0" font-size="11" fill="#6B7280" text-anchor="middle">⑦ POST /progress/applied</text>
<rect x="260" y="530" width="300" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="272.0" y="550.0" font-size="11.5" fill="#1F2937" text-anchor="start">删快照（reason = applied / timeout）</text>
<text x="272.0" y="566.5" font-size="11.5" fill="#1F2937" text-anchor="start">超过 30 天的快照启动时清掉</text>
<text x="30.0" y="626.0" font-size="11.5" fill="#6B7280" text-anchor="start">换算：新页 = 新 .epubindex 里同名章节文件的起始页 + round(文件内比例 × 该文件页数)；文件改名或拆分找不到时用全书比例；页序 ↔ PDF 页靠 .content 页表。</text>
<text x="30.0" y="646.0" font-size="11.5" fill="#6B7280" text-anchor="start">连续替换：上一份快照还没等到新排版（用户没打开过新版）就保留上一份；打开过就按当前位置重拍。book-serve 不在或回别的状态码：qmd 安静收工。只对 EPUB。</text>
<text x="30.0" y="666.0" font-size="11.5" fill="#6B7280" text-anchor="start">状态：2026-10-09 已部署，真机验证一次（《绍宋》跳回第 15 页，替换前后该章排版没变）；内容变动导致页数变化、书里插过笔记页的情形未测。</text>
</svg>
