<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="860" fill="#fbfbfa"/>
<text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">原地替换后找回阅读位置：谁在什么时候做什么（§03ca）</text>
<text x="550" y="54" text-anchor="middle" font-size="12.5" fill="#6a6a6a">外部改 .metadata / .content 会被运行中的 xochitl 盖回去，所以 book-serve 只记"原来读到哪"，真正跳页由注入 xochitl 的 qmd 调它自己的 goToPage</text>

<!-- 泳道标题 -->
<rect x="30" y="74" width="180" height="36" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="120" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">sheng-ren（电脑）</text>
<rect x="290" y="74" width="200" height="36" rx="8" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="390" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">book-serve :8790</text>
<rect x="580" y="74" width="180" height="36" rx="8" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="670" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl 书库目录</text>
<rect x="830" y="74" width="230" height="36" rx="8" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="945" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl + keep-progress.qmd</text>

<!-- 生命线 -->
<line x1="120" y1="110" x2="120" y2="700" stroke="#b5b5b5" stroke-width="1.2" stroke-dasharray="5,5"/>
<line x1="390" y1="110" x2="390" y2="700" stroke="#b5b5b5" stroke-width="1.2" stroke-dasharray="5,5"/>
<line x1="670" y1="110" x2="670" y2="700" stroke="#b5b5b5" stroke-width="1.2" stroke-dasharray="5,5"/>
<line x1="945" y1="110" x2="945" y2="700" stroke="#b5b5b5" stroke-width="1.2" stroke-dasharray="5,5"/>

<!-- ① 替换请求 -->
<line x1="122" y1="140" x2="386" y2="140" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="254" y="133" text-anchor="middle" font-size="11.5" fill="#1a1a1a">① POST /import?uuid=…（新 EPUB）</text>
<line x1="388" y1="164" x2="124" y2="164" stroke="#555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<text x="254" y="182" text-anchor="middle" font-size="11.5" fill="#6a6a6a">202 {job}（后台任务慢慢做）</text>

<!-- ② 拍快照 -->
<rect x="250" y="198" width="290" height="112" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="395" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">② finish_replace：先拍快照</text>
<text x="395" y="242" text-anchor="middle" font-size="11.5" fill="#3a3a3a">读 lastOpenedPage + 旧 .content 页表 + 旧 .epubindex</text>
<text x="395" y="260" text-anchor="middle" font-size="11.5" fill="#3a3a3a">→ progress/&lt;uuid&gt;.json：所在章节文件、</text>
<text x="395" y="278" text-anchor="middle" font-size="11.5" fill="#3a3a3a">文件内比例、全书比例、快照时刻</text>
<text x="395" y="298" text-anchor="middle" font-size="11" fill="#8a8a8a">拍不成只记日志，替换照常</text>

<!-- ③ 换文件 -->
<line x1="542" y1="336" x2="666" y2="336" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="604" y="328" text-anchor="middle" font-size="11.5" fill="#1a1a1a">③ 再换文件</text>
<rect x="560" y="348" width="220" height="70" rx="10" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="670" y="370" text-anchor="middle" font-size="11.5" fill="#3a3a3a">删 &lt;uuid&gt;.pdf、&lt;uuid&gt;.epubindex</text>
<text x="670" y="388" text-anchor="middle" font-size="11.5" fill="#3a3a3a">新 &lt;uuid&gt;.epub 换进来</text>
<text x="670" y="406" text-anchor="middle" font-size="11" fill="#8a8a8a">.content / .metadata 不动</text>

<!-- ④ 用户开书 -->
<rect x="820" y="348" width="250" height="70" rx="10" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="945" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">④ 用户打开这本书</text>
<text x="945" y="390" text-anchor="middle" font-size="11.5" fill="#3a3a3a">xochitl 整本重排，按比例估一页</text>
<text x="945" y="408" text-anchor="middle" font-size="11" fill="#8a8a8a">（替换后自带的章节恢复用不上）</text>
<line x1="818" y1="440" x2="674" y2="440" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="746" y="458" text-anchor="middle" font-size="11.5" fill="#1a1a1a">写出新 .epubindex</text>
<text x="746" y="474" text-anchor="middle" font-size="11" fill="#8a8a8a">（真机：打开当场写）</text>

<!-- ⑤ 问页号 -->
<rect x="820" y="488" width="250" height="52" rx="10" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="945" y="509" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">⑤ 开书 / 页数变 / 目录到达</text>
<text x="945" y="528" text-anchor="middle" font-size="11.5" fill="#3a3a3a">各重启一个 2 秒单次计时器，到点去问</text>
<line x1="818" y1="514" x2="544" y2="514" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="680" y="506" text-anchor="middle" font-size="11.5" fill="#1a1a1a">GET /progress/{uuid}?pages=N</text>

<rect x="250" y="490" width="290" height="104" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="395" y="512" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">book-serve 怎么回</text>
<text x="262" y="534" font-size="11.5" fill="#3a3a3a">• 没有快照 → 404：qmd 收工</text>
<text x="262" y="554" font-size="11.5" fill="#3a3a3a">• 新 .epubindex 不在或早于快照 → 202</text>
<text x="262" y="574" font-size="11.5" fill="#3a3a3a">• 出来了 → 200 {page}（换算后的页序）</text>

<line x1="542" y1="560" x2="818" y2="560" stroke="#555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<text x="680" y="552" text-anchor="middle" font-size="11" fill="#6a6a6a">202：每 5 秒再问；开书约 60 秒还没有就放弃</text>
<line x1="542" y1="586" x2="818" y2="586" stroke="#555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<text x="680" y="580" text-anchor="middle" font-size="11" fill="#6a6a6a">200（页号仍 ≥ 当前总页数时按 202 处理）</text>

<!-- ⑥ 跳页 -->
<rect x="820" y="562" width="250" height="84" rx="10" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="945" y="584" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">⑥ sceneView.goToPage(page)</text>
<text x="945" y="603" text-anchor="middle" font-size="11" fill="#3a3a3a">日志 CJ-KEEP-PROGRESS: &lt;uuid&gt; -&gt; &lt;页&gt;</text>
<text x="945" y="620" text-anchor="middle" font-size="11" fill="#3a3a3a">15 秒内被 xochitl 自己跳走就跳回</text>
<text x="945" y="636" text-anchor="middle" font-size="11" fill="#3a3a3a">（最多 3 次），之后不再干预</text>

<!-- ⑦ 销账 -->
<line x1="818" y1="672" x2="544" y2="672" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="680" y="664" text-anchor="middle" font-size="11.5" fill="#1a1a1a">⑦ POST /progress/applied {uuid, reason}</text>
<text x="680" y="690" text-anchor="middle" font-size="11" fill="#6a6a6a">reason = applied（跳完）或 timeout（放弃）</text>
<rect x="250" y="652" width="290" height="40" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="395" y="677" text-anchor="middle" font-size="11.5" fill="#3a3a3a">删快照；超过 30 天的启动时也清</text>

<!-- 底部说明 -->
<rect x="20" y="716" width="1060" height="128" rx="10" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="40" y="740" font-size="12.5" fill="#1a1a1a">• 换算：新页 = 新 .epubindex 里同名章节文件的起始页 + round(文件内比例 × 该文件页数)；文件改名或拆分找不到时用全书比例；页序 ↔ PDF 页靠 .content 页表（笔记页按原值）。</text>
<text x="40" y="764" font-size="12.5" fill="#1a1a1a">• 同一本书连续替换：上一份快照还没等到新排版（用户没打开过新版）就保留上一份；打开过就按当前位置重拍、覆盖。</text>
<text x="40" y="788" font-size="12.5" fill="#1a1a1a">• book-serve 不在（XHR status 0）或回别的状态码：qmd 安静收工，不打日志、不重试。只问 EPUB。</text>
<text x="40" y="812" font-size="12.5" fill="#1a1a1a">• 状态：10-09 已部署，真机验证一次（《绍宋》跳回第 15 页，替换前后该章排版没变）；内容变动导致页数变化、插过笔记页的情形未测。</text>
<text x="40" y="834" font-size="11.5" fill="#6a6a6a">代码：shelf/services/book-serve/src/progress.rs、import.rs（finish_replace）、shelf/xovi/shelf-keep-progress.qmd；.epubindex 解析在 rmsvc-core/epubpkg</text>
</svg>
