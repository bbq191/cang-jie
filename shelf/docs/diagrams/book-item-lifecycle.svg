<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="bil-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="590" fill="#fbfbfa"/>
  <text x="540" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">母版库一本书的生命周期：内存忙锁 与 sidecar 状态</text>
  <text x="540" y="48" text-anchor="middle" font-size="12" fill="#6a6a6a">两套互不混用：忙锁回答“现在有没有线程在跑”（内存，重启清零）；sidecar 回答“上次跑到哪、结果如何”（落盘）</text>

  <!-- 点一次「优化/落库」的时间线 -->
  <rect x="33" y="62" width="118" height="42" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="92" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">① 同步校验</text>
  <text x="92" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">格式 · 文件在不在</text>
  <rect x="161" y="62" width="118" height="42" rx="6" fill="#fff3d6" stroke="#c9971f" stroke-width="1"/>
  <text x="220" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">② 加忙锁</text>
  <text x="220" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">已忙 → 回 400</text>
  <rect x="289" y="62" width="118" height="42" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1"/>
  <text x="348" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">③ 写 pending</text>
  <text x="348" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">sidecar</text>
  <rect x="417" y="62" width="118" height="42" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="476" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">④ 起线程</text>
  <text x="476" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">spawn_bg，回“已开始”</text>
  <rect x="545" y="62" width="118" height="42" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="604" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">⑤ 干活</text>
  <text x="604" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">写进度 · 查取消标记</text>
  <rect x="673" y="62" width="118" height="42" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1"/>
  <text x="732" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">⑥ 写终态</text>
  <text x="732" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">ok / failed / cancelled</text>
  <rect x="801" y="62" width="118" height="42" rx="6" fill="#fff3d6" stroke="#c9971f" stroke-width="1"/>
  <text x="860" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">⑦ 解忙锁</text>
  <text x="860" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">连取消标记一起清</text>
  <rect x="929" y="62" width="118" height="42" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="988" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">⑧ 推 SSE</text>
  <text x="988" y="94" text-anchor="middle" font-size="9.5" fill="#4a4a4a">books / staging</text>
  <line x1="151" y1="83" x2="161" y2="83" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="279" y1="83" x2="289" y2="83" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="407" y1="83" x2="417" y2="83" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="535" y1="83" x2="545" y2="83" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="663" y1="83" x2="673" y2="83" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="791" y1="83" x2="801" y2="83" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="919" y1="83" x2="929" y2="83" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>

  <!-- 左：内存 OpRegistry -->
  <rect x="30" y="118" width="370" height="450" rx="10" fill="#fff8e6" stroke="#c9971f" stroke-width="1.6"/>
  <text x="215" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">内存 · OpRegistry（忙锁 + 取消标记）</text>

  <rect x="70" y="152" width="200" height="46" rx="7" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="170" y="171" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">空闲</text>
  <text x="170" y="187" text-anchor="middle" font-size="9.8" fill="#4a4a4a">没有线程在跑</text>
  <rect x="70" y="232" width="200" height="46" rx="7" fill="#fff3d6" stroke="#c9971f" stroke-width="1.4"/>
  <text x="170" y="251" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">忙</text>
  <text x="170" y="267" text-anchor="middle" font-size="9.8" fill="#4a4a4a">优化 · 落库 · 删除 互斥</text>
  <rect x="70" y="312" width="200" height="46" rx="7" fill="#fff3d6" stroke="#c9971f" stroke-width="1.4"/>
  <text x="170" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">忙 · 可取消</text>
  <text x="170" y="347" text-anchor="middle" font-size="9.8" fill="#4a4a4a">EPUB 优化 / 按卷拆分已声明</text>
  <rect x="70" y="392" width="200" height="46" rx="7" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.4"/>
  <text x="170" y="411" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">已请求取消</text>
  <text x="170" y="427" text-anchor="middle" font-size="9.8" fill="#4a4a4a">下一个检查点停手</text>

  <line x1="170" y1="198" x2="170" y2="232" stroke="#555" stroke-width="1.4" marker-end="url(#bil-a)"/>
  <text x="180" y="219" text-anchor="start" font-size="10" fill="#4a4a4a">try_start（对应步骤 ②）</text>
  <line x1="170" y1="278" x2="170" y2="312" stroke="#555" stroke-width="1.4" marker-end="url(#bil-a)"/>
  <text x="180" y="299" text-anchor="start" font-size="10" fill="#4a4a4a">mark_cancellable</text>
  <line x1="170" y1="358" x2="170" y2="392" stroke="#555" stroke-width="1.4" marker-end="url(#bil-a)"/>
  <text x="180" y="379" text-anchor="start" font-size="10" fill="#4a4a4a">POST /staging/cancel</text>
  <polyline points="70,415 46,415 46,175 70,175" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#bil-a)"/>
  <text x="280" y="166" text-anchor="start" font-size="10" fill="#6a6a6a">← end()：任何状态收尾</text>
  <text x="280" y="180" text-anchor="start" font-size="10" fill="#6a6a6a">整条记录一并移除</text>

  <rect x="50" y="456" width="330" height="94" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1"/>
  <text x="215" y="474" text-anchor="middle" font-size="9.8" fill="#4a4a4a">忙锁只在内存：进程一重启，没有线程还在跑，</text>
  <text x="215" y="488" text-anchor="middle" font-size="9.8" fill="#4a4a4a">“忙”天然清零（不落盘，免得重启后永久卡忙）</text>
  <text x="215" y="506" text-anchor="middle" font-size="9.8" fill="#4a4a4a">取消三态：没在处理 → 400；这一步不可取消</text>
  <text x="215" y="520" text-anchor="middle" font-size="9.8" fill="#4a4a4a">（单文件上传、PDF 优化）→ 200 cancelled:false；</text>
  <text x="215" y="534" text-anchor="middle" font-size="9.8" fill="#4a4a4a">可取消 → 200 cancelled:true</text>

  <!-- 右：sidecar -->
  <rect x="420" y="118" width="630" height="450" rx="10" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="735" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">磁盘 · sidecar .&lt;name&gt;.delivered（重启不丢）</text>

  <!-- 轨道 1 optimize -->
  <rect x="434" y="152" width="602" height="104" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="446" y="171" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">optimize（优化）</text>
  <rect x="446" y="188" width="130" height="40" rx="6" fill="#fff3d6" stroke="#c9971f" stroke-width="1.2"/>
  <text x="511" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">pending</text>
  <text x="511" y="220" text-anchor="middle" font-size="9.5" fill="#4a4a4a">progress: done/total</text>
  <rect x="646" y="168" width="100" height="22" rx="5" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.1"/>
  <text x="696" y="183" text-anchor="middle" font-size="10.5" fill="#1a1a1a">ok</text>
  <rect x="646" y="194" width="100" height="22" rx="5" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.1"/>
  <text x="696" y="209" text-anchor="middle" font-size="10.5" fill="#1a1a1a">failed</text>
  <rect x="646" y="220" width="100" height="22" rx="5" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="696" y="235" text-anchor="middle" font-size="10.5" fill="#1a1a1a">cancelled</text>
  <line x1="576" y1="208" x2="646" y2="179" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="576" y1="208" x2="646" y2="205" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="576" y1="208" x2="646" y2="231" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <text x="770" y="186" text-anchor="start" font-size="9.8" fill="#4a4a4a">progress＝已写出条目/总条目（每 5 条落盘）</text>
  <text x="770" y="204" text-anchor="start" font-size="9.8" fill="#4a4a4a">message＝回执文案或失败原因</text>
  <text x="770" y="222" text-anchor="start" font-size="9.8" fill="#4a4a4a">cancelled＝用户中止，原文件字节不变</text>

  <!-- 轨道 2 deliver -->
  <rect x="434" y="264" width="602" height="104" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="446" y="283" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">deliver（落库）</text>
  <rect x="446" y="300" width="130" height="40" rx="6" fill="#fff3d6" stroke="#c9971f" stroke-width="1.2"/>
  <text x="511" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">pending</text>
  <text x="511" y="332" text-anchor="middle" font-size="9.5" fill="#4a4a4a">progress: 份数</text>
  <rect x="646" y="280" width="100" height="22" rx="5" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.1"/>
  <text x="696" y="295" text-anchor="middle" font-size="10.5" fill="#1a1a1a">ok</text>
  <rect x="646" y="306" width="100" height="22" rx="5" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.1"/>
  <text x="696" y="321" text-anchor="middle" font-size="10.5" fill="#1a1a1a">failed</text>
  <rect x="646" y="332" width="100" height="22" rx="5" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="696" y="347" text-anchor="middle" font-size="10.5" fill="#1a1a1a">cancelled</text>
  <line x1="576" y1="320" x2="646" y2="291" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="576" y1="320" x2="646" y2="317" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="576" y1="320" x2="646" y2="343" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <text x="770" y="298" text-anchor="start" font-size="9.8" fill="#4a4a4a">progress＝已成功份数/预算内总份数</text>
  <text x="770" y="314" text-anchor="start" font-size="9.8" fill="#4a4a4a">（仅按卷拆分有；整本落库无进度）</text>
  <text x="770" y="332" text-anchor="start" font-size="9.8" fill="#4a4a4a">成功后另起渲染自检线程 → 下一条轨道</text>

  <!-- 轨道 3 render -->
  <rect x="434" y="376" width="602" height="104" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="446" y="395" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">render（投原生后的渲染自检）</text>
  <rect x="446" y="412" width="110" height="40" rx="6" fill="#fff3d6" stroke="#c9971f" stroke-width="1.2"/>
  <text x="501" y="429" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">pending</text>
  <text x="501" y="444" text-anchor="middle" font-size="9.5" fill="#4a4a4a">等 xochitl 出页数</text>
  <rect x="616" y="392" width="200" height="22" rx="5" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.1"/>
  <text x="716" y="407" text-anchor="middle" font-size="10" fill="#1a1a1a">ok　页数不低于期望的 50%</text>
  <rect x="616" y="418" width="200" height="22" rx="5" fill="#fff3d6" stroke="#c9971f" stroke-width="1.1"/>
  <text x="716" y="433" text-anchor="middle" font-size="10" fill="#1a1a1a">warn　页数低于期望的 50%</text>
  <rect x="616" y="444" width="200" height="22" rx="5" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="716" y="459" text-anchor="middle" font-size="10" fill="#1a1a1a">timeout　10 分钟没等到（非错误）</text>
  <line x1="556" y1="432" x2="616" y2="403" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="556" y1="432" x2="616" y2="429" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <line x1="556" y1="432" x2="616" y2="455" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>
  <rect x="836" y="404" width="190" height="52" rx="6" fill="#eaf3fb" stroke="#4a6fa5" stroke-width="1.1"/>
  <text x="931" y="422" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#1a1a1a">onopen（大文件通道的 EPUB）</text>
  <text x="931" y="437" text-anchor="middle" font-size="9.5" fill="#4a4a4a">首次打开才渲染；</text>
  <text x="931" y="450" text-anchor="middle" font-size="9.5" fill="#4a4a4a">页数一变自动升级为 ok</text>
  <line x1="836" y1="418" x2="816" y2="404" stroke="#555" stroke-width="1.2" marker-end="url(#bil-a)"/>

  <!-- 启动恢复 -->
  <rect x="434" y="490" width="602" height="66" rx="8" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.3"/>
  <text x="735" y="508" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">启动时 recover_interrupted（仅启动时调一次，此时不可能有操作在跑）</text>
  <text x="735" y="525" text-anchor="middle" font-size="10" fill="#4a4a4a">optimize / deliver 停在 pending → 改成 failed；render 停在 pending → 改成 timeout</text>
  <text x="735" y="541" text-anchor="middle" font-size="10" fill="#4a4a4a">清 .&lt;name&gt;.optimizing.tmp 半成品；gc_orphan_sidecars 清没有对应书的孤儿边车</text>
</svg>
