<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="archit-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="archit-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="archit-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">shelf 书架：组成部分与连接</text>
<text x="600.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">全部跑在设备上；网关是唯一对外的门，领域服务只听本机端口；装 / 卸一个服务 = 一个二进制 + 一个 systemd 单元</text>
<text x="30.0" y="100.0" font-size="12" font-weight="bold" fill="#6B7280" text-anchor="start">设备外</text>
<rect x="30" y="112" width="210" height="92" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="132.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">浏览器（手机 / 电脑）</text>
<text x="42.0" y="151.0" font-size="11.5" fill="#1F2937" text-anchor="start">https://shelf.local/</text>
<text x="42.0" y="167.5" font-size="11.5" fill="#1F2937" text-anchor="start">或 https://10.11.99.1/（USB）</text>
<rect x="30" y="262" width="210" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="282.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">电脑上的 sheng-ren</text>
<text x="42.0" y="301.0" font-size="11.5" fill="#1F2937" text-anchor="start">booklib 优化书（不在本仓库）</text>
<text x="42.0" y="317.5" font-size="11.5" fill="#1F2937" text-anchor="start">booklib sync 直接导入 /</text>
<text x="42.0" y="334.0" font-size="11.5" fill="#1F2937" text-anchor="start">原地替换（经 ssh -L）</text>
<rect x="30" y="402" width="210" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="422.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">scp</text>
<text x="42.0" y="441.0" font-size="11.5" fill="#1F2937" text-anchor="start">把书丢进设备 inbox/</text>
<rect x="262" y="84" width="696" height="582" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="276.0" y="102.0" font-size="12" font-weight="bold" fill="#6B7280" text-anchor="start">reMarkable Paper Pro Move</text>
<rect x="300" y="112" width="520" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="312.0" y="132.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">gateway（0.0.0.0:443）</text>
<text x="312.0" y="151.0" font-size="11.5" fill="#1F2937" text-anchor="start">HTTPS + 登录密码 · 单页网页（传书 / 笔记 / 其他 / 管理）</text>
<text x="312.0" y="167.5" font-size="11.5" fill="#1F2937" text-anchor="start">/api/&lt;段&gt;/* 剥掉段名转发到本机端口 · 批量队列 · 事件汇聚（SSE）</text>
<rect x="300" y="262" width="250" height="150" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="312.0" y="282.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">book-serve（127.0.0.1:8790）</text>
<text x="312.0" y="301.0" font-size="11.5" fill="#1F2937" text-anchor="start">母版库：入库、改名、删除、下载原件</text>
<text x="312.0" y="317.5" font-size="11.5" fill="#1F2937" text-anchor="start">加入 xochitl（投递层 XochitlDelivery）</text>
<text x="312.0" y="334.0" font-size="11.5" fill="#1F2937" text-anchor="start">直接导入 / 原地替换（sheng-ren 用）</text>
<text x="312.0" y="350.5" font-size="11.5" fill="#1F2937" text-anchor="start">四个 qmd 代理的待办队列</text>
<text x="312.0" y="367.0" font-size="11.5" fill="#1F2937" text-anchor="start">链接库 shelf-conv：只读不改书</text>
<rect x="570" y="262" width="170" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="582.0" y="282.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">font-serve（8792）</text>
<text x="582.0" y="301.0" font-size="11.5" fill="#1F2937" text-anchor="start">字体上传即装</text>
<rect x="570" y="344" width="170" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="582.0" y="364.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">wallpaper-serve（8793）</text>
<text x="582.0" y="383.0" font-size="11.5" fill="#1F2937" text-anchor="start">休眠壁纸上传即用</text>
<rect x="760" y="262" width="170" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="772.0" y="282.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">笔记线四个服务</text>
<text x="772.0" y="301.0" font-size="11.5" fill="#1F2937" text-anchor="start">8795–8798</text>
<text x="772.0" y="317.5" font-size="11.5" fill="#1F2937" text-anchor="start">ink / transcribe /</text>
<text x="772.0" y="334.0" font-size="11.5" fill="#1F2937" text-anchor="start">mind / note</text>
<text x="772.0" y="350.5" font-size="11.5" fill="#1F2937" text-anchor="start">见 notes/README.md</text>
<rect x="300" y="470" width="630" height="176" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="312.0" y="490.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">xochitl（设备自带的界面 + 阅读器，不改它本体）</text>
<text x="312.0" y="509.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页上传接口 /upload（10.11.99.1:80，单文件上限 100,000,000 字节）</text>
<text x="312.0" y="525.5" font-size="11.5" fill="#1F2937" text-anchor="start">书库目录 ~/.local/share/remarkable/xochitl/（&lt;uuid&gt;.metadata / .content / .epub / .pdf）</text>
<text x="312.0" y="542.0" font-size="11.5" fill="#1F2937" text-anchor="start">注入的 qmd（xochitl 启动时加载）：</text>
<text x="312.0" y="558.5" font-size="11.5" fill="#1F2937" text-anchor="start">  shelf-mkdir-agent · shelf-trash-agent · shelf-comic-margins · shelf-keep-progress</text>
<text x="312.0" y="575.0" font-size="11.5" fill="#1F2937" text-anchor="start">  reader-page-turn（单击翻页，不经 book-serve）· 字体菜单 · 界面字体令牌（随 font-serve 装）</text>
<text x="312.0" y="591.5" font-size="11.5" fill="#1F2937" text-anchor="start">外部进程改书库文件会被运行中的 xochitl 盖回去，所以建文件夹、进回收站、</text>
<text x="312.0" y="608.0" font-size="11.5" fill="#1F2937" text-anchor="start">设页边距、跳页都请 qmd 在 xochitl 进程里调它自己的函数</text>
<rect x="980" y="112" width="190" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="992.0" y="132.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">服务注册表</text>
<text x="992.0" y="151.0" font-size="11.5" fill="#1F2937" text-anchor="start">$XDG_RUNTIME_DIR/shelf/</text>
<text x="992.0" y="167.5" font-size="11.5" fill="#1F2937" text-anchor="start">services/（重启即清）</text>
<text x="992.0" y="184.0" font-size="11.5" fill="#1F2937" text-anchor="start">服务启动时写一份，</text>
<text x="992.0" y="200.5" font-size="11.5" fill="#1F2937" text-anchor="start">网关据此出页签、转发</text>
<rect x="980" y="262" width="190" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="992.0" y="282.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">共用基座 rmsvc-core</text>
<text x="992.0" y="301.0" font-size="11.5" fill="#1F2937" text-anchor="start">HTTP 路由、SSE、上传</text>
<text x="992.0" y="317.5" font-size="11.5" fill="#1F2937" text-anchor="start">路径表（XDG）</text>
<text x="992.0" y="334.0" font-size="11.5" fill="#1F2937" text-anchor="start">往 xochitl 上传并认领</text>
<text x="992.0" y="350.5" font-size="11.5" fill="#1F2937" text-anchor="start">跨进程上传锁</text>
<text x="992.0" y="367.0" font-size="11.5" fill="#1F2937" text-anchor="start">epubpkg：读 EPUB 容器</text>
<rect x="980" y="470" width="190" height="176" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="992.0" y="490.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">systemd</text>
<text x="992.0" y="509.0" font-size="11.5" fill="#1F2937" text-anchor="start">shelf.target</text>
<text x="992.0" y="525.5" font-size="11.5" fill="#1F2937" text-anchor="start">各服务 PartOf=</text>
<text x="992.0" y="542.0" font-size="11.5" fill="#1F2937" text-anchor="start">shelf.target</text>
<text x="992.0" y="558.5" font-size="11.5" fill="#1F2937" text-anchor="start">单元装在 /usr（OTA 后</text>
<text x="992.0" y="575.0" font-size="11.5" fill="#1F2937" text-anchor="start">要重装）</text>
<text x="992.0" y="591.5" font-size="11.5" fill="#1F2937" text-anchor="start">绝不给 xochitl 加</text>
<text x="992.0" y="608.0" font-size="11.5" fill="#1F2937" text-anchor="start">启动依赖</text>
<path d="M240.0,158.0 L300.0,158.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<text x="270.0" y="152.0" font-size="11" fill="#6B7280" text-anchor="middle">HTTPS</text>
<path d="M425.0,204.0 L425.0,262.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<path d="M655.0,204.0 L655.0,262.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<path d="M845.0,204.0 L845.0,262.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<text x="560.0" y="236.0" font-size="11" fill="#6B7280" text-anchor="middle">loopback 转发（/api/books → 8790 …）</text>
<path d="M820.0,140.0 L980.0,140.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<text x="900.0" y="134.0" font-size="11" fill="#6B7280" text-anchor="middle">读</text>
<path d="M240.0,317.0 L300.0,317.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<text x="270.0" y="311.0" font-size="11" fill="#6B7280" text-anchor="middle">直连 :8790</text>
<path d="M240.0,433.0 L270.0,433.0 L270.0,395.0 L300.0,395.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<path d="M400.0,412.0 L400.0,470.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<text x="392.0" y="446.0" font-size="11" fill="#6B7280" text-anchor="end">/upload + 读写书库目录</text>
<path d="M500.0,470.0 L500.0,412.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#archit-a)"/>
<text x="508.0" y="446.0" font-size="11" fill="#6B7280" text-anchor="start">qmd 拉待办（长轮询 / 开书时问）</text>
</svg>
