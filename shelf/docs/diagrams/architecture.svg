<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="660" fill="#fbfbfa"/>
  <text x="520" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">shelf 架构：网关 + 领域服务</text>

  <!-- client -->
  <rect x="400" y="52" width="240" height="46" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="520" y="80" text-anchor="middle" font-size="14" fill="#1a1a1a">浏览器 / shelf CLI</text>

  <line x1="520" y1="98" x2="520" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- gateway -->
  <rect x="240" y="128" width="560" height="76" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="520" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">shelf-gateway  https://0.0.0.0:8778 · shelf.local</text>
  <text x="520" y="172" text-anchor="middle" font-size="12.5" fill="#4a4a4a">私有 CA TLS + 登录密码 / CLI Basic</text>
  <text x="520" y="190" text-anchor="middle" font-size="12.5" fill="#4a4a4a">按注册表反向代理 /api/&lt;seg&gt;/*（$XDG_RUNTIME_DIR/shelf/services/*.json）</text>

  <!-- 4 core services (x: 30,214,398,582 · width 172 · centers 116,300,484,668) -->
  <line x1="360" y1="204" x2="116" y2="248" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="440" y1="204" x2="300" y2="248" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="500" y1="204" x2="484" y2="248" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="560" y1="204" x2="668" y2="248" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="30" y="250" width="172" height="100" rx="8" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.5"/>
  <text x="116" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">book-serve :8790</text>
  <text x="116" y="290" text-anchor="middle" font-size="10.8" fill="#3a3a3a">母版库：入库/优化/落库</text>
  <text x="116" y="306" text-anchor="middle" font-size="10.8" fill="#3a3a3a">+ 投 xochitl · inbox</text>
  <text x="116" y="322" text-anchor="middle" font-size="10.8" fill="#3a3a3a">渲染自检 · 回收站队列</text>

  <rect x="214" y="250" width="172" height="100" rx="8" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.5"/>
  <text x="300" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">koreader-serve :8791</text>
  <text x="300" y="290" text-anchor="middle" font-size="10.8" fill="#3a3a3a">从母版库 adopt 落书</text>
  <text x="300" y="306" text-anchor="middle" font-size="10.8" fill="#3a3a3a">字体 · 词典 · 配置</text>
  <text x="300" y="322" text-anchor="middle" font-size="10.8" fill="#3a3a3a">（不依赖 bookconv）</text>

  <rect x="398" y="250" width="172" height="100" rx="8" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.5"/>
  <text x="484" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">font-serve :8792</text>
  <text x="484" y="290" text-anchor="middle" font-size="10.8" fill="#3a3a3a">原生字体上传即装</text>
  <text x="484" y="306" text-anchor="middle" font-size="10.8" fill="#3a3a3a">fontconfig 回退链</text>
  <text x="484" y="322" text-anchor="middle" font-size="10.8" fill="#3a3a3a">字形级兜底（缺字才回退）</text>

  <rect x="582" y="250" width="172" height="100" rx="8" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.5"/>
  <text x="668" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">wallpaper-serve :8793</text>
  <text x="668" y="290" text-anchor="middle" font-size="10.8" fill="#3a3a3a">壁纸上传即用</text>
  <text x="668" y="306" text-anchor="middle" font-size="10.8" fill="#3a3a3a">原生 SleepScreenPath</text>
  <text x="668" y="322" text-anchor="middle" font-size="10.8" fill="#3a3a3a">（bind-mount 已退役）</text>

  <!-- shared crate -->
  <line x1="116" y1="350" x2="116" y2="400" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="668" y1="350" x2="668" y2="400" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="30" y="402" width="724" height="46" rx="8" fill="#f1f1f6" stroke="#7a7a8c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="392" y="430" text-anchor="middle" font-size="12" fill="#3a3a3a">共享底座 shelf-core：paths(XDG) · registry · events(SSE) · http · fswatch · xochitl 注入/找书 · clock · config</text>

  <!-- notes line (dashed, external) -->
  <line x1="710" y1="204" x2="890" y2="248" stroke="#8a6d00" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowDash)"/>

  <rect x="800" y="250" width="210" height="330" rx="10" fill="#fdf3f0" stroke="#b5541f" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="905" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">笔记线 notes/</text>
  <text x="905" y="288" text-anchor="middle" font-size="11" fill="#5a3a2a">独立仓库，同一套机制接入</text>

  <rect x="815" y="300" width="180" height="56" rx="7" fill="#ffffff" stroke="#b5541f" stroke-width="1.2"/>
  <text x="905" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ink-serve 矿 :8795</text>
  <text x="905" y="337" text-anchor="middle" font-size="10.5" fill="#3a3a3a">fswatch → 条目库唯一写者</text>
  <text x="905" y="351" text-anchor="middle" font-size="10.5" fill="#3a3a3a">零网络</text>

  <rect x="815" y="366" width="180" height="56" rx="7" fill="#ffffff" stroke="#b5541f" stroke-width="1.2"/>
  <text x="905" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">transcribe-serve :8796</text>
  <text x="905" y="403" text-anchor="middle" font-size="10.5" fill="#3a3a3a">裁图喂视觉模型</text>
  <text x="905" y="417" text-anchor="middle" font-size="10.5" fill="#3a3a3a">四厂商预置；出网之一</text>

  <rect x="815" y="432" width="180" height="56" rx="7" fill="#ffffff" stroke="#b5541f" stroke-width="1.2"/>
  <text x="905" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">note-serve 本 :8798</text>
  <text x="905" y="469" text-anchor="middle" font-size="10.5" fill="#3a3a3a">注册「笔记」tab</text>
  <text x="905" y="483" text-anchor="middle" font-size="10.5" fill="#3a3a3a">投影设备笔记本 + md 导出</text>

  <rect x="815" y="498" width="180" height="56" rx="7" fill="#ffffff" stroke="#b5541f" stroke-width="1.2"/>
  <text x="905" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">mind-serve 脑 :8797</text>
  <text x="905" y="535" text-anchor="middle" font-size="10.5" fill="#3a3a3a">按条目单发问 AI（纯被动）</text>
  <text x="905" y="549" text-anchor="middle" font-size="10.5" fill="#3a3a3a">四厂商预置；出网之一</text>

  <!-- legend -->
  <rect x="30" y="470" width="18" height="14" rx="3" fill="#eaf7ec" stroke="#3e8e51"/>
  <text x="54" y="482" font-size="11.5" fill="#3a3a3a">书架自身服务（本仓库）</text>
  <rect x="230" y="470" width="18" height="14" rx="3" fill="#fdf3f0" stroke="#b5541f" stroke-dasharray="3 2"/>
  <text x="254" y="482" font-size="11.5" fill="#3a3a3a">外部独立仓库线（notes/，虚线=独立仓库边界，非"待建"——四服务均已真机验证）</text>

  <text x="520" y="600" text-anchor="middle" font-size="12" fill="#6a6a6a">装/卸一个服务 = 一个二进制 + 一个 systemd 单元，其余零改动；notes/ 只加 MODULES 几行映射即可接入同一套机制</text>
  <text x="520" y="622" text-anchor="middle" font-size="11" fill="#8a8a8a">notes 线自己的服务/端口/职责细节见 notes/README.md，本图不重复</text>
</svg>
