<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="sans-serif">
<defs><marker id="sa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="sa-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="sa-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1080" height="640" fill="#fbfbfa"/>
<text x="540.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">shelf 架构：网关 + 领域服务</text>
<text x="540.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">装 / 卸一个服务 = 一个二进制 + 一个 systemd 单元，其余零改动；服务启动时自己写注册表，网关按它出 tab 和转发</text>
<rect x="410" y="68" width="260" height="42" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="540" y="95" text-anchor="middle" font-size="13.5" fill="#1a1a1a">浏览器（手机 / 电脑）</text>
<polyline points="540,110 540,134" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sa-a)"/>
<rect x="150" y="136" width="780" height="92" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="540.0" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">gateway  https://0.0.0.0:443 · shelf.local</text>
<text x="540.0" y="184.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">私有 CA TLS + 登录页密码 · 单页 UI · /api/services · /api/manage · /api/events(SSE)</text>
<text x="540.0" y="198.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">按注册表 /api/&lt;seg&gt;/* 反向代理 · 批量队列 · 并发/内存预算闸门</text>
<rect x="30" y="290" width="240" height="120" rx="10" fill="#ffffff" stroke="#3f9a55" stroke-width="1.6"/>
<text x="150.0" y="309.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">book-serve :8790</text>
<text x="150.0" y="335.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">母版库：入库 / 优化 / 落库</text>
<text x="150.0" y="349.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">投 xochitl · 回收站/建夹队列</text>
<text x="150.0" y="362.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">渲染自检 · 边车记录</text>
<polyline points="150,228 150,290" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sa-a)"/>
<rect x="290" y="290" width="240" height="120" rx="10" fill="#ffffff" stroke="#3f9a55" stroke-width="1.6"/>
<text x="410.0" y="309.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">koreader-serve :8791</text>
<text x="410.0" y="335.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">从母版库落书进 KOReader</text>
<text x="410.0" y="349.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">字体 · 词典 · 配置同步</text>
<text x="410.0" y="362.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">高亮/生词只读端点</text>
<polyline points="410,228 410,290" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sa-a)"/>
<rect x="550" y="290" width="240" height="120" rx="10" fill="#ffffff" stroke="#3f9a55" stroke-width="1.6"/>
<text x="670.0" y="309.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">font-serve :8792</text>
<text x="670.0" y="335.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">原生字体上传即装</text>
<text x="670.0" y="349.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">fontconfig 中文回退链</text>
<text x="670.0" y="362.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">（源码在 enhance/）</text>
<polyline points="670,228 670,290" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sa-a)"/>
<rect x="810" y="290" width="240" height="120" rx="10" fill="#ffffff" stroke="#3f9a55" stroke-width="1.6"/>
<text x="930.0" y="309.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">wallpaper-serve :8793</text>
<text x="930.0" y="335.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">壁纸上传即用</text>
<text x="930.0" y="349.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">池化轮换</text>
<text x="930.0" y="362.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">原生 SleepScreenPath 键</text>
<text x="930.0" y="376.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">（源码在 enhance/）</text>
<polyline points="930,228 930,290" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sa-a)"/>
<text x="540" y="262" text-anchor="middle" font-size="10.5" fill="#5a5a5a">按注册表转发（剥掉 &lt;seg&gt;，请求体流式透传）</text>
<rect x="30" y="440" width="1020" height="92" rx="10" fill="#f3effa" stroke="#7a56b5" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="540.0" y="459.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">笔记线 notes/（独立目录，挂同一网关/同一载荷）</text>
<text x="540.0" y="485.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">ink-serve :8795 · transcribe-serve :8796 · mind-serve :8797 · note-serve :8798</text>
<text x="540.0" y="499.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">服务列表、职责与端口详见 notes/README.md</text>
<polyline points="930,182 1064,182 1064,486 1050,486" fill="none" stroke="#7a56b5" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sa-a)"/>
<rect x="30" y="556" width="1020" height="34" rx="10" fill="#f2f2f5" stroke="#8a8a99" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="540" y="578" text-anchor="middle" font-size="10.5" fill="#4a4a4a">共享底座 rmsvc-core：paths(XDG) · registry · events(SSE) · http · fswatch · xochitl 注入/找书 · clock · config</text>
<text x="540" y="616" text-anchor="middle" font-size="10.5" fill="#7a7a7a">URL 段 ↔ 服务：books→book-serve · koreader→koreader-serve · fonts→font-serve · wallpapers→wallpaper-serve（gateway/src/manage.rs 单一事实源）</text>
</svg>
