<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="svi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="640" fill="#fbfbfa"/>
  <text x="540" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">EPUB 优化的内存路径：旧整本内存版（已删）vs 现役流式版</text>
  <text x="540" y="50" text-anchor="middle" font-size="12" fill="#4a4a4a">大头是图片字节；文字类条目（html/css/opf/ncx）本来就小，两条路径都整份留在内存</text>

  <!-- 左：整本内存版 -->
  <rect x="24" y="66" width="500" height="404" rx="10" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="274" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">旧整本内存版（09-19 前生产用，09-29 删）</text>
  <text x="274" y="108" text-anchor="middle" font-size="11.5" fill="#4a4a4a">此处保留当年的内存账，说明为什么改流式</text>

  <rect x="54" y="122" width="440" height="46" rx="7" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="274" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">① 输入：整本 EPUB 已在内存（&amp;[u8]）</text>
  <text x="274" y="159" text-anchor="middle" font-size="11.5" fill="#3a3a3a">副本 1 = 书体积 S</text>
  <line x1="274" y1="168" x2="274" y2="184" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>

  <rect x="54" y="186" width="440" height="46" rx="7" fill="#fff3d6" stroke="#c9971f" stroke-width="1.4"/>
  <text x="274" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">② check::read_entries：全部条目解压</text>
  <text x="274" y="223" text-anchor="middle" font-size="11.5" fill="#3a3a3a">含全部图片，进 Vec&lt;Entry&gt;：副本 2 ≈ 解压后全书</text>
  <line x1="274" y1="232" x2="274" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>

  <rect x="54" y="250" width="440" height="46" rx="7" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="274" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">③ prepare_entries：清洗 + 第一遍</text>
  <text x="274" y="287" text-anchor="middle" font-size="11.5" fill="#3a3a3a">整本 entries 在手，逐条图片变换结果与原字节并存</text>
  <line x1="274" y1="296" x2="274" y2="312" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>

  <rect x="54" y="314" width="440" height="46" rx="7" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.4"/>
  <text x="274" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">④ 第二遍 → ZipWriter&lt;Cursor&lt;Vec&lt;u8&gt;&gt;&gt;</text>
  <text x="274" y="351" text-anchor="middle" font-size="11.5" fill="#3a3a3a">完整产物 out_buf 攒在内存：副本 3 ≈ 输出体积</text>

  <rect x="54" y="380" width="440" height="72" rx="7" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.6"/>
  <text x="274" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b0451f">峰值 ≈ 输入 + 解压全书 + 产物，随书体积线性涨</text>
  <text x="274" y="421" text-anchor="middle" font-size="11.5" fill="#3a3a3a">真机实测：552MB《镖人（套装共11卷）》VmRSS 几十秒冲到</text>
  <text x="274" y="438" text-anchor="middle" font-size="11.5" fill="#3a3a3a">1.4GB+，系统可用内存探底 ~25MB，手动重启 book-serve 止血</text>

  <!-- 右：流式版 -->
  <rect x="556" y="66" width="500" height="404" rx="10" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.2"/>
  <text x="806" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">流式版 optimize_epub_file_streaming</text>
  <text x="806" y="108" text-anchor="middle" font-size="11.5" fill="#4a4a4a">= StreamingOptimize；book-serve 与 epub-optimize 都走这条</text>

  <rect x="586" y="122" width="440" height="46" rx="7" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="806" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">① 输入：磁盘路径（不读进内存）</text>
  <text x="806" y="159" text-anchor="middle" font-size="11.5" fill="#3a3a3a">ZipArchive&lt;BufReader&lt;File&gt;&gt;，可随时按名字 seek</text>
  <line x1="806" y1="168" x2="806" y2="184" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>

  <rect x="586" y="186" width="440" height="46" rx="7" fill="#fff3d6" stroke="#c9971f" stroke-width="1.4"/>
  <text x="806" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">② 阶段一 read_skeleton：只读“骨架”</text>
  <text x="806" y="223" text-anchor="middle" font-size="11.5" fill="#3a3a3a">非图片条目整份读；图片只记名字+大小，字节留空占位</text>
  <line x1="806" y1="232" x2="806" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>

  <rect x="586" y="250" width="440" height="46" rx="7" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="806" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">③ prepare_entries：清洗 + 第一遍 + 漫画识别</text>
  <text x="806" y="287" text-anchor="middle" font-size="11.5" fill="#3a3a3a">只看 html 文字与 &lt;img&gt; 引用，从不需要图片真实字节</text>
  <line x1="806" y1="296" x2="806" y2="312" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>

  <rect x="586" y="314" width="440" height="60" rx="7" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
  <text x="806" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">④ 阶段二：按条目顺序逐个写出</text>
  <text x="806" y="350" text-anchor="middle" font-size="11.5" fill="#3a3a3a">主线程读一张原图 → 2 个 worker 变换（总像素 ≤ 600 万）</text>
  <text x="806" y="365" text-anchor="middle" font-size="11.5" fill="#3a3a3a">→ 按原顺序取回，立刻写入 ZipWriter&lt;BufWriter&lt;File&gt;&gt; 并丢弃</text>

  <rect x="586" y="380" width="440" height="72" rx="7" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.6"/>
  <text x="806" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c7a41">峰值 ≈ 全书文字 + 至多 workers+2 张在途图</text>
  <text x="806" y="421" text-anchor="middle" font-size="11.5" fill="#3a3a3a">真机同一本 552MB：并行化前 VmRSS 8-53MB；并行化后乱马 01</text>
  <text x="806" y="438" text-anchor="middle" font-size="11.5" fill="#3a3a3a">VmHWM 47MB，不随书体积线性涨；每条目回调进度并检查取消</text>

  <!-- 共用代码条 -->
  <line x1="274" y1="470" x2="274" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>
  <line x1="806" y1="470" x2="806" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#svi-arrow)"/>
  <rect x="24" y="500" width="1032" height="92" rx="9" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="540" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">09-29 起只剩流式这一份实现（optimize/ 下的抽出函数）</text>
  <text x="540" y="546" text-anchor="middle" font-size="12" fill="#3a3a3a">prepare_entries · first_pass_html · transform_html_chapter · transform_image_bytes（漫画走 prepare_comic_page_for_epub 单趟）</text>
  <text x="540" y="566" text-anchor="middle" font-size="12" fill="#3a3a3a">optimize_epub_with(&amp;[u8]) 现在只是薄封装：字节写临时文件 → StreamingOptimize → 读回产物</text>
  <text x="540" y="583" text-anchor="middle" font-size="12" fill="#3a3a3a">（给单测和抓网文组装用；09-19～09-29 两份实现并存时靠对拍单测保证逐字节一致）</text>

  <text x="540" y="620" text-anchor="middle" font-size="11.5" fill="#4a4a4a">另：落库（≤90MB）路径的自检 stats::text_profile_file 也是同一思路——按条目名先筛，图片连解压都跳过</text>
</svg>
