<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="shinst-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="shinst-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="shinst-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">书架怎么装到设备上：deploy.sh → install.sh</text>
<text x="600.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">整套设备增强用 packaging/install-all.sh（书架是其中一步）；只更新书架这几个服务用 packaging/deploy.sh</text>
<rect x="30" y="96" width="330" height="128" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">电脑：sh shelf/build.sh</text>
<text x="42.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">host 测试（cargo test --locked）</text>
<text x="42.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">aarch64 musl 全静态交叉编译：</text>
<text x="42.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">book-serve、gateway、font / wallpaper、</text>
<text x="42.0" y="184.5" font-size="11.5" fill="#1F2937" text-anchor="start">笔记线四服务（目录在才编）</text>
<rect x="30" y="248" width="330" height="166" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42.0" y="268.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">电脑：sh packaging/deploy.sh &lt;设备IP&gt;</text>
<text x="42.0" y="287.0" font-size="11.5" fill="#1F2937" text-anchor="start">[--only book,font …] [--password &#x27;新密码&#x27;]</text>
<text x="42.0" y="303.5" font-size="11.5" fill="#1F2937" text-anchor="start">组载荷：bin/ systemd/ xovi/ lo-alias/</text>
<text x="42.0" y="320.0" font-size="11.5" fill="#1F2937" text-anchor="start">  install.sh uninstall.sh manifest.sh devlib.sh</text>
<text x="42.0" y="336.5" font-size="11.5" fill="#1F2937" text-anchor="start">确定性 tar → 推到 shelf-pkg.new → 核对 md5</text>
<text x="42.0" y="353.0" font-size="11.5" fill="#1F2937" text-anchor="start">  后换位（载荷没变就不重传）</text>
<text x="42.0" y="369.5" font-size="11.5" fill="#1F2937" text-anchor="start">密码经 ssh 标准输入传，不上命令行</text>
<path d="M195.0,224.0 L195.0,248.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shinst-a)"/>
<rect x="420" y="96" width="750" height="386" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="436.0" y="116.0" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="start">设备上：install.sh（root；幂等，重跑即收敛；umask 022）</text>
<rect x="440" y="132" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="152.0" font-size="12" fill="#1F2937" text-anchor="start">0 校验载荷</text>
<text x="596.0" y="155.0" font-size="11.5" fill="#1F2937" text-anchor="start">所选服务的二进制、单元、shelf.target 全在，否则一字节不写就退出</text>
<rect x="440" y="175" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="195.0" font-size="12" fill="#1F2937" text-anchor="start">1 备份</text>
<text x="596.0" y="198.0" font-size="11.5" fill="#1F2937" text-anchor="start">要被替换的旧文件进 ~/cangjie-backups/shelf-&lt;时间&gt;/（留最近 5 份）</text>
<rect x="440" y="218" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="238.0" font-size="12" fill="#1F2937" text-anchor="start">2 二进制与库</text>
<text x="596.0" y="241.0" font-size="11.5" fill="#1F2937" text-anchor="start">~/.local/bin/ 原子替换（暂存 → rename）；刷新 shelf-uninstall 与 ~/.local/lib/shelf/</text>
<rect x="440" y="261" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="281.0" font-size="12" fill="#1F2937" text-anchor="start">3 systemd</text>
<text x="596.0" y="284.0" font-size="11.5" fill="#1F2937" text-anchor="start">写 /usr 前实检 dm-verity；带 trap 的 rw 窗口；清旧命名遗留单元</text>
<rect x="440" y="304" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="324.0" font-size="12" fill="#1F2937" text-anchor="start">3 重启服务</text>
<text x="596.0" y="327.0" font-size="11.5" fill="#1F2937" text-anchor="start">只重启：二进制或单元变了 / 没在跑 / 还在跑被替换掉的旧二进制 / 只改了密码的网关</text>
<rect x="440" y="347" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="367.0" font-size="12" fill="#1F2937" text-anchor="start">3b 壁纸</text>
<text x="596.0" y="370.0" font-size="11.5" fill="#1F2937" text-anchor="start">建壁纸池；有当前图就写 xochitl.conf 的 SleepScreenPath</text>
<rect x="440" y="390" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="410.0" font-size="12" fill="#1F2937" text-anchor="start">3c qmd</text>
<text x="596.0" y="413.0" font-size="11.5" fill="#1F2937" text-anchor="start">原子落盘到 qt-resource-rebuilder 目录；换上一份就当场记「待生效」标记</text>
<rect x="440" y="433" width="140" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="452.0" y="453.0" font-size="12" fill="#1F2937" text-anchor="start">4 健康检查</text>
<text x="596.0" y="456.0" font-size="11.5" fill="#1F2937" text-anchor="start">轮询最多 10 秒看各服务 active、注册表；HTTPS 探测由电脑上的 deploy.sh 做</text>
<path d="M360.0,330.0 L420.0,330.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shinst-a)"/>
<rect x="30" y="500" width="1140" height="70" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="42.0" y="520.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">qmd 怎么生效：整机重启</text>
<text x="42.0" y="539.0" font-size="11.5" fill="#1F2937" text-anchor="start">install.sh 只把 qmd 放到位、不重启（会打断阅读）。电脑上跑 packaging/deploy-xovi-apply.sh &lt;设备&gt;，或设备上 reboot；install-all 最后一步有待生效改动才自动重启。</text>
<text x="42.0" y="555.5" font-size="11.5" fill="#1F2937" text-anchor="start">不要单独 systemctl restart xochitl（退出时自身有概率崩溃）；xovi 已生效时绝不跑 xovi/start（会让运行中的 xochitl 崩溃）。</text>
<text x="30.0" y="600.0" font-size="11.5" fill="#6B7280" text-anchor="start">卸载：设备上 ~/.local/bin/shelf-uninstall [--only font] [--purge] [--dry-run]；网页「管理 → 基石与模块」的卸载也调它。删了 qmd 会记待生效标记，提示整机重启。</text>
<text x="30.0" y="620.0" font-size="11.5" fill="#6B7280" text-anchor="start">固件升级（OTA）后：/home 数据不丢，/usr 单元没了 → 设备旁 rebuild_hashtable，再在电脑上重跑 install-all（见 docs/INSTALL.md）。</text>
</svg>
