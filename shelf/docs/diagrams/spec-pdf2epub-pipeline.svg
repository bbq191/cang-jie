<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">PDF → EPUB：六步走（有文字层的 PDF）</text>

  <!-- step boxes: row 1 -->
  <g font-size="12.5" fill="#333">
    <rect x="30" y="60" width="280" height="150" rx="10" fill="#fdf7ef" stroke="#c8812e"/>
    <text x="45" y="84" font-size="15" font-weight="bold" fill="#6b4210">① 逐字抽取（pdf-extract-cj）</text>
    <text x="45" y="108">每个字：字符、坐标、设备字号、颜色</text>
    <text x="45" y="128">每张图：绘制矩形（CTM）、资源名</text>
    <text x="45" y="148">字宽/字号 × 页面缩放，计入字间距</text>
    <text x="45" y="168">中文字宽区间写法已修（原来全是 0）</text>
    <text x="45" y="188">标题按规范解码（UTF-16BE 等）</text>

    <rect x="340" y="60" width="280" height="150" rx="10" fill="#fdf7ef" stroke="#c8812e"/>
    <text x="355" y="84" font-size="15" font-weight="bold" fill="#6b4210">② 定结构（先于排版）</text>
    <text x="355" y="108">书签 → 按字号认标题 → 每 20 页兜底</text>
    <text x="355" y="128">每页只进一章、一页不丢</text>
    <text x="355" y="148">扫全书链接：有跨章书内跳转？</text>
    <text x="355" y="168">　有 → 单文件模式（xochitl 才能跳）</text>
    <text x="355" y="188">　无 → 每章一个文件</text>

    <rect x="650" y="60" width="280" height="150" rx="10" fill="#fdf7ef" stroke="#c8812e"/>
    <text x="665" y="84" font-size="15" font-weight="bold" fill="#6b4210">③ 逐页排成段落</text>
    <text x="665" y="108">同一基线不补空格；折行补一个空格</text>
    <text x="665" y="128">（中文接中文、行尾连字符除外）</text>
    <text x="665" y="148">换段三线索：行距大/短行/字号变</text>
    <text x="665" y="168">颜色 → &lt;span class="cj-cN"&gt;</text>
    <text x="665" y="188">链接矩形里的字 → &lt;a href&gt;</text>
  </g>

  <!-- row 2 -->
  <g font-size="12.5" fill="#333">
    <rect x="650" y="250" width="280" height="130" rx="10" fill="#fdf7ef" stroke="#c8812e"/>
    <text x="665" y="274" font-size="15" font-weight="bold" fill="#6b4210">④ 放图片</text>
    <text x="665" y="298">插在"图片上沿以上最近一行"之后</text>
    <text x="665" y="318">同一行的几张图并排</text>
    <text x="665" y="338">宽度 = 原书占栏宽比例（5% 一档）</text>
    <text x="665" y="358">公式区域另截图补在所在段落后</text>

    <rect x="340" y="250" width="280" height="130" rx="10" fill="#fdf7ef" stroke="#c8812e"/>
    <text x="355" y="274" font-size="15" font-weight="bold" fill="#6b4210">⑤ 拼章节</text>
    <text x="355" y="298">页与页接起来；一句话跨页就接回</text>
    <text x="355" y="318">书内跳转目标：页首段落挂 id</text>
    <text x="355" y="338">原有标题段落升级成 &lt;h2&gt;（不加字）</text>
    <text x="355" y="358">目录：显式 nav，分组标题只进目录</text>

    <rect x="30" y="250" width="280" height="130" rx="10" fill="#fdf7ef" stroke="#c8812e"/>
    <text x="45" y="274" font-size="15" font-weight="bold" fill="#6b4210">⑥ 打包 + 质量门</text>
    <text x="45" y="298">颜色/图宽规则写进 pdf-img.css</text>
    <text x="45" y="318">过质量门才替换，原 PDF 随后删除</text>
    <text x="45" y="338">不过门：报错，原 PDF 不动</text>
    <text x="45" y="358">书名、正文丢弃 XML 非法字符</text>
  </g>

  <line x1="310" y1="135" x2="338" y2="135" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="135" x2="648" y2="135" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="790" y1="210" x2="790" y2="248" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="650" y1="315" x2="622" y2="315" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="340" y1="315" x2="312" y2="315" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 底部：两本真机样本 -->
  <rect x="30" y="405" width="900" height="135" rx="10" fill="#fafafa" stroke="#ccc"/>
  <text x="50" y="430" font-size="14" font-weight="bold" fill="#333">真机样本（2026-09-23）</text>
  <text x="50" y="455" font-size="13" fill="#333">《移动互联软件安装使用手册》Word 导出 8 页 → EPUB 9 页：红字/蓝色网址保留，二维码并排，截图按原比例，一句话跨页已接回。</text>
  <text x="50" y="480" font-size="13" fill="#333">《2026-09-19 T.E.双语》calibre 导出 540 页 → 单文件 + 95 条锚点目录；344 个链接全部可跳、95 个目标逐一核对落页正确。</text>
  <text x="50" y="505" font-size="13" fill="#8e2a20">修掉的坑：内容重复十倍（书签往回指）、字间插空格约 500 处、整本只渲染 1 页（书名 UTF-16 解错）、</text>
  <text x="50" y="526" font-size="13" fill="#8e2a20">跨章链接点不动（跨文件 → 单文件）、目标空元素点不动（→ 挂到段落上）。</text>
</svg>
