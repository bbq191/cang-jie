<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ok" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e8b57"/></marker>
    <marker id="no" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">xochitl 里哪些链接点了会跳？（2026-09-23 真机实验）</text>

  <!-- 文件 A -->
  <rect x="40" y="60" width="380" height="330" rx="10" fill="#f7f9fc" stroke="#7a8ca6"/>
  <text x="60" y="86" font-size="14" font-weight="bold" fill="#34495e">chap_0001.xhtml（同一个文件）</text>
  <rect x="60" y="100" width="340" height="34" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="72" y="122" font-size="13" fill="#1a5dab">&lt;a href="#t1"&gt;第一章&lt;/a&gt;</text>
  <rect x="60" y="150" width="340" height="34" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="72" y="172" font-size="13" fill="#1a5dab">&lt;a href="#t2"&gt;第二章&lt;/a&gt;</text>
  <rect x="60" y="200" width="340" height="34" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="72" y="222" font-size="13" fill="#1a5dab">&lt;a href="chap_0002.xhtml#t3"&gt;第三章&lt;/a&gt;</text>

  <rect x="60" y="270" width="340" height="40" rx="6" fill="#eaf7ee" stroke="#2e8b57"/>
  <text x="72" y="295" font-size="13" fill="#1d5e3a">&lt;p id="t1"&gt;第一章正文……&lt;/p&gt;　有内容</text>
  <rect x="60" y="325" width="340" height="40" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="72" y="350" font-size="13" fill="#8e2a20">&lt;a id="t2"&gt;&lt;/a&gt;　空元素</text>

  <!-- 文件 B -->
  <rect x="540" y="200" width="380" height="110" rx="10" fill="#f7f9fc" stroke="#7a8ca6"/>
  <text x="560" y="226" font-size="14" font-weight="bold" fill="#34495e">chap_0002.xhtml（另一个文件）</text>
  <rect x="560" y="245" width="340" height="40" rx="6" fill="#eaf7ee" stroke="#2e8b57"/>
  <text x="572" y="270" font-size="13" fill="#1d5e3a">&lt;p id="t3"&gt;第三章正文……&lt;/p&gt;</text>

  <!-- 箭头 -->
  <path d="M400,117 C455,117 455,290 402,290" fill="none" stroke="#2e8b57" stroke-width="2" marker-end="url(#ok)"/>
  <text x="462" y="200" font-size="13" fill="#2e8b57" font-weight="bold">✔ 会跳</text>
  <path d="M400,167 C440,167 440,345 402,345" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#no)"/>
  <text x="440" y="330" font-size="13" fill="#c0392b" font-weight="bold">✘ 不跳</text>
  <path d="M400,217 C480,217 480,265 558,265" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#no)"/>
  <text x="478" y="292" font-size="13" fill="#c0392b" font-weight="bold">✘ 不跳</text>

  <!-- 说明 -->
  <rect x="40" y="405" width="880" height="100" rx="10" fill="#fafafa" stroke="#ccc"/>
  <text x="60" y="430" font-size="13.5" fill="#1d5e3a">✔ 同一文件 + 目标是有内容的元素（p / div / h2）：正文链接能跳，xochitl 把它登记进"跳转目标表"。</text>
  <text x="60" y="453" font-size="13.5" fill="#8e2a20">✘ 目标是空元素 &lt;a id&gt;&lt;/a&gt;：不登记，点了没反应。　✘ 跨文件（不管带不带 #）：被当成外部网址。</text>
  <text x="60" y="476" font-size="13.5" fill="#333">目录（nav）是另一套机制：同文件锚点、空元素都能精确定位到页——所以"目录能跳"不代表"正文链接能跳"。</text>
  <text x="60" y="497" font-size="12.5" fill="#777">核对方法：正文链接看 xochitl 预览 PDF 的跳转目标表（/Dests 名字树）；目录看 .epubindex。</text>
</svg>
