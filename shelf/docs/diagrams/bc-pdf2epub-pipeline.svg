<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1080" height="700" fill="#fbfbfa"/>
  <text x="540" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">有文字层 PDF → EPUB：五步管线（optimize_pdf_to_epub）</text>
  <text x="540" y="50" text-anchor="middle" font-size="12" fill="#4a4a4a">每一步下面的小字＝它要防住的真机问题（2026-09-23《移动互联软件安装使用手册》《2026-09-19 T.E.双语》）</text>

  <!-- stage boxes -->
  <g font-size="12">
    <rect x="20" y="66" width="192" height="64" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="116" y="92" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a1a">① 逐字提取</text>
    <text x="116" y="112" text-anchor="middle" fill="#3a3a3a">pdf-extract-cj（fork）</text>

    <rect x="232" y="66" width="192" height="64" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="328" y="92" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a1a">② 逐页排版</text>
    <text x="328" y="112" text-anchor="middle" fill="#3a3a3a">段落 / 颜色 / 图片 / 链接</text>

    <rect x="444" y="66" width="192" height="64" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="540" y="92" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a1a">③ 切章</text>
    <text x="540" y="112" text-anchor="middle" fill="#3a3a3a">partition_chapters</text>

    <rect x="656" y="66" width="192" height="64" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="752" y="92" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a1a">④ 组装</text>
    <text x="752" y="112" text-anchor="middle" fill="#3a3a3a">单文件 / 多文件 + Book.nav</text>

    <rect x="868" y="66" width="192" height="64" rx="8" fill="#e8f3e8" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="964" y="92" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a1a">⑤ 质量门 + 落地</text>
    <text x="964" y="112" text-anchor="middle" fill="#3a3a3a">check_epub_file</text>
  </g>
  <g stroke="#555" stroke-width="1.5">
    <line x1="212" y1="98" x2="230" y2="98" marker-end="url(#pp-a)"/>
    <line x1="424" y1="98" x2="442" y2="98" marker-end="url(#pp-a)"/>
    <line x1="636" y1="98" x2="654" y2="98" marker-end="url(#pp-a)"/>
    <line x1="848" y1="98" x2="866" y2="98" marker-end="url(#pp-a)"/>
  </g>

  <!-- problem notes -->
  <g font-size="11" fill="#3a3a3a">
    <rect x="20" y="140" width="192" height="158" rx="6" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="30" y="160">· 补全 g/rg/k 颜色算子，</text>
    <text x="38" y="176">把填充色传出来</text>
    <text x="30" y="196">· 图片 Do 不再当表单递归，</text>
    <text x="38" y="212">报告位置（output_image）</text>
    <text x="30" y="232">· CID 字宽区间解析修正</text>
    <text x="38" y="248">（中文字宽曾全为 0）</text>
    <text x="30" y="268">· 字号/字宽换算到设备空间</text>
    <text x="38" y="284">（calibre PDF 带 0.742 缩放）</text>

    <rect x="232" y="140" width="192" height="158" rx="6" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="242" y="160">· 基线没变不补空格</text>
    <text x="250" y="176">（曾 "C a n  t h e" ×约 500 处）</text>
    <text x="242" y="196">· 换段三线索：大行距 /</text>
    <text x="250" y="212">短行 / 字号变化；跨页续段</text>
    <text x="242" y="232">· 图片按视觉位置落位、</text>
    <text x="250" y="248">同行并排、按栏宽比例定宽</text>
    <text x="242" y="268">· 颜色 .cj-cN、宽度 .cj-wN</text>
    <text x="250" y="284">（xochitl 不认内联 style）</text>

    <rect x="444" y="140" width="192" height="158" rx="6" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="454" y="160">· 每页只进一章、一页不丢</text>
    <text x="454" y="180">· 回指书签当分组标题</text>
    <text x="462" y="196">（T.E. 曾重复十倍：</text>
    <text x="462" y="212">604 万字 vs 原书 50 万）</text>
    <text x="454" y="232">· 首个书签前的页并入第一章</text>
    <text x="462" y="248">（封面、目录页不再丢）</text>
    <text x="454" y="268">· 标题段落原地升 &lt;h2&gt;，</text>
    <text x="462" y="284">不加原书没有的字</text>

    <rect x="656" y="140" width="192" height="158" rx="6" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="666" y="160">· 有跨章书内跳转 →</text>
    <text x="674" y="176">合成单文件，目录指锚点</text>
    <text x="666" y="196">· 跳转目标挂非空段落</text>
    <text x="674" y="212">（空 &lt;a id&gt; xochitl 不登记）</text>
    <text x="666" y="232">· 分组标题只进目录，</text>
    <text x="674" y="248">不生成空白章</text>
    <text x="666" y="268">· PDF 标题按 UTF-16BE/UTF-8/</text>
    <text x="674" y="284">PDFDoc 解码（曾出 \0）</text>

    <rect x="868" y="140" width="192" height="158" rx="6" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="878" y="160">· 资源引用命中率 ≥ 80%</text>
    <text x="886" y="176">（图片 ../ 路径曾全错）</text>
    <text x="878" y="196">· OPF 必须是合法 XML</text>
    <text x="886" y="212">（非法 → 整本只 1 页）</text>
    <text x="878" y="232">· 不过门：原 PDF 不动</text>
    <text x="878" y="252">· 过门：写 &lt;stem&gt;.epub，</text>
    <text x="886" y="268">删原 .pdf</text>
  </g>

  <!-- panel A: visual placement -->
  <rect x="20" y="318" width="512" height="366" rx="8" fill="#ffffff" stroke="#9aa9bf" stroke-width="1.2"/>
  <text x="276" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">示意一：图片按"视觉位置"落位，不按绘制顺序</text>
  <text x="276" y="360" text-anchor="middle" font-size="11" fill="#4a4a4a">Word 导出的 PDF：先画完整页文字，最后才画图片</text>
  <!-- page mock -->
  <rect x="40" y="374" width="200" height="290" fill="#f7f7f5" stroke="#888"/>
  <g font-size="10.5" fill="#1a1a1a">
    <rect x="52" y="386" width="176" height="14" fill="#dfe7f1"/><text x="56" y="397">1、扫描如下二维码下载：  ①</text>
    <rect x="60" y="410" width="72" height="72" fill="#c9d6e8" stroke="#4a6fa5"/><text x="66" y="450">二维码 ④</text>
    <rect x="144" y="410" width="72" height="72" fill="#c9d6e8" stroke="#4a6fa5"/><text x="150" y="450">二维码 ⑤</text>
    <rect x="52" y="494" width="176" height="14" fill="#f6d9d9"/><text x="56" y="505">注意：原有客户端需删除  ②</text>
    <rect x="52" y="520" width="176" height="14" fill="#dfe7f1"/><text x="56" y="531">2、浏览器中输入网址：  ③</text>
    <rect x="60" y="546" width="160" height="40" fill="#c9d6e8" stroke="#4a6fa5"/><text x="96" y="570">横幅图 ⑥</text>
  </g>
  <text x="140" y="680" text-anchor="middle" font-size="10.5" fill="#4a4a4a">圈号＝PDF 里的绘制顺序</text>
  <!-- results -->
  <g font-size="11">
    <text x="258" y="392" font-weight="bold" fill="#b23a3a">✗ 按绘制顺序（旧）</text>
    <text x="258" y="410" fill="#3a3a3a">① 扫描二维码… ② 注意… ③ 网址…</text>
    <text x="258" y="426" fill="#3a3a3a">④ ⑤ ⑥ 三张图全堆在页尾</text>
    <text x="258" y="442" fill="#3a3a3a">（第 4 页的图还插进句子中间）</text>

    <text x="258" y="480" font-weight="bold" fill="#2e7d32">✓ 按视觉位置（现行）</text>
    <text x="258" y="498" fill="#3a3a3a">① 扫描二维码…</text>
    <text x="258" y="514" fill="#3a3a3a">④ ⑤ 并排（上沿相差 &lt; 8pt）</text>
    <text x="258" y="530" fill="#3a3a3a">② 注意…  ③ 网址…</text>
    <text x="258" y="546" fill="#3a3a3a">⑥ 横幅</text>
    <text x="258" y="578" fill="#4a4a4a">规则：图插在"它上沿以上最近一行文字"</text>
    <text x="258" y="594" fill="#4a4a4a">之后（image_visual_pos）；宽度＝图宽 ÷</text>
    <text x="258" y="610" fill="#4a4a4a">正文栏宽，取 5% 一档：二维码 45%/50%、</text>
    <text x="258" y="626" fill="#4a4a4a">横幅 100%、手机截图 35–45%</text>
  </g>

  <!-- panel B: chapter partition -->
  <rect x="548" y="318" width="512" height="366" rx="8" fill="#ffffff" stroke="#9aa9bf" stroke-width="1.2"/>
  <text x="804" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">示意二：回指书签不再让内容重复</text>
  <text x="804" y="360" text-anchor="middle" font-size="11" fill="#4a4a4a">《T.E.双语》：一级栏目书签全指向第 2 页（书内目录页）</text>
  <g font-size="11" fill="#1a1a1a">
    <text x="566" y="388" font-weight="bold">书签（顺序）</text>
    <text x="566" y="408">The world this week → 第 2 页</text>
    <text x="582" y="426" fill="#3a3a3a">Politics → 第 5 页</text>
    <text x="582" y="444" fill="#3a3a3a">Cartoon → 第 19 页</text>
    <text x="566" y="462" fill="#b23a3a">Leaders → 第 2 页（往回指）</text>
    <text x="582" y="480" fill="#3a3a3a">Can the AI arms race… → 第 22 页</text>

    <text x="810" y="388" font-weight="bold">切出的页范围</text>
    <text x="810" y="408">第 1–4 页（含封面、目录页）</text>
    <text x="810" y="426" fill="#3a3a3a">第 5–12 页（Business 13–18 略）</text>
    <text x="810" y="444" fill="#3a3a3a">第 19–21 页</text>
    <text x="810" y="462" fill="#2e7d32">空（只进目录，指向下一篇）</text>
    <text x="810" y="480" fill="#3a3a3a">第 22–29 页</text>
  </g>
  <g stroke="#999" stroke-width="1" stroke-dasharray="3,3">
    <line x1="770" y1="404" x2="804" y2="404"/>
    <line x1="770" y1="422" x2="804" y2="422"/>
    <line x1="770" y1="440" x2="804" y2="440"/>
    <line x1="770" y1="458" x2="804" y2="458"/>
    <line x1="770" y1="476" x2="804" y2="476"/>
  </g>
  <g font-size="11" fill="#3a3a3a">
    <text x="566" y="518" font-weight="bold" fill="#b23a3a">旧：每条取"本条页到下一条页"</text>
    <text x="566" y="536">Leaders 从第 2 页取到第 21 页 → 把前面整个</text>
    <text x="566" y="552">栏目又复制一遍；全书 604 万字（原书 50 万）、</text>
    <text x="566" y="568">图片引用 1208 处（实际 129 张），渲染预估 4978 页</text>
    <text x="566" y="600" font-weight="bold" fill="#2e7d32">新：每页只归一章（partition_chapters）</text>
    <text x="566" y="618">往回指的条目起点顺延到下一个正常条目；多条同页，</text>
    <text x="566" y="634">内容归最后一条；首个书签之前的页并入第一章</text>
    <text x="566" y="656">结果：50.8 万字、130 处图片引用，xochitl 渲染 600+ 页</text>
  </g>
</svg>
