<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="shinbo-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="shinbo-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="shinbo-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">scp 往 inbox 传一本大书：什么时候才入库</text>
<text x="600.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">scp 直接写最终文件名；book-serve 只收「修改时间静止 ≥ 5 秒」的文件，还在写的先跳过，写完那次事件再收（2026-09-25 起）</text>
<path d="M40.0,150.0 L1160.0,150.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shinbo-a)"/>
<text x="1160.0" y="140.0" font-size="11" fill="#6B7280" text-anchor="end">时间</text>
<rect x="40" y="100" width="560" height="36" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="52.0" y="120.0" font-size="12" fill="#1F2937" text-anchor="start">scp 正在写：WiFi 传大书可以好几分钟，修改时间一直在变</text>
<path d="M60,140 L60,172" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="40" y="176" width="250" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="52.0" y="196.0" font-size="11.5" fill="#1F2937" text-anchor="start">CREATE 事件</text>
<text x="52.0" y="212.5" font-size="11.5" fill="#1F2937" text-anchor="start">开始 8 秒防抖</text>
<path d="M320,140 L320,172" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="300" y="176" width="250" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="312.0" y="196.0" font-size="11.5" fill="#1F2937" text-anchor="start">防抖到期 → 追平一轮</text>
<text x="312.0" y="212.5" font-size="11.5" fill="#1F2937" text-anchor="start">修改时间离现在 &lt; 5 秒 → 跳过（暂缓）</text>
<path d="M590,140 L590,172" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="570" y="176" width="250" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="582.0" y="196.0" font-size="11.5" fill="#1F2937" text-anchor="start">写完：CLOSE_WRITE</text>
<text x="582.0" y="212.5" font-size="11.5" fill="#1F2937" text-anchor="start">再防抖 8 秒</text>
<path d="M870,140 L870,172" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="850" y="176" width="250" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="862.0" y="196.0" font-size="11.5" fill="#1F2937" text-anchor="start">追平一轮</text>
<text x="862.0" y="212.5" font-size="11.5" fill="#1F2937" text-anchor="start">静止 ≥ 5 秒 → 挪进 .work/ → 入母版库</text>
<rect x="40" y="262" width="540" height="112" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="52.0" y="282.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">2026-09-25 之前（真 bug）</text>
<text x="52.0" y="301.0" font-size="11.5" fill="#1F2937" text-anchor="start">防抖到期就把文件挪走、改名进母版库；</text>
<text x="52.0" y="317.5" font-size="11.5" fill="#1F2937" text-anchor="start">scp 手里的文件句柄跟着 inode 继续往里写</text>
<text x="52.0" y="334.0" font-size="11.5" fill="#1F2937" text-anchor="start">→ 母版库里出现一本「半截书」，还能被加入 xochitl</text>
<text x="52.0" y="350.5" font-size="11.5" fill="#1F2937" text-anchor="start">CREATE 之后 8 秒内写不完的书都会中招</text>
<rect x="620" y="262" width="540" height="112" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="632.0" y="282.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">现在</text>
<text x="632.0" y="301.0" font-size="11.5" fill="#1F2937" text-anchor="start">每轮追平逐个看修改时间：离现在不足 5 秒的跳过</text>
<text x="632.0" y="317.5" font-size="11.5" fill="#1F2937" text-anchor="start">5 秒 &lt; 8 秒防抖：写完那次事件触发的一轮不会再被暂缓</text>
<text x="632.0" y="334.0" font-size="11.5" fill="#1F2937" text-anchor="start">启动时先起监听、再扫启动前就在的文件；遇到暂缓的</text>
<text x="632.0" y="350.5" font-size="11.5" fill="#1F2937" text-anchor="start">隔 5 秒重扫，最多 12 轮（约 1 分钟），之后交给事件</text>
<text x="40.0" y="404.0" font-size="11.5" fill="#6B7280" text-anchor="start">已知边界：只判「还在不在写」、不校验内容完整——scp 中途断开留下的半截文件，静止 5 秒后同样会被收进母版库。</text>
<text x="40.0" y="424.0" font-size="11.5" fill="#6B7280" text-anchor="start">网页上传不走这条路（先落 .work/ 下随机名的 .part，收完才挑名、改名），不受影响。09-25 已部署；这个场景没在真机专门触发过。</text>
</svg>
