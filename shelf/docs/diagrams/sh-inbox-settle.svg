<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="ib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="1100" height="470" fill="#fbfbfa"/>
<text x="550.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">scp 往 inbox 传一本大书：什么时候才入库（book-serve，2026-09-25 第四轮审计）</text>
<text x="550.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">scp 直接写最终文件名；追平时只收“修改时间静止 ≥ 5 秒”的文件，还在写的先跳过，写完那次事件再收（09-25 已部署，真机未专门触发）</text>
<line x1="80" y1="130" x2="1040" y2="130" stroke="#555" stroke-width="1.6" marker-end="url(#ib)"/>
<text x="1030" y="118" text-anchor="end" font-size="11" fill="#6a6a6a">时间</text>
<rect x="100" y="96" width="620" height="20" rx="4" fill="#dbe6f3" stroke="#4a6fa5"/>
<text x="410" y="111" text-anchor="middle" font-size="11.5" fill="#1a1a1a">scp 正在写（WiFi 传大书可以好几分钟，修改时间一直在变）</text>
<line x1="100" y1="124" x2="100" y2="136" stroke="#555" stroke-width="2"/>
<text x="100" y="156" text-anchor="start" font-size="12" fill="#1a1a1a" font-weight="bold">CREATE 事件</text>
<text x="100" y="174" text-anchor="start" font-size="11" fill="#3a3a3a">开始防抖 8 秒</text>
<line x1="260" y1="124" x2="260" y2="136" stroke="#555" stroke-width="2"/>
<text x="260" y="156" text-anchor="start" font-size="12" fill="#b0451f" font-weight="bold">防抖到期 → 追平一轮</text>
<text x="260" y="174" text-anchor="start" font-size="11" fill="#3a3a3a">文件还在写：修改时间离现在 &lt;5 秒 → 跳过</text>
<line x1="720" y1="124" x2="720" y2="136" stroke="#555" stroke-width="2"/>
<text x="720" y="156" text-anchor="start" font-size="12" fill="#1a1a1a" font-weight="bold">写完：CLOSE_WRITE 事件</text>
<text x="720" y="174" text-anchor="start" font-size="11" fill="#3a3a3a">再防抖 8 秒</text>
<line x1="960" y1="124" x2="960" y2="136" stroke="#555" stroke-width="2"/>
<text x="960" y="156" text-anchor="middle" font-size="12" fill="#2f7d45" font-weight="bold">追平一轮</text>
<text x="960" y="174" text-anchor="middle" font-size="11" fill="#3a3a3a">静止已 ≥5 秒 → 挪进 .work/ → 入母版库</text>
<path d="M100,186 v6 h160 v-6" fill="none" stroke="#999"/>
<text x="180" y="206" text-anchor="middle" font-size="10.5" fill="#6a6a6a">8 秒防抖</text>
<rect x="40" y="240" width="500" height="150" rx="10" fill="#fbeee8" stroke="#b0451f" stroke-width="1.6"/>
<text x="54" y="262" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="bold">09-25 之前（真 bug）</text>
<text x="54" y="284" text-anchor="start" font-size="11.5" fill="#3a3a3a">防抖到期就把文件挪走、改名进母版库</text>
<text x="54" y="301" text-anchor="start" font-size="11.5" fill="#3a3a3a">scp 手里的文件句柄跟着 inode 继续往里写</text>
<text x="54" y="318" text-anchor="start" font-size="11.5" fill="#3a3a3a">→ 母版库里出现一本“半截书”：列表按半截内容缓存，</text>
<text x="54" y="335" text-anchor="start" font-size="11.5" fill="#3a3a3a">   可以被优化、加入阅读器</text>
<text x="54" y="352" text-anchor="start" font-size="11.5" fill="#3a3a3a">CREATE 之后 8 秒内写不完的书都会中招</text>
<rect x="560" y="240" width="500" height="150" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="574" y="262" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="bold">现在</text>
<text x="574" y="284" text-anchor="start" font-size="11.5" fill="#3a3a3a">每轮追平逐个看修改时间：离现在不足 5 秒的跳过（计数“暂缓”）</text>
<text x="574" y="301" text-anchor="start" font-size="11.5" fill="#3a3a3a">5 秒 &lt; 8 秒防抖：写完那次事件触发的一轮不会再被暂缓</text>
<text x="574" y="318" text-anchor="start" font-size="11.5" fill="#3a3a3a">启动时先起监听、再扫启动前就在的文件；扫描遇到暂缓的，</text>
<text x="574" y="335" text-anchor="start" font-size="11.5" fill="#3a3a3a">   隔 5 秒重扫，最多 12 轮（约 1 分钟），之后交给事件</text>
<text x="574" y="352" text-anchor="start" font-size="11.5" fill="#3a3a3a">判据只看“还在不在写”，不校验内容是否完整（见下）</text>
<text x="40" y="420" text-anchor="start" font-size="11.5" fill="#6a6a6a">已知边界：scp 中途断开时，文件停止变化 5 秒后同样可能被当成完整的书收进母版库——判据只看“还在不在写”，不校验内容完整。</text>
<text x="40" y="440" text-anchor="start" font-size="11.5" fill="#6a6a6a">网页上传不走这条路（先落 .work/ 下的随机名 .part，收完才改名），不受影响。</text>
</svg>
