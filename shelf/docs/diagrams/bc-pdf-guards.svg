<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="pg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="pg-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker></defs>
<rect width="1100" height="600" fill="#ffffff"/>
<text x="550" y="32" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">坏 PDF 的几道闸：只让这一本失败，不让 book-serve 倒下</text>
<text x="550" y="56" font-size="12.5" fill="#6b7280" text-anchor="middle">上传的 PDF 是任意文件；每道闸超限就返回错误或降级，原书不动（2026-09-24 / 09-30 两轮审计，只在开发机测过）</text>

<rect x="30" y="92" width="150" height="70" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="105" y="122" font-size="14" fill="#1f3b66" text-anchor="middle" font-weight="bold">上传的 PDF</text>
<text x="105" y="143" font-size="11.5" fill="#374151" text-anchor="middle">可能损坏或恶意</text>
<line x1="180" y1="127" x2="208" y2="127" stroke="#555" stroke-width="1.5" marker-end="url(#pg-a)"/>

<!-- gate 1 -->
<rect x="210" y="80" width="200" height="94" rx="10" fill="#e8f5ec" stroke="#2f7d45" stroke-width="1.5"/>
<text x="310" y="102" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">① 加载解析</text>
<text x="310" y="124" font-size="11.5" fill="#374151" text-anchor="middle">单条流解压 ≤ 64MB</text>
<text x="310" y="142" font-size="10.5" fill="#6b7280" text-anchor="middle">MAX_LOAD_STREAM_BYTES</text>
<text x="310" y="160" font-size="10.5" fill="#6b7280" text-anchor="middle">09-24</text>
<line x1="410" y1="127" x2="428" y2="127" stroke="#555" stroke-width="1.5" marker-end="url(#pg-a)"/>

<!-- gate 2 -->
<rect x="430" y="80" width="200" height="94" rx="10" fill="#e8f5ec" stroke="#2f7d45" stroke-width="1.5"/>
<text x="530" y="102" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">② 走页树</text>
<text x="530" y="124" font-size="11.5" fill="#374151" text-anchor="middle">沿 /Parent 找继承属性</text>
<text x="530" y="142" font-size="11.5" fill="#374151" text-anchor="middle">最多 64 层（成环也停）</text>
<text x="530" y="160" font-size="10.5" fill="#6b7280" text-anchor="middle">09-30：此前递归到栈溢出</text>
<line x1="630" y1="127" x2="648" y2="127" stroke="#555" stroke-width="1.5" marker-end="url(#pg-a)"/>

<!-- gate 3 -->
<rect x="650" y="80" width="200" height="94" rx="10" fill="#e8f5ec" stroke="#2f7d45" stroke-width="1.5"/>
<text x="750" y="102" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">③ 读页内容</text>
<text x="750" y="124" font-size="11.5" fill="#374151" text-anchor="middle">页内容 + 嵌套流合计 ≤ 64MB</text>
<text x="750" y="142" font-size="11.5" fill="#374151" text-anchor="middle">表单嵌套 ≤ 16 层</text>
<text x="750" y="160" font-size="10.5" fill="#6b7280" text-anchor="middle">pdf-extract-cj · 09-24 / 09-30</text>
<line x1="850" y1="127" x2="868" y2="127" stroke="#555" stroke-width="1.5" marker-end="url(#pg-a)"/>

<!-- gate 4 -->
<rect x="870" y="80" width="200" height="94" rx="10" fill="#e8f5ec" stroke="#2f7d45" stroke-width="1.5"/>
<text x="970" y="102" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">④ 解图片</text>
<text x="970" y="124" font-size="11.5" fill="#374151" text-anchor="middle">Flate 图 ≤ 声明宽×高×3</text>
<text x="970" y="142" font-size="11.5" fill="#374151" text-anchor="middle">ICC 按字节数认通道数</text>
<text x="970" y="160" font-size="10.5" fill="#6b7280" text-anchor="middle">09-30</text>

<!-- fail arrows -->
<line x1="310" y1="174" x2="310" y2="232" stroke="#b0451f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pg-r)"/>
<line x1="530" y1="174" x2="530" y2="232" stroke="#b0451f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pg-r)"/>
<line x1="750" y1="174" x2="750" y2="232" stroke="#b0451f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pg-r)"/>
<line x1="970" y1="174" x2="970" y2="232" stroke="#b0451f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pg-r)"/>
<text x="1040" y="206" font-size="11" fill="#b0451f" text-anchor="middle">超限</text>

<rect x="210" y="234" width="860" height="56" rx="10" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.5"/>
<text x="640" y="257" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="bold">返回错误：这一本优化失败，回执说明原因；母版库里的原书一字不动</text>
<text x="640" y="278" font-size="11.5" fill="#374151" text-anchor="middle">book-serve 进程照常服务其它请求</text>

<!-- panic path -->
<rect x="210" y="316" width="420" height="96" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
<text x="420" y="339" font-size="13" fill="#7a4d00" text-anchor="middle" font-weight="bold">⑤ 抽字时第三方代码 panic</text>
<text x="420" y="361" font-size="11.5" fill="#374151" text-anchor="middle">catch_unwind 接住 → 分类按“判不准”处理</text>
<text x="420" y="380" font-size="11.5" fill="#374151" text-anchor="middle">当成无文字层：只裁边、不转 EPUB（09-30）</text>
<text x="420" y="399" font-size="10.5" fill="#6b7280" text-anchor="middle">此前整次优化报错</text>

<!-- big file path -->
<rect x="650" y="316" width="420" height="96" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="860" y="339" font-size="13" fill="#1f3b66" text-anchor="middle" font-weight="bold">另一条路：大文件通道读页数（PdfFileReader）</text>
<text x="860" y="361" font-size="11.5" fill="#374151" text-anchor="middle">页数必须来自 /Type /Pages 字典</text>
<text x="860" y="380" font-size="11.5" fill="#374151" text-anchor="middle">字典对象最多读 4MB（MAX_DICT_OBJ_BYTES）</text>
<text x="860" y="399" font-size="10.5" fill="#6b7280" text-anchor="middle">09-30：此前对象 2 是 /Outlines 时把书签数当页数</text>

<!-- why -->
<rect x="30" y="440" width="1040" height="130" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="550" y="464" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">为什么必须“事先设上限”，而不是出事后再兜</text>
<text x="550" y="490" font-size="12" fill="#374151" text-anchor="middle">release 是 panic=unwind，普通 panic 能被 catch_unwind 接住，只坏一本书；</text>
<text x="550" y="512" font-size="12" fill="#374151" text-anchor="middle">但<tspan font-weight="bold">栈溢出（SIGSEGV）和内存分配失败（abort）都不是 panic</tspan>，接不住——整个 book-serve 进程直接倒，</text>
<text x="550" y="534" font-size="12" fill="#374151" text-anchor="middle">所有在途的优化、落库一起中断。所以递归要改成有上限的循环，按文件里的数字分配内存前要先封顶。</text>
<text x="550" y="556" font-size="11" fill="#6b7280" text-anchor="middle">没改（记录）：带交叉引用流的现代 PDF 走不了大文件通道；hayro 2 倍渲染公式页无像素上限；裁边整本输出仍在内存里攒</text>
</svg>
