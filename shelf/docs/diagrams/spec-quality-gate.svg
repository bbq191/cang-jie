<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">质量门：新书先写临时文件，体检通过才替换原书</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">book-serve 在 produce_then_replace 里调 check::check_epub_file；只读书的骨架，不读图片字节</text>

  <!-- 三个来源 -->
  <rect x="30" y="90" width="210" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="135" y="118" text-anchor="middle" font-size="14" fill="#312e81">EPUB 优化</text>
  <rect x="30" y="148" width="210" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="135" y="176" text-anchor="middle" font-size="14" fill="#312e81">PDF 转 EPUB</text>
  <rect x="30" y="206" width="210" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="135" y="234" text-anchor="middle" font-size="14" fill="#312e81">只改阅读方向（改 OPF）</text>

  <line x1="240" y1="113" x2="290" y2="160" stroke="#64748b" stroke-width="1.5"/>
  <line x1="240" y1="171" x2="290" y2="171" stroke="#64748b" stroke-width="1.5"/>
  <line x1="240" y1="229" x2="290" y2="182" stroke="#64748b" stroke-width="1.5"/>
  <line x1="290" y1="171" x2="318" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 临时文件 -->
  <rect x="320" y="140" width="200" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="420" y="166" text-anchor="middle" font-size="14" fill="#334155">写到隐藏临时文件</text>
  <text x="420" y="188" text-anchor="middle" font-size="12" fill="#64748b">.&lt;书名&gt;.optimizing.tmp</text>
  <line x1="520" y1="171" x2="566" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 判定 -->
  <polygon points="670,121 772,171 670,221 568,171" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="670" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">过门？</text>
  <text x="670" y="186" text-anchor="middle" font-size="12" fill="#713f12">五条拦截规则</text>

  <line x1="772" y1="171" x2="818" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="768" y="138" font-size="13" fill="#15803d">过</text>
  <line x1="772" y1="171" x2="818" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="752" y="214" font-size="13" fill="#b91c1c">不过</text>

  <rect x="820" y="82" width="160" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="900" y="110" text-anchor="middle" font-size="14" fill="#14532d">改名覆盖原书</text>
  <text x="900" y="132" text-anchor="middle" font-size="12" fill="#166534">提醒项写进回执</text>
  <rect x="820" y="190" width="160" height="70" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="900" y="218" text-anchor="middle" font-size="14" fill="#7f1d1d">删掉临时文件</text>
  <text x="900" y="240" text-anchor="middle" font-size="12" fill="#991b1b">原书一个字节不动</text>

  <!-- 规则表 -->
  <rect x="30" y="286" width="460" height="244" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="260" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">拦截（任何一条都不替换）</text>
  <text x="50" y="344" font-size="13.5" fill="#7f1d1d">1  正文被加密（真 DRM）——两个阅读器都打不开</text>
  <text x="50" y="372" font-size="13.5" fill="#7f1d1d">2  目录链接命中率 &lt; 80%——目录大面积失效</text>
  <text x="50" y="400" font-size="13.5" fill="#7f1d1d">3  同一标签两个 id——xochitl 整章不显示</text>
  <text x="50" y="428" font-size="13.5" fill="#7f1d1d">4  图片/样式引用命中率 &lt; 80%——图不显示</text>
  <text x="50" y="456" font-size="13.5" fill="#7f1d1d">5  OPF 不是合法 XML——整本只渲染 1 页</text>
  <text x="50" y="494" font-size="12.5" fill="#991b1b">4、5 两条来自 2026-09-23 的真机事故（手册二维码、T.E.）</text>

  <rect x="510" y="286" width="460" height="244" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="740" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">只提醒（照常替换）</text>
  <text x="530" y="344" font-size="13.5" fill="#78350f">·  某一章不是合法 XML（原书本来如此）</text>
  <text x="530" y="372" font-size="13.5" fill="#78350f">·  没有目录</text>
  <text x="530" y="400" font-size="13.5" fill="#78350f">·  目录锚点丢失（退化成跳到文件开头）</text>
  <text x="530" y="428" font-size="13.5" fill="#78350f">·  只混淆了字体（伪 DRM，不影响阅读）</text>
  <text x="530" y="466" font-size="12.5" fill="#92400e">不适用："PDF 仅裁边"产物仍是 PDF，不过这道门；</text>
  <text x="530" y="488" font-size="12.5" fill="#92400e">它只处理零文字、每页恰一张整页图的 PDF，否则拒绝。</text>
  <text x="530" y="510" font-size="12.5" fill="#92400e">落库后另有"渲染自检"兜底页数不对的书。</text>
</svg>
