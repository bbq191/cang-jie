  <rect x="24" y="424" width="320" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="40" y="448" font-size="13" fill="#1f2937">路径、注册、上传、投 xochitl 的底层？</text>
  <text x="40" y="468" font-size="12" fill="#6b7280">书架、笔记、增强、网关共用的 Web 服务底座</text>
  <line x1="346" y1="452" x2="540" y2="452" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="546" y="424" width="410" height="56" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="562" y="448" font-size="14" font-weight="bold" fill="#1e293b">../rmsvc-core/README.md</text>
  <text x="562" y="468" font-size="12.5" fill="#334155">rmsvc-core：模块速查 + 基座白皮书入口</text>
  <text x="490" y="514" text-anchor="middle" font-size="12.5" fill="#6b7280">全项目入门看仓库根 docs/OVERVIEW.md；网关自身（转发、批量队列）看 gateway/docs/；用户可见的更新看 docs/CHANGELOG.md</text>
  <text x="490" y="534" text-anchor="middle" font-size="12" fill="#9ca3af">已经移除的能力（设备端优化、KOReader、电脑端命令行等）统一列在书架白皮书附录 B</text>
