<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">书架文档地图：带着问题找文档</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#6b7280">同一件事只在一处写全，其它文档只放一句话 + 链接</text>

  <!-- questions column -->
  <g font-size="13" fill="#1f2937">
    <rect x="24" y="84" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="40" y="108">第一次用：怎么装、怎么传书？</text>
    <text x="40" y="128" fill="#6b7280">入门、目录、端口、路径</text>

    <rect x="24" y="152" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="40" y="176">现在的系统长什么样？</text>
    <text x="40" y="196" fill="#6b7280">模块怎么拼、数据怎么流</text>

    <rect x="24" y="220" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="40" y="244">改书时能不能这样改？</text>
    <text x="40" y="264" fill="#6b7280">EPUB 优化 / PDF 转 EPUB 的现行规则</text>

    <rect x="24" y="288" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="40" y="312">优化引擎内部怎么实现？</text>
    <text x="40" y="332" fill="#6b7280">清洗/脚注/图片/内存的实现与踩坑</text>

    <rect x="24" y="356" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="40" y="380">当初为什么这么定？真机怎么验的？</text>
    <text x="40" y="400" fill="#6b7280">决策、事故、被推翻的旧结论</text>
  </g>

  <!-- arrows -->
  <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="326" y1="112" x2="560" y2="112"/>
    <line x1="326" y1="180" x2="560" y2="180"/>
    <line x1="326" y1="248" x2="560" y2="248"/>
    <line x1="326" y1="316" x2="560" y2="316"/>
    <line x1="326" y1="384" x2="560" y2="384"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- docs column -->
  <g font-size="14">
    <rect x="566" y="84" width="390" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="584" y="108" font-weight="bold" fill="#075985">shelf/README.md</text>
    <text x="584" y="128" font-size="12.5" fill="#0c4a6e">入门 · 目录 · 部署 · 文档索引</text>

    <rect x="566" y="152" width="390" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="584" y="176" font-weight="bold" fill="#166534">传书EPUB线架构.md</text>
    <text x="584" y="196" font-size="12.5" fill="#14532d">当前状态参考（非时间顺序）</text>

    <rect x="566" y="220" width="390" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="584" y="244" font-weight="bold" fill="#92400e">EPUB优化规范白皮书.md</text>
    <text x="584" y="264" font-size="12.5" fill="#78350f">规则的权威出处：xochitl 实测规则 + 两条线的规范</text>

    <rect x="566" y="288" width="390" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="584" y="312" font-weight="bold" fill="#5b21b6">bookconv优化白皮书.md</text>
    <text x="584" y="332" font-size="12.5" fill="#4c1d95">引擎逐模块细节、版本演进、踩坑时间线</text>

    <rect x="566" y="356" width="390" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="584" y="380" font-weight="bold" fill="#991b1b">reMarkable书架白皮书.md（本文）</text>
    <text x="584" y="400" font-size="12.5" fill="#7f1d1d">决策依据与真机记录，§ 编号是稳定锚点</text>
  </g>

  <text x="490" y="448" text-anchor="middle" font-size="12.5" fill="#6b7280">全项目入门看仓库根 docs/OVERVIEW.md；网关自身设计看 gateway/docs/；用户可见的更新看 docs/CHANGELOG.md</text>
</svg>
