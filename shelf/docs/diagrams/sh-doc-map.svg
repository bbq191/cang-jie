<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">书架文档地图：带着问题找文档</text>
