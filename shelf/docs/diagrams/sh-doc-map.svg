  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9ca3af"/></marker></defs>
  <rect x="24" y="84" width="320" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
