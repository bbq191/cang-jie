  <text x="40" y="196" font-size="12" fill="#6b7280">数据流、状态机、落库通道、API、配置</text>
  <line x1="346" y1="180" x2="540" y2="180" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="546" y="152" width="410" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="562" y="176" font-size="14" font-weight="bold" fill="#166534">docs/传书EPUB线架构.md（传书线架构）</text>
  <text x="562" y="196" font-size="12.5" fill="#14532d">数据流与服务分工（现状参考 + 全部 API）</text>
  <rect x="24" y="220" width="320" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
