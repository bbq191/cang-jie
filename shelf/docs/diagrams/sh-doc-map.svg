  <text x="40" y="264" font-size="12" fill="#6b7280">排版、注释、漫画、xochitl 阅读器踩坑</text>
  <line x1="346" y1="248" x2="540" y2="248" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="546" y="220" width="410" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="562" y="244" font-size="14" font-weight="bold" fill="#92400e">sheng-ren 仓库 docs/（不在本仓库）</text>
  <text x="562" y="264" font-size="12.5" fill="#78350f">typesetting.md 排版规则 · xochitl.md 阅读器踩坑</text>
