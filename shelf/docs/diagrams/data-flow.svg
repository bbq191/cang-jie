<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="sans-serif">
<defs><marker id="sd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="sd-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="sd-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1080" height="470" fill="#fbfbfa"/>
<text x="540.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">shelf 读书线数据流：三层 · 三动作正交</text>
<text x="540.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">统一规则：所有书只落母版库——网页、inbox 都没有直投读器的路径；入库是入库，优化是优化，落库是落库</text>
<rect x="30" y="84" width="230" height="250" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="145.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">内容源（入库）</text>
<rect x="46" y="124" width="198" height="54" rx="7" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.1"/>
<text x="145.0" y="142.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">网页上传</text>
<text x="145.0" y="167.0" text-anchor="middle" font-size="10" fill="#4a4a4a">只收 EPUB / PDF</text>
<rect x="46" y="190" width="198" height="54" rx="7" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.1"/>
<text x="145.0" y="208.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">抓网文</text>
<text x="145.0" y="233.0" text-anchor="middle" font-size="10" fill="#4a4a4a">Readability 组 EPUB</text>
<rect x="46" y="256" width="198" height="54" rx="7" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.1"/>
<text x="145.0" y="274.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">scp 进 inbox/</text>
<text x="145.0" y="299.0" text-anchor="middle" font-size="10" fill="#4a4a4a">追平队列</text>
<polyline points="260,210 310,210" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sd-a)"/>
<text x="285" y="200" text-anchor="middle" font-size="10.5" fill="#555">原样入库</text>
<rect x="315" y="84" width="400" height="290" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="515.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">母版库（中间层暂存池）</text>
<text x="515.0" y="130.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">~/.local/state/shelf/books/staging/</text>
<text x="515.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">母版永久保留，可反复落库、两读器对照</text>
<rect x="335" y="166" width="360" height="96" rx="8" fill="#ffffff" stroke="#c9971f" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="515.0" y="184.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">可选「优化」（手动点或批量队列）</text>
<text x="515.0" y="209.0" text-anchor="middle" font-size="10" fill="#4a4a4a">EPUB：清洗 + 排版 + 目录 + 封面保证，不改格式</text>
<text x="515.0" y="222.0" text-anchor="middle" font-size="10" fill="#4a4a4a">PDF：有文字层转 EPUB；无文字层 / 漫画仅裁边</text>
<rect x="335" y="276" width="360" height="86" rx="8" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
<text x="515.0" y="294.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">落库记录（边车）</text>
<text x="515.0" y="319.0" text-anchor="middle" font-size="10" fill="#4a4a4a">已加入哪个读器 · 渲染自检徽章</text>
<text x="515.0" y="332.0" text-anchor="middle" font-size="10" fill="#4a4a4a">清理已落库 · 剩余空间</text>
<polyline points="715,190 770,150" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sd-a)"/>
<text x="738" y="158" text-anchor="middle" font-size="10.5" fill="#555">落库</text>
<polyline points="715,270 770,310" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#sd-a)"/>
<rect x="775" y="84" width="275" height="130" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="912.5" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">加入 xochitl</text>
<text x="912.5" y="130" text-anchor="middle" font-size="10" fill="#4a4a4a">EPUB / PDF</text>
<text x="912.5" y="143" text-anchor="middle" font-size="10" fill="#4a4a4a">≤90MB 流式 upload；&gt;90MB 占位+替换</text>
<text x="912.5" y="156" text-anchor="middle" font-size="10" fill="#4a4a4a">投完渲染自检（页数 vs 预期）</text>
<text x="912.5" y="169" text-anchor="middle" font-size="10" fill="#4a4a4a">事件 books/render 推网页徽章</text>
<rect x="775" y="260" width="275" height="110" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="912.5" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">加入 KOReader</text>
<text x="912.5" y="306.5" text-anchor="middle" font-size="10.5" fill="#4a4a4a">本地文件拷贝，不经优化器</text>
<text x="912.5" y="320.0" text-anchor="middle" font-size="10.5" fill="#4a4a4a">母版字节两边一致，可对照</text>
<text x="540" y="414" text-anchor="middle" font-size="11" fill="#6a6a6a">优化与落库都是异步：HTTP 立即回“已开始”，进度靠边车 + SSE 事件呈现</text>
<text x="540" y="436" text-anchor="middle" font-size="10.5" fill="#8a8a8a">入库来源里没有电脑端命令行——该入口 2026-09-18 已砍；格式转换请先在电脑上自行处理成 EPUB/PDF 再上传</text>
</svg>
