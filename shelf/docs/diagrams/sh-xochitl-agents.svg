<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="shxoch-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="shxoch-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="shxoch-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">让 xochitl 自己动手：四个 qmd 代理</text>
<text x="600.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">外部进程改书库文件会被运行中的 xochitl 盖回去 → book-serve 只排队，注入 xochitl 的 qmd 来取活、调 xochitl 自己的函数</text>
<text x="30.0" y="100.0" font-size="12" font-weight="bold" fill="#6B7280" text-anchor="start">谁发起</text>
<text x="320.0" y="100.0" font-size="12" font-weight="bold" fill="#6B7280" text-anchor="start">book-serve（127.0.0.1:8790）排队</text>
<text x="760.0" y="100.0" font-size="12" font-weight="bold" fill="#6B7280" text-anchor="start">xochitl 进程里的 qmd 动手</text>
<rect x="30" y="112" width="250" height="86" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="132.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">建文件夹</text>
<text x="42.0" y="151.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页「加入 → 文件夹」填了</text>
<text x="42.0" y="167.5" font-size="11.5" fill="#1F2937" text-anchor="start">不存在的名字；直接导入逐级建</text>
<rect x="320" y="112" width="380" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="332.0" y="132.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">MkdirQueue（mkdir-pending.json）</text>
<text x="332.0" y="151.0" font-size="11.5" fill="#1F2937" text-anchor="start">按（上级, 名字）记；投递那边先挂监听再等</text>
<text x="332.0" y="167.5" font-size="11.5" fill="#1F2937" text-anchor="start">（每级 ≤ 20 秒）；建出来即出队</text>
<rect x="760" y="112" width="410" height="86" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="772.0" y="132.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">shelf-mkdir-agent.qmd（MainView）</text>
<text x="772.0" y="151.0" font-size="11.5" fill="#1F2937" text-anchor="start">长轮询 GET /mkdir/pending?wait=290</text>
<text x="772.0" y="167.5" font-size="11.5" fill="#1F2937" text-anchor="start">→ Library.createCollection(上级, 名字)</text>
<path d="M280.0,155.0 L320.0,155.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="300.0" y="149.0" font-size="11" fill="#6B7280" text-anchor="middle">入队</text>
<path d="M760.0,155.0 L700.0,155.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="730.0" y="149.0" font-size="11" fill="#6B7280" text-anchor="middle">来取</text>
<rect x="30" y="212" width="250" height="86" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="232.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">移进回收站</text>
<text x="42.0" y="251.0" font-size="11.5" fill="#1F2937" text-anchor="start">「管理 → 设备健康 → 清理」；</text>
<text x="42.0" y="267.5" font-size="11.5" fill="#1F2937" text-anchor="start">笔记线挪走旧版笔记本</text>
<rect x="320" y="212" width="380" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="332.0" y="232.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">TrashQueue（trash-pending.json）</text>
<text x="332.0" y="251.0" font-size="11.5" fill="#1F2937" text-anchor="start">入队按书名核对 uuid（防错删）；</text>
<text x="332.0" y="267.5" font-size="11.5" fill="#1F2937" text-anchor="start">进了回收站 / .metadata 真没了才出队</text>
<rect x="760" y="212" width="410" height="86" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="772.0" y="232.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">shelf-trash-agent.qmd（MainView）</text>
<text x="772.0" y="251.0" font-size="11.5" fill="#1F2937" text-anchor="start">长轮询 GET /trash/pending?wait=290</text>
<text x="772.0" y="267.5" font-size="11.5" fill="#1F2937" text-anchor="start">→ moveEntriesToTrash([entryForId(uuid).id])</text>
<path d="M280.0,255.0 L320.0,255.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="300.0" y="249.0" font-size="11" fill="#6B7280" text-anchor="middle">入队</text>
<path d="M760.0,255.0 L700.0,255.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="730.0" y="249.0" font-size="11" fill="#6B7280" text-anchor="middle">来取</text>
<rect x="30" y="312" width="250" height="86" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="332.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">漫画页边距 ≈ 0</text>
<text x="42.0" y="351.0" font-size="11.5" fill="#1F2937" text-anchor="start">加入 / 导入一本带 sheng-ren</text>
<text x="42.0" y="367.5" font-size="11.5" fill="#1F2937" text-anchor="start">页边距标记的漫画（没有开关）</text>
<rect x="320" y="312" width="380" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="332.0" y="332.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">ComicMargins（comic-margins.json）</text>
<text x="332.0" y="351.0" font-size="11.5" fill="#1F2937" text-anchor="start">记 uuid → 页边距；设过一次</text>
<text x="332.0" y="367.5" font-size="11.5" fill="#1F2937" text-anchor="start">（POST /margins/applied）即出队</text>
<rect x="760" y="312" width="410" height="86" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="772.0" y="332.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">shelf-comic-margins.qmd（DocumentView）</text>
<text x="772.0" y="351.0" font-size="11.5" fill="#1F2937" text-anchor="start">开书 1.5 秒后 GET /margins/{uuid}</text>
<text x="772.0" y="367.5" font-size="11.5" fill="#1F2937" text-anchor="start">→ setMargins(1)；之后用户改回不再干预</text>
<path d="M280.0,355.0 L320.0,355.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="300.0" y="349.0" font-size="11" fill="#6B7280" text-anchor="middle">入队</text>
<path d="M760.0,355.0 L700.0,355.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="730.0" y="349.0" font-size="11" fill="#6B7280" text-anchor="middle">来取</text>
<rect x="30" y="412" width="250" height="86" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="432.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">找回阅读位置</text>
<text x="42.0" y="451.0" font-size="11.5" fill="#1F2937" text-anchor="start">sheng-ren 经 POST /import?uuid=</text>
<text x="42.0" y="467.5" font-size="11.5" fill="#1F2937" text-anchor="start">原地替换一本在读的 EPUB</text>
<rect x="320" y="412" width="380" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="332.0" y="432.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">progress/&lt;uuid&gt;.json（快照）</text>
<text x="332.0" y="451.0" font-size="11.5" fill="#1F2937" text-anchor="start">替换前记：所在章节文件 + 文件内比例</text>
<text x="332.0" y="467.5" font-size="11.5" fill="#1F2937" text-anchor="start">跳完 / 放弃（POST /progress/applied）即删</text>
<rect x="760" y="412" width="410" height="86" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="772.0" y="432.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">shelf-keep-progress.qmd（DocumentView）</text>
<text x="772.0" y="451.0" font-size="11.5" fill="#1F2937" text-anchor="start">开书后 GET /progress/{uuid}（≤ 约 60 秒）</text>
<text x="772.0" y="467.5" font-size="11.5" fill="#1F2937" text-anchor="start">→ sceneView.goToPage(page)</text>
<path d="M280.0,455.0 L320.0,455.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="300.0" y="449.0" font-size="11" fill="#6B7280" text-anchor="middle">入队</text>
<path d="M760.0,455.0 L700.0,455.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shxoch-a)"/>
<text x="730.0" y="449.0" font-size="11" fill="#6B7280" text-anchor="middle">来取</text>
<text x="30.0" y="530.0" font-size="11.5" fill="#6B7280" text-anchor="start">• 箭头方向 = 谁找谁：qmd 主动向 book-serve 要活，book-serve 从不主动调 xochitl。前两个长轮询共用 Handout：有待办立即回，否则睡到有人入队、290 秒到期或某项静默期到期。</text>
<text x="30.0" y="550.0" font-size="11.5" fill="#6B7280" text-anchor="start">• 交出后 15 秒（建文件夹）/ 30 秒（回收站）内不重交；同一项最多交 5 次，仍不成就放弃、记进 agent-failures.json，网页页头横幅提示。</text>
<text x="30.0" y="570.0" font-size="11.5" fill="#6B7280" text-anchor="start">• qmd 请求出错（book-serve 不在）时退避 15 → 30 → 60 → 120 秒；后两个不轮询，只在打开一本书时问，平时不耗电。</text>
<text x="30.0" y="590.0" font-size="11.5" fill="#6B7280" text-anchor="start">• qmd 只在 xochitl 启动时注入：装 / 改了要整机重启才生效。另一个 qmd reader-page-turn（单击翻页）不经 book-serve，归系统增强线。</text>
</svg>
