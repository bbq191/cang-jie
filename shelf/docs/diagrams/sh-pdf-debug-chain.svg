<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="1120" height="700" fill="#ffffff"/>
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">2026-09-23 两本真实 PDF 转 EPUB 的真机排查链（§03br）</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#6b7280">《移动互联软件安装使用手册》（Word 导出，8 页）与《2026-09-19 T.E.双语》（calibre 导出，540 页）；规则细节见 EPUB优化规范白皮书 §3、§5</text>

  <!-- header -->
  <g font-size="14" font-weight="bold" fill="#ffffff">
    <rect x="20" y="76" width="300" height="34" fill="#6b7280"/>
    <text x="170" y="98" text-anchor="middle">真机症状</text>
    <rect x="326" y="76" width="380" height="34" fill="#b45309"/>
    <text x="516" y="98" text-anchor="middle">根因</text>
    <rect x="712" y="76" width="388" height="34" fill="#15803d"/>
    <text x="906" y="98" text-anchor="middle">修法（已部署，真机复核）</text>
  </g>

  <g font-size="13" fill="#1f2937">
    <!-- row 1 -->
    <rect x="20" y="116" width="300" height="86" fill="#f3f4f6"/>
    <text x="32" y="140" font-weight="bold">手册：图片一张都不显示</text>
    <text x="32" y="162" fill="#4b5563">二维码、截图全没了</text>
    <rect x="326" y="116" width="380" height="86" fill="#fef3c7"/>
    <text x="338" y="140">① JPEG 字节存成 .png 后缀</text>
    <text x="338" y="162">② 章节与 images/ 同级却多拼一层 ../</text>
    <text x="338" y="184" fill="#78350f">图片在包里，但 src 指向不存在的位置</text>
    <rect x="712" y="116" width="388" height="86" fill="#dcfce7"/>
    <text x="724" y="140">按字节嗅探后缀；相对路径按真实层级</text>
    <text x="724" y="162">质量门新增第 4 条：资源引用命中率</text>
    <text x="724" y="184" fill="#14532d">预览 PDF 里 24 张图全部出现</text>

    <!-- row 2 -->
    <rect x="20" y="208" width="300" height="86" fill="#f3f4f6"/>
    <text x="32" y="232" font-weight="bold">手册：图片位置不对</text>
    <text x="32" y="254" fill="#4b5563">二维码堆到页尾、截图插进</text>
    <text x="32" y="276" fill="#4b5563">"点击获取验|证码"句子中间</text>
    <rect x="326" y="208" width="380" height="86" fill="#fef3c7"/>
    <text x="338" y="232">Word 导出的 PDF 每页先画完文字、</text>
    <text x="338" y="254">最后才画图；按"绘制顺序"排就错位</text>
    <text x="338" y="276" fill="#78350f">另：并排的图被上下叠放、大小失真</text>
    <rect x="712" y="208" width="388" height="86" fill="#dcfce7"/>
    <text x="724" y="232">按视觉坐标：图插在上方最近一行文字之后</text>
    <text x="724" y="254">同一行的图放同一段并排；按原书占栏宽</text>
    <text x="724" y="276">比例定宽（外链 class .cj-wN）</text>

    <!-- row 3 -->
    <rect x="20" y="300" width="300" height="86" fill="#f3f4f6"/>
    <text x="32" y="324" font-weight="bold">T.E.：xochitl 只渲染 1 页</text>
    <text x="32" y="346" fill="#4b5563">渲染自检 warn，预估 4978 页</text>
    <rect x="326" y="300" width="380" height="86" fill="#fef3c7"/>
    <text x="338" y="324">PDF 标题是 UTF-16BE，被当 UTF-8 解码，</text>
    <text x="338" y="346">OPF 的 dc:title 混进 \0 → 不是合法 XML，</text>
    <text x="338" y="368" fill="#78350f">xochitl 整本读不出（日志不报 XML 错）</text>
    <rect x="712" y="300" width="388" height="86" fill="#dcfce7"/>
    <text x="724" y="324">按 PDF 规范解码文本字符串</text>
    <text x="724" y="346">xml_escape 丢弃 XML 非法字符</text>
    <text x="724" y="368">质量门第 5 条：OPF 必须是合法 XML</text>

    <!-- row 4 -->
    <rect x="20" y="392" width="300" height="86" fill="#f3f4f6"/>
    <text x="32" y="416" font-weight="bold">T.E.：内容重复约 10 倍</text>
    <text x="32" y="438" fill="#4b5563">604 万字 vs 原书 50 万字；</text>
    <text x="32" y="460" fill="#4b5563">图片引用 1208 处 vs 129 张</text>
    <rect x="326" y="392" width="380" height="86" fill="#fef3c7"/>
    <text x="338" y="416">一级栏目书签全指回第 2 页目录页；</text>
    <text x="338" y="438">切章按"本条起始页到下一条起始页"，</text>
    <text x="338" y="460" fill="#78350f">往回指的书签把整段页复制进多章</text>
    <rect x="712" y="392" width="388" height="86" fill="#dcfce7"/>
    <text x="724" y="416">partition_chapters：每页只进一章、一页不丢</text>
    <text x="724" y="438">分组标题只进目录，不生成空白章</text>
    <text x="724" y="460" fill="#14532d">产物 50.3 万字，与原书文字层一致</text>

    <!-- row 5 -->
    <rect x="20" y="484" width="300" height="86" fill="#f3f4f6"/>
    <text x="32" y="508" font-weight="bold">T.E.：标题被逐字拆开</text>
    <text x="32" y="530" fill="#4b5563">"C a n  t h e"、"能  否  阻  止"</text>
    <text x="32" y="552" fill="#4b5563">全书约 500 处</text>
    <rect x="326" y="484" width="380" height="86" fill="#fef3c7"/>
    <text x="338" y="508">calibre 每个字形各定位一次，"行号变了"</text>
    <text x="338" y="530">≠ 换行，却一律补空格；另外 fork 里 CID</text>
    <text x="338" y="552" fill="#78350f">字体 /W 区间写法解析错，中文字宽全为 0</text>
    <rect x="712" y="484" width="388" height="86" fill="#dcfce7"/>
    <text x="724" y="508">换行只看基线 y 是否真的变了</text>
    <text x="724" y="530">字号/字宽换算到设备空间；中文接中文、</text>
    <text x="724" y="552">行尾连字符不补空格；fork 修 /W 解析</text>

    <!-- row 6 -->
    <rect x="20" y="576" width="300" height="86" fill="#f3f4f6"/>
    <text x="32" y="600" font-weight="bold">T.E.：目录页链接点了不跳</text>
    <text x="32" y="622" fill="#4b5563">95 个书内跳转（xochitl 目录菜单</text>
    <text x="32" y="644" fill="#4b5563">本身一直能用）</text>
    <rect x="326" y="576" width="380" height="86" fill="#fef3c7"/>
    <text x="338" y="600">xochitl 把跨文件链接当外部网址；</text>
    <text x="338" y="622">空的 &lt;a id&gt; 不登记为跳转目标</text>
    <text x="338" y="644" fill="#78350f">（真机实验 + 预览 PDF 名字树 0 条坐实）</text>
    <rect x="712" y="576" width="388" height="86" fill="#dcfce7"/>
    <text x="724" y="600">有跨章跳转就合成单文件，目录指向文件内锚点</text>
    <text x="724" y="622">目标 id 挂在该页第一个有内容的段落上</text>
    <text x="724" y="644" fill="#14532d">名字树 95 条，95 个目标逐个核对落页正确</text>
  </g>
  <text x="560" y="688" text-anchor="middle" font-size="12.5" fill="#6b7280">教训：先拿真书量化（字符数、图片引用数、预览 PDF 链接/名字树），再改代码；"目录能跳"与"正文链接能跳"在 xochitl 里是两套机制，要分别核对</text>
</svg>
