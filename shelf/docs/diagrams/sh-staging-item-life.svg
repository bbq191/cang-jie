<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="shstag-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="shstag-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="shstag-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">母版库里一本书的一生：入库 → 加入 xochitl / 改名 / 下载 / 删除</text>
<text x="600.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">书架不改书；同一本书同一时刻只做一个动作（忙锁）；结果写进边车、经事件推到网页</text>
<rect x="30" y="96" width="300" height="214" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">① 入库（原样）</text>
<text x="42.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页上传：流式落到 .work/ 下随机名，</text>
<text x="42.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">  收完再挑名、改名进母版库</text>
<text x="42.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">scp 进 inbox/：写完静止 5 秒才收；</text>
<text x="42.0" y="184.5" font-size="11.5" fill="#1F2937" text-anchor="start">  失败进 failed/ 带 .reason</text>
<text x="42.0" y="201.0" font-size="11.5" fill="#1F2937" text-anchor="start">只收 EPUB / PDF，其它拒收</text>
<text x="42.0" y="217.5" font-size="11.5" fill="#1F2937" text-anchor="start">文件名规范成「书名 - 02卷」</text>
<text x="42.0" y="234.0" font-size="11.5" fill="#1F2937" text-anchor="start">同名同内容：认已有那本</text>
<text x="42.0" y="250.5" font-size="11.5" fill="#1F2937" text-anchor="start">同名不同内容：加数字前缀</text>
<rect x="372" y="96" width="360" height="214" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="384.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">母版库条目（永久保留）</text>
<text x="384.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">~/.local/state/shelf/books/staging/</text>
<text x="384.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">书名 - 02卷.epub（原书字节，从不改写）</text>
<text x="384.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">边车 .书名 - 02卷.epub.delivered：</text>
<text x="384.0" y="184.5" font-size="11.5" fill="#1F2937" text-anchor="start">  native 最近加入时间</text>
<text x="384.0" y="201.0" font-size="11.5" fill="#1F2937" text-anchor="start">  deliver 加入结果 · render 渲染自检</text>
<text x="384.0" y="217.5" font-size="11.5" fill="#1F2937" text-anchor="start">列表字段：name · bytes · format · mtime ·</text>
<text x="384.0" y="234.0" font-size="11.5" fill="#1F2937" text-anchor="start">  delivered · busy · title · series · done</text>
<text x="384.0" y="250.5" font-size="11.5" fill="#1F2937" text-anchor="start">  （title / series / done 由后端算，10-10）</text>
<path d="M330.0,203.0 L372.0,203.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shstag-a)"/>
<rect x="774" y="96" width="396" height="100" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="786.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">② 加入 xochitl（复制字节，可反复、可批量）</text>
<text x="786.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">≤ 90MB 流式上传；更大走占位 + 磁盘替换（≤ 1GiB）</text>
<text x="786.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">排进作业队列一本一本做；没有能中途停的步骤</text>
<text x="786.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">批量「全部中止」只清还没开始的</text>
<rect x="774" y="206" width="396" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="786.0" y="226.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">③ 改名 / 下载原件（只勾一本时出现）</text>
<text x="786.0" y="245.0" font-size="11.5" fill="#1F2937" text-anchor="start">改名只改文件名、扩展名不变，边车跟着改</text>
<rect x="774" y="268" width="396" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="786.0" y="288.0" font-size="11.5" fill="#1F2937" text-anchor="start">④ 删除：删的那一刻占忙锁；已在 xochitl 里的副本不受影响</text>
<path d="M732.0,146.0 L774.0,146.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shstag-a)"/>
<path d="M732.0,232.0 L774.0,232.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shstag-a)"/>
<path d="M732.0,289.0 L774.0,289.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#shstag-a)"/>
<rect x="30" y="340" width="540" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="360.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">忙锁 OpRegistry（内存）：现在有没有线程在做</text>
<text x="42.0" y="379.0" font-size="11.5" fill="#1F2937" text-anchor="start">按书名；加入、改名（新旧两个名字）、删除互斥</text>
<text x="42.0" y="395.5" font-size="11.5" fill="#1F2937" text-anchor="start">冲突回 409「《…》正在处理中，请稍候」</text>
<text x="42.0" y="412.0" font-size="11.5" fill="#1F2937" text-anchor="start">排队等加入的书也占着忙锁（网页显示「处理中」）</text>
<text x="42.0" y="428.5" font-size="11.5" fill="#1F2937" text-anchor="start">不落盘：book-serve 重启即清零（有意，落盘会永久卡忙）</text>
<text x="42.0" y="445.0" font-size="11.5" fill="#1F2937" text-anchor="start">列表字段 busy</text>
<rect x="600" y="340" width="570" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="612.0" y="360.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">边车 sidecar（磁盘）：上次做到哪、结果如何</text>
<text x="612.0" y="379.0" font-size="11.5" fill="#1F2937" text-anchor="start">deliver：pending → ok / failed</text>
<text x="612.0" y="395.5" font-size="11.5" fill="#1F2937" text-anchor="start">render：pending → ok（记页数）/ timeout（没等到或认不出，不算错）</text>
<text x="612.0" y="412.0" font-size="11.5" fill="#1F2937" text-anchor="start">  大文件通道的 EPUB 先记 onopen，首次打开排版后列表自动升成 ok</text>
<text x="612.0" y="428.5" font-size="11.5" fill="#1F2937" text-anchor="start">线上值是 rmsvc-core wire 枚举；旧边车里的历史值（如 cancelled）</text>
<text x="612.0" y="445.0" font-size="11.5" fill="#1F2937" text-anchor="start">  读成 unknown，网页按「不是 ok 也不是 pending」显示</text>
<rect x="30" y="506" width="1140" height="64" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="42.0" y="526.0" font-size="11.5" fill="#1F2937" text-anchor="start">重启修正：停在 pending 的 deliver → failed（「服务重启，上次加入被中断，可重新加入」）、render → timeout；</text>
<text x="42.0" y="542.5" font-size="11.5" fill="#1F2937" text-anchor="start">母版库目录里点前缀、.tmp 结尾的半成品全删；孤儿边车（书已不在）清掉。</text>
</svg>
