<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="960" height="500" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">按书签切章：每页只进一章、一页不丢</text>

  <!-- 页轴 -->
  <text x="30" y="72" font-size="13" fill="#555">页码</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <rect x="90" y="58" width="40" height="22" fill="#eee" stroke="#aaa"/><text x="110" y="74">1</text>
    <rect x="130" y="58" width="40" height="22" fill="#ffe9c7" stroke="#aaa"/><text x="150" y="74">2 目录</text>
    <rect x="170" y="58" width="120" height="22" fill="#eee" stroke="#aaa"/><text x="230" y="74">3–4</text>
    <rect x="290" y="58" width="200" height="22" fill="#eee" stroke="#aaa"/><text x="390" y="74">5–18</text>
    <rect x="490" y="58" width="80" height="22" fill="#eee" stroke="#aaa"/><text x="530" y="74">19–21</text>
    <rect x="570" y="58" width="330" height="22" fill="#eee" stroke="#aaa"/><text x="735" y="74">22 …</text>
  </g>

  <!-- 书签列表 -->
  <text x="30" y="112" font-size="13" fill="#555">书签</text>
  <g font-size="12" fill="#333">
    <text x="90" y="112">① The world this week → 第 2 页</text>
    <text x="90" y="132">② Politics → 第 5 页　③ Business → 第 13 页　④ Cartoon → 第 19 页</text>
    <text x="90" y="152" fill="#c0392b">⑤ Leaders → 第 2 页（往回指！一级栏目书签都指向目录页）</text>
    <text x="90" y="172">⑥ Can the AI arms race be stopped? → 第 22 页　⑦ …</text>
  </g>

  <!-- 旧做法 -->
  <text x="30" y="215" font-size="14" font-weight="bold" fill="#8e2a20">旧：每条取"本条页到下一条页"</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="130" y="228" width="160" height="22" fill="#f9d6d2" stroke="#c0392b"/><text x="210" y="244">① 第 2–4 页</text>
    <rect x="290" y="228" width="200" height="22" fill="#f9d6d2" stroke="#c0392b"/><text x="390" y="244">② ③</text>
    <rect x="490" y="228" width="40" height="22" fill="#f9d6d2" stroke="#c0392b"/><text x="510" y="244">④</text>
    <rect x="130" y="256" width="440" height="22" fill="#e74c3c" stroke="#a93226"/><text x="350" y="272" fill="#fff">⑤ Leaders：第 2–21 页（把前面全部又复制一遍）</text>
  </g>
  <text x="590" y="271" font-size="12" fill="#8e2a20">每个一级栏目都这样 → 全书重复约 10 倍</text>
  <text x="590" y="291" font-size="12" fill="#8e2a20">604 万字 vs 原书 50 万；xochitl 预估 4978 页</text>
  <text x="130" y="296" font-size="11.5" fill="#8e2a20">另：第 1 页（封面）不在任何章里——丢了</text>

  <!-- 新做法 -->
  <text x="30" y="340" font-size="14" font-weight="bold" fill="#1d5e3a">新：partition_chapters</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="90" y="353" width="200" height="22" fill="#d5efdf" stroke="#2e8b57"/><text x="190" y="369">① 第 1–4 页（含封面、目录）</text>
    <rect x="290" y="353" width="200" height="22" fill="#d5efdf" stroke="#2e8b57"/><text x="390" y="369">② ③</text>
    <rect x="490" y="353" width="80" height="22" fill="#d5efdf" stroke="#2e8b57"/><text x="530" y="369">④</text>
    <rect x="570" y="353" width="330" height="22" fill="#d5efdf" stroke="#2e8b57"/><text x="735" y="369">⑥ 第 22 页 …</text>
    <rect x="570" y="381" width="120" height="22" fill="#fff" stroke="#2e8b57" stroke-dasharray="4,3"/><text x="630" y="397" fill="#1d5e3a">⑤ Leaders（只进目录）</text>
  </g>
  <g font-size="12.5" fill="#333">
    <text x="90" y="430">· 往回指的书签当"分组标题"：起点顺延到下一条正常书签，不占页、只作为目录里的上级条目。</text>
    <text x="90" y="452">· 多条书签落在同一页：内容归最后一条（最具体的那篇文章）。</text>
    <text x="90" y="474">· 第一条书签之前的页（封面、目录页）并入第一章。没有书签就按字号认标题，再不行每 20 页一段。</text>
  </g>
</svg>
