<text x="1095.5" y="155" text-anchor="middle" font-size="10" fill="#6b7280">进程内 static</text>
<text x="28" y="138" font-size="13" font-weight="bold" fill="#1f2937">入口 / 操作</text>
<rect x="20" y="174" width="1139" height="32" fill="#f7f7f5"/>
<text x="28" y="195" font-size="12.5" fill="#1f2937">网页上传  POST /staging</text>
<circle cx="587.5" cy="190" r="7" fill="#2f7d45"/>
