<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="880" viewBox="0 0 1310 880" font-family="Noto Sans CJK SC, sans-serif">
<rect width="1310" height="880" fill="#ffffff"/>
<text x="655.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">书架服务的并发控制：哪条路径进哪把锁</text>
<text x="655.0" y="56" text-anchor="middle" font-size="13" fill="#6b7280">2026-09-25 第四轮审计后的代码现状（⑤⑥⑦ 只在 host 测过，未部署真机；其余已部署，但并发场景没在真机专门触发）。锁只包住真正会撞的那一小段</text>
<text x="655.0" y="76" text-anchor="middle" font-size="12.5" fill="#6b7280">除网关闸门外都是单个进程内的锁；book-serve、koreader-serve、网关是三个独立进程</text>
<rect x="273" y="96" width="121" height="70" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
