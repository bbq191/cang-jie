<rect x="180" y="278" width="224" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="192.0" y="298.0" font-size="11.5" fill="#1F2937" text-anchor="start">Spool::guard</text>
<rect x="410" y="278" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="298.0" font-size="11.5" fill="#1F2937" text-anchor="start">一轮 inbox 追平</text>
<rect x="700" y="278" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="298.0" font-size="11.5" fill="#1F2937" text-anchor="start">一轮</text>
<rect x="950" y="278" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="298.0" font-size="11.5" fill="#1F2937" text-anchor="start">两轮追平抢同一个文件</text>
<rect x="30" y="324" width="144" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="344.0" font-size="11.5" fill="#1F2937" text-anchor="start">边车写锁</text>
<rect x="180" y="324" width="224" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="192.0" y="344.0" font-size="11.5" fill="#1F2937" text-anchor="start">sidecar::update（全局）</text>
<rect x="410" y="324" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="344.0" font-size="11.5" fill="#1F2937" text-anchor="start">所有边车读-改-写</text>
<rect x="700" y="324" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="344.0" font-size="11.5" fill="#1F2937" text-anchor="start">一次读-改-写</text>
<rect x="950" y="324" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="344.0" font-size="11.5" fill="#1F2937" text-anchor="start">交错写丢字段</text>
<rect x="30" y="370" width="144" height="38" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="42.0" y="390.0" font-size="11.5" fill="#1F2937" text-anchor="start">投递作业队列</text>
<rect x="180" y="370" width="224" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="192.0" y="390.0" font-size="11.5" fill="#1F2937" text-anchor="start">jobs.rs（一个工作线程）</text>
<rect x="410" y="370" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="390.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页落库、直接导入 POST /import</text>
<rect x="700" y="370" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="390.0" font-size="11.5" fill="#1F2937" text-anchor="start">一件作业（文件夹、上传、认领）</text>
<rect x="950" y="370" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="390.0" font-size="11.5" fill="#1F2937" text-anchor="start">落库与直接导入同时往 xochitl 传</text>
<rect x="30" y="416" width="144" height="38" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="42.0" y="436.0" font-size="11.5" fill="#1F2937" text-anchor="start">跨进程上传锁</text>
<rect x="180" y="416" width="224" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="192.0" y="436.0" font-size="11.5" fill="#1F2937" text-anchor="start">rmsvc-core UploadLock + flock</text>
<rect x="410" y="416" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="436.0" font-size="11.5" fill="#1F2937" text-anchor="start">每次「设文件夹 → /upload」，含 note-serve</text>
<rect x="700" y="416" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="436.0" font-size="11.5" fill="#1F2937" text-anchor="start">一次上传</text>
<rect x="950" y="416" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="436.0" font-size="11.5" fill="#1F2937" text-anchor="start">书或笔记本落进别人的文件夹</text>
<rect x="30" y="462" width="144" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="482.0" font-size="11.5" fill="#1F2937" text-anchor="start">认领串行</text>
<rect x="180" y="462" width="224" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="192.0" y="482.0" font-size="11.5" fill="#1F2937" text-anchor="start">rmsvc-core upload_and_claim</text>
<rect x="410" y="462" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="482.0" font-size="11.5" fill="#1F2937" text-anchor="start">EPUB 普通上传、直接导入、大文件占位</text>
<rect x="700" y="462" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="482.0" font-size="11.5" fill="#1F2937" text-anchor="start">快照 → 上传 → 认出 uuid</text>
<rect x="950" y="462" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="482.0" font-size="11.5" fill="#1F2937" text-anchor="start">同一份字节投两次，后一次认走前一次的</text>
<rect x="30" y="508" width="144" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="528.0" font-size="11.5" fill="#1F2937" text-anchor="start">大文件通道锁</text>
<rect x="180" y="508" width="224" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="192.0" y="528.0" font-size="11.5" fill="#1F2937" text-anchor="start">rmsvc-core upload_large</text>
<rect x="410" y="508" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="528.0" font-size="11.5" fill="#1F2937" text-anchor="start">超体积门的投递</text>
<rect x="700" y="508" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="528.0" font-size="11.5" fill="#1F2937" text-anchor="start">传占位 → 认领 → 换真文件</text>
<rect x="950" y="508" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="528.0" font-size="11.5" fill="#1F2937" text-anchor="start">两本大 PDF 认领到同一个条目</text>
<text x="30.0" y="572.0" font-size="11.5" fill="#6B7280" text-anchor="start">来由：09-24 网页上传曾把 spool 锁攥到请求体收完（WiFi 传大书可达分钟级）→ 改成只在挑名 + 改名那一瞬进落名临界区；xochitl 的「当前文件夹」是全局状态，</text>
<text x="30.0" y="592.0" font-size="11.5" fill="#6B7280" text-anchor="start">并发投递会落错文件夹 →「设文件夹 → /upload」成对加锁（10-10 起用锁文件 flock 管到 note-serve）。09-25：删除也占忙锁；大文件通道整段串行；跨分区入库锁外先拷。</text>
<text x="30.0" y="612.0" font-size="11.5" fill="#6B7280" text-anchor="start">10-10：落库原来每次新起线程、直接导入另有一套队列 → 合进 jobs.rs 一个工作线程；认领收进基座，认不出就不认。认领等待不跨进程互斥（笔记本按 visibleName 认，不会撞）。</text>
<text x="30.0" y="632.0" font-size="11.5" fill="#6B7280" text-anchor="start">验证：这些场景都有 host 回归测试；并发场景没在真机专门触发过。锁文件 $XDG_RUNTIME_DIR/shelf/xochitl-upload.lock（设备上缺省 /tmp/shelf-0/shelf/）。</text>
</svg>
