<circle cx="432.5" cy="350" r="7" fill="#b0451f"/>
<text x="444.5" y="354" font-size="11" fill="#b0451f">09-25 起占</text>
<rect x="20" y="366" width="1266" height="32" fill="#f7f7f5"/>
<text x="28" y="387" font-size="12.5" fill="#1f2937">优化 EPUB（完成时改规范名）</text>
<circle cx="333.5" cy="382" r="7" fill="#4a6fa5"/>
<circle cx="460.5" cy="382" r="7" fill="#b0451f"/>
<circle cx="587.5" cy="382" r="7" fill="#2f7d45"/>
<circle cx="841.5" cy="382" r="7" fill="#6b4fa0"/>
<text x="28" y="419" font-size="12.5" fill="#1f2937">优化 PDF → 转 EPUB</text>
<circle cx="333.5" cy="414" r="7" fill="#4a6fa5"/>
<circle cx="460.5" cy="414" r="7" fill="#b0451f"/>
<circle cx="587.5" cy="414" r="7" fill="#2f7d45"/>
<text x="599.5" y="418" font-size="11" fill="#2f7d45">落地时复查</text>
<circle cx="841.5" cy="414" r="7" fill="#6b4fa0"/>
<rect x="20" y="430" width="1266" height="32" fill="#f7f7f5"/>
<text x="28" y="451" font-size="12.5" fill="#1f2937">加入 xochitl</text>
<circle cx="333.5" cy="446" r="7" fill="#4a6fa5"/>
<circle cx="460.5" cy="446" r="7" fill="#b0451f"/>
<circle cx="841.5" cy="446" r="7" fill="#6b4fa0"/>
<circle cx="968.5" cy="446" r="7" fill="#1f6f8b"/>
<circle cx="1055.5" cy="446" r="7" fill="#2b5c8a"/>
<text x="1067.5" y="450" font-size="11" fill="#2b5c8a">超 90MB 时</text>
<text x="28" y="483" font-size="12.5" fill="#1f2937">加入 KOReader（复制）</text>
<circle cx="333.5" cy="478" r="7" fill="#4a6fa5"/>
<rect x="20" y="494" width="1266" height="32" fill="#f7f7f5"/>
<text x="28" y="515" font-size="12.5" fill="#1f2937">KOReader 配置 /config/*</text>
<circle cx="1222.5" cy="510" r="7" fill="#555555"/>
<line x1="270" y1="174" x2="270" y2="630" stroke="#e5e7eb"/>
<line x1="397" y1="174" x2="397" y2="630" stroke="#e5e7eb"/>
<line x1="524" y1="174" x2="524" y2="630" stroke="#e5e7eb"/>
<line x1="651" y1="174" x2="651" y2="630" stroke="#e5e7eb"/>
<line x1="778" y1="174" x2="778" y2="630" stroke="#e5e7eb"/>
<line x1="905" y1="174" x2="905" y2="630" stroke="#e5e7eb"/>
<line x1="1032" y1="174" x2="1032" y2="630" stroke="#e5e7eb"/>
<line x1="1159" y1="174" x2="1159" y2="630" stroke="#e5e7eb"/>
<line x1="1286" y1="174" x2="1286" y2="630" stroke="#e5e7eb"/>
<line x1="20" y1="526" x2="1286" y2="526" stroke="#9ca3af"/>
<text x="28" y="548" font-size="12.5" font-weight="bold" fill="#1f2937">锁住多久</text>
<text x="333.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">从开始到这本书</text>
<text x="333.5" y="559" text-anchor="middle" font-size="10.5" fill="#374151">不再 busy</text>
<text x="333.5" y="573" text-anchor="middle" font-size="10.5" fill="#374151">（最长 1 小时）</text>
<text x="460.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">整个操作</text>
<text x="460.5" y="559" text-anchor="middle" font-size="10.5" fill="#374151">（大书可到分钟级）</text>
<text x="587.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">只包挑名 + 改名</text>
<text x="587.5" y="559" text-anchor="middle" font-size="10.5" fill="#374151">（毫秒级本地操作）</text>
<text x="714.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">一轮 inbox 追平</text>
<text x="841.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">一次读-改-写</text>
<text x="968.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">设当前文件夹</text>
<text x="968.5" y="559" text-anchor="middle" font-size="10.5" fill="#374151">+ 一次 /upload</text>
<text x="1095.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">传占位 → 认领</text>
<text x="1095.5" y="559" text-anchor="middle" font-size="10.5" fill="#374151">→ 换成真文件</text>
<text x="1222.5" y="545" text-anchor="middle" font-size="10.5" fill="#374151">一次应用</text>
<text x="1222.5" y="559" text-anchor="middle" font-size="10.5" fill="#374151">（含跑 luajit）</text>
<line x1="20" y1="584" x2="1286" y2="584" stroke="#e5e7eb"/>
<text x="28" y="606" font-size="12.5" font-weight="bold" fill="#1f2937">防什么</text>
<text x="333.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">多本大书同时</text>
<text x="333.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">处理，内存叠加</text>
<text x="460.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">同一本同时被</text>
<text x="460.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">优化/删/改名</text>
<text x="587.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">两本同名书挑到</text>
<text x="587.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">同一个名、互相覆盖</text>
<text x="714.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">两轮追平抢</text>
<text x="714.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">同一个文件</text>
<text x="841.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">并发写边车</text>
<text x="841.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">丢字段</text>
<text x="968.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">并发投递落进</text>
<text x="968.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">别人的文件夹</text>
<text x="1095.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">两本大 PDF 认领</text>
<text x="1095.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">到同一个条目</text>
<text x="1222.5" y="603" text-anchor="middle" font-size="10.5" fill="#374151">固定名临时补丁</text>
<text x="1222.5" y="617" text-anchor="middle" font-size="10.5" fill="#374151">被别的请求覆盖</text>
<line x1="20" y1="630" x2="1286" y2="630" stroke="#9ca3af"/>
<circle cx="34" cy="648" r="6" fill="#374151"/><text x="46" y="652" font-size="12" fill="#374151">进这把锁</text>
<text x="134" y="652" font-size="12" fill="#374151">“勾选时”＝只有勾了「同步优化」才进；“超 90MB 时”＝走“占位 + 磁盘替换”大文件通道时才进</text>
<text x="20" y="678" font-size="12" fill="#374151" xml:space="preserve">09-24 改动①：网页上传原来把 spool 锁攥到整个请求体收完（WiFi 传大书可达分钟级），期间 inbox 追平和别的上传全被卡住；</text>
<text x="20" y="698" font-size="12" fill="#374151" xml:space="preserve">              现在上传只在“挑名 + 改名”那一瞬进落名临界区。跨分区入库（09-25）也是锁外先拷到临时文件，锁内只挑名、改名。</text>
<text x="20" y="718" font-size="12" fill="#374151" xml:space="preserve">09-24 改动②：xochitl 的“当前文件夹”是它自己的全局状态，并发投递时 A 设完文件夹、B 又设了自己的，A 就落进 B 的文件夹；</text>
<text x="20" y="738" font-size="12" fill="#374151" xml:space="preserve">              现在进程内把“设文件夹 → /upload”串成一对（note-serve 是另一个进程，仍不受这把锁约束）。</text>
<text x="20" y="758" font-size="12" fill="#374151" xml:space="preserve">09-24 改动③：PDF 转 EPUB 转换完（可达分钟级）落地前，在落名临界区里再查一次同名 .epub，转换期间有人落下同名书就放弃、不覆盖。</text>
<text x="20" y="778" font-size="12" fill="#374151" xml:space="preserve">09-25 改动④：抓网文勾了「同步优化」时，落名那一刻就占上忙锁（优化完才放），并过网关闸门（固定小档，键＝“抓网文 &lt;url&gt;”）。</text>
<text x="20" y="798" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑤：删除原来只“先查忙不忙再删”，中间可能被优化/落库插进来对着已删的文件跑；现在删除期间占着忙锁。</text>
<text x="20" y="818" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑥：大文件通道按“刚进库 + 大小等于占位”认领条目，PDF 占位字节都一样，两本同时投会认领同一个 uuid；现在整段串行。</text>
<text x="20" y="838" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑦：scp 直接写最终文件名，写到一半就被追平会进母版库一本半截书；现在修改时间静止不足 5 秒的文件先跳过，写完再收。</text>
</svg>
