<text x="28" y="259" font-size="12.5" fill="#1f2937">改名（新旧两个名字都占忙锁）</text>
<circle cx="460.5" cy="254" r="7" fill="#b0451f"/>
<circle cx="587.5" cy="254" r="7" fill="#2f7d45"/>
<text x="28" y="291" font-size="12.5" fill="#1f2937">删除</text>
<circle cx="460.5" cy="286" r="7" fill="#b0451f"/>
<text x="472.5" y="290" font-size="11" fill="#b0451f">09-25 起占</text>
<rect x="20" y="302" width="1139" height="32" fill="#f7f7f5"/>
<text x="28" y="323" font-size="12.5" fill="#1f2937">加入 xochitl</text>
<circle cx="333.5" cy="318" r="7" fill="#4a6fa5"/>
<circle cx="460.5" cy="318" r="7" fill="#b0451f"/>
<circle cx="841.5" cy="318" r="7" fill="#6b4fa0"/>
<circle cx="968.5" cy="318" r="7" fill="#1f6f8b"/>
<circle cx="1055.5" cy="318" r="7" fill="#2b5c8a"/>
<text x="1067.5" y="322" font-size="11" fill="#2b5c8a">超 90MB 时</text>
<line x1="270" y1="174" x2="270" y2="438" stroke="#e5e7eb"/>
<line x1="397" y1="174" x2="397" y2="438" stroke="#e5e7eb"/>
<line x1="524" y1="174" x2="524" y2="438" stroke="#e5e7eb"/>
<line x1="651" y1="174" x2="651" y2="438" stroke="#e5e7eb"/>
<line x1="778" y1="174" x2="778" y2="438" stroke="#e5e7eb"/>
<line x1="905" y1="174" x2="905" y2="438" stroke="#e5e7eb"/>
<line x1="1032" y1="174" x2="1032" y2="438" stroke="#e5e7eb"/>
<line x1="1159" y1="174" x2="1159" y2="438" stroke="#e5e7eb"/>
<line x1="20" y1="334" x2="1159" y2="334" stroke="#9ca3af"/>
<text x="28" y="356" font-size="12.5" font-weight="bold" fill="#1f2937">锁住多久</text>
<text x="333.5" y="353" text-anchor="middle" font-size="10.5" fill="#374151">从提交到这本书</text>
<text x="333.5" y="367" text-anchor="middle" font-size="10.5" fill="#374151">不再 busy</text>
<text x="333.5" y="381" text-anchor="middle" font-size="10.5" fill="#374151">（最长 1 小时）</text>
<text x="460.5" y="353" text-anchor="middle" font-size="10.5" fill="#374151">整个操作</text>
<text x="460.5" y="367" text-anchor="middle" font-size="10.5" fill="#374151">（大书可到分钟级）</text>
<text x="587.5" y="353" text-anchor="middle" font-size="10.5" fill="#374151">只包挑名 + 改名</text>
<text x="587.5" y="367" text-anchor="middle" font-size="10.5" fill="#374151">（毫秒级本地操作）</text>
<text x="714.5" y="353" text-anchor="middle" font-size="10.5" fill="#374151">一轮 inbox 追平</text>
<text x="841.5" y="353" text-anchor="middle" font-size="10.5" fill="#374151">一次读-改-写</text>
<text x="968.5" y="353" text-anchor="middle" font-size="10.5" fill="#374151">设当前文件夹</text>
<text x="968.5" y="367" text-anchor="middle" font-size="10.5" fill="#374151">+ 一次 /upload</text>
<text x="1095.5" y="353" text-anchor="middle" font-size="10.5" fill="#374151">传占位 → 认领</text>
<text x="1095.5" y="367" text-anchor="middle" font-size="10.5" fill="#374151">→ 换成真文件</text>
<line x1="20" y1="392" x2="1159" y2="392" stroke="#e5e7eb"/>
<text x="28" y="414" font-size="12.5" font-weight="bold" fill="#1f2937">防什么</text>
<text x="333.5" y="411" text-anchor="middle" font-size="10.5" fill="#374151">网页一次勾多本时</text>
<text x="333.5" y="425" text-anchor="middle" font-size="10.5" fill="#374151">同时往 xochitl 投</text>
<text x="460.5" y="411" text-anchor="middle" font-size="10.5" fill="#374151">同一本同时被</text>
<text x="460.5" y="425" text-anchor="middle" font-size="10.5" fill="#374151">加入/删/改名</text>
<text x="587.5" y="411" text-anchor="middle" font-size="10.5" fill="#374151">两本同名书挑到</text>
<text x="587.5" y="425" text-anchor="middle" font-size="10.5" fill="#374151">同一个名、互相覆盖</text>
<text x="714.5" y="411" text-anchor="middle" font-size="10.5" fill="#374151">两轮追平抢</text>
<text x="714.5" y="425" text-anchor="middle" font-size="10.5" fill="#374151">同一个文件</text>
<text x="841.5" y="411" text-anchor="middle" font-size="10.5" fill="#374151">并发写边车</text>
<text x="841.5" y="425" text-anchor="middle" font-size="10.5" fill="#374151">丢字段</text>
<text x="968.5" y="411" text-anchor="middle" font-size="10.5" fill="#374151">并发投递落进</text>
<text x="968.5" y="425" text-anchor="middle" font-size="10.5" fill="#374151">别人的文件夹</text>
<text x="1095.5" y="411" text-anchor="middle" font-size="10.5" fill="#374151">两本大 PDF 认领</text>
<text x="1095.5" y="425" text-anchor="middle" font-size="10.5" fill="#374151">到同一个条目</text>
<line x1="20" y1="438" x2="1159" y2="438" stroke="#9ca3af"/>
<circle cx="34" cy="456" r="6" fill="#374151"/><text x="46" y="460" font-size="12" fill="#374151">进这把锁</text>
<text x="134" y="460" font-size="12" fill="#374151">“超 90MB 时”＝走“占位 + 磁盘替换”大文件通道时才进；2026-10-07 删掉的行：抓网文、恢复原 PDF、优化 EPUB、优化 PDF</text>
<text x="20" y="486" font-size="12" fill="#374151" xml:space="preserve">09-24 改动①：网页上传原来把 spool 锁攥到整个请求体收完（WiFi 传大书可达分钟级），期间 inbox 追平和别的上传全被卡住；</text>
<text x="20" y="506" font-size="12" fill="#374151" xml:space="preserve">              现在上传只在“挑名 + 改名”那一瞬进落名临界区。跨分区入库（09-25）也是锁外先拷到临时文件，锁内只挑名、改名。</text>
<text x="20" y="526" font-size="12" fill="#374151" xml:space="preserve">09-24 改动②：xochitl 的“当前文件夹”是它自己的全局状态，并发投递时 A 设完文件夹、B 又设了自己的，A 就落进 B 的文件夹；</text>
<text x="20" y="546" font-size="12" fill="#374151" xml:space="preserve">              现在进程内把“设文件夹 → /upload”串成一对（note-serve 是另一个进程，仍不受这把锁约束）。</text>
<text x="20" y="566" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑤：删除原来只“先查忙不忙再删”，中间可能被落库/改名插进来对着已删的文件跑；现在删除期间占着忙锁。</text>
<text x="20" y="586" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑥：大文件通道按“刚进库 + 大小等于占位”认领条目，PDF 占位字节都一样，两本同时投会认领同一个 uuid；现在整段串行。</text>
<text x="20" y="606" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑦：scp 直接写最终文件名，写到一半就被追平会进母版库一本半截书；现在修改时间静止不足 5 秒的文件先跳过，写完再收。</text>
</svg>
