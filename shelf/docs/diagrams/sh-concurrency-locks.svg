<text x="841.5" y="155" text-anchor="middle" font-size="10" fill="#6b7280">全局一把</text>
<rect x="908" y="96" width="121" height="70" rx="8" fill="#e6f3f7" stroke="#1f6f8b" stroke-width="1.5"/>
