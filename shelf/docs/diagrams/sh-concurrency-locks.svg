<line x1="1375" y1="174" x2="1375" y2="520" stroke="#e5e7eb"/>
<line x1="20" y1="398" x2="1372" y2="398" stroke="#9ca3af"/>
<text x="28" y="420" font-size="12.5" font-weight="bold" fill="#1f2937">锁住多久</text>
<text x="321.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">从提交到这本书</text>
<text x="321.0" y="431" text-anchor="middle" font-size="10.5" fill="#374151">不再 busy</text>
<text x="321.0" y="445" text-anchor="middle" font-size="10.5" fill="#374151">（最长 1 小时）</text>
<text x="445.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">整个操作</text>
<text x="445.0" y="431" text-anchor="middle" font-size="10.5" fill="#374151">（大书可到分钟级）</text>
<text x="569.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">只包挑名 + 改名</text>
<text x="569.0" y="431" text-anchor="middle" font-size="10.5" fill="#374151">（毫秒级本地操作）</text>
<text x="693.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">一轮 inbox 追平</text>
<text x="817.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">一次读-改-写</text>
<text x="941.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">一件作业：建文件夹、</text>
<text x="941.0" y="431" text-anchor="middle" font-size="10.5" fill="#374151">上传、认领（渲染</text>
<text x="941.0" y="445" text-anchor="middle" font-size="10.5" fill="#374151">自检另起线程）</text>
<text x="1065.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">设当前文件夹</text>
<text x="1065.0" y="431" text-anchor="middle" font-size="10.5" fill="#374151">+ 一次 /upload</text>
<text x="1189.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">快照 → 上传</text>
<text x="1189.0" y="431" text-anchor="middle" font-size="10.5" fill="#374151">→ 认出 uuid</text>
<text x="1313.0" y="417" text-anchor="middle" font-size="10.5" fill="#374151">传占位 → 认领</text>
<text x="1313.0" y="431" text-anchor="middle" font-size="10.5" fill="#374151">→ 换成真文件</text>
<line x1="20" y1="470" x2="1372" y2="470" stroke="#e5e7eb"/>
<text x="28" y="492" font-size="12.5" font-weight="bold" fill="#1f2937">防什么</text>
<text x="321.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">网页一次勾多本时</text>
<text x="321.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">同时往 xochitl 投</text>
<text x="445.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">同一本同时被</text>
<text x="445.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">加入/删/改名</text>
<text x="569.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">两本同名书挑到</text>
<text x="569.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">同一个名、互相覆盖</text>
<text x="693.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">两轮追平抢</text>
<text x="693.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">同一个文件</text>
<text x="817.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">并发写边车</text>
<text x="817.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">丢字段</text>
<text x="941.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">落库与直接导入</text>
<text x="941.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">同时往 xochitl 传</text>
<text x="1065.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">书或笔记本落进</text>
<text x="1065.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">别的投递的文件夹</text>
<text x="1189.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">同一份字节投两次，</text>
<text x="1189.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">后一次认走前一次的</text>
<text x="1313.0" y="489" text-anchor="middle" font-size="10.5" fill="#374151">两本大 PDF 认领</text>
<text x="1313.0" y="503" text-anchor="middle" font-size="10.5" fill="#374151">到同一个条目</text>
<line x1="20" y1="520" x2="1372" y2="520" stroke="#9ca3af"/>
<circle cx="34" cy="538" r="6" fill="#374151"/><text x="46" y="542" font-size="12" fill="#374151">总会进</text>
<circle cx="114" cy="538" r="5" fill="#ffffff" stroke="#374151" stroke-width="2.5"/><text x="126" y="542" font-size="12" fill="#374151">有条件才进：认领＝EPUB 走普通上传时（PDF 落库只上传、不认领）；大文件通道＝超体积门（默认 90MB）时（通道里按占位大小认领，也走 upload_and_claim）。</text>
<text x="46" y="562" font-size="12" fill="#374151">2026-10-07 删掉的行：抓网文、恢复原 PDF、优化 EPUB、优化 PDF</text>
<text x="20" y="592" font-size="12" fill="#374151" xml:space="preserve">09-24 改动①：网页上传原来把 spool 锁攥到整个请求体收完（WiFi 传大书可达分钟级），期间 inbox 追平和别的上传全被卡住；</text>
<text x="20" y="612" font-size="12" fill="#374151" xml:space="preserve">              现在上传只在“挑名 + 改名”那一瞬进落名临界区。跨分区入库（09-25）也是锁外先拷到临时文件，锁内只挑名、改名。</text>
<text x="20" y="632" font-size="12" fill="#374151" xml:space="preserve">09-24 改动②：xochitl 的“当前文件夹”是它自己的全局状态，并发投递时 A 设完文件夹、B 又设了自己的，A 就落进 B 的文件夹；进程内把</text>
<text x="20" y="652" font-size="12" fill="#374151" xml:space="preserve">              “设文件夹 → /upload”串成一对。10-10 起再加运行时目录下 xochitl-upload.lock 的 flock，note-serve 投笔记本也排进来。</text>
<text x="20" y="672" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑤：删除原来只“先查忙不忙再删”，中间可能被落库/改名插进来对着已删的文件跑；现在删除期间占着忙锁。</text>
<text x="20" y="692" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑥：大文件通道按“刚进库 + 大小等于占位”认领条目，PDF 占位字节都一样，两本同时投会认领同一个 uuid；现在整段串行。</text>
<text x="20" y="712" font-size="12" fill="#374151" xml:space="preserve">09-25 改动⑦：scp 直接写最终文件名，写到一半就被追平会进母版库一本半截书；现在修改时间静止不足 5 秒的文件先跳过，写完再收。</text>
<text x="20" y="732" font-size="12" fill="#374151" xml:space="preserve">10-10 改动⑧：落库原来每次新起一个线程、直接导入另有一套任务队列，几本书能同时往 xochitl 传；现在都排进 jobs.rs 的一个工作线程。</text>
<text x="20" y="752" font-size="12" fill="#374151" xml:space="preserve">10-10 改动⑨：认领（上传前快照 → 上传 → 在快照之外的新文档里按字节认）收进基座 upload_and_claim，认不出就不认，绝不取最新一本。</text>
</svg>
