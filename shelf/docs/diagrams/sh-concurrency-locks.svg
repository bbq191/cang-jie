<text x="192.0" y="206.0" font-size="11.5" fill="#1F2937" text-anchor="start">ops.rs OpRegistry（按书名）</text>
<rect x="410" y="186" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="206.0" font-size="11.5" fill="#1F2937" text-anchor="start">加入、改名（新旧两名）、删除</text>
<rect x="700" y="186" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="206.0" font-size="11.5" fill="#1F2937" text-anchor="start">整个操作（含排队）</text>
<rect x="950" y="186" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="206.0" font-size="11.5" fill="#1F2937" text-anchor="start">同一本被同时加入 / 删 / 改名</text>
