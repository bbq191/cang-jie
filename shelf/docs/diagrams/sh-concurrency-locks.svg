<text x="28" y="291" font-size="12.5" fill="#1f2937">改名（新旧两个名字都占忙锁）</text>
<circle cx="460.5" cy="286" r="7" fill="#b0451f"/>
<circle cx="587.5" cy="286" r="7" fill="#2f7d45"/>
<rect x="20" y="302" width="1266" height="32" fill="#f7f7f5"/>
