<defs><marker id="shconc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="shconc-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="shconc-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="615.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">书架的并发控制：哪条路径进哪把锁</text>
<text x="615.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">锁只包住真正会撞的那一小段；除批量队列（网关）与跨进程上传锁外，都在 book-serve 进程内。绿色两行是 2026-10-10 重构加的（未部署）</text>
<rect x="30" y="96" width="144" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="102.0" y="116.0" font-size="12.5" fill="#1F2937" text-anchor="middle">锁</text>
