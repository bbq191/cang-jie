<text x="587.5" y="155" text-anchor="middle" font-size="10" fill="#6b7280">母版库一把</text>
<rect x="654" y="96" width="121" height="70" rx="8" fill="#fdf6e3" stroke="#7a5a00" stroke-width="1.5"/>
<text x="714.5" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a00">spool 锁</text>
