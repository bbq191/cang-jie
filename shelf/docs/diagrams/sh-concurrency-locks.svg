<text x="696.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">书架服务的并发控制：哪条路径进哪把锁</text>
<text x="696.0" y="56" text-anchor="middle" font-size="13" fill="#6b7280">按 2026-10-10 重构后的代码（作业队列、跨进程上传锁、基座认领未部署）。各把锁的并发场景都没在真机专门触发。锁只包住真正会撞的那一小段</text>
<text x="696.0" y="76" text-anchor="middle" font-size="12.5" fill="#6b7280">第一列是网关批量队列的"一次一本"（不是锁；原并发闸门 budget.rs 2026-10-07 删除）；其余在 book-serve 进程内，只有上传锁另用锁文件的 flock 管到别的进程</text>
