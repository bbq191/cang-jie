<rect x="700" y="96" width="244" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="822.0" y="116.0" font-size="12.5" fill="#1F2937" text-anchor="middle">锁多久</text>
<rect x="950" y="96" width="244" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1072.0" y="116.0" font-size="12.5" fill="#1F2937" text-anchor="middle">防什么</text>
<rect x="30" y="140" width="144" height="38" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="42.0" y="160.0" font-size="11.5" fill="#1F2937" text-anchor="start">批量队列（不是锁）</text>
<rect x="180" y="140" width="224" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="192.0" y="160.0" font-size="11.5" fill="#1F2937" text-anchor="start">gateway batch.rs</text>
<rect x="410" y="140" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="160.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页一次勾多本「加入 xochitl」</text>
