<text x="192.0" y="252.0" font-size="11.5" fill="#1F2937" text-anchor="start">Staging::land</text>
<rect x="410" y="232" width="284" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="422.0" y="252.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页上传、inbox 追平、改名</text>
<rect x="700" y="232" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="712.0" y="252.0" font-size="11.5" fill="#1F2937" text-anchor="start">只包挑名 + 改名（毫秒级）</text>
