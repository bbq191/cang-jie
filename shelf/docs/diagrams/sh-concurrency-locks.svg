<text x="712.0" y="160.0" font-size="11.5" fill="#1F2937" text-anchor="start">到这本不再 busy（≤ 1 小时）</text>
<rect x="950" y="140" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="962.0" y="160.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页同时往 xochitl 投多本</text>
