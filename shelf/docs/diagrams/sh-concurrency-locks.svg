<text x="968.5" y="155" text-anchor="middle" font-size="10" fill="#6b7280">进程内 static</text>
<rect x="1035" y="96" width="121" height="70" rx="8" fill="#e9f1f7" stroke="#2b5c8a" stroke-width="1.5"/>
<text x="1095.5" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5c8a">大文件通道锁</text>
<text x="1095.5" y="138" text-anchor="middle" font-size="10" fill="#374151">rmsvc_core::xochitl</text>
<text x="1095.5" y="155" text-anchor="middle" font-size="10" fill="#6b7280">进程内 static</text>
<rect x="1162" y="96" width="121" height="70" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
<text x="1222.5" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555">配置同步锁</text>
<text x="1222.5" y="138" text-anchor="middle" font-size="10" fill="#374151">koreader-serve</text>
<text x="1222.5" y="155" text-anchor="middle" font-size="10" fill="#6b7280">ConfigSync</text>
<text x="28" y="138" font-size="13" font-weight="bold" fill="#1f2937">入口 / 操作</text>
