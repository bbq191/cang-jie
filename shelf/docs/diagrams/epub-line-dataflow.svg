<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="eld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="540" fill="#fbfbfa"/>
  <text x="520" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">传书 EPUB 线：三层 · 三动作正交</text>
  <text x="520" y="50" text-anchor="middle" font-size="12.5" fill="#6a6a6a">统一规则：所有书只落母版库——网页没有直投读器的路径；母版永久保留，落库不删</text>

  <!-- 内容源 -->
  <rect x="30" y="80" width="220" height="188" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="140" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">内容源（入库）</text>
  <rect x="48" y="118" width="184" height="44" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="140" y="137" text-anchor="middle" font-size="11" fill="#2a2a2a">网页上传</text>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#4a4a4a">多文件 · 真实进度 · 同名同大小去重</text>
  <rect x="48" y="170" width="184" height="44" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="140" y="189" text-anchor="middle" font-size="11" fill="#2a2a2a">抓网文</text>
  <text x="140" y="204" text-anchor="middle" font-size="10" fill="#4a4a4a">Readability 组 EPUB，可选同步优化</text>
  <rect x="48" y="222" width="184" height="36" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="140" y="238" text-anchor="middle" font-size="11" fill="#2a2a2a">scp 进设备 inbox/</text>
  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#4a4a4a">fswatch 追平（写完静止 5 秒才收）</text>

  <line x1="250" y1="170" x2="320" y2="170" stroke="#555" stroke-width="1.6" marker-end="url(#eld-arrow)"/>
  <text x="285" y="160" text-anchor="middle" font-size="10.5" fill="#5a5a5a">原样入库</text>
  <text x="285" y="190" text-anchor="middle" font-size="9.5" fill="#5a5a5a">只收 EPUB/PDF</text>

  <!-- 母版库 -->
  <rect x="325" y="66" width="330" height="352" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="490" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">母版库（中间层暂存池）</text>
  <text x="490" y="108" text-anchor="middle" font-size="10.5" fill="#4a4a4a">~/.local/state/shelf/books/staging/ · 永久保留</text>

  <rect x="345" y="122" width="290" height="68" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="141" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">优化（可选；PDF 另有转 EPUB / 裁边）</text>
  <text x="490" y="157" text-anchor="middle" font-size="10" fill="#4a4a4a">wash 清洗 + 目录 + 封面保证 → 逐图片流式（并行，限内存）</text>
  <text x="490" y="171" text-anchor="middle" font-size="10" fill="#4a4a4a">过质量门才覆盖原文件；漫画可选「页边距最小化」</text>
  <text x="490" y="184" text-anchor="middle" font-size="10" fill="#4a4a4a">spawn_optimize 异步，progress 推 SSE</text>

  <rect x="345" y="198" width="290" height="50" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">忙锁 busy（内存，进程重启即清零）</text>
  <text x="490" y="233" text-anchor="middle" font-size="10" fill="#4a4a4a">同一本书「优化」「落库」「删除」互斥；EPUB 优化可取消</text>

  <rect x="345" y="256" width="290" height="66" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">sidecar .&lt;name&gt;.delivered（磁盘）</text>
  <text x="490" y="292" text-anchor="middle" font-size="10" fill="#4a4a4a">optimize（带进度）/ deliver：status + message</text>
  <text x="490" y="306" text-anchor="middle" font-size="10" fill="#4a4a4a">native 时间戳（koreader 只剩旧记录）+ render 自检结果</text>

  <rect x="345" y="332" width="290" height="72" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="351" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">落库（原样复制字节，不再优化）</text>
  <text x="490" y="367" text-anchor="middle" font-size="10" fill="#4a4a4a">留空 = 书库根；&gt;90MB 走占位+替换（≤1GiB）</text>
  <text x="490" y="381" text-anchor="middle" font-size="10" fill="#4a4a4a">占位通道走不了就整本拒绝（不再分卷）</text>
  <text x="490" y="395" text-anchor="middle" font-size="10" fill="#4a4a4a">spawn_deliver 异步，渲染自检另起线程</text>

  <line x1="655" y1="200" x2="720" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#eld-arrow)"/>
  <line x1="655" y1="370" x2="720" y2="410" stroke="#aaa" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 读器 -->
  <rect x="725" y="90" width="270" height="112" rx="10" fill="#fdf3f0" stroke="#b5541f" stroke-width="1.6"/>
  <text x="860" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl（设备自带，唯一落库目标）</text>
  <text x="860" y="132" text-anchor="middle" font-size="10.5" fill="#5a3a2a">≤90MB 流式 upload；&gt;90MB 占位+磁盘替换</text>
  <text x="860" y="148" text-anchor="middle" font-size="10.5" fill="#5a3a2a">投完 render_check 页数自检（EPUB）</text>
  <text x="860" y="164" text-anchor="middle" font-size="10.5" fill="#5a3a2a">符合条件的漫画：登记首开设页边距</text>
  <text x="860" y="180" text-anchor="middle" font-size="10.5" fill="#5a3a2a">只读 EPUB / PDF</text>

  <rect x="725" y="360" width="270" height="90" rx="10" fill="#f4f4f2" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="860" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a6a6a">（历史）KOReader</text>
  <text x="860" y="402" text-anchor="middle" font-size="10.5" fill="#7a7a7a">2026-09-29 从设备卸载，落库入口全部删除</text>
  <text x="860" y="418" text-anchor="middle" font-size="10.5" fill="#7a7a7a">当时由 koreader-serve 从母版库本地拷贝，</text>
  <text x="860" y="434" text-anchor="middle" font-size="10.5" fill="#7a7a7a">与 xochitl 同一份母版字节</text>

  <!-- SSE loop back -->
  <path d="M 490 404 C 490 480, 140 480, 140 268" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#eld-arrow)"/>
  <text x="310" y="492" text-anchor="middle" font-size="11" fill="#6a6a6a">EventBus → SSE /api/events → 浏览器零轮询自动刷新列表</text>

  <text x="520" y="512" text-anchor="middle" font-size="11" fill="#8a8a8a">优化/落库都异步（HTTP 立即回"已开始"），进度靠 sidecar+SSE 呈现，不是轮询查出来的</text>
  <text x="520" y="530" text-anchor="middle" font-size="11" fill="#8a8a8a">批量队列与并发/内存闸门在网关，不在 book-serve，见 §7.2</text>
</svg>
