<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="sans-serif">
  <defs>
    <marker id="eld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="500" fill="#fbfbfa"/>
  <text x="520" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">传书 EPUB 线：三层 · 三动作正交</text>
  <text x="520" y="50" text-anchor="middle" font-size="12.5" fill="#6a6a6a">统一规则：所有书只落母版库——网页没有直投读器的路径；母版永久保留，落库不删</text>

  <!-- 内容源 -->
  <rect x="30" y="80" width="220" height="140" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="140" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">内容源（入库）</text>
  <rect x="48" y="118" width="184" height="36" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="140" y="140" text-anchor="middle" font-size="11" fill="#2a2a2a">网页上传（多文件+进度+去重）</text>
  <rect x="48" y="162" width="184" height="36" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="140" y="184" text-anchor="middle" font-size="11" fill="#2a2a2a">抓网文（Readability 组 EPUB）</text>

  <line x1="250" y1="150" x2="320" y2="150" stroke="#555" stroke-width="1.6" marker-end="url(#eld-arrow)"/>
  <text x="285" y="140" text-anchor="middle" font-size="10.5" fill="#5a5a5a">原样入库</text>

  <!-- 母版库 -->
  <rect x="325" y="66" width="330" height="330" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="490" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">母版库（中间层暂存池）</text>
  <text x="490" y="108" text-anchor="middle" font-size="10.5" fill="#4a4a4a">~/.local/state/shelf/books/staging/</text>

  <rect x="345" y="122" width="290" height="56" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">优化（可选，仅 EPUB）</text>
  <text x="490" y="158" text-anchor="middle" font-size="10" fill="#4a4a4a">wash+htmlproc+TOC → 逐图片流式处理</text>
  <text x="490" y="172" text-anchor="middle" font-size="10" fill="#4a4a4a">spawn_optimize 异步，progress 推 SSE</text>

  <rect x="345" y="186" width="290" height="50" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">忙锁 busy（内存，进程重启即清零）</text>
  <text x="490" y="220" text-anchor="middle" font-size="10" fill="#4a4a4a">同一条目「优化」「落库」互斥，防并发撞车</text>

  <rect x="345" y="244" width="290" height="66" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">sidecar .&lt;name&gt;.delivered（磁盘）</text>
  <text x="490" y="280" text-anchor="middle" font-size="10" fill="#4a4a4a">optimize/deliver：status+message+progress</text>
  <text x="490" y="294" text-anchor="middle" font-size="10" fill="#4a4a4a">native/koreader 时间戳 + render 自检结果</text>

  <rect x="345" y="322" width="290" height="58" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="490" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">落库（原样复制字节，不再优化）</text>
  <text x="490" y="358" text-anchor="middle" font-size="10" fill="#4a4a4a">folder 留空 = 书库根；超限漫画按卷拆分</text>
  <text x="490" y="372" text-anchor="middle" font-size="10" fill="#4a4a4a">spawn_deliver 异步，渲染自检另起线程</text>

  <line x1="655" y1="180" x2="720" y2="140" stroke="#555" stroke-width="1.6" marker-end="url(#eld-arrow)"/>
  <line x1="655" y1="350" x2="720" y2="390" stroke="#555" stroke-width="1.6" marker-end="url(#eld-arrow)"/>

  <!-- 读器 -->
  <rect x="725" y="90" width="270" height="90" rx="10" fill="#fdf3f0" stroke="#b5541f" stroke-width="1.6"/>
  <text x="860" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl（原生，学术/批注）</text>
  <text x="860" y="132" text-anchor="middle" font-size="10.5" fill="#5a3a2a">upload_file 流式；folder 找不到落根</text>
  <text x="860" y="148" text-anchor="middle" font-size="10.5" fill="#5a3a2a">投完 render_check 页数自检</text>
  <text x="860" y="164" text-anchor="middle" font-size="10.5" fill="#5a3a2a">只读 EPUB / PDF</text>

  <rect x="725" y="340" width="270" height="90" rx="10" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.6"/>
  <text x="860" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">KOReader（消遣阅读）</text>
  <text x="860" y="382" text-anchor="middle" font-size="10.5" fill="#3a3a3a">adopt：本地文件系统拷贝</text>
  <text x="860" y="398" text-anchor="middle" font-size="10.5" fill="#3a3a3a">没有服务端忙态，网页补本地忙态</text>
  <text x="860" y="414" text-anchor="middle" font-size="10.5" fill="#3a3a3a">两读器同一份母版字节，可对照</text>

  <!-- SSE loop back -->
  <path d="M 490 380 C 490 450, 140 450, 140 220" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#eld-arrow)"/>
  <text x="310" y="462" text-anchor="middle" font-size="11" fill="#6a6a6a">EventBus → SSE /api/events → 浏览器零轮询自动刷新列表</text>

  <text x="520" y="486" text-anchor="middle" font-size="11" fill="#8a8a8a">优化/落库都异步（HTTP 立即回"已开始"），进度靠 sidecar+SSE 呈现，不是轮询查出来的</text>
</svg>
