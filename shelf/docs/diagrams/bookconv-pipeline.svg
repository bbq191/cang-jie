<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#fbfbfa"/>
  <text x="590" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">bookconv 优化管线：阶段一（整书结构）+ 阶段二（逐条目变换）</text>
  <text x="590" y="48" text-anchor="middle" font-size="12" fill="#4a4a4a">book-serve 母版库「优化」与开发期 epub-optimize 调同一份代码；产出是新 EPUB，原书字节不动</text>

  <!-- 阶段标签 -->
  <text x="20" y="80" font-size="13" font-weight="bold" fill="#4a6fa5">阶段一：读入 + 整书级判断（prepare_entries）</text>
  <text x="180" y="362" font-size="13" font-weight="bold" fill="#b0451f">阶段二：逐条目变换 + 写出（第二遍 + 图片 + 打包）</text>

  <!-- A1 -->
  <rect x="20" y="92" width="262" height="205" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="151" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">1 读取 + 封面声明</text>
  <text x="151" y="138" text-anchor="middle" font-size="11.5" fill="#2a2a2a">输入：EPUB 文件（流式）或字节</text>
  <text x="151" y="158" text-anchor="middle" font-size="11.5" fill="#2a2a2a">读条目（无扩展名章节按内容认）；图片只占位</text>
  <text x="151" y="176" text-anchor="middle" font-size="11.5" fill="#2a2a2a">（真实字节到阶段二再按需读）</text>
  <text x="151" y="198" text-anchor="middle" font-size="11.5" fill="#a03030">读条目失败 = 整体报错</text>
  <text x="151" y="214" text-anchor="middle" font-size="11.5" fill="#a03030">绝不静默产出残缺 EPUB</text>
  <text x="151" y="238" text-anchor="middle" font-size="11.5" fill="#2a2a2a">ensure_cover_declared</text>
  <text x="151" y="256" text-anchor="middle" font-size="11.5" fill="#2a2a2a">保证 OPF 有效封面声明</text>
  <text x="151" y="274" text-anchor="middle" font-size="11.5" fill="#6a6a6a">须在 wash 之前（wash 会删 SVG 封面页）</text>

  <line x1="282" y1="195" x2="308" y2="195" stroke="#555" stroke-width="1.6" marker-end="url(#p1)"/>

  <!-- A2 wash -->
  <rect x="312" y="92" width="262" height="205" rx="8" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="443" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">2 wash 清洗（可选，§02）</text>
  <text x="443" y="136" text-anchor="middle" font-size="11.5" fill="#3a3a3a">伪 DRM 剥离（真 DRM 报错停）</text>
  <text x="443" y="154" text-anchor="middle" font-size="11.5" fill="#3a3a3a">空页清理 → 死引用清理</text>
  <text x="443" y="172" text-anchor="middle" font-size="11.5" fill="#3a3a3a">主语言探测 → CSS 锁剥离</text>
  <text x="443" y="190" text-anchor="middle" font-size="11.5" fill="#3a3a3a">边距段距 → 外链 cangjie-wash.css</text>
  <text x="443" y="208" text-anchor="middle" font-size="11.5" fill="#3a3a3a">NCX 三项修复 → 分部重建</text>
  <text x="443" y="226" text-anchor="middle" font-size="11.5" fill="#3a3a3a">缺目录才自动建目录</text>
  <text x="443" y="250" text-anchor="middle" font-size="11.5" fill="#6a5a2a">opts.wash = None 时整步跳过</text>
  <text x="443" y="268" text-anchor="middle" font-size="11.5" fill="#6a5a2a">（book-serve 缺省开；网文抓取不开）</text>

  <line x1="574" y1="195" x2="600" y2="195" stroke="#555" stroke-width="1.6" marker-end="url(#p1)"/>

  <!-- A3 重排+漫画识别 -->
  <rect x="604" y="92" width="262" height="205" rx="8" fill="#eaf7ec" stroke="#3f9a55" stroke-width="1.5"/>
  <text x="735" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">3 重排 + 漫画识别</text>
  <text x="735" y="138" text-anchor="middle" font-size="11.5" fill="#2a2a2a">mimetype 置首（STORED）</text>
  <text x="735" y="156" text-anchor="middle" font-size="11.5" fill="#2a2a2a">其余原序，旧优化标记剔除</text>
  <text x="735" y="182" text-anchor="middle" font-size="11.5" fill="#2a2a2a">comic_detect::is_comic</text>
  <text x="735" y="200" text-anchor="middle" font-size="11.5" fill="#2a2a2a">图 ≥20 张且平均每图文字 &lt;40 字</text>
  <text x="735" y="218" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ 后面图片走「漫画路」</text>
  <text x="735" y="244" text-anchor="middle" font-size="11.5" fill="#6a6a6a">（判在 wash 之后，空页已清）</text>

  <line x1="866" y1="195" x2="892" y2="195" stroke="#555" stroke-width="1.6" marker-end="url(#p1)"/>

  <!-- A4 第一遍 -->
  <rect x="896" y="92" width="264" height="205" rx="8" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.5"/>
  <text x="1028" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">4 第一遍（逐 html，§03/§04）</text>
  <text x="1028" y="138" text-anchor="middle" font-size="11.5" fill="#2a2a2a">normalize_self_hrefs</text>
  <text x="1028" y="156" text-anchor="middle" font-size="11.5" fill="#2a2a2a">strip_font_locks（剥字体锁）</text>
  <text x="1028" y="174" text-anchor="middle" font-size="11.5" fill="#2a2a2a">扫全书 marker → referenced 集</text>
  <text x="1028" y="192" text-anchor="middle" font-size="11.5" fill="#2a2a2a">被引用的注释块移出章节</text>
  <text x="1028" y="210" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ 建 aside_index</text>
  <text x="1028" y="236" text-anchor="middle" font-size="11.5" fill="#6a6a6a">漫画 + MinMargin 页框另加</text>
  <text x="1028" y="254" text-anchor="middle" font-size="11.5" fill="#6a6a6a">comic_pad 文字页留边（§20）</text>
  <text x="1028" y="278" text-anchor="middle" font-size="11.5" fill="#6a6a6a">未被引用的注释块原样留原处</text>

  <!-- 拐弯箭头：阶段一 -> 阶段二 -->
  <path d="M 1028 297 L 1028 328 L 151 328 L 151 388" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#p1)"/>
  <text x="590" y="320" text-anchor="middle" font-size="11.5" fill="#6a6a6a">entries + aside_index + is_comic_book 交给阶段二</text>

  <!-- B1 第二遍 -->
  <rect x="20" y="392" width="330" height="200" rx="8" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.5"/>
  <text x="185" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">5 第二遍：每个 html 章节</text>
  <text x="185" y="438" text-anchor="middle" font-size="11.5" fill="#2a2a2a">break_footnote_cycles（拆互指环）</text>
  <text x="185" y="456" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ fix_duokan_markers → 封面 SVG 换 img</text>
  <text x="185" y="474" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ preserve_relink_footnotes（缺省 Anchor）</text>
  <text x="185" y="492" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ boost_text_contrast（灰字→黑）</text>
  <text x="185" y="510" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ inline_remote_images（抓不到就删）</text>
  <text x="185" y="528" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ dedup_ids_in_chapter（全书 id 去重）</text>
  <text x="185" y="552" text-anchor="middle" font-size="11.5" fill="#6a6a6a">独立 .css 条目：boost_contrast_css</text>
  <text x="185" y="570" text-anchor="middle" font-size="11.5" fill="#6a6a6a">OPF：改 dc:title（仅落库规范命名时）</text>

  <!-- B2 图片 -->
  <rect x="380" y="392" width="390" height="200" rx="8" fill="#eaf5ee" stroke="#3f9a55" stroke-width="1.5"/>
  <text x="575" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">6 每张图片（§05）</text>
  <text x="575" y="438" text-anchor="middle" font-size="11.5" fill="#2a2a2a">文字书：downscale_for_epub</text>
  <text x="575" y="456" text-anchor="middle" font-size="11.5" fill="#2a2a2a">竖向框 954×1696、宽绝不超 954、JPEG q85</text>
  <text x="575" y="482" text-anchor="middle" font-size="11.5" fill="#2a2a2a">漫画：prepare_comic_page_for_epub</text>
  <text x="575" y="500" text-anchor="middle" font-size="11.5" fill="#2a2a2a">解码一次 → 裁边 → 缩放 → 补白 → 编码一次</text>
  <text x="575" y="518" text-anchor="middle" font-size="11.5" fill="#2a2a2a">页框由 comic_frame 决定：Screen / MinMargin</text>
  <text x="575" y="544" text-anchor="middle" font-size="11.5" fill="#6a6a6a">流式路径：imgpool 并行（≤2 线程）</text>
  <text x="575" y="562" text-anchor="middle" font-size="11.5" fill="#6a6a6a">+ 像素预算 600 万；单图 &gt;900 万像素原样保留</text>

  <!-- B3 打包 -->
  <rect x="800" y="392" width="360" height="200" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="980" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">7 打包 + 幂等标记 → 输出 EPUB</text>
  <text x="980" y="438" text-anchor="middle" font-size="11.5" fill="#2a2a2a">mimetype STORED；文本 deflate；图片 deflate 快档</text>
  <text x="980" y="464" text-anchor="middle" font-size="11.5" fill="#2a2a2a">抓到的远程图追加进 zip</text>
  <text x="980" y="490" text-anchor="middle" font-size="11.5" fill="#2a2a2a">写 META-INF/com.cangjie.optimized</text>
  <text x="980" y="508" text-anchor="middle" font-size="11.5" fill="#2a2a2a">= "15"（含 wash）或 "15-core"（wash=None）</text>
  <text x="980" y="534" text-anchor="middle" font-size="11.5" fill="#6a6a6a">optimized_version() 读它判 full / core / old</text>
  <text x="980" y="552" text-anchor="middle" font-size="11.5" fill="#6a6a6a">旧版本重传按当前版本重新走一遍，脚注不翻倍</text>

  <line x1="350" y1="492" x2="376" y2="492" stroke="#555" stroke-width="1.6" marker-end="url(#p1)"/>
  <line x1="770" y1="492" x2="796" y2="492" stroke="#555" stroke-width="1.6" marker-end="url(#p1)"/>

  <text x="590" y="616" text-anchor="middle" font-size="12" fill="#4a4a4a">两个入口共用 first_pass_html / transform_html_chapter / transform_image_bytes：optimize_epub_with(&amp;[u8]) 整本进内存（测试/小书），StreamingOptimize 路径进路径出（真机大书，§14）</text>
  <text x="590" y="634" text-anchor="middle" font-size="11.5" fill="#8a8a8a">xochitl 渲染硬规则（为什么每一步要这样做）见 §09</text>
</svg>
