<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#fbfbfa"/>
  <text x="590" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">脚注：四种真机形态 → 一套抽取 → 两种 FootnoteMode</text>
  <text x="590" y="48" text-anchor="middle" font-size="12" fill="#4a4a4a">零丢失原则：没被任何 marker 引用的注释块原样留在原处，不搬不删</text>

  <!-- 4 forms -->
  <rect x="20" y="90" width="270" height="250" rx="9" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="155" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">输入：真机遇到的四种形态</text>
  <text x="155" y="142" text-anchor="middle" font-size="11.5" fill="#2a2a2a">① 同章 noteref ↔ aside</text>
  <text x="155" y="170" text-anchor="middle" font-size="11.5" fill="#2a2a2a">② 跨文件 &lt;a href="notes.xhtml#nX"&gt;</text>
  <text x="155" y="187" text-anchor="middle" font-size="11.5" fill="#2a2a2a">+ 尾注 &lt;p id="nX"&gt;</text>
  <text x="155" y="215" text-anchor="middle" font-size="11.5" fill="#2a2a2a">③ duokan 图片脚注标记</text>
  <text x="155" y="232" text-anchor="middle" font-size="11.5" fill="#6a6a6a">→ fix_duokan_markers 换上标数字</text>
  <text x="155" y="260" text-anchor="middle" font-size="11.5" fill="#2a2a2a">④ 双向互指对（marker ↔ 注释互链）</text>
  <text x="155" y="277" text-anchor="middle" font-size="11.5" fill="#a03030">reMarkable 索引器会把整对丢弃</text>
  <text x="155" y="294" text-anchor="middle" font-size="11.5" fill="#6a6a6a">→ break_footnote_cycles 拆环</text>
  <text x="155" y="322" text-anchor="middle" font-size="11.5" fill="#6a6a6a">先 normalize_self_hrefs 归一裸锚</text>

  <line x1="290" y1="215" x2="322" y2="215" stroke="#555" stroke-width="1.6" marker-end="url(#n1)"/>

  <!-- extraction -->
  <rect x="326" y="90" width="320" height="250" rx="9" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.5"/>
  <text x="486" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">抽取：第一遍 → 第二遍</text>
  <text x="486" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a1f">第一遍（扫全书）</text>
  <text x="486" y="160" text-anchor="middle" font-size="11.5" fill="#2a2a2a">referenced_note_frags：得到被引用的</text>
  <text x="486" y="177" text-anchor="middle" font-size="11.5" fill="#2a2a2a">注释 id 集</text>
  <text x="486" y="199" text-anchor="middle" font-size="11.5" fill="#2a2a2a">collect_footnote_notes：把这些注释块</text>
  <text x="486" y="216" text-anchor="middle" font-size="11.5" fill="#2a2a2a">（aside / p / li / div）移出章节，建 aside_index</text>
  <text x="486" y="233" text-anchor="middle" font-size="11.5" fill="#6a6a6a">块须自带 footnote/note 语义；嵌套 div 跳过</text>
  <text x="486" y="263" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a1f">第二遍（逐章）</text>
  <text x="486" y="283" text-anchor="middle" font-size="11.5" fill="#2a2a2a">break_footnote_cycles → fix_duokan_markers</text>
  <text x="486" y="301" text-anchor="middle" font-size="11.5" fill="#2a2a2a">→ 纯图标号换上标数字 → preserve_relink(mode)</text>
  <text x="486" y="319" text-anchor="middle" font-size="11.5" fill="#6a6a6a">把注释块搬进引用它的那一章</text>

  <!-- fork arrows -->
  <line x1="646" y1="180" x2="688" y2="140" stroke="#555" stroke-width="1.6" marker-end="url(#n1)"/>
  <line x1="646" y1="260" x2="688" y2="360" stroke="#555" stroke-width="1.6" marker-end="url(#n1)"/>

  <!-- Anchor -->
  <rect x="692" y="70" width="290" height="200" rx="9" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.5"/>
  <text x="837" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">FootnoteMode::Anchor（缺省）</text>
  <text x="837" y="118" text-anchor="middle" font-size="11.5" fill="#2a2a2a">标号原样保留，链接改指同章锚点</text>
  <text x="837" y="135" text-anchor="middle" font-size="11.5" fill="#2a2a2a">#nX；不再追加 [N]（09-29 起）</text>
  <text x="837" y="159" text-anchor="middle" font-size="11.5" fill="#2a2a2a">注释移到 &lt;/body&gt; 之内的章末</text>
  <text x="837" y="176" text-anchor="middle" font-size="11.5" fill="#2a2a2a">&lt;hr/&gt;&lt;div class="footnotes"&gt;</text>
  <text x="837" y="200" text-anchor="middle" font-size="11.5" fill="#2a2a2a">注释里不加回链（会构成互指对被丢）</text>
  <text x="837" y="224" text-anchor="middle" font-size="11.5" fill="#6a6a6a">返回靠 xochitl 原生「返回」浮标</text>
  <text x="837" y="248" text-anchor="middle" font-size="11.5" fill="#6a6a6a">章末可见，不是页底（EPUB 做不到）</text>

  <!-- Inline -->
  <rect x="692" y="320" width="290" height="200" rx="9" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
  <text x="837" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">FootnoteMode::Inline（备选）</text>
  <text x="837" y="368" text-anchor="middle" font-size="11.5" fill="#2a2a2a">注释就地内联 &lt;span class="cj-fnote"&gt;</text>
  <text x="837" y="385" text-anchor="middle" font-size="11.5" fill="#2a2a2a">〔纯文本〕&lt;/span&gt;，始终可见、不跳转</text>
  <text x="837" y="411" text-anchor="middle" font-size="11.5" fill="#a03030">必须丢弃原 marker（图标 img 会按</text>
  <text x="837" y="428" text-anchor="middle" font-size="11.5" fill="#a03030">固有尺寸巨大且每条重复）</text>
  <text x="837" y="452" text-anchor="middle" font-size="11.5" fill="#a03030">必须去标签取纯文本（防整章白屏）</text>
  <text x="837" y="484" text-anchor="middle" font-size="11.5" fill="#6a6a6a">当前无任何调用入口，仅单测保留</text>
  <text x="837" y="502" text-anchor="middle" font-size="11.5" fill="#6a6a6a">（xochitl 无弹窗脚注，见 §09 ⑤）</text>

  <!-- 右侧汇总卡 -->
  <rect x="1010" y="90" width="150" height="250" rx="9" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="1085" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a2a2a">谁用哪种</text>
  <text x="1085" y="142" text-anchor="middle" font-size="11.5" fill="#3a3a3a">母版库「优化」</text>
  <text x="1085" y="159" text-anchor="middle" font-size="11.5" fill="#3a3a3a">→ Anchor</text>
  <text x="1085" y="187" text-anchor="middle" font-size="11.5" fill="#3a3a3a">网文抓取</text>
  <text x="1085" y="204" text-anchor="middle" font-size="11.5" fill="#3a3a3a">→ Anchor（缺省值）</text>
  <text x="1085" y="232" text-anchor="middle" font-size="11.5" fill="#3a3a3a">epub-optimize</text>
  <text x="1085" y="249" text-anchor="middle" font-size="11.5" fill="#3a3a3a">→ Anchor（固定）</text>
  <text x="1085" y="277" text-anchor="middle" font-size="11.5" fill="#3a3a3a">Inline</text>
  <text x="1085" y="294" text-anchor="middle" font-size="11.5" fill="#3a3a3a">→ 仅测试</text>

  <text x="590" y="545" text-anchor="middle" font-size="12" fill="#4a4a4a">详见 §04；xochitl 硬规则见 §09 ① ⑤ ⑥</text>
</svg>
