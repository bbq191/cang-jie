<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 640" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="bj-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1088" height="640" fill="#fbfbfa"/>
<text x="544" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">一本书的旅程：电脑上优化 → 上传 → 母版库 → 加入 xochitl</text>
<text x="544" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">2026-10-07 起书架只搬运、不改书：优化全部在电脑上用 sheng-ren 做，设备上原样投进 xochitl</text>

<!-- ① 电脑 -->
<rect x="24" y="72" width="236" height="300" rx="10" fill="#eceaf4" stroke="#6a5aa5" stroke-width="1.6"/>
<text x="142" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">① 电脑上优化</text>
<text x="142" y="114" text-anchor="middle" font-size="11" fill="#6a5aa5">sheng-ren（booklib）· 不在本仓库</text>
<rect x="38" y="126" width="208" height="112" rx="7" fill="#fff" stroke="#6a5aa5"/>
<text x="50" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">xochitl 阅读模式出 EPUB</text>
<text x="50" y="166" font-size="11" fill="#4a4a4a">排版、目录、注释跳转、封面</text>
<text x="50" y="184" font-size="11" fill="#4a4a4a">漫画裁边、缩放、补白</text>
<text x="50" y="202" font-size="11" fill="#4a4a4a">漫画写页边距标记</text>
<text x="50" y="220" font-size="10.5" fill="#6a6a6a">META-INF/eink-reader-margins</text>
<text x="50" y="262" font-size="11" fill="#4a4a4a">规则：sheng-ren docs/typesetting.md</text>
<text x="50" y="280" font-size="11" fill="#4a4a4a">阅读器踩坑：docs/xochitl.md</text>
<text x="50" y="306" font-size="11" fill="#4a4a4a">PDF 不处理，直接传也行</text>
<text x="50" y="324" font-size="11" fill="#4a4a4a">其它格式先在电脑上转好</text>

<polyline points="260,200 290,200" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#bj-a)"/>

<!-- ② 入库 -->
<rect x="292" y="72" width="236" height="300" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="410" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">② 入库</text>
<rect x="306" y="110" width="208" height="52" rx="7" fill="#fff" stroke="#4a6fa5"/>
<text x="410" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">网页上传</text>
<text x="410" y="150" text-anchor="middle" font-size="11" fill="#4a4a4a">「传书 → 入库」，可多文件</text>
<rect x="306" y="172" width="208" height="52" rx="7" fill="#fff" stroke="#4a6fa5"/>
<text x="410" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">scp 进设备 inbox/</text>
<text x="410" y="212" text-anchor="middle" font-size="11" fill="#4a4a4a">写完静止 5 秒才收</text>
<text x="306" y="252" font-size="11" fill="#4a4a4a">· 字节原样，不改书</text>
<text x="306" y="272" font-size="11" fill="#4a4a4a">· 只收 EPUB / PDF</text>
<text x="306" y="292" font-size="11" fill="#4a4a4a">· 同名同内容不重复存</text>
<text x="306" y="312" font-size="11" fill="#4a4a4a">· 同名不同内容加数字前缀</text>
<text x="306" y="332" font-size="11" fill="#4a4a4a">· 文件名规范成「书名 - 02卷」</text>

<polyline points="528,200 558,200" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#bj-a)"/>

<!-- ③ 母版库 -->
<rect x="560" y="72" width="236" height="300" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="678" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">③ 母版库 staging/</text>
<text x="678" y="114" text-anchor="middle" font-size="11" fill="#8a6a10">永久保留，可反复加入</text>
<text x="574" y="142" font-size="11" fill="#4a4a4a">· 勾选后底部栏操作</text>
<text x="574" y="162" font-size="11" fill="#4a4a4a">· 只勾一本：下载原件 · 改名</text>
<text x="585" y="182" font-size="11" fill="#4a4a4a">（改名只改文件名）</text>
<text x="574" y="202" font-size="11" fill="#4a4a4a">· 删除（忙时拒绝）</text>
<text x="574" y="222" font-size="11" fill="#4a4a4a">· 筛选：全部 / 未加入 / 已加入</text>
<rect x="574" y="244" width="208" height="92" rx="7" fill="#fffaf0" stroke="#c9971f" stroke-dasharray="5 3"/>
<text x="586" y="264" font-size="11.5" font-weight="bold" fill="#1a1a1a">边车 .&lt;书名&gt;.delivered</text>
<text x="586" y="284" font-size="11" fill="#4a4a4a">最近加入时间</text>
<text x="586" y="302" font-size="11" fill="#4a4a4a">加入结果 pending/ok/failed</text>
<text x="586" y="320" font-size="11" fill="#4a4a4a">渲染自检页数</text>

<polyline points="796,200 826,200" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#bj-a)"/>

<!-- ④ 加入 xochitl -->
<rect x="828" y="72" width="236" height="300" rx="10" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.6"/>
<text x="946" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">④ 加入 xochitl</text>
<text x="946" y="114" text-anchor="middle" font-size="11" fill="#8a3010">复制母版字节，可批量</text>
<text x="842" y="142" font-size="11" fill="#4a4a4a">· 选文件夹；没有就排队</text>
<text x="853" y="160" font-size="11" fill="#4a4a4a">让 xochitl 自己建</text>
<text x="842" y="184" font-size="11" fill="#1a1a1a">≤ 90MB：流式 POST /upload</text>
<text x="842" y="204" font-size="11" fill="#1a1a1a">&gt; 90MB 且 ≤ 1GB：</text>
<text x="853" y="222" font-size="11" fill="#1a1a1a">占位 + 磁盘替换</text>
<text x="842" y="242" font-size="11" fill="#1a1a1a">再大：整本拒绝</text>
<text x="842" y="268" font-size="11" fill="#4a4a4a">· 渲染自检：页数 vs 预期</text>
<text x="842" y="292" font-size="11" fill="#4a4a4a">· 漫画带 sheng-ren 页边距标记：</text>
<text x="853" y="310" font-size="11" fill="#4a4a4a">一律登记（没有开关），</text>
<text x="853" y="328" font-size="11" fill="#4a4a4a">首次打开自动设页边距 1</text>

<!-- 横切 -->
<rect x="24" y="394" width="512" height="104" rx="10" fill="#f0efe9" stroke="#8a8a8a"/>
<text x="280" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">网关 gateway :443</text>
<text x="40" y="440" font-size="11" fill="#4a4a4a">HTTPS + 密码 · 单页网页 · /api/&lt;段&gt;/* 反向代理 · SSE 推送，网页不轮询</text>
<text x="40" y="460" font-size="11" fill="#4a4a4a">批量队列：只剩「加入 xochitl」，顺序逐本、落盘续跑、可全部中止</text>
<text x="40" y="480" font-size="11" fill="#4a4a4a">闸门：只拦「加入 xochitl」，&gt;90MB 同时 1 本，其余 3 本</text>
<rect x="552" y="394" width="512" height="104" rx="10" fill="#f0efe9" stroke="#8a8a8a"/>
<text x="808" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">xochitl 里的 qmd 代理（book-serve 排队、xochitl 自己做）</text>
<text x="568" y="440" font-size="11" fill="#4a4a4a">建文件夹 · 移进回收站 · 漫画页边距</text>
<text x="568" y="460" font-size="11" fill="#4a4a4a">日漫翻页：只读书里自带的 OPF rtl 标记（+ 旧手动清单）</text>
<text x="568" y="480" font-size="11" fill="#4a4a4a">改 qmd 后要整机重启才加载</text>

<rect x="24" y="512" width="1040" height="58" rx="10" fill="#f4f4f2" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="40" y="534" font-size="12" font-weight="bold" fill="#8a8a8a">已删除（git 历史可查）</text>
<text x="40" y="555" font-size="11" fill="#8a8a8a">2026-10-07：设备上「优化」· PDF 转 EPUB / 裁边 · 原 PDF 备份 · 抓网文 · 联网补封面 · 旧产物兼容 · 中途取消　｜　09-30：超限按卷拆分 · 按书设方向　｜　09-29：加入 KOReader</text>

<text x="544" y="596" text-anchor="middle" font-size="11" fill="#4a4a4a">代码：shelf/services/book-serve（:8790）母版库 · 加入 · 代理队列　·　shelf/crates/shelf-conv：PDF 页数 · 占位文档 · 渲染统计 · 书名规范（只读不改书）</text>
<text x="544" y="616" text-anchor="middle" font-size="11" fill="#6a6a6a">sheng-ren 的 bookconv 是 git 依赖，书架只用它读 EPUB 的公开接口，不调用优化器</text>
</svg>
