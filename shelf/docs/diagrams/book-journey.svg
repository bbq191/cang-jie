<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="bookjo-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="bookjo-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="bookjo-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600.0" y="32.0" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">一本书的旅程：电脑上优化 → 入库 → 母版库 → 加入 xochitl</text>
<text x="600.0" y="54.0" font-size="12" fill="#6B7280" text-anchor="middle">书架只搬运、不改书：优化全在电脑上用 sheng-ren 做（2026-10-07 起），设备上把字节原样投进 xochitl</text>
<rect x="30" y="96" width="255" height="232" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">① 电脑上优化（不在本仓库）</text>
<text x="42.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">sheng-ren 的 booklib，</text>
<text x="42.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">按 xochitl 阅读模式出 EPUB：</text>
<text x="42.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">排版、目录、注释、封面、漫画</text>
<text x="42.0" y="184.5" font-size="11.5" fill="#1F2937" text-anchor="start">漫画另写页边距标记</text>
<text x="42.0" y="201.0" font-size="11.5" fill="#1F2937" text-anchor="start">META-INF/eink-reader-margins</text>
<text x="42.0" y="217.5" font-size="11.5" fill="#1F2937" text-anchor="start">PDF 不处理也能直接传</text>
<text x="42.0" y="234.0" font-size="11.5" fill="#1F2937" text-anchor="start">其它格式先在电脑上转好</text>
<text x="42.0" y="250.5" font-size="11.5" fill="#6B7280" text-anchor="start">规则：sheng-ren docs/typesetting.md</text>
<text x="42.0" y="267.0" font-size="11.5" fill="#6B7280" text-anchor="start">阅读器怪癖：docs/xochitl.md</text>
<rect x="315" y="96" width="255" height="232" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="327.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">② 入库</text>
<text x="327.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">网页「传书 → 入库」上传</text>
<text x="327.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">（多文件，有进度）</text>
<text x="327.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">或 scp 进设备 inbox/</text>
<text x="327.0" y="184.5" font-size="11.5" fill="#1F2937" text-anchor="start">（文件静止 5 秒后才收）</text>
<text x="327.0" y="201.0" font-size="11.5" fill="#1F2937" text-anchor="start">· 只收 EPUB / PDF</text>
<text x="327.0" y="217.5" font-size="11.5" fill="#1F2937" text-anchor="start">· 字节原样，不改书</text>
<text x="327.0" y="234.0" font-size="11.5" fill="#1F2937" text-anchor="start">· 文件名规范成「书名 - 02卷」</text>
<text x="327.0" y="250.5" font-size="11.5" fill="#1F2937" text-anchor="start">· 同名同内容：认已有那本</text>
<text x="327.0" y="267.0" font-size="11.5" fill="#1F2937" text-anchor="start">· 同名不同内容：加数字前缀</text>
<rect x="600" y="96" width="255" height="232" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="612.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">③ 母版库 staging/</text>
<text x="612.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">~/.local/state/shelf/books/staging/</text>
<text x="612.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">永久保留，可反复加入</text>
<text x="612.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">勾选后在底部栏操作：</text>
<text x="612.0" y="184.5" font-size="11.5" fill="#1F2937" text-anchor="start">加入 xochitl · 删除</text>
<text x="612.0" y="201.0" font-size="11.5" fill="#1F2937" text-anchor="start">只勾一本时：下载原件 · 改名</text>
<text x="612.0" y="217.5" font-size="11.5" fill="#1F2937" text-anchor="start">筛选：全部 / 未加入 / 已加入</text>
<text x="612.0" y="234.0" font-size="11.5" fill="#1F2937" text-anchor="start">每本旁边一个隐藏边车：</text>
<text x="612.0" y="250.5" font-size="11.5" fill="#1F2937" text-anchor="start">.&lt;书名&gt;.delivered</text>
<text x="612.0" y="267.0" font-size="11.5" fill="#1F2937" text-anchor="start">（加入时间、结果、渲染页数）</text>
<rect x="885" y="96" width="285" height="232" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="897.0" y="116.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">④ 加入 xochitl</text>
<text x="897.0" y="135.0" font-size="11.5" fill="#1F2937" text-anchor="start">网关批量队列一本一本交给 book-serve，</text>
<text x="897.0" y="151.5" font-size="11.5" fill="#1F2937" text-anchor="start">book-serve 的作业队列再一本一本做：</text>
<text x="897.0" y="168.0" font-size="11.5" fill="#1F2937" text-anchor="start">· 文件夹：书库根下按名字找，没有</text>
<text x="897.0" y="184.5" font-size="11.5" fill="#1F2937" text-anchor="start">  就请 xochitl 自己建（最多等 20 秒）</text>
<text x="897.0" y="201.0" font-size="11.5" fill="#1F2937" text-anchor="start">· ≤ 90MB：流式 /upload</text>
<text x="897.0" y="217.5" font-size="11.5" fill="#1F2937" text-anchor="start">· &gt; 90MB 且 ≤ 1GiB：占位 + 磁盘替换</text>
<text x="897.0" y="234.0" font-size="11.5" fill="#1F2937" text-anchor="start">· 再大：整本拒绝</text>
<text x="897.0" y="250.5" font-size="11.5" fill="#1F2937" text-anchor="start">· EPUB 按字节认出新文档 uuid，</text>
<text x="897.0" y="267.0" font-size="11.5" fill="#1F2937" text-anchor="start">  再记页数、登记漫画页边距</text>
<path d="M285.0,212.0 L315.0,212.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bookjo-a)"/>
<path d="M570.0,212.0 L600.0,212.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bookjo-a)"/>
<path d="M855.0,212.0 L885.0,212.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bookjo-a)"/>
<rect x="315" y="362" width="540" height="92" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="327.0" y="382.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">旁路：直接导入（sheng-ren 用，不进母版库）</text>
<text x="327.0" y="401.0" font-size="11.5" fill="#1F2937" text-anchor="start">booklib sync 经 ssh -L 直连 book-serve 的 POST /import：多级文件夹逐级找或建；</text>
<text x="327.0" y="417.5" font-size="11.5" fill="#1F2937" text-anchor="start">目标文件夹里已有逐字节相同的书就认它，不重复加入；?uuid= 原地替换一本已有的书，</text>
<text x="327.0" y="434.0" font-size="11.5" fill="#1F2937" text-anchor="start">重开时 qmd 让 xochitl 跳回原来读到的地方。与网页加入排进同一个作业队列。</text>
<path d="M157.0,328.0 L157.0,408.0 L315.0,408.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bookjo-a)"/>
<path d="M855.0,408.0 L1027.0,408.0 L1027.0,328.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bookjo-a)"/>
<text x="30.0" y="486.0" font-size="11.5" fill="#6B7280" text-anchor="start">已删除（历史附录与 git 历史可查）：设备上的「优化」、PDF 转 EPUB / 裁边、原 PDF 备份、抓网文、联网补封面（10-07）；并发闸门、渲染 warn、日漫翻页（10-07 稍后）；</text>
<text x="30.0" y="506.0" font-size="11.5" fill="#6B7280" text-anchor="start">按卷拆分、按书设方向（09-30）；加入 KOReader（09-29）。</text>
</svg>
