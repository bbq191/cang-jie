<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 626" font-family="sans-serif">
<rect x="0" y="0" width="1080" height="626" fill="#fbfbfa"/>
<text x="540.0" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">xochitl 吃 CSS 的规矩（真机实测，固件 3.28.0.172）</text>
<text x="540.0" y="52" text-anchor="middle" font-size="12" fill="#6a6a6a">方法：每章一种写法的诊断 EPUB，量 xochitl 渲染缓存 PDF 里每段首行的 x 偏移（书架白皮书 §03y）</text>
<text x="30" y="84" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">① 规则写在哪</text>
<rect x="30" y="96" width="330" height="84" rx="9" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.5"/>
<rect x="40" y="126.0" width="52" height="24" rx="12" fill="#3f9a55"/>
<text x="66" y="143.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">认</text>
<text x="104" y="135.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">外链 .css 文件</text>
<text x="104" y="153.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">排版规则只能放这里（cangjie-wash.css）</text>
<rect x="30" y="192" width="330" height="84" rx="9" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.5"/>
<rect x="40" y="222.0" width="52" height="24" rx="12" fill="#b0451f"/>
<text x="66" y="239.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">无视</text>
<text x="104" y="231.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">内联 &lt;style&gt; 块</text>
<text x="104" y="249.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">v6–v9 注入的排版规则从未生效</text>
<rect x="30" y="288" width="330" height="84" rx="9" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.5"/>
<rect x="40" y="318.0" width="52" height="24" rx="12" fill="#b0451f"/>
<text x="66" y="335.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">无视</text>
<text x="104" y="327.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">元素 style="" 属性</text>
<text x="104" y="345.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">div{} 元素规则也不生效</text>
<text x="390" y="84" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">② 外链 css 里怎么写</text>
<rect x="390" y="96" width="660" height="54" rx="9" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.5"/>
<rect x="400" y="111.0" width="52" height="24" rx="12" fill="#3f9a55"/>
<text x="426" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">认</text>
<text x="464" y="120.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">声明必须以分号收尾</text>
<text x="464" y="138.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">规则里最后一个无分号的声明被丢；p{text-indent:2em} 整条无效</text>
<rect x="390" y="158" width="660" height="54" rx="9" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
<rect x="400" y="173.0" width="52" height="24" rx="12" fill="#c9971f"/>
<text x="426" y="190.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">陷阱</text>
<text x="464" y="182.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">text-indent:0 被当作“没设”</text>
<text x="464" y="200.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">落回继承或别的规则；顶格要写 0.01em（肉眼不可见）</text>
<rect x="390" y="220" width="660" height="54" rx="9" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.5"/>
<rect x="400" y="235.0" width="52" height="24" rx="12" fill="#3f9a55"/>
<text x="426" y="252.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">认</text>
<text x="464" y="244.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">类选择器，且类规则压过元素规则</text>
<text x="464" y="262.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">.x{} 生效；旧结论“不认类选择器”是规则 1 的误读</text>
<rect x="390" y="282" width="660" height="54" rx="9" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
<rect x="400" y="297.0" width="52" height="24" rx="12" fill="#c9971f"/>
<text x="426" y="314.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">陷阱</text>
<text x="464" y="306.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">同为类规则时先出现者胜</text>
<text x="464" y="324.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">书的 css 链接在前，会压住我们的 .cj-flush；所以要剥掉书的类</text>
<rect x="390" y="344" width="660" height="54" rx="9" fill="#fff3d6" stroke="#c9971f" stroke-width="1.5"/>
<rect x="400" y="359.0" width="52" height="24" rx="12" fill="#c9971f"/>
<text x="426" y="376.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">陷阱</text>
<text x="464" y="368.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">text-indent 会被外层 div 继承</text>
<text x="464" y="386.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">子 div 自己“没设”（含 0）就继承外层缩进</text>
<rect x="390" y="406" width="660" height="54" rx="9" fill="#fbe9e4" stroke="#b0451f" stroke-width="1.5"/>
<rect x="400" y="421.0" width="52" height="24" rx="12" fill="#b0451f"/>
<text x="426" y="438.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">不认</text>
<text x="464" y="430.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">!important</text>
<text x="464" y="448.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">带它的规则整条失效；也不需要它：我们的 &lt;link&gt; 晚于书 css</text>
<rect x="390" y="468" width="660" height="54" rx="9" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
<rect x="400" y="483.0" width="52" height="24" rx="12" fill="#4a6fa5"/>
<text x="426" y="500.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">保守</text>
<text x="464" y="492.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">逗号/复合选择器不写</text>
<text x="464" y="510.0" text-anchor="start" font-size="11.5" fill="#4a4a4a">figure、figcaption 各写一条裸元素规则，测试守住这条线</text>
<rect x="30" y="536" width="1020" height="66" rx="10" fill="#e8f5ec" stroke="#3f9a55" stroke-width="1.8"/>
<text x="48" y="560" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">最终配方（v10 起外链 css；2026-09-06 起顶格段用 cj-flush）</text>
<text x="48" y="582" text-anchor="start" font-size="11.5" fill="#4a4a4a">外链 cangjie-wash.css：p{text-indent:2em;…;} + .cj-flush{text-indent:0.01em;…;}；顶格段换成 &lt;div class="cj-flush"&gt;（剥书的类和 style）；实测章首/场景切换 0pt、续段 14.2pt</text>
</svg>