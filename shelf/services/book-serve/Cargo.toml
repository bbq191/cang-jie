[package]
name = "book-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "书架·母版库（入库/落库）+ 原生 xochitl 投递；书在电脑上用 sheng-ren 优化好再传上来"

[[bin]]
name = "book-serve"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../../../rmsvc-core" }
# 投进 xochitl 时读书用的工具（读 EPUB 书名/封面/漫画页边距标记、占位文档、PDF 页数、书名规范化）；
# 书本身的优化在电脑上用 sheng-ren 做（2026-10-07）
shelf-conv = { path = "../../crates/shelf-conv" }
# xochitl `.epubindex`（各 spine 文件起始页）解析：原地替换后找回阅读位置（progress.rs）；与笔记线 epubmap 共用同一份
epubpkg = { path = "../../../rmsvc-core/epubpkg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 书名太长时边车改用"截断书名 + sha256 前 16 位"的短名（`sidecar::file_name_for`）；跟 rmsvc-core 同一版本，不新增依赖树
sha2 = "0.11"

[dev-dependencies]
# 测试里手搓 EPUB 用；特性跟 shelf-conv 一致（"deflate" 特性还会带上用不到的 zopfli）
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
tempfile = "3"
tiny_http = "0.12"
