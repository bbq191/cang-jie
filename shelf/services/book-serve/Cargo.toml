[package]
name = "book-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "书架·母版库（入库/优化/落库正交）+ 原生 xochitl 投递"

[[bin]]
name = "book-serve"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../../../rmsvc-core" }
bookconv = { path = "../../crates/bookconv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# statvfs 查母版库所在分区剩余空间（此前每次 GET /staging 都 fork 一个 `df`）；libc 本来就在依赖树里（inotify 拉进来的）
libc = "0.2"
# 书里没有封面时联网补封面（`cover_fetch`，2026-09-29 移植自 sheng-ren）：ureq 查豆瓣/Wikidata（bookconv 已依赖同一版本）；
# image 判封面尺寸、贴作者头像；ab_glyph（Apache-2.0）画生成封面上的字；fast2s（MIT）繁转简比对书名。许可证按各 crate 的 LICENSE 文件核过。
ureq = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2.32"
fast2s = "0.3.1"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
tiny_http = "0.12"
