[package]
name = "wallpaper-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "书架·壁纸：上传即用（缩放 954×1696、池化轮换、bind-mount 休眠屏）"

[[bin]]
name = "wallpaper-serve"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../../../rmsvc-core" }
bookconv = { path = "../../crates/bookconv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3"
