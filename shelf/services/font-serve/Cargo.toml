[package]
name = "font-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "书架·字体：上传即装（fontconfig + fonts.json + KOReader 镜像）"

[[bin]]
name = "font-serve"
path = "src/main.rs"

[dependencies]
shelf-core = { path = "../../crates/shelf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[dev-dependencies]
tempfile = "3"
