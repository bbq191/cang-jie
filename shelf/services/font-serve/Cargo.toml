[package]
name = "font-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "书架·字体：上传即装（fontconfig 用户字体目录 + fonts.json + 中文回退链）"

[[bin]]
name = "font-serve"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../../../rmsvc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
