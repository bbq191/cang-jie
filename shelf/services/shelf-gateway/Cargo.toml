[package]
name = "shelf-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "书架网关：对外唯一入口（UI + /api/<service>/* 反向代理 + 服务发现）"

[[bin]]
name = "shelf-gateway"
path = "src/main.rs"

[dependencies]
shelf-core = { path = "../../crates/shelf-core" }
serde_json = "1"
ureq = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
