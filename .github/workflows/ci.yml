name: CI

# cang-jie 最小回归网：离线可跑的五类检查（不含真机——设备行为靠工程纪律人工真机验证）。
# 五类检查：shell 静态检查 / host 侧 pytest + 前端 JS + enhance/shared C 单测 / 各 Rust crate cargo test /
# 依赖漏洞公告（cargo audit）/ aarch64 交叉编译冒烟（Rust 设备二进制 + 两个 C 写的 xovi 扩展）。
# cargo 一律 --locked（2026-10-10，审计 SEC-3）：Cargo.lock 与 Cargo.toml 对不上就失败，不在 CI 里悄悄重新解析依赖。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 安全关键 shell 静态检查（install/deploy/fail-safe/packaging 能把设备搞崩，必须零告警）──
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 装 shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: 全量 .sh 检查（POSIX，揪 busybox 上会炸的 bashism）
        # --severity=warning：只在 warning/error 上门控，容忍 runner apt shellcheck(0.9.x)
        # 与本地(0.11)对 info/style(SC2015/SC2002…)判定的版本漂移。真问题都是 warning+。
        run: git ls-files '*.sh' | xargs -r shellcheck --severity=warning
      - name: 模拟测试的桩命令（无 .sh 后缀的 POSIX sh 脚本，同样门控）
        run: shellcheck --severity=warning --shell=sh packaging/tests/stubs/*

  # ── host 侧测试：安装脚本沙箱模拟（pytest）+ 网关前端 JS + enhance/shared C 单测 ──
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 装 uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: uv sync（统一 .venv，各线依赖）
        run: uv sync
      # 只跑「自足」测试（fixtures 都进 git）。拼音引擎等早期代码已于 2026-09-11 移出本仓库，不再有对应步骤。
      # 2026-09-18：`shelf/host/`（Python CLI + Calibre 转换管线）整个已砍——用户明确表态以后
      # 不再使用 PC 端，只留网页/设备端交互；源码留档在本机 oldbak/（不随仓库走），CI 这步跟着删。
      - name: pytest（packaging/tests：安装/卸载脚本的沙箱模拟，不需要真机）
        run: uv run pytest packaging/tests -q
      - name: 网关内嵌 JS 语法检查（ui/app.js 是真文件，编译期 include_str! 进二进制）
        run: node --check gateway/ui/app.js
      - name: 网关前端转义回归（esc() 行为 + app.js 插值静态检查，node 内置测试、零 npm 依赖）
        run: node --test gateway/ui/test/*.test.mjs
      # enhance/shared 四个纯 C 工具文件（hl-snap 这个"涉及 xovi/mprotect 高危代码路径"的扩展用的
      # 特征码扫描 + trampoline patch；原先 handwriting-stroke 也用，2026-09-30 已移除）：host gcc 编译+跑，不需要 aarch64
      # 交叉工具链，不需要真机——2026-09-16 补，此前这块完全零自动化覆盖，见 enhance/shared/
      # tests/test_shared.c 头注。
      - name: enhance/shared host 单测（特征码扫描 + trampoline patch，纯字节级验证不涉真机）
        run: make -C enhance/shared test
      # enhance/ui-font（界面字体 xovi 扩展，2026-10-07）：配置解析 + 导入表改写（4 种链接方式）+ 真实 Qt 6 上的 setFont 替换
      - name: enhance/ui-font host 单测
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev pkg-config && make -C enhance/ui-font test

  # ── 设备端 Rust crate 的 host 测试（rmsvc-core / gateway / shelf / notes，各自独立无根 workspace）──
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test（共享基座 + 网关 + enhance 的两个独立服务，各自独立 crate）
        run: |
          cargo test --locked --manifest-path rmsvc-core/Cargo.toml
          cargo test --locked --manifest-path rmsvc-core/epubpkg/Cargo.toml
          cargo test --locked --manifest-path gateway/Cargo.toml
          cargo test --locked --manifest-path enhance/wallpaper-serve/Cargo.toml
          cargo test --locked --manifest-path enhance/font-serve/Cargo.toml
      # 2026-10-07 起书架不再依赖 sheng-ren 的 bookconv，读 EPUB 用自带的 shelf-conv，无外部 git 依赖
      - name: cargo test（shelf 内部 workspace：shelf-conv/book-serve）
        run: cargo test --manifest-path shelf/Cargo.toml --workspace --locked
      - name: cargo test（notes 内部 workspace：rmv6/notecore/vendorcfg/四服务）
        run: cargo test --manifest-path notes/Cargo.toml --workspace --locked

  # ── 依赖漏洞公告（RustSec 数据库）：每个 Cargo.lock 逐个查（2026-10-10，审计 SEC-3：rustls 0.20 的
  #    RUSTSEC-2024-0336 本该由这一步抓到）。只在有漏洞公告时失败；unmaintained/yanked 只打警告。
  #    不设 ignore 名单：真要放过某条公告，在这里写明编号与理由再加 --ignore。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit（7 个 lockfile，一个不过也查完其余的再失败）
        run: |
          rc=0
          for d in rmsvc-core rmsvc-core/epubpkg gateway shelf notes enhance/font-serve enhance/wallpaper-serve; do
            echo "::group::$d/Cargo.lock"
            cargo audit --file "$d/Cargo.lock" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # ── aarch64 全静态交叉编译冒烟（打包器分发的设备二进制，别让 musl/链接悄悄坏掉）──
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross
      - name: 装 aarch64 交叉 gcc（编 ring 的 C；musl 链接由 rust-lld 完成）
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: shelf + gateway + notes 交叉编译（shelf/build.sh 顺手编译 ../gateway、../notes，复用仓库 build.sh，与打包器同路径）
        run: sh shelf/build.sh
      # 两个 C 写的 xovi 扩展（2026-10-10，审计 SEC-2）：部署脚本构建失败时会退回仓库里提交的 .so，源码改坏/出警告
      # 不会被发现——这里按"交叉编译零警告"门槛编一遍。xovi 胶水 xovi_glue.{c,h} 已提交，不需要 asivery/xovi clone。
      # 只验证编得过，不比对仓库里提交的 .so（runner 的 gcc 版本与开发机不同，产物字节必然不同）。
      - name: enhance C 扩展交叉编译（hl-snap / ui-font，-Werror）
        run: |
          make -C enhance/hl-snap aarch64 EXTRA_CFLAGS=-Werror
          make -C enhance/ui-font aarch64 EXTRA_CFLAGS=-Werror
