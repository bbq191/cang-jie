<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="240" height="240">
  <!-- 极简背景与留白：隐喻宣纸的微暖色调 -->
  <circle cx="50" cy="50" r="48" fill="#fdfcf8" stroke="#ece4d8" stroke-width="1"/>
  
  <!-- 香气缭绕的抽象曲线：表现“香”的轻盈与扩散 -->
  <path d="M40 85 C 10 55, 45 15, 60 25 C 75 35, 55 55, 80 75" stroke="#d4ccc0" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- 核心意象：融合了毛笔笔锋与坠落墨滴的形态 -->
  <path d="M50 18 C 50 18, 30 45, 30 65 C 30 76, 39 85, 50 85 C 61 85, 70 76, 70 65 C 70 45, 50 18, 50 18 Z" fill="#2b2b2b"/>
  
  <!-- 墨滴内部的留白高光/气韵流动：增加立体感与呼吸感 -->
  <path d="M50 35 C 43 48, 43 65, 55 75" stroke="#fdfcf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- 东方美学的点睛之笔：朱砂红印章，打破黑白的沉闷 -->
  <rect x="65" y="65" width="14" height="14" rx="1.5" fill="#c33427" />
  <!-- 印章内部的文字：采用经典衬线体代替篆体以保证在小尺寸下的可读性 -->
  <text x="72" y="75" font-size="9" fill="#fdfcf8" font-family="serif" text-anchor="middle" font-weight="bold">香</text>
</svg>
