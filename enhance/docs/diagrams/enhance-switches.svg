<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="sw-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text xml:space="preserve" x="600.0" y="36" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">网页上的开关 → 写到设备的哪里 → 谁读、什么时候生效</text>
<text xml:space="preserve" x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">前三行登记在网关 gateway/src/enhance/mod.rs 的 TOGGLES 表；后三行由网关反代给独立服务</text>
<text xml:space="preserve" x="30" y="96" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">网页位置 · 开关</text>
<text xml:space="preserve" x="410" y="96" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">写到哪里</text>
<text xml:space="preserve" x="790" y="96" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">谁读、什么时候生效</text>
<polyline points="30,106 1170,106" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="30" y="120" width="330" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="142" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">CJK 荧光笔精确吸附</text>
<text xml:space="preserve" x="44" y="163" font-size="12" fill="#1F2937" text-anchor="start">管理 → 系统增强</text>
<rect x="410" y="120" width="330" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="424" y="142" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">reading-qol.json</text>
<text xml:space="preserve" x="424" y="163" font-size="12" fill="#1F2937" text-anchor="start">hlSnapCjk（缺省 开）</text>
<rect x="790" y="120" width="380" height="76" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="804" y="142" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">hl-snap.so（扩展）</text>
<text xml:space="preserve" x="804" y="162" font-size="12" fill="#1F2937" text-anchor="start">每次划线现读 → 下一次划线就生效</text>
<text xml:space="preserve" x="804" y="180" font-size="12" fill="#1F2937" text-anchor="start">徽章：xochitl 主进程 maps 里有没有它</text>
<polyline points="360,158 408,158" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<polyline points="740,158 788,158" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<rect x="30" y="210" width="330" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="232" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">单击翻页</text>
<text xml:space="preserve" x="44" y="253" font-size="12" fill="#1F2937" text-anchor="start">管理 → 系统增强</text>
<rect x="410" y="210" width="330" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="424" y="232" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">reading-qol.json</text>
<text xml:space="preserve" x="424" y="253" font-size="12" fill="#1F2937" text-anchor="start">tapPageTurn（缺省 关）</text>
<rect x="790" y="210" width="380" height="76" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="804" y="232" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">reader-page-turn.qmd（补丁）</text>
<text xml:space="preserve" x="804" y="252" font-size="12" fill="#1F2937" text-anchor="start">每次打开书读一次 → 重新打开书生效</text>
<text xml:space="preserve" x="804" y="270" font-size="12" fill="#1F2937" text-anchor="start">徽章：补丁文件早于 xochitl 启动 = 已载入</text>
<polyline points="360,248 408,248" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<polyline points="740,248 788,248" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<rect x="30" y="300" width="330" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="322" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">导入 md 文档（笔记线）</text>
<text xml:space="preserve" x="44" y="343" font-size="12" fill="#1F2937" text-anchor="start">管理 → 实验室</text>
<rect x="410" y="300" width="330" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="424" y="322" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">reading-qol.json</text>
<text xml:space="preserve" x="424" y="343" font-size="12" fill="#1F2937" text-anchor="start">notesImportMdEnabled（缺省 关）</text>
<rect x="790" y="300" width="380" height="76" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="804" y="322" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">只影响网页本身</text>
<text xml:space="preserve" x="804" y="342" font-size="12" fill="#1F2937" text-anchor="start">显示 / 隐藏笔记页的「导入 md」子标签</text>
<text xml:space="preserve" x="804" y="360" font-size="12" fill="#1F2937" text-anchor="start">徽章：「网页功能」，不判加载</text>
<polyline points="360,338 408,338" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<polyline points="740,338 788,338" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<polyline points="30,394 1170,394" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="30" y="416" font-size="12" fill="#6B7280" text-anchor="start">以下经网关反代到独立 Web 服务（只听本机端口）</text>
<rect x="30" y="430" width="330" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="452" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">界面字体</text>
<text xml:space="preserve" x="44" y="473" font-size="12" fill="#1F2937" text-anchor="start">其他 → xochitl</text>
<rect x="410" y="430" width="330" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="424" y="452" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">font-serve :8792</text>
<text xml:space="preserve" x="424" y="473" font-size="12" fill="#1F2937" text-anchor="start">fonts/shelf-ui/ + ui-font.json</text>
<rect x="790" y="430" width="380" height="76" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text xml:space="preserve" x="804" y="452" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">ui-font.so + ui-font-tokens.qmd</text>
<text xml:space="preserve" x="804" y="472" font-size="12" fill="#1F2937" text-anchor="start">xochitl 启动时读一次 → 整机重启生效</text>
<text xml:space="preserve" x="804" y="490" font-size="12" fill="#1F2937" text-anchor="start">网页显示「整机重启后生效」</text>
<polyline points="360,468 408,468" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<polyline points="740,468 788,468" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<rect x="30" y="520" width="330" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="542" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">阅读字体</text>
<text xml:space="preserve" x="44" y="563" font-size="12" fill="#1F2937" text-anchor="start">其他 → xochitl</text>
<rect x="410" y="520" width="330" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="424" y="542" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">font-serve :8792</text>
<text xml:space="preserve" x="424" y="563" font-size="12" fill="#1F2937" text-anchor="start">~/.local/share/fonts/ + fonts.json</text>
<rect x="790" y="520" width="380" height="76" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text xml:space="preserve" x="804" y="542" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">xochitl 阅读器字体菜单（字体菜单 qmd）</text>
<text xml:space="preserve" x="804" y="562" font-size="12" fill="#1F2937" text-anchor="start">重开字体菜单即可选，不用重启</text>
<text xml:space="preserve" x="804" y="580" font-size="12" fill="#1F2937" text-anchor="start">中文缺字回退写在 fonts.conf</text>
<polyline points="360,558 408,558" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<polyline points="740,558 788,558" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<rect x="30" y="610" width="330" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="632" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">休眠壁纸</text>
<text xml:space="preserve" x="44" y="653" font-size="12" fill="#1F2937" text-anchor="start">其他 → 壁纸</text>
<rect x="410" y="610" width="330" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="424" y="632" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">wallpaper-serve :8793</text>
<text xml:space="preserve" x="424" y="653" font-size="12" fill="#1F2937" text-anchor="start">current.png；首次写 SleepScreenPath</text>
<rect x="790" y="610" width="380" height="76" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text xml:space="preserve" x="804" y="632" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">xochitl 休眠屏</text>
<text xml:space="preserve" x="804" y="652" font-size="12" fill="#1F2937" text-anchor="start">首次写配置键后整机重启一次</text>
<text xml:space="preserve" x="804" y="670" font-size="12" fill="#1F2937" text-anchor="start">之后每次休眠都重读 current.png</text>
<polyline points="360,648 408,648" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<polyline points="740,648 788,648" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#sw-arr)"/>
<text xml:space="preserve" x="600" y="714" font-size="12" fill="#6B7280" text-anchor="middle">reading-qol.json 在 ~/.local/share/cangjie-ime/（目录名是历史遗留）。网关只改自己要改的键，其余键原样写回（全量写回）。</text>
<text xml:space="preserve" x="600" y="736" font-size="12" fill="#6B7280" text-anchor="middle">旧文件里的 rtlPageTurn、comicMinMargin、hwStroke* 等键无人再读，留着无害。</text>
</svg>
