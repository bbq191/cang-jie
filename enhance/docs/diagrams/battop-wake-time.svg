<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="Noto Sans CJK SC, sans-serif">
<defs>
<marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker>
</defs>
<rect x="0" y="0" width="1040" height="560" fill="#fbfbfa"/>
<text x="520" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">battop 唤醒源：kmsg 时间戳怎么换算成钟点（2026-09-25；battop 09-30 已移除，历史图）</text>
<text x="520" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">kmsg 每条记录带“开机以来微秒数”，但这个钟在设备休眠时不走；换算时减去的基准必须同样不含休眠</text>

<!-- 时间轴 -->
<text x="40" y="92" font-size="13" font-weight="bold" fill="#1a1a1a">例子（与单测 epoch_uses_monotonic_offset_not_boottime 同一组数）：开机 10000 秒，其中休眠 9000 秒、醒着 1000 秒</text>
<text x="40" y="126" font-size="11" fill="#555">开机</text>
<text x="1000" y="126" text-anchor="end" font-size="11" fill="#555">现在（刷新时刻）</text>
<rect x="60" y="134" width="60" height="26" fill="#cfe8d4" stroke="#3f9a55"/>
<rect x="120" y="134" width="300" height="26" fill="#e3e3e3" stroke="#8a8a8a"/>
<rect x="420" y="134" width="40" height="26" fill="#cfe8d4" stroke="#3f9a55"/>
<rect x="460" y="134" width="420" height="26" fill="#e3e3e3" stroke="#8a8a8a"/>
<rect x="880" y="134" width="100" height="26" fill="#cfe8d4" stroke="#3f9a55"/>
<text x="270" y="152" text-anchor="middle" font-size="11" fill="#555">休眠</text>
<text x="670" y="152" text-anchor="middle" font-size="11" fill="#555">休眠</text>
<text x="90" y="152" text-anchor="middle" font-size="10" fill="#2f7d45">醒</text>
<text x="440" y="152" text-anchor="middle" font-size="10" fill="#2f7d45">醒</text>
<text x="930" y="152" text-anchor="middle" font-size="10" fill="#2f7d45">醒</text>
<!-- 真实事件 -->
<line x1="890" y1="128" x2="890" y2="170" stroke="#1a1a1a" stroke-width="2"/>
<text x="890" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">唤醒事件 E</text>
<text x="890" y="201" text-anchor="middle" font-size="10.5" fill="#3a3a3a">实际在“现在”前 100 秒</text>
<text x="890" y="216" text-anchor="middle" font-size="10.5" fill="#3a3a3a">kmsg ts = 900 秒（只数醒着的时间）</text>

<!-- 三个钟 -->
<rect x="40" y="236" width="960" height="84" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="56" y="258" font-size="12" font-weight="bold" fill="#1a1a1a">三个钟（刷新时刻读数）</text>
<text x="56" y="280" font-size="11" fill="#3a3a3a">墙钟 now（unix 秒）</text>
<text x="330" y="280" font-size="11" fill="#3a3a3a">/proc/uptime = CLOCK_BOOTTIME：10000 秒（<tspan font-weight="bold">含</tspan>休眠）</text>
<text x="700" y="280" font-size="11" fill="#3a3a3a">CLOCK_MONOTONIC：1000 秒（<tspan font-weight="bold">不含</tspan>休眠）</text>
<text x="56" y="304" font-size="11" fill="#6a6a6a">kmsg 时间戳和 CLOCK_MONOTONIC 一样，休眠时不走（dmesg 手册：suspend/resume 之后时间戳不更新）</text>

<!-- 旧 vs 新 -->
<rect x="40" y="334" width="470" height="100" rx="8" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.4"/>
<text x="56" y="356" font-size="12.5" font-weight="bold" fill="#b0451f">09-25 前：now − uptime + ts</text>
<text x="56" y="378" font-size="11" fill="#3a3a3a">= now − 10000 + 900 = now − 9100 秒</text>
<text x="56" y="398" font-size="11" fill="#3a3a3a">每条事件被提前“它之前累计的休眠时长”；开机两天后</text>
<text x="56" y="416" font-size="11" fill="#3a3a3a">的唤醒可能记到两天前，「今日 / 24 小时」计数对不上</text>
<rect x="530" y="334" width="470" height="100" rx="8" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.4"/>
<text x="546" y="356" font-size="12.5" font-weight="bold" fill="#2f7d45">09-25 起：now − 单调时钟 + ts</text>
<text x="546" y="378" font-size="11" fill="#3a3a3a">= now − 1000 + 900 = now − 100 秒 ✓</text>
<text x="546" y="398" font-size="11" fill="#3a3a3a">剩下的误差只有“E 之后到刷新之间又休眠了多久”；</text>
<text x="546" y="416" font-size="11" fill="#3a3a3a">长休眠后醒来的第一次采样就会刷新，按代码推算通常差几秒（未实测）</text>

<!-- 去重 -->
<rect x="40" y="448" width="960" height="96" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.4"/>
<text x="56" y="470" font-size="12.5" font-weight="bold" fill="#1a1a1a">去重改按序号：wakes.cursor = 开机 id（/proc/sys/kernel/random/boot_id）+ 已并入的最大 kmsg 序号</text>
<text x="56" y="492" font-size="11" fill="#3a3a3a">· 同一次开机：只并入序号更大的记录。同一条事件两次换算出的秒数会随中间的休眠变化，不能再像旧版那样按“时间 ≥ since 整段替换”。</text>
<text x="56" y="511" font-size="11" fill="#3a3a3a">· 换了开机 / 没有游标（旧版升级上来）/ 读不到 boot_id：先删缓存里本次开机以来的条目（可能是旧算法记歪的），再把 kmsg 里本次开机的记录全部并入。</text>
<text x="56" y="530" font-size="11" fill="#3a3a3a">· wakes.tsv 约每 50 分钟刷新一次，保留 31 天；kmsg 打不开就不动旧缓存；读的过程中旧记录被覆盖（EPIPE）接着读，不再丢后面的记录。</text>
</svg>
