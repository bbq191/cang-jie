<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="rc-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" fill="#fbfbfa"/>
<text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">重跑 install-all.sh 时，怎么自动清掉已移除功能的残留（2026-09-30）</text>
<text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#666">对象：电池刺客 battop、手写优化 hw-stroke；代码 packaging/removal.sh（与 uninstall-all.sh 共用）；没有残留时一步都不动</text>

<rect x="24" y="86" width="176" height="110" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6"/>
<text x="112" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">① 前面各步照常装</text>
<text x="112" y="134" text-anchor="middle" font-size="11.8" fill="#444">shelf、hl-snap 等</text>
<text x="112" y="152" text-anchor="middle" font-size="11.8" fill="#444">xovi 相关的只落盘</text>
<text x="112" y="170" text-anchor="middle" font-size="11.8" fill="#444">不当场生效</text>
<polyline points="200,141 236,141" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#rc-m)"/>

<rect x="236" y="76" width="500" height="300" rx="10" fill="#fdf8ec" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="486" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">② xovi-apply 之前：对 STEP_RETIRED_AUTOCLEAN 逐个清理</text>

<rect x="252" y="112" width="468" height="116" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="268" y="134" font-size="13.5" font-weight="bold" fill="#1a1a1a">电池刺客 uninstall_battop</text>
<text x="268" y="156" font-size="11.8" fill="#444">单元和 /home/root/battop 都没有 → 直接退出（不碰 systemd、不 remount）</text>
<text x="268" y="176" font-size="11.8" fill="#444">有 → 删 /usr 的 battop.service 与旧版 .timer（dm-verity 门 + 限时读写窗口）</text>
<text x="268" y="196" font-size="11.8" fill="#444">　　 → 删 /home/root/battop 整个目录（二进制、采样数据、旧脚本）</text>
<text x="268" y="216" font-size="11.8" fill="#8a4b00">dm-verity 开着：单元删不掉，目录也保留，等可写后再跑一次</text>

<rect x="252" y="240" width="468" height="122" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="268" y="262" font-size="13.5" font-weight="bold" fill="#1a1a1a">手写优化 uninstall_handwriting_stroke</text>
<text x="268" y="284" font-size="11.8" fill="#444">撤掉待换入区 ~/.cangjie-stage/so-pending/ 里的副本</text>
<text x="268" y="304" font-size="11.8" fill="#444">rm extensions.d/hw-stroke.so 与 .crashed；清 /home/root/hw-stroke/</text>
<text x="268" y="324" font-size="11.8" fill="#444">运行中的 xochitl 还映射着它（删掉的旧 inode 照常可用，不崩）</text>
<text x="268" y="344" font-size="11.8" font-weight="bold" fill="#2f5d9a">　→ 记待生效标记 removed-hw-stroke.so</text>
<polyline points="736,300 772,300" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#rc-m)"/>

<rect x="772" y="232" width="204" height="144" rx="10" fill="#eef3fa" stroke="#4a72b0" stroke-width="1.6"/>
<text x="874" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">③ xovi-apply</text>
<text x="874" y="280" text-anchor="middle" font-size="11.8" fill="#444">有待生效标记（或别的</text>
<text x="874" y="298" text-anchor="middle" font-size="11.8" fill="#444">待生效改动）→ 整机重启</text>
<text x="874" y="316" text-anchor="middle" font-size="11.8" font-weight="bold" fill="#1a1a1a">全程只重启一次</text>
<text x="874" y="340" text-anchor="middle" font-size="11" fill="#8a4b00">不 stop/restart xochitl；</text>
<text x="874" y="358" text-anchor="middle" font-size="11" fill="#8a4b00">xovi 已生效时不跑 xovi/start</text>
<polyline points="874,232 874,206" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#rc-m)"/>

<rect x="772" y="86" width="204" height="120" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="874" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">④ verify-on-device.sh</text>
<text x="874" y="134" text-anchor="middle" font-size="11.8" fill="#444">不再把两样当在位项</text>
<text x="874" y="152" text-anchor="middle" font-size="11.8" fill="#444">若还有残留：报 ⚠</text>
<text x="874" y="170" text-anchor="middle" font-size="11.8" fill="#444">并给出只清这两样的</text>
<text x="874" y="188" text-anchor="middle" font-size="11.8" fill="#444">uninstall-all 命令</text>

<rect x="24" y="400" width="952" height="136" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.4"/>
<text x="40" y="424" font-size="13.5" font-weight="bold" fill="#1a1a1a">不想自动清 / 只想清这两样</text>
<text x="40" y="446" font-size="11.8" fill="#333">· install-all.sh 加 --skip battop / --skip handwriting-stroke 就整样不碰（注意：待换入区里若还有旧 hw-stroke.so，xovi-apply 会照常把它换进去）</text>
<text x="40" y="466" font-size="11.8" fill="#333">· 只清这两样：uninstall-all.sh 加 --skip 其余步骤（列表由 lib.sh 的 uninstall_only_skip 生成），然后自己 reboot</text>
<text x="40" y="494" font-size="13" font-weight="bold" fill="#2f7d45">09-30 15:23 真机：install-all 自动清掉 battop 单元 + /home/root/battop 与 hw-stroke.so，整机重启一次；</text>
<text x="40" y="514" font-size="13" font-weight="bold" fill="#2f7d45">verify 36✓ 1⚠（刚开机）0✗，xochitl maps 里已无 hw-stroke（部署自检，非功能手测）</text>
</svg>
