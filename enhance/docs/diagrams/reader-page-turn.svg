<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="pt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text xml:space="preserve" x="600.0" y="36" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">xochitl 阅读器单击翻页（reader-page-turn.qmd）</text>
<text xml:space="preserve" x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">一个 qmd 改三个 QML；网页开关「管理 → 系统增强 → 单击翻页」，缺省关</text>
<text xml:space="preserve" x="160" y="98" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">点击区域（竖屏）</text>
<rect x="60" y="110" width="200" height="330" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="60" y="258.5" width="14" height="115.5" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="246" y="258.5" width="14" height="115.5" rx="2" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<polyline points="74,258.5 246,258.5" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
<polyline points="74,374.0 246,374.0" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="270" y="262.5" font-size="11" fill="#6B7280" text-anchor="start">45%</text>
<text xml:space="preserve" x="270" y="378.0" font-size="11" fill="#6B7280" text-anchor="start">80%</text>
<text xml:space="preserve" x="160" y="312.25" font-size="11" fill="#6B7280" text-anchor="middle">中间照常：</text>
<text xml:space="preserve" x="160" y="330.25" font-size="11" fill="#6B7280" text-anchor="middle">选字、点链接</text>
<text xml:space="preserve" x="67" y="460" font-size="11" fill="#6B7280" text-anchor="middle">左 7%</text>
<text xml:space="preserve" x="253" y="460" font-size="11" fill="#6B7280" text-anchor="middle">右 7%</text>
<text xml:space="preserve" x="40" y="490" font-size="12" fill="#1F2937" text-anchor="start">右边缘 = 下一页，左边缘 = 上一页</text>
<text xml:space="preserve" x="40" y="510" font-size="12" fill="#6B7280" text-anchor="start">链接按下、文本编辑、缩放中、笔记页：不接管</text>
<rect x="400" y="96" width="340" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="570.0" y="118" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">打开一本书</text>
<text xml:space="preserve" x="570.0" y="139" font-size="12" fill="#1F2937" text-anchor="middle">DocumentView：document 变化</text>
<rect x="400" y="198" width="340" height="104" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="414" y="220" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">① 300 ms 后读一次开关（同步 XHR）</text>
<text xml:space="preserve" x="414" y="241" font-size="12" fill="#1F2937" text-anchor="start">reading-qol.json → tapPageTurn</text>
<text xml:space="preserve" x="414" y="260" font-size="12" fill="#1F2937" text-anchor="start">不轮询：改了开关，下次打开书生效</text>
<text xml:space="preserve" x="414" y="279" font-size="12" fill="#1F2937" text-anchor="start">关书（document 为空）时不读</text>
<rect x="400" y="338" width="340" height="84" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="414" y="360" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">② 写到阅读视图</text>
<text xml:space="preserve" x="414" y="381" font-size="12" fill="#1F2937" text-anchor="start">sceneView.cjTapPageTurn</text>
<text xml:space="preserve" x="414" y="400" font-size="12" fill="#1F2937" text-anchor="start">（DeviceSceneView 根对象上加的属性）</text>
<polyline points="570,162 570,196" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pt-arr)"/>
<polyline points="570,302 570,336" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pt-arr)"/>
<rect x="800" y="96" width="370" height="326" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="814" y="118" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">③ 手势（SceneViewGestures.qml）</text>
<text xml:space="preserve" x="814" y="139" font-size="12" fill="#1F2937" text-anchor="start">单击 touchClick.onClick：</text>
<text xml:space="preserve" x="814" y="158" font-size="12" fill="#1F2937" text-anchor="start">开头插一段 —— cjTapPageTurn 开着、</text>
<text xml:space="preserve" x="814" y="177" font-size="12" fill="#1F2937" text-anchor="start">命中边缘区就翻页并 return，其余交回原生</text>
<text xml:space="preserve" x="814" y="196" font-size="12" fill="#1F2937" text-anchor="start"></text>
<text xml:space="preserve" x="814" y="215" font-size="12" fill="#1F2937" text-anchor="start">滑动翻页：不改，xochitl 原生行为</text>
<text xml:space="preserve" x="814" y="234" font-size="12" fill="#1F2937" text-anchor="start"></text>
<text xml:space="preserve" x="814" y="253" font-size="12" fill="#6B7280" text-anchor="start">日志：journalctl -u xochitl | grep CJ-PAGE-TURN</text>
<text xml:space="preserve" x="814" y="272" font-size="12" fill="#6B7280" text-anchor="start">　loaded（qmd 已载入）/ cfg tap=…（读到的开关）</text>
<text xml:space="preserve" x="814" y="291" font-size="12" fill="#1F2937" text-anchor="start"></text>
<text xml:space="preserve" x="814" y="310" font-size="12" fill="#6B7280" text-anchor="start">日漫翻页规则 2026-10-07 删除：xochitl 不看</text>
<text xml:space="preserve" x="814" y="329" font-size="12" fill="#6B7280" text-anchor="start">OPF 的翻页方向，日漫一律从左往右翻</text>
<polyline points="740,380 798,380" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pt-arr)"/>
</svg>
