<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Noto Sans CJK SC, sans-serif">
  <defs><marker id="rp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">xochitl 阅读器单击翻页（§03i）</text>
  <text x="550" y="56" text-anchor="middle" font-size="13" fill="#6b7280">一个 qmd 补丁 reader-page-turn.qmd（随 book 服务安装）；网页开关「单击翻页」在「管理 → 系统增强」，默认关</text>

  <!-- 左：屏幕示意 -->
  <text x="190" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">点击区域（竖屏）</text>
  <rect x="90" y="104" width="200" height="356" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <!-- 45%..80% of 356 = 160..285 -->
  <rect x="90" y="264" width="14" height="125" fill="#bfdbfe" stroke="#1d4ed8"/>
  <rect x="276" y="264" width="14" height="125" fill="#bbf7d0" stroke="#15803d"/>
  <line x1="90" y1="264" x2="290" y2="264" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="90" y1="389" x2="290" y2="389" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <text x="298" y="268" font-size="12" fill="#6b7280">45%</text>
  <text x="298" y="393" font-size="12" fill="#6b7280">80%</text>
  <text x="190" y="330" text-anchor="middle" font-size="12" fill="#6b7280">中间照常：</text>
  <text x="190" y="348" text-anchor="middle" font-size="12" fill="#6b7280">双击进文本、点链接</text>
  <text x="97" y="480" font-size="12" fill="#1d4ed8">左 7%</text>
  <text x="252" y="480" font-size="12" fill="#15803d">右 7%</text>
  <g font-size="13" fill="#1f2937">
    <text x="40" y="512">右边缘 = 下一页，左边缘 = 上一页</text>
    <text x="40" y="534" fill="#6b7280">链接按下、文本编辑、缩放、笔记页：不接管</text>
  </g>

  <!-- 中：打开书的流程 -->
  <g font-size="13" fill="#1f2937">
    <rect x="420" y="84" width="300" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="570" y="110" text-anchor="middle" font-weight="bold" fill="#312e81">打开一本书</text>
    <text x="570" y="132" text-anchor="middle" fill="#4b5563">DocumentView.onDocumentChanged</text>

    <rect x="420" y="190" width="300" height="104" rx="10" fill="#f0fdf4" stroke="#15803d"/>
    <text x="436" y="214" font-weight="bold" fill="#14532d">① 300 ms 后读开关（同步，读一次）</text>
    <text x="436" y="236">reading-qol.json：tapPageTurn</text>
    <text x="436" y="258" fill="#6b7280">不轮询：改开关后下次打开书生效</text>
    <text x="436" y="280" fill="#6b7280">关书（document 为空）时不读</text>

    <rect x="420" y="336" width="300" height="84" rx="10" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="436" y="360" font-weight="bold" fill="#1e3a8a">② 写到阅读视图</text>
    <text x="436" y="382">sceneView.cjTapPageTurn</text>
    <text x="436" y="404" fill="#6b7280">DeviceSceneView 根上加的属性</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M570 148 L570 188" marker-end="url(#rp-a)"/>
    <path d="M570 294 L570 334" marker-end="url(#rp-a)"/>
    <path d="M720 378 L770 378" marker-end="url(#rp-a)"/>
  </g>

  <!-- 右：手势 -->
  <rect x="775" y="84" width="300" height="336" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="791" y="110" font-size="15" font-weight="bold" fill="#1f2937">③ 手势（SceneViewGestures）</text>
  <g font-size="13" fill="#1f2937">
    <text x="791" y="140" font-weight="bold">单击 touchClick.onClick</text>
    <text x="791" y="162">开头插一段：cjTapPageTurn 开着、</text>
    <text x="791" y="184">命中边缘区就翻页、return</text>
    <text x="791" y="206" fill="#6b7280">其余交回原生逻辑</text>
    <text x="791" y="244" font-weight="bold">滑动翻页</text>
    <text x="791" y="266">不改：xochitl 原生行为</text>
    <text x="791" y="304" fill="#6b7280">日志关键字：CJ-PAGE-TURN</text>
    <text x="791" y="326" fill="#6b7280">（loaded / cfg tap=…）</text>
  </g>
  <g font-size="12" fill="#9ca3af">
    <text x="791" y="370">日漫翻页规则 2026-10-07 删除：</text>
    <text x="791" y="388">xochitl 不看 OPF 方向，</text>
    <text x="791" y="406">日漫一律从左往右</text>
  </g>
</svg>
