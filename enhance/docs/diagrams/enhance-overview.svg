<text x="425.0" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Noto Sans Mono CJK SC, monospace">reading-qol.json</text>
<text x="425.0" y="230" text-anchor="middle" font-size="11.5" fill="#444">~/.local/share/cangjie-ime/</text>
<text x="425.0" y="247" text-anchor="middle" font-size="11.5" fill="#444">hlSnapCjk 等开关（全量写回）</text>
<text x="425.0" y="264" text-anchor="middle" font-size="11.5" fill="#444">hl-snap 每次划线读 · 翻页 qmd 打开书时读</text>
<polyline points="230,234 300,234" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#eo-m)"/>
<text x="265" y="224" text-anchor="middle" font-size="11.5" fill="#555">读/写</text>
<rect x="620" y="84" width="350" height="262" rx="10" fill="#eef3fa" stroke="#4a72b0" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="795" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">xochitl 进程（xovi 加载的扩展 / qmd 补丁）</text>
<rect x="636" y="122" width="318" height="92" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="795.0" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Noto Sans Mono CJK SC, monospace">hl-snap.so</text>
<text x="795.0" y="166" text-anchor="middle" font-size="11.8" fill="#444">荧光笔 CJK 精确吸附（划哪吸哪）</text>
<text x="795.0" y="183" text-anchor="middle" font-size="11.8" fill="#444">1 个 hook：荧光笔扩张函数 FUN_00f05ad0</text>
<text x="795.0" y="200" text-anchor="middle" font-size="11.8" fill="#444">开关 hlSnapCjk（默认开）</text>
<rect x="636" y="228" width="318" height="104" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="795.0" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Noto Sans Mono CJK SC, monospace">reader-page-turn.qmd</text>
<text x="795.0" y="272" text-anchor="middle" font-size="11.8" fill="#444">阅读器单击翻页 · 日漫从右往左翻</text>
<text x="795.0" y="289" text-anchor="middle" font-size="11.8" fill="#444">经 qt-resource-rebuilder 载入（源码在 shelf/xovi/）</text>
<text x="795.0" y="306" text-anchor="middle" font-size="11.8" fill="#444">开关 tapPageTurn / rtlPageTurn（默认关）</text>
<text x="795.0" y="323" text-anchor="middle" font-size="11.8" fill="#444">每次打开书读一次；书的方向问 book-serve</text>
<polyline points="550,234 620,234" fill="none" stroke="#555" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#eo-m)"/>
<text x="585" y="224" text-anchor="middle" font-size="11.5" fill="#555">现读</text>
<text x="210" y="392" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">不经 xovi、独立运行的工具</text>
<rect x="30" y="408" width="300" height="132" rx="10" fill="#eef3fa" stroke="#4a72b0" stroke-width="1.6"/>
<text x="180.0" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">lo-alias.sh（网关启动前跑）</text>
<text x="180.0" y="452" text-anchor="middle" font-size="11.8" fill="#444">给 lo 和 usb1 挂 10.11.99.1</text>
<text x="180.0" y="469" text-anchor="middle" font-size="11.8" fill="#444">不插 USB 时 xochitl 的 :80 上传口</text>
<text x="180.0" y="486" text-anchor="middle" font-size="11.8" fill="#444">照样可达（传书、推送笔记本都靠它）</text>
<text x="180.0" y="503" text-anchor="middle" font-size="11.8" fill="#444">幂等，失败不拦网关启动</text>
<rect x="350" y="408" width="300" height="132" rx="10" fill="#f1edf9" stroke="#6d4ab0" stroke-width="1.6"/>
<text x="500.0" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">font-serve :8792</text>
<text x="500.0" y="452" text-anchor="middle" font-size="11.8" fill="#444">上传字体 → ~/.local/share/fonts + fc-cache</text>
<text x="500.0" y="469" text-anchor="middle" font-size="11.8" fill="#444">重建 fonts.json（字体菜单 qmd 读）</text>
<text x="500.0" y="486" text-anchor="middle" font-size="11.8" fill="#444">维护界面 CJK 回退链（fontconfig）</text>
<text x="500.0" y="503" text-anchor="middle" font-size="11.8" fill="#444">只管 xochitl（原生阅读器）的字体菜单</text>
<rect x="670" y="408" width="300" height="132" rx="10" fill="#f1edf9" stroke="#6d4ab0" stroke-width="1.6"/>
<text x="820.0" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">wallpaper-serve :8793</text>
<text x="820.0" y="452" text-anchor="middle" font-size="11.8" fill="#444">上传壁纸 → 缩放 954×1696、入池</text>
<text x="820.0" y="469" text-anchor="middle" font-size="11.8" fill="#444">写 xochitl.conf 的 SleepScreenPath</text>
<text x="820.0" y="486" text-anchor="middle" font-size="11.8" fill="#444">指向 current.png，每次休眠重读</text>
<text x="820.0" y="503" text-anchor="middle" font-size="11.8" fill="#444">休眠时 xochitl 读完它就轮换（inotify）</text>
