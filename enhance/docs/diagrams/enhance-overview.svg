<rect x="0" y="0" width="1000" height="700" fill="#fbfbfa"/>
<text x="500.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">enhance 系统增强线：工具怎么接到设备上</text>
<text x="500.0" y="56" text-anchor="middle" font-size="13" fill="#666">xochitl 进程里：一个 xovi 扩展 + 一个 qmd 补丁 · 进程外：两个 Web 服务 + 一个网络小脚本；开关都经网关网页</text>
