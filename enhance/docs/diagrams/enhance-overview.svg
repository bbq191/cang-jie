<rect x="0" y="0" width="1000" height="700" fill="#fbfbfa"/>
<text x="500.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">enhance 系统增强线：五个工具怎么接到设备上</text>
<text x="500.0" y="56" text-anchor="middle" font-size="13" fill="#666">两个 xovi 扩展改 xochitl 行为 · 一个采样器 · 两个 Web 服务；开关经网关网页控制</text>
<rect x="30" y="84" width="200" height="70" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6"/>
