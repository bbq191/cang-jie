<text x="130.0" y="145" text-anchor="middle" font-size="12" fill="#444">管理 → 系统增强/实验室</text>
<polyline points="230,204 262,204 262,152 620,152" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#eo-m)"/>
