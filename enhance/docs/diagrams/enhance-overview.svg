<text x="440" y="144" text-anchor="middle" font-size="11.5" fill="#8a6508">读 /proc/&lt;pid&gt;/maps → 网页「已加载」徽章</text>
<polyline points="130,154 130,186" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#eo-m)"/>
