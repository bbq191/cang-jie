<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 666" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="uf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text xml:space="preserve" x="600.0" y="36" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">界面字体：只换 xochitl 界面，不碰阅读</text>
<text xml:space="preserve" x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">一个选择文件，xochitl 启动时被两处各读一次；界面字体放在单独子目录，fontconfig 再加一条保底规则</text>
<rect x="30" y="96" width="250" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="155.0" y="118" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">网页</text>
<text xml:space="preserve" x="155.0" y="139" font-size="12" fill="#1F2937" text-anchor="middle">其他 → xochitl → 界面字体</text>
<rect x="30" y="206" width="250" height="132" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="228" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">font-serve :8792</text>
<text xml:space="preserve" x="44" y="249" font-size="12" fill="#1F2937" text-anchor="start">POST /ui 上传 · DELETE /ui/{family}</text>
<text xml:space="preserve" x="44" y="268" font-size="12" fill="#1F2937" text-anchor="start">PUT /ui/select {sans, serif}</text>
<text xml:space="preserve" x="44" y="287" font-size="12" fill="#1F2937" text-anchor="start">只能选已装的界面字体</text>
<text xml:space="preserve" x="44" y="306" font-size="12" fill="#6B7280" text-anchor="start">改选择 → 回执「整机重启后生效」</text>
<polyline points="155,162 155,204" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#uf-arr)"/>
<rect x="340" y="96" width="380" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="354" y="118" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">~/.local/share/fonts/shelf-ui/</text>
<text xml:space="preserve" x="354" y="139" font-size="12" fill="#1F2937" text-anchor="start">界面字体文件（阅读字体扫描只看上一层，看不到）</text>
<rect x="340" y="196" width="380" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="354" y="218" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">~/.local/share/shelf/ui-font.json</text>
<text xml:space="preserve" x="354" y="239" font-size="12" fill="#1F2937" text-anchor="start">{"version":1,"sans":"…","serif":"…"}　空串 = 原生</text>
<rect x="340" y="296" width="380" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="354" y="318" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">~/.config/fontconfig/fonts.conf</text>
<text xml:space="preserve" x="354" y="339" font-size="12" fill="#1F2937" text-anchor="start">有界面字体时末尾加：每个请求 append weak「Noto Sans SC」</text>
<polyline points="280,272 310,272 310,132" fill="none" stroke="#64748B" stroke-width="1.5"/>
<polyline points="310,132 338,132" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#uf-arr)"/>
<polyline points="280,272 310,272 310,232" fill="none" stroke="#64748B" stroke-width="1.5"/>
<polyline points="310,232 338,232" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#uf-arr)"/>
<polyline points="280,272 310,272 310,332" fill="none" stroke="#64748B" stroke-width="1.5"/>
<polyline points="310,332 338,332" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#uf-arr)"/>
<rect x="780" y="84" width="390" height="300" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text xml:space="preserve" x="794" y="106" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">xochitl 进程（启动时读一次）</text>
<rect x="800" y="118" width="350" height="108" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="814" y="140" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">ui-font.so（xovi 扩展）</text>
<text xml:space="preserve" x="814" y="161" font-size="12" fill="#1F2937" text-anchor="start">改 xochitl 导入表里 setFont 那一格</text>
<text xml:space="preserve" x="814" y="180" font-size="12" fill="#1F2937" text-anchor="start">应用默认字体 reMarkable Sans → sans</text>
<text xml:space="preserve" x="814" y="199" font-size="12" fill="#1F2937" text-anchor="start">管：老界面里没写字体名的文字</text>
<rect x="800" y="240" width="350" height="124" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="814" y="262" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">ui-font-tokens.qmd</text>
<text xml:space="preserve" x="814" y="283" font-size="12" fill="#1F2937" text-anchor="start">改 Ark 设计令牌 Style.qml</text>
<text xml:space="preserve" x="814" y="302" font-size="12" fill="#1F2937" text-anchor="start">正文 39 处 reMarkable Sans → sans</text>
<text xml:space="preserve" x="814" y="321" font-size="12" fill="#1F2937" text-anchor="start">标题 8 处 reMarkable Serif Small → serif</text>
<text xml:space="preserve" x="814" y="340" font-size="12" fill="#1F2937" text-anchor="start">管：设置页、对话框、按钮、标题</text>
<polyline points="720,232 750,232 750,172 798,172" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#uf-arr)"/>
<text xml:space="preserve" x="744" y="206" font-size="11" fill="#6B7280" text-anchor="end">读</text>
<polyline points="750,232 750,302 798,302" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#uf-arr)"/>
<rect x="30" y="420" width="1140" height="216" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="442" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">阅读不变：三道隔离</text>
<text xml:space="preserve" x="44" y="468" font-size="12" fill="#1F2937" text-anchor="start">① 菜单：阅读器字体菜单读 shelf/fonts.json，只列 fonts/ 顶层的字体；界面字体在 shelf-ui/ 子目录，不进菜单。</text>
<text xml:space="preserve" x="44" y="492" font-size="12" fill="#1F2937" text-anchor="start">② 缺字回退：只装了界面字体时，fontconfig 会把它排进阅读的中文回退第一位（设备上 fc-match -s 实测）。</text>
<text xml:space="preserve" x="44" y="516" font-size="12" fill="#1F2937" text-anchor="start">     font-serve 因此在有界面字体时给每个请求末尾追加系统自带的 Noto Sans SC（weak）：有 lang=zh-cn 或汉字字符集时它排第一，</text>
<text xml:space="preserve" x="44" y="540" font-size="12" fill="#1F2937" text-anchor="start">     拉丁字、你选的阅读字体、已有的中文回退链顺序都不变；界面字体删光后这条规则自动撤掉。</text>
<text xml:space="preserve" x="44" y="564" font-size="12" fill="#1F2937" text-anchor="start">③ 字体名：阅读器菜单里的「reMarkable Sans」、笔记本里打字的字体都按名字直接取内嵌字体，</text>
<text xml:space="preserve" x="44" y="588" font-size="12" fill="#1F2937" text-anchor="start">     扩展只换 setFont 这一次调用、不改字体数据库，qmd 只改令牌文件，两者都碰不到它们。</text>
<text xml:space="preserve" x="44" y="612" font-size="12" fill="#6B7280" text-anchor="start">2026-10-07 真机目测：书库、设置、对话框、标题都换成更纱黑体 UI SC，书里的中文字体不变。</text>
</svg>
