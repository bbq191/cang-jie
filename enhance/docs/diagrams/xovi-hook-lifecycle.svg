<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="xh-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="830" fill="#fbfbfa"/>
<text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">xovi 扩展怎么生效：从 xochitl 启动到 hook 起作用</text>
<text x="500" y="56" text-anchor="middle" font-size="13" fill="#666">hl-snap.so / hw-stroke.so 共用这套流程（代码在 enhance/shared/）；任何一步不满足都退回原生行为</text>

<!-- ① -->
<rect x="30" y="76" width="600" height="84" rx="10" fill="#eef3fa" stroke="#4a72b0" stroke-width="1.6"/>
<text x="46" y="99" font-size="14" font-weight="bold" fill="#1a1a1a">① xochitl 启动，xovi 加载扩展</text>
<text x="46" y="122" font-size="12" fill="#444">systemd drop-in 00-xovi.conf 用 LD_PRELOAD 把 xovi.so 带进 xochitl</text>
<text x="46" y="142" font-size="12" fill="#444">xovi 把 ~/xovi/extensions.d/ 下每个文件都当扩展加载（备份绝不能放这里）</text>
<rect x="660" y="76" width="310" height="84" rx="10" fill="#fdf0ec" stroke="#b0553a" stroke-width="1.4"/>
<text x="674" y="99" font-size="12.5" font-weight="bold" fill="#1a1a1a">✗ xovi 没生效</text>
<text x="674" y="120" font-size="11.8" fill="#444">真重启后 /etc 被清，所有扩展都不加载</text>
<text x="674" y="140" font-size="11.8" fill="#444">恢复：xovi-reenable.service 或 xovi/start</text>
<polyline points="630,118 660,118" fill="none" stroke="#b0553a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#xh-m)"/>
<polyline points="65,160 65,182" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#xh-m)"/>

<!-- ② -->
<rect x="30" y="182" width="600" height="100" rx="10" fill="#eef3fa" stroke="#4a72b0" stroke-width="1.6"/>
<text x="46" y="205" font-size="14" font-weight="bold" fill="#1a1a1a">② _xovi_shouldLoad：认不认识这版固件？</text>
<text x="46" y="228" font-size="12" fill="#444">读 /proc/self/maps，找到 /usr/bin/xochitl 的可执行段</text>
<text x="46" y="248" font-size="12" fill="#444">在段里搜「特征码」：目标函数开头 32~40 字节的原始机器码</text>
<text x="46" y="268" font-size="12" fill="#444">恰好命中 1 处才返回 1（加载）——不认地址，只认代码长相</text>
<rect x="660" y="182" width="310" height="100" rx="10" fill="#fdf0ec" stroke="#b0553a" stroke-width="1.4"/>
<text x="674" y="205" font-size="12.5" font-weight="bold" fill="#1a1a1a">✗ 命中 0 处或多处</text>
<text x="674" y="226" font-size="11.8" fill="#444">（新固件改了这个函数）→ 返回 0，</text>
<text x="674" y="245" font-size="11.8" fill="#444">不加载，xochitl 按原生行为跑</text>
<text x="674" y="266" font-size="11.8" fill="#444">PDF 渲染子进程里也走这条，属正常</text>
<polyline points="630,232 660,232" fill="none" stroke="#b0553a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#xh-m)"/>
<polyline points="65,282 65,304" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#xh-m)"/>

<!-- ③ -->
<rect x="30" y="304" width="600" height="100" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="46" y="327" font-size="14" font-weight="bold" fill="#1a1a1a">③ _xovi_construct：装 hook（cj_patch_target）</text>
<text x="46" y="350" font-size="12" fill="#444">再扫一次拿到目标地址，mprotect 让那一页可写</text>
<text x="46" y="370" font-size="12" fill="#444">把开头 20 字节抄进新分配的「调用桩」，桩尾跳回原函数第 21 字节</text>
<text x="46" y="390" font-size="12" fill="#444">再把目标开头改写成跳到我们 handler 的远跳转（这就是 trampoline，见下图）</text>
<rect x="660" y="304" width="310" height="100" rx="10" fill="#fdf0ec" stroke="#b0553a" stroke-width="1.4"/>
<text x="674" y="327" font-size="12.5" font-weight="bold" fill="#1a1a1a">✗ mprotect / 桩分配失败</text>
<text x="674" y="348" font-size="11.8" fill="#444">打 safe mode 日志，放弃这个 hook，</text>
<text x="674" y="367" font-size="11.8" fill="#444">一个字节都不改</text>
<text x="674" y="388" font-size="11.8" fill="#444">hw-stroke 的次要 hook 找不到只跳过自己</text>
<polyline points="630,354 660,354" fill="none" stroke="#b0553a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#xh-m)"/>

<!-- inset: patch before/after -->
<rect x="100" y="424" width="870" height="168" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="116" y="447" font-size="13" font-weight="bold" fill="#1a1a1a">patch 前后（ARM64 远跳转正好 20 字节，所以只动函数开头 20 字节）</text>
<text x="116" y="482" font-size="12" fill="#444">目标函数（patch 前）</text>
<rect x="330" y="466" width="200" height="26" fill="#f2f2f4" stroke="#7a7a88"/>
<text x="430" y="484" text-anchor="middle" font-size="11.5" fill="#333">开头 20 字节（序言）</text>
<rect x="530" y="466" width="420" height="26" fill="#f2f2f4" stroke="#7a7a88"/>
<text x="740" y="484" text-anchor="middle" font-size="11.5" fill="#333">函数其余部分（不动）</text>
<text x="116" y="522" font-size="12" fill="#444">目标函数（patch 后）</text>
<rect x="330" y="506" width="200" height="26" fill="#eaf5ee" stroke="#2f7d45"/>
<text x="430" y="524" text-anchor="middle" font-size="11.5" fill="#1a1a1a">远跳转 → handler</text>
<rect x="530" y="506" width="420" height="26" fill="#f2f2f4" stroke="#7a7a88"/>
<text x="740" y="524" text-anchor="middle" font-size="11.5" fill="#333">函数其余部分（不动）</text>
<text x="116" y="562" font-size="12" fill="#444">调用桩（新分配内存）</text>
<rect x="330" y="546" width="200" height="26" fill="#f2f2f4" stroke="#7a7a88"/>
<text x="430" y="564" text-anchor="middle" font-size="11.5" fill="#333">原来的 20 字节序言</text>
<rect x="530" y="546" width="200" height="26" fill="#eef3fa" stroke="#4a72b0"/>
<text x="630" y="564" text-anchor="middle" font-size="11.5" fill="#1a1a1a">远跳转 → 原函数第 21 字节</text>
<text x="742" y="564" font-size="11.2" fill="#666">⇒ 序言不能含分支/PC 相对寻址</text>

<polyline points="65,404 65,612" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#xh-m)"/>

<!-- ④ -->
<rect x="30" y="612" width="600" height="90" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="46" y="635" font-size="14" font-weight="bold" fill="#1a1a1a">④ 运行时：xochitl 每次调这个函数，都先进 handler</text>
<text x="46" y="658" font-size="12" fill="#444">handler 读 reading-qol.json 的开关（hl-snap 每次划线读，hw-stroke 每笔起点读）</text>
<text x="46" y="678" font-size="12" fill="#444">开：改参数或跳过原逻辑；关：原样经调用桩调回原函数</text>
<rect x="660" y="612" width="310" height="90" rx="10" fill="#fdf0ec" stroke="#b0553a" stroke-width="1.4"/>
<text x="674" y="635" font-size="12.5" font-weight="bold" fill="#1a1a1a">✗ 配置缺失 / 解析失败 / 越界</text>
<text x="674" y="657" font-size="11.8" fill="#444">保持默认值：</text>
<text x="674" y="677" font-size="11.8" fill="#444">hl-snap 默认开，hw-stroke 默认关</text>
<polyline points="630,657 660,657" fill="none" stroke="#b0553a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#xh-m)"/>

<!-- bottom note -->
<rect x="30" y="722" width="940" height="84" rx="10" fill="#fdf3dc" stroke="#b8860b" stroke-width="1.5"/>
<text x="46" y="745" font-size="13" font-weight="bold" fill="#1a1a1a">网页上的「已加载 / 未加载」徽章怎么来的</text>
<text x="46" y="768" font-size="12" fill="#444">网关读 xochitl 主进程的 /proc/&lt;pid&gt;/maps，看里面有没有 extensions.d/&lt;名&gt;.so（gateway/src/enhance/loaded.rs）</text>
<text x="46" y="789" font-size="12" fill="#444">它只证明 .so 进了进程，走完了 ②；③ 有没有装上要看 journal 里的「hook 安装完成」</text>
</svg>
