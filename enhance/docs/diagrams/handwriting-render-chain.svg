<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="hw-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="700" fill="#fbfbfa"/>
<text x="500.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">笔画怎么变成像素：xochitl 渲染链与 hw-stroke 的 hook 位置（hw-stroke 2026-09-30 已移除，历史图）</text>
<text x="500.0" y="56" text-anchor="middle" font-size="13" fill="#666">xochitl 3.28.0.172 逆向所得；函数名 FUN_ 后是 Ghidra 地址（stripped 二进制无符号）</text>
<rect x="30" y="76" width="940" height="52" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6"/>
<text x="500.0" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">① 内存里的笔迹点（14 字节/点）</text>
<text x="500.0" y="120" text-anchor="middle" font-size="12" fill="#444">ShapesOverlay.updateImage 把笔画重采样、每点重新打包：x · y（float）｜宽度字段 ×2（u16，×0.25）｜方向角（u8）｜压感（u8）</text>
<polyline points="500,128 500,148" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<rect x="30" y="148" width="940" height="64" rx="10" fill="#eef3fa" stroke="#4a72b0" stroke-width="1.6"/>
<text x="500.0" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">② FUN_00f3f9d0：逐点渲染分派（读笔型标签 bVar16 → 选分支算宽度）</text>
<text x="500.0" y="192" text-anchor="middle" font-size="12" fill="#444">这里有一个只读诊断 hook，仅 hwStrokeDebug=true 时才装；本函数有 6 个调用点，"实时预览"与"提交进笔记本"可能走不同路径</text>
<rect x="30" y="240" width="211" height="96" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="135.5" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">书法笔（方向敏感分支）</text>
<text x="135.5" y="284" text-anchor="middle" font-size="11.8" fill="#444">→ FUN_00f47530</text>
<text x="135.5" y="301" text-anchor="middle" font-size="11.8" fill="#444">hook ✓  一次实测命中 2117 次</text>
<text x="135.5" y="318" text-anchor="middle" font-size="11.8" fill="#444">书法笔原生就带方向粗细</text>
<polyline points="135,212 135,240" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<rect x="273" y="240" width="211" height="96" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="378.5" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">bVar16 == 5 / 6</text>
<text x="378.5" y="284" text-anchor="middle" font-size="11.8" fill="#444">→ FUN_00f4c8d0</text>
<text x="378.5" y="301" text-anchor="middle" font-size="11.8" fill="#444">hook ✓  一次实测命中 10033 次</text>
<text x="378.5" y="318" text-anchor="middle" font-size="11.8" fill="#444">钢笔/铅笔/马克笔等日常工具</text>
<polyline points="378,212 378,240" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<rect x="516" y="240" width="211" height="96" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6"/>
<text x="621.5" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">bVar16 == 3</text>
<text x="621.5" y="284" text-anchor="middle" font-size="11.8" fill="#444">→ FUN_00f4f430</text>
<text x="621.5" y="301" text-anchor="middle" font-size="11.8" fill="#444">未 hook：前 20 字节含条件分支</text>
<text x="621.5" y="318" text-anchor="middle" font-size="11.8" fill="#444">PC 相对寻址，搬进 stub 会算错</text>
<polyline points="621,212 621,240" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<rect x="759" y="240" width="211" height="96" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6"/>
<text x="864.5" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">bVar16 &lt; 4（最常用钢笔量级）</text>
<text x="864.5" y="284" text-anchor="middle" font-size="11.8" fill="#444">虚函数动态分发</text>
<text x="864.5" y="301" text-anchor="middle" font-size="11.8" fill="#444">运行时目标未确认</text>
<text x="864.5" y="318" text-anchor="middle" font-size="11.8" fill="#444">目前摸不到</text>
<polyline points="864,212 864,240" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<polyline points="135,336 135,366" fill="none" stroke="#555" stroke-width="1.7"/>
<polyline points="378,336 378,366" fill="none" stroke="#555" stroke-width="1.7"/>
<polyline points="621,336 621,366" fill="none" stroke="#555" stroke-width="1.7" stroke-dasharray="5 4"/>
<polyline points="864,336 864,366" fill="none" stroke="#555" stroke-width="1.7" stroke-dasharray="5 4"/>
<polyline points="135,366 864,366" fill="none" stroke="#555" stroke-width="1.7"/>
<polyline points="500,366 500,392" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<text x="690" y="386" text-anchor="start" font-size="11.5" fill="#666">虚线：同族生成器，本线未覆盖</text>
<rect x="30" y="392" width="940" height="78" rx="10" fill="#eaf5ee" stroke="#2f7d45" stroke-width="1.6"/>
<text x="500.0" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">③ 变宽梯形几何生成器（两个 hook 改的就是这一步的宽度）</text>
<text x="500.0" y="436" text-anchor="middle" font-size="12" fill="#444">取"上一点半宽 + 当前点半宽 + 连线的垂直单位向量"算出梯形四角点；hook 在这里按 笔尖角度模型 × 运笔速度代理 缩放宽度</text>
<text x="500.0" y="453" text-anchor="middle" font-size="12" fill="#444">强度随基础宽度自动挂钩：细笔画趋近关闭、粗笔画满强度</text>
<polyline points="500,470 500,490" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<rect x="30" y="490" width="940" height="58" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6"/>
<text x="500.0" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">④ 四级 Sutherland-Hodgman 多边形裁剪（固定代码，非虚函数）</text>
<text x="500.0" y="534" text-anchor="middle" font-size="12" fill="#444">FUN_00f37d30 → 00f378e0 → 00f376b0 → 00f374f0：梯形按脏矩形切成三角形，纯几何，不碰颜色</text>
<polyline points="500,548 500,568" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#hw-m)"/>
<rect x="30" y="568" width="940" height="58" rx="10" fill="#f2f2f4" stroke="#7a7a88" stroke-width="1.6"/>
<text x="500.0" y="590" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">⑤ vtable+0x10 虚函数 → 多态像素消费者</text>
<text x="500.0" y="612" text-anchor="middle" font-size="12" fill="#444">CoverageBuffer / LerpRaster&lt;Fill*&gt;（铅笔、圆珠笔、实心、橡皮…），运行时按笔型选成员；静态分析到此为边界</text>
<text x="500" y="662" text-anchor="middle" font-size="12.5" fill="#555">压感：点结构里的压感字节是真数据，但跨函数传到 ③ 的方案被真机数据证伪，已放弃，改用运笔速度代理</text>
<text x="500" y="684" text-anchor="middle" font-size="12.5" fill="#555">详细推导与踩坑：enhance/docs/reMarkable系统增强线白皮书.md §03c–§03g、§04</text>
</svg>
