<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<defs><marker id="wk-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text xml:space="preserve" x="600.0" y="36" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">设备空闲时谁在定时叫醒 CPU（整套设备端组件，2026-10-10 按代码常量核对）</text>
<text xml:space="preserve" x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">不开网页、不操作设备时；用户态定时器用单调时钟，设备休眠时不走，所以都是「醒着时」的频率；没有在真机上实测唤醒次数</text>
<rect x="30" y="86" width="700" height="384" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text xml:space="preserve" x="44" y="108" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">定时唤醒（每小时次数，醒着时）</text>
<text xml:space="preserve" x="50" y="140" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">wifi-watch：每 15 秒看一眼链路</text>
<rect x="50" y="150" width="384.0" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="444.0" y="163" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">240 次/时</text>
<text xml:space="preserve" x="50" y="186" font-size="11" fill="#6B7280" text-anchor="start">链路正常只读 sysfs、不 fork；每 40 轮（10 分钟）兜底复查一次频段 / 省电</text>
<text xml:space="preserve" x="50" y="220" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">服务间事件流心跳：7 条 × 每 120 秒</text>
<rect x="50" y="230" width="336.0" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="396.0" y="243" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">210 次/时</text>
<text xml:space="preserve" x="50" y="266" font-size="11" fill="#6B7280" text-anchor="start">网关订阅 6 个有 /events 的服务 + transcribe-serve 订阅 ink-serve</text>
<text xml:space="preserve" x="50" y="300" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">mkdir-agent / trash-agent 两个 qmd 长轮询</text>
<rect x="50" y="310" width="19.200000000000003" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="79.2" y="323" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">12 次/时</text>
<text xml:space="preserve" x="50" y="346" font-size="11" fill="#6B7280" text-anchor="start">wait=290 秒长等待，各约 12 次/时；book-serve 不在时出错退避 15→120 秒</text>
<text xml:space="preserve" x="50" y="380" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">网关 mDNS 接口重扫</text>
<rect x="50" y="390" width="4" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text xml:space="preserve" x="64" y="403" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">0 次/时（空闲）</text>
<text xml:space="preserve" x="50" y="426" font-size="11" fill="#6B7280" text-anchor="start">听内核 netlink 地址变化，地址增删才重扫；netlink 打不开才退回每 60 秒</text>
<rect x="760" y="86" width="410" height="384" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text xml:space="preserve" x="774" y="108" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">只在事件发生时醒（空闲不醒）</text>
<text xml:space="preserve" x="774" y="144" font-size="12" fill="#1F2937" text-anchor="start">hl-snap.so：没有定时器，只在划线时进 handler</text>
<text xml:space="preserve" x="774" y="178" font-size="12" fill="#1F2937" text-anchor="start">reader-page-turn.qmd：开书时单发 300 ms 读一次</text>
<text xml:space="preserve" x="774" y="212" font-size="12" fill="#1F2937" text-anchor="start">shelf-comic-margins.qmd：换文档单发 1.5 秒</text>
<text xml:space="preserve" x="774" y="246" font-size="12" fill="#1F2937" text-anchor="start">shelf-keep-progress.qmd：开书 / 页数变化时单发 2 秒</text>
<text xml:space="preserve" x="774" y="280" font-size="12" fill="#1F2937" text-anchor="start">wallpaper-serve：inotify，每次休眠醒一次</text>
<text xml:space="preserve" x="774" y="314" font-size="12" fill="#1F2937" text-anchor="start">book-serve / ink-serve：inotify 防抖（8 秒 / 4 秒）</text>
<text xml:space="preserve" x="774" y="348" font-size="12" fill="#1F2937" text-anchor="start">font-serve：只响应网页请求</text>
<text xml:space="preserve" x="774" y="382" font-size="12" fill="#1F2937" text-anchor="start">浏览器事件流 20 秒心跳：只在网页开着时</text>
<rect x="30" y="494" width="1140" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text xml:space="preserve" x="44" y="516" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">结论与依据</text>
<text xml:space="preserve" x="44" y="542" font-size="12" fill="#1F2937" text-anchor="start">空闲时的定时唤醒主要是 wifi-watch（约 240 次/时）和 7 条事件流心跳（约 210 次/时），两个长轮询各约 12 次/时。</text>
<text xml:space="preserve" x="44" y="566" font-size="12" fill="#1F2937" text-anchor="start">本线自己的组件空闲时都不定时醒：wallpaper-serve 从 2026-09-24 起不再常驻 journalctl -f（那时 xochitl 每写一行日志它就醒一次）。</text>
<text xml:space="preserve" x="44" y="590" font-size="12" fill="#1F2937" text-anchor="start">飞行记录仪跑在宿主机上（经 ssh 抓设备日志），不在设备上；本线仍尽量压低 xochitl 日志量（翻页 qmd 去掉了命中日志）。</text>
<text xml:space="preserve" x="44" y="614" font-size="12" fill="#1F2937" text-anchor="start">常量出处：wifi-watch.sh INTERVAL/RECHECK · rmsvc-core events.rs FOLLOW_KEEPALIVE_SECS · mdns.rs RESCAN_INTERVAL · 各 qmd 源码</text>
</svg>
