<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" fill="currentColor">
  <style>
    .box  { fill: none; stroke: currentColor; }
    .soft { fill: currentColor; fill-opacity: .05; stroke: currentColor; }
    .t    { font-size: 15px; font-weight: 600; }
    .s    { font-size: 12px; fill-opacity: .78; }
    .flow { stroke: currentColor; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ① 关笔记 -->
  <rect class="box" x="170" y="16" width="560" height="62" rx="10"/>
  <text class="t" x="450" y="42" text-anchor="middle">① 卡片某槽旁手写想法 → 退出笔记回书库</text>
  <text class="s" x="450" y="63" text-anchor="middle">xochitl 关页落盘 &lt;card&gt;/&lt;page&gt;.rm（CLOSE_WRITE；停在原页不落盘）</text>

  <path class="flow" d="M450,78 L450,106" marker-end="url(#ah)"/>

  <!-- ② daemon fswatch -->
  <rect class="soft" x="170" y="108" width="560" height="62" rx="10"/>
  <text class="t" x="450" y="134" text-anchor="middle">② daemon fswatch（inotify + 8s 防抖，事件驱动）</text>
  <text class="s" x="450" y="155" text-anchor="middle">步骤④：在库「总结卡片」含手写页？（排除 trash + 内容哈希幂等 exactly-once）</text>

  <path class="flow" d="M450,170 L450,198" marker-end="url(#ah)"/>

  <!-- ③ 收割缩略图 -->
  <rect class="box" x="170" y="200" width="560" height="62" rx="10"/>
  <text class="t" x="450" y="226" text-anchor="middle">③ 收割 xochitl 原生缩略图（vision 输入）</text>
  <text class="s" x="450" y="247" text-anchor="middle">&lt;card&gt;.thumbnails/&lt;page&gt;.png · 真实线宽/抗锯齿（de-risk：值 8 分，胜自制渲染）</text>

  <path class="flow" d="M450,262 L450,290" marker-end="url(#ah)"/>

  <!-- ④ 设备调云 vision -->
  <rect class="soft" x="170" y="292" width="560" height="78" rx="10"/>
  <text class="t" x="450" y="318" text-anchor="middle">④ 设备自己调云 vision（ureq+rustls HTTPS，host 零参与）</text>
  <text class="s" x="450" y="339" text-anchor="middle">四后端可插拔·默认 Gemini · 空间关联 {手写 → 贴哪条书摘}</text>
  <text class="s" x="450" y="357" text-anchor="middle">只认彩色手写 · 打印文字泄漏结构性过滤（note≈已有 bullet 即丢）</text>

  <path class="flow" d="M450,370 L450,398" marker-end="url(#ah)"/>

  <!-- ⑤ 内联注入 -->
  <rect class="box" x="170" y="400" width="560" height="62" rx="10"/>
  <text class="t" x="450" y="426" text-anchor="middle">⑤ 转写内联拼接到书摘行尾（模式 A）</text>
  <text class="s" x="450" y="447" text-anchor="middle">手写消化成文字 · 搭 cardsync::parse_card 保留通道（重建不丢）</text>

  <path class="flow" d="M450,462 L450,490" marker-end="url(#ah)"/>

  <!-- ⑥ /upload -->
  <rect class="soft" x="170" y="492" width="560" height="62" rx="10"/>
  <text class="t" x="450" y="518" text-anchor="middle">⑥ /upload 重建卡片（notebook_sync::sync_auto_notebook）</text>
  <text class="s" x="450" y="539" text-anchor="middle">绕过「xochitl 直写不可见」铁律 · 顺带合并重名卡 + queue-trash 旧本</text>

  <path class="flow" d="M450,554 L450,582" marker-end="url(#ah)"/>

  <!-- ⑦ 通知（Phase C） -->
  <rect class="box" x="170" y="584" width="560" height="62" rx="10" stroke-dasharray="5 4"/>
  <text class="t" x="450" y="610" text-anchor="middle">⑦ showNotification 通知「完成/失败」（Phase C 待建）</text>
  <text class="s" x="450" y="631" text-anchor="middle">daemon 够不到 QML → 写状态文件 + 注入 QML 观察器轮询桥接</text>

  <!-- 旁注：失败不阻塞 -->
  <text class="s" x="748" y="336" text-anchor="start">网络/识别</text>
  <text class="s" x="748" y="352" text-anchor="start">失败只记不崩</text>
  <text class="s" x="748" y="368" text-anchor="start">不阻塞画星</text>
  <path class="flow" d="M732,340 L742,340" marker-end="url(#ah)" opacity=".6"/>
</svg>
