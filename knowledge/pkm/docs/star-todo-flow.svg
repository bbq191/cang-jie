<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 712" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" fill="currentColor">
  <style>
    .box  { fill: none; stroke: currentColor; }
    .soft { fill: currentColor; fill-opacity: .05; stroke: currentColor; }
    .t    { font-size: 15px; font-weight: 600; }
    .s    { font-size: 12px; fill-opacity: .78; }
    .lbl  { font-size: 11.5px; fill-opacity: .85; }
    .flow { stroke: currentColor; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ① 画星 -->
  <rect class="box" x="150" y="16" width="440" height="60" rx="10"/>
  <text class="t" x="370" y="42" text-anchor="middle">① 阅读器：红笔在某页画五角星</text>
  <text class="s" x="370" y="63" text-anchor="middle">xochitl 把笔迹落盘 &lt;doc-uuid&gt;/&lt;page&gt;.rm</text>

  <path class="flow" d="M370,76 L370,104" marker-end="url(#ah)"/>

  <!-- ② fswatch -->
  <rect class="soft" x="150" y="106" width="440" height="60" rx="10"/>
  <text class="t" x="370" y="132" text-anchor="middle">② fswatch（inotify + 8s 防抖）</text>
  <text class="s" x="370" y="153" text-anchor="middle">监视文档目录 · 写入静默后结算一次 · 空闲阻塞睡死零唤醒</text>

  <path class="flow" d="M370,166 L370,194" marker-end="url(#ah)"/>

  <!-- ③ 识别（两块） -->
  <rect class="box" x="60" y="196" width="360" height="76" rx="10"/>
  <text class="t" x="240" y="222" text-anchor="middle">③a stardetect · 识别</text>
  <text class="s" x="80" y="244">读 .rm → 自相交计数（pentagram 不变量）</text>
  <text class="s" x="80" y="262">+ 专用笔色门控（红）→ 命中星页</text>

  <rect class="box" x="440" y="196" width="360" height="76" rx="10"/>
  <text class="t" x="620" y="222" text-anchor="middle">③b epubindex · 页→章名</text>
  <text class="s" x="460" y="244">逆向 .epubindex（页→spine 文件）</text>
  <text class="s" x="460" y="262">+ .epub toc（spine→章名）</text>

  <path class="flow" d="M240,272 C240,290 370,286 370,306" marker-end="url(#ah)"/>
  <path class="flow" d="M620,272 C620,290 370,286 370,306" marker-end="url(#ah)"/>

  <!-- ④ 卡片 merge -->
  <rect class="soft" x="90" y="308" width="560" height="98" rx="10"/>
  <text class="t" x="370" y="334" text-anchor="middle">④ cardsync / cardnote · 生成卡片（merge，绝不覆盖打字批注）</text>
  <text class="s" x="370" y="356" text-anchor="middle">读回卡片现有打字 → parse_card 拆每页批注 → render_card 按当前星重生成</text>
  <text class="s" x="370" y="374" text-anchor="middle">一星一页 · ★ 章名·第 N 页 · [ID] · 2.md 模板（老星保留批注、新星注入）</text>
  <text class="s" x="370" y="392" text-anchor="middle">→ pack_rmdoc（.rmdoc）；内容不变则跳过（开书不重复生成、每书恒 1 张）</text>

  <path class="flow" d="M370,406 L370,434" marker-end="url(#ah)"/>

  <!-- ⑤ /upload -->
  <rect class="box" x="150" y="436" width="440" height="72" rx="10" stroke-width="2"/>
  <text class="t" x="370" y="462" text-anchor="middle">⑤ /upload（10.11.99.1，本机可达）→ 活注入</text>
  <text class="s" x="370" y="484" text-anchor="middle">注入「《书名》- 总结卡片」新本 · xochitl 原生导入即时进库</text>
  <text class="s" x="370" y="502" text-anchor="middle">旧同名本 uuid 入 pending-trash 队列</text>

  <path class="flow" d="M370,508 L370,536" marker-end="url(#ah)"/>
  <text class="lbl" x="382" y="527" fill-opacity=".7">新卡进库 → 文档模型 onRowsInserted</text>

  <!-- ⑥ trash-agent -->
  <rect class="box" x="150" y="538" width="440" height="72" rx="10"/>
  <text class="t" x="370" y="564" text-anchor="middle">⑥ trash-agent.qmd · 纯事件驱动去重</text>
  <text class="s" x="370" y="586" text-anchor="middle">挂 onRowsInserted / onModelReset + 4s 防抖 → 原生 selectionMoveToTrash</text>
  <text class="s" x="370" y="604" text-anchor="middle">读 /trash/pending 删旧卡（~2s 无形消失，界面不残留）</text>

  <!-- 开关（侧） -->
  <rect class="box" x="628" y="436" width="180" height="98" rx="10" stroke-dasharray="5 4"/>
  <text class="t" x="718" y="462" text-anchor="middle">总开关</text>
  <text class="s" x="718" y="484" text-anchor="middle">设置页</text>
  <text class="s" x="718" y="502" text-anchor="middle">系统增强 → 笔记增强</text>
  <text class="lbl" x="718" y="522" text-anchor="middle" fill-opacity=".7">starTodoEnabled（默认关）</text>
  <path class="flow" d="M628,406 C560,406 460,410 420,436" marker-end="url(#ah)" stroke-dasharray="4 3"/>
  <text class="lbl" x="628" y="400" text-anchor="end" fill-opacity=".6">关闭时只监听不动手</text>

  <!-- 底注 -->
  <text class="s" x="370" y="648" text-anchor="middle" fill-opacity=".62">全设备自足（无 host、无网络依赖）· 独立 daemon wr-stars.service · CPUQuota 30% · 开机自启</text>
  <text class="s" x="370" y="668" text-anchor="middle" fill-opacity=".62">配置 reading-qol.json：starTodoColor(RED) · starTodoGap(25)　｜　批注用 Text 工具打字（手写读不回）</text>
</svg>
