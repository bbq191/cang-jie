<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  xochitl UI/候选栏/笔记 中文字体链（2026-08-23 换宋体主字体 + 扩展 B 兜底）：
    主  LXGW Neo ZhiSong Screen Full（霞鹜新致宋，优雅书卷气宋体，BMP+扩展A 全覆盖）
    兜底 HanaMinB（花园明朝 B，覆盖 CJK 扩展 B-F 生僻字，补主字体缺的 U+20000+）
  目的：候选栏 + 笔记正文统一霞鹜新致宋；打到扩展 B 生僻字（如 hang 尾部的 𠡊𡕧…）
  时字形级回退 HanaMinB、不再豆腐块。字体在 /home 持久分区。
  演进：此前 LXGW Neo XiHei / Alibaba PuHuiTi 均只覆盖到扩展 A，扩展 B 生僻字豆腐。
  清晰度：宋体笔画细，若 e-ink 发虚可对主字体加 <edit name="embolden"><bool>true</bool></edit>。
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>LXGW Neo ZhiSong Screen Full</family>
      <family>HanaMinB</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW Neo ZhiSong Screen Full</string></edit>
    <edit name="family" mode="append" binding="weak"><string>HanaMinB</string></edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>LXGW Neo ZhiSong Screen Full</string></edit>
    <edit name="family" mode="append" binding="weak"><string>HanaMinB</string></edit>
  </match>
</fontconfig>
