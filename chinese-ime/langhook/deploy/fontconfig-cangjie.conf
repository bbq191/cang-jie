<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  xochitl UI 字体 → LXGW Neo XiHei Screen Full（霞鹜新晰黑 屏幕阅读版·补全）。
  黑体、Screen 版为屏幕清晰预优化（略加粗、调 metrics），单文件覆盖简繁+英，e-ink 不发虚。
  字体在 /home 持久分区。2026-08-16 结项：全线统一到 LXGW Neo XiHei（UI+候选栏），不再装 HarmonyOS。
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>LXGW Neo XiHei Screen Full</family></prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW Neo XiHei Screen Full</string></edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>LXGW Neo XiHei Screen Full</string></edit>
  </match>
</fontconfig>
