# cangjie: xochitl.service 的 ExecStartPre —— 每次 xochitl 启动前给 usb1 挂 10.11.99.1/32。
#
# 为什么需要：xochitl web(:80) 只绑 USB gadget 接口的 IP。无 USB 冷启动时靠
# cangjie-lo-alias.sh（xovi pre-start）给 usb1 挂 10.11.99.1 喂饱接口选择 fallback（反编译
# 0x71e070：usb0 无 carrier → 落 usb1 不查 carrier），xochitl 才绑得上 :80。
# 但那脚本**只在 xovi pre-start（开机）跑**——中途 `systemctl restart xochitl`（部署常做：
# cardhw/packaging/多格式）不重跑它；且期间插拔 USB 会重置 usb1、丢掉手挂的 alias（lo 的不受影响）。
# → xochitl 中途重启时 usb1 无 IPv4 → :80 绑不上 → ★待办/cardhw/墨香/多格式所有 /upload 静默失败。
#
# 本 drop-in 把 usb1 alias 挂载做成 xochitl.service 的 ExecStartPre，**每次启动都跑**、补上时序缺口。
# `-` 前缀：命令失败（usb1 不存在、地址已存在）被忽略、绝不阻塞 xochitl 启动。命令内联、
# 全走 rootfs 的 /usr/sbin/ip，**不引入任何 /home 依赖**（守「绝不给 xochitl 加 /home 依赖」铁律）。
# 幂等；不影响真插 USB（那时 usb1 本就有 10.11.99.1）。
[Service]
ExecStartPre=-/usr/sbin/ip link set usb1 up
ExecStartPre=-/usr/sbin/ip addr add 10.11.99.1/32 dev usb1
