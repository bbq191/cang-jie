<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- cangjie-langhook: 中文界面字体 —— reMarkable Sans（xochitl 内置英文字体，无
     CJK 字形）渲染中文字符时，优先 fallback 到汉仪铁线黑，而不是设备自带的
     Noto Sans SC。这条规则不区分"当前界面语言是不是中文"，而是按"这段文字
     实际含不含 reMarkable Sans 覆盖不到的字形"来生效——效果上等价于"简/繁体
     中文界面下的中文字符都走这个字体"，因为英文界面下本来就不会出现中文字符
     触发这条 fallback；唯一的例外是文档文件名等用户内容本身含中文时，即使
     界面语言是英文也会命中这条规则，这是刻意接受的简化，不做更复杂的按界面
     语言精确判断。 -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>reMarkable Sans</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>HYTieXianHei</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>reMarkable Serif Small</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>HYTieXianHei</string>
    </edit>
  </match>
</fontconfig>
