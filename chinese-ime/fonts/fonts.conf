<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  xochitl UI 字体 → LXGW Neo XiHei Screen Full（晰黑 Screen 补全，/home 持久分区）。
  2026-08-22 演进记录：
  ① 删 HarmonyOS 弱回退残留（字体已卸载，规则永不生效）。
  ② 晰黑开 embolden 合成加粗（e-ink 笔记/UI 中文发虚缓解）。
  ③ ⛔ 判死存档：想给"阅读选 KF Readerly 时汉字回退到致宋"做过两轮规则（按
     family=KF Readerly 定向 / 按 prgname=xochitl_pdf_renderer 分流），重渲后 PDF
     实测都仍嵌晰黑——EPUB 渲染是 xochitl fork 的 worker（prgname 同为 xochitl），
     其 CJK 回退查询也不带请求家族，fontconfig 层无法定向拦截。结论：读中文书要
     衬线组合直接选致宋（自带衬线拉丁）。规则已清理勿再加回。
  语法坑：prepend 在 test 命中同属性时插到命中值前而非队头，占队头用 prepend_first。
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>LXGW Neo XiHei Screen Full</family></prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW Neo XiHei Screen Full</string></edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>LXGW Neo XiHei Screen Full</string></edit>
  </match>
  <match target="font">
    <test name="family"><string>LXGW Neo XiHei Screen Full</string></test>
    <edit name="embolden" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
