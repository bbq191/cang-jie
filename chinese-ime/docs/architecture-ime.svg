<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" fill="currentColor">
  <style>
    .box  { fill: none; stroke: currentColor; }
    .soft { fill: currentColor; fill-opacity: .05; stroke: currentColor; }
    .t    { font-size: 15px; font-weight: 600; }
    .s    { font-size: 12px; fill-opacity: .78; }
    .lbl  { font-size: 11.5px; fill-opacity: .85; }
    .flow { stroke: currentColor; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- VirtualKeyboard -->
  <rect class="soft" x="40" y="18" width="820" height="80" rx="12"/>
  <text class="t" x="450" y="46" text-anchor="middle">xochitl 进程 · VirtualKeyboard 实例</text>
  <text class="s" x="450" y="70" text-anchor="middle">QQuickPaintedItem 子类（非 Qt 官方 VirtualKeyboard / 非 QPlatformInputContext 插件）</text>
  <text class="s" x="450" y="88" text-anchor="middle">全部按键统一经 FUN_00697610 分发</text>

  <!-- VK → so -->
  <path class="flow" d="M450,98 L450,132" marker-end="url(#ah)"/>
  <text class="lbl" x="462" y="120">trampoline hook（LD_PRELOAD 注入）</text>

  <!-- langhook.so -->
  <rect class="box" x="330" y="134" width="240" height="52" rx="10" stroke-width="2"/>
  <text class="t" x="450" y="166" text-anchor="middle">cangjie-langhook.so</text>

  <!-- so → 两条链 -->
  <path class="flow" d="M400,186 C400,210 235,206 235,232" marker-end="url(#ah)"/>
  <path class="flow" d="M500,186 C500,210 665,206 665,232" marker-end="url(#ah)"/>
  <text class="lbl" x="150" y="216" fill-opacity=".7">链① 语言切换</text>
  <text class="lbl" x="600" y="216" fill-opacity=".7">链② 按键处理</text>

  <!-- 链① 语言切换器 hook -->
  <rect class="box" x="40" y="234" width="390" height="118" rx="10"/>
  <text class="t" x="235" y="262" text-anchor="middle">语言切换器 hook</text>
  <text class="s" x="60" y="288">FUN_00695a60 分派：languages 追加 zh_CN/zh_TW</text>
  <text class="s" x="60" y="308">languageName 去重名</text>
  <text class="s" x="60" y="328">布局加载换 en_US 兜底</text>
  <text class="lbl" x="60" y="346" fill-opacity=".6">（否则按键网格整体消失，见 Step U）</text>

  <!-- 链② 按键处理 → 拼音缓冲 -->
  <rect class="box" x="470" y="234" width="390" height="118" rx="10"/>
  <text class="t" x="665" y="262" text-anchor="middle">按键处理 → 拼音缓冲状态机</text>
  <text class="s" x="490" y="288">中文模式（language == zh_CN/zh_TW）才拦截</text>
  <text class="s" x="490" y="308">字符键缓冲进静态 buffer</text>
  <text class="s" x="490" y="328">cj_segment() 音节切分 → key</text>
  <text class="lbl" x="490" y="346" fill-opacity=".6">（切分见 03 节）</text>

  <!-- 按键处理 → dict.bin -->
  <path class="flow" d="M665,352 L665,398" marker-end="url(#ah)"/>
  <text class="lbl" x="675" y="378">cj_dict_lookup[_prefix]</text>

  <!-- dict.bin -->
  <rect class="box" x="470" y="400" width="390" height="76" rx="10"/>
  <text class="t" x="665" y="428" text-anchor="middle">dict.bin（独立文件）</text>
  <text class="s" x="490" y="450">mmap 只读，不编译进 .so 本体</text>
  <text class="s" x="490" y="468">rime-ice 词典 GPL v3 数据隔离取舍</text>

  <!-- dict.bin → 候选栏 -->
  <path class="flow" d="M665,476 L665,514" marker-end="url(#ah)"/>
  <text class="lbl" x="675" y="500">候选结果 → keys 属性</text>

  <!-- CjCandidateBar -->
  <rect class="box" x="470" y="516" width="390" height="80" rx="10"/>
  <text class="t" x="665" y="544" text-anchor="middle">CjCandidateBar（QMLDiff 注入组件）</text>
  <text class="s" x="490" y="566">qt-resource-rebuilder 装 xovi 扩展 · 在 KeyboardPanel.qml 注入</text>
  <text class="s" x="490" y="584">全新 Rectangle 组件（Step BB）· C 端 parentItem() 定位</text>
</svg>
