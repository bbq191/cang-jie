<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" fill="currentColor">
  <style>
    .box  { fill: none; stroke: currentColor; }
    .soft { fill: currentColor; fill-opacity: .05; stroke: currentColor; }
    .t    { font-size: 15px; font-weight: 600; }
    .s    { font-size: 12px; fill-opacity: .78; }
    .lbl  { font-size: 11.5px; fill-opacity: .85; }
    .flow { stroke: currentColor; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- xochitl 进程 -->
  <rect class="soft" x="40" y="20" width="680" height="86" rx="12"/>
  <text class="t" x="380" y="48" text-anchor="middle">xochitl 进程（Qt6，闭源，磁盘文件不做任何修改）</text>
  <text class="s" x="380" y="72" text-anchor="middle">Settings UI · 语言列表（LanguageSettings）</text>
  <text class="s" x="380" y="90" text-anchor="middle">Qt 翻译系统（.qm 加载器）</text>

  <!-- hook 注入 -->
  <path class="flow" d="M380,106 L380,158" marker-end="url(#ah)"/>
  <text class="lbl" x="392" y="128">trampoline hook</text>
  <text class="lbl" x="392" y="145" fill-opacity=".65">LD_PRELOAD 注入 · 进程启动</text>

  <!-- langhook.so -->
  <rect class="box" x="230" y="160" width="300" height="66" rx="10" stroke-width="2"/>
  <text class="t" x="380" y="188" text-anchor="middle">cangjie-langhook.so</text>
  <text class="s" x="380" y="210" text-anchor="middle">语言列表 hook（追加简/繁中文项）</text>

  <!-- so → 语言包 -->
  <path class="flow" d="M380,226 L380,270" marker-end="url(#ah)"/>

  <!-- 中文语言包 -->
  <rect class="box" x="120" y="272" width="520" height="96" rx="10"/>
  <text class="t" x="380" y="300" text-anchor="middle">中文语言包（运行时加载的外部数据）</text>
  <text class="s" x="380" y="324" text-anchor="middle">zh_CN.qm / zh_TW.qm / zh_HK.qm　·　LXGW Neo XiHei subset 字体</text>
  <text class="s" x="380" y="346" text-anchor="middle">对接 Qt 翻译系统 + 语言列表　（键盘/输入法另见拼音白皮书）</text>
</svg>
