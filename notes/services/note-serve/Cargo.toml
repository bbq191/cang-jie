[package]
name = "note-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "笔记·本：注册「笔记」tab；条目库 → 设备笔记本（一章一本）投影 + 生成/上传编排（md 导出待建）"

[[bin]]
name = "note-serve"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../../../rmsvc-core" }
notecore = { path = "../../crates/notecore" }
notesvc = { path = "../../crates/notesvc" }
rmv6 = { path = "../../crates/rmv6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# 只用 flate2 的 deflate（zip 的 "deflate" 特性还会带上用不到的 zopfli）
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
