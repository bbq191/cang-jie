[package]
name = "note-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "笔记·本：注册「笔记」tab；条目库 → 设备笔记本（一章一本）投影与 md 导出（投影部分待建）"

[[bin]]
name = "note-serve"
