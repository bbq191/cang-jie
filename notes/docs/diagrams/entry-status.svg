<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d00"/></marker>
    <marker id="s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a03030"/></marker>
    <marker id="s4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fa3"/></marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#fbfbfa"/>
  <text x="540" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">条目状态机：7 个状态 + 回收站「恢复」</text>
  <text x="540" y="48" text-anchor="middle" font-size="11.5" fill="#8a8a8a">代码：notecore::model::Status / Entry::set_triage / Entry::restore；上排是正常流程，下排三个是回收站里的终态</text>

  <!-- 上排 -->
  <rect x="30" y="90" width="180" height="76" rx="9" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="120" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Mined 待浏览</text>
  <text x="120" y="137" text-anchor="middle" font-size="10" fill="#5a4a1a">摄取出来的初始态</text>
  <text x="120" y="153" text-anchor="middle" font-size="9.5" fill="#8a7a4a">不会被自动转写</text>

  <rect x="290" y="90" width="180" height="76" rx="9" fill="#eaf3fb" stroke="#2f6fa3" stroke-width="1.8"/>
  <text x="380" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Pending 待转写</text>
  <text x="380" y="137" text-anchor="middle" font-size="10" fill="#1a3a5a">用户点了「转入笔记」</text>
  <text x="380" y="153" text-anchor="middle" font-size="9.5" fill="#5a7a9a">transcribe-serve 会扫到</text>

  <rect x="550" y="90" width="180" height="76" rx="9" fill="#fdf3e6" stroke="#c9701f" stroke-width="1.8"/>
  <text x="640" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Draft 待校对</text>
  <text x="640" y="137" text-anchor="middle" font-size="10" fill="#5a3a1a">有转写草稿</text>
  <text x="640" y="153" text-anchor="middle" font-size="9.5" fill="#8a6a4a">text 仍为空</text>

  <rect x="810" y="90" width="180" height="76" rx="9" fill="#eaf7ec" stroke="#3e8e51" stroke-width="1.8"/>
  <text x="900" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Reviewed 已定稿</text>
  <text x="900" y="137" text-anchor="middle" font-size="10" fill="#1a5a2a">text 有值</text>
  <text x="900" y="153" text-anchor="middle" font-size="9.5" fill="#5a8a6a">以后重扫也不会覆盖它</text>

  <line x1="210" y1="128" x2="288" y2="128" stroke="#555" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="249" y="118" text-anchor="middle" font-size="9.5" fill="#5a5a5a">「转入笔记」</text>
  <line x1="470" y1="128" x2="548" y2="128" stroke="#555" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="509" y="118" text-anchor="middle" font-size="9.5" fill="#5a5a5a">草稿写回</text>
  <line x1="730" y1="128" x2="808" y2="128" stroke="#555" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="769" y="118" text-anchor="middle" font-size="9.5" fill="#5a5a5a">网页改字</text>

  <!-- 快路径 -->
  <path d="M 150 90 C 190 50, 860 50, 900 88" fill="none" stroke="#8a6d00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#s2)"/>
  <text x="525" y="81" text-anchor="middle" font-size="10" fill="#8a6d00">快路径：没有手写的条目（纯勾画、KOReader 高亮/生词）点「转入笔记」→ 直接用原文定稿，跳过 Pending/Draft</text>

  <!-- 灰色总线：→ Revoked -->
  <line x1="180" y1="166" x2="180" y2="205" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="420" y1="166" x2="420" y2="205" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="600" y1="166" x2="600" y2="205" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="850" y1="166" x2="850" y2="205" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="180" y1="205" x2="850" y2="205" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="540" y1="205" x2="540" y2="368" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#s1)"/>
  <text x="330" y="226" text-anchor="middle" font-size="10" fill="#6a6a6a">笔迹/勾画被擦掉，或源书被删、进回收站</text>
  <text x="330" y="241" text-anchor="middle" font-size="10" fill="#6a6a6a">→ ink-serve 重扫时自动改判（任一非终态）</text>

  <!-- 红色总线：→ Archived -->
  <line x1="450" y1="166" x2="450" y2="262" stroke="#a03030" stroke-width="1.3"/>
  <line x1="700" y1="166" x2="700" y2="262" stroke="#a03030" stroke-width="1.3"/>
  <line x1="960" y1="166" x2="960" y2="262" stroke="#a03030" stroke-width="1.3"/>
  <line x1="450" y1="262" x2="960" y2="262" stroke="#a03030" stroke-width="1.3"/>
  <line x1="870" y1="262" x2="870" y2="368" stroke="#a03030" stroke-width="1.3" marker-end="url(#s3)"/>
  <text x="720" y="284" text-anchor="middle" font-size="10" fill="#a03030">「整理」页点「不要了」</text>
  <text x="720" y="299" text-anchor="middle" font-size="10" fill="#a03030">（两处投影都摘掉）</text>

  <!-- Mined -> Skipped -->
  <path d="M 70 166 C 70 260, 150 300, 170 368" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#s1)"/>
  <text x="44" y="262" text-anchor="middle" font-size="9.5" fill="#5a5a5a">「不需要」</text>

  <!-- 下排：终态 -->
  <rect x="120" y="370" width="180" height="70" rx="9" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="210" y="397" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a3a3a">Skipped 已跳过</text>
  <text x="210" y="416" text-anchor="middle" font-size="10" fill="#5a5a5a">「浏览」里点了「不需要」</text>
  <text x="210" y="431" text-anchor="middle" font-size="9.5" fill="#8a8a8a">用户主动</text>

  <rect x="450" y="370" width="180" height="70" rx="9" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="540" y="397" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a3a3a">Revoked 已撤销</text>
  <text x="540" y="416" text-anchor="middle" font-size="10" fill="#5a5a5a">笔迹没了 / 书没了</text>
  <text x="540" y="431" text-anchor="middle" font-size="9.5" fill="#8a8a8a">系统自动</text>

  <rect x="780" y="370" width="180" height="70" rx="9" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="870" y="397" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a3a3a">Archived 已删除</text>
  <text x="870" y="416" text-anchor="middle" font-size="10" fill="#5a5a5a">「整理」里点了「不要了」</text>
  <text x="870" y="431" text-anchor="middle" font-size="9.5" fill="#8a8a8a">用户主动</text>

  <!-- restore -->
  <path d="M 150 370 C 120 300, 110 230, 110 168" fill="none" stroke="#2f6fa3" stroke-width="1.4" stroke-dasharray="6 3" marker-end="url(#s4)"/>
  <text x="96" y="352" text-anchor="end" font-size="9.5" fill="#2f6fa3">恢复 → 回 Mined</text>
  <path d="M 540 440 L 540 470" fill="none" stroke="#2f6fa3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#s4)"/>
  <path d="M 850 440 L 760 470" fill="none" stroke="#2f6fa3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#s4)"/>
  <rect x="340" y="472" width="480" height="76" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="580" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Revoked / Archived「恢复」：按已有内容倒推回到哪一步</text>
  <text x="580" y="514" text-anchor="middle" font-size="10.3" fill="#3a3a3a">有定稿文本 → Reviewed ｜ 没定稿但有草稿 → Draft</text>
  <text x="580" y="532" text-anchor="middle" font-size="10.3" fill="#3a3a3a">有手写没转写 → Pending ｜ 什么都没有 → Mined</text>

  <!-- purge -->
  <path d="M 210 440 L 210 600 L 328 600" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#s1)"/>
  <rect x="330" y="578" width="400" height="44" rx="8" fill="#f5f5f5" stroke="#5a5a5a" stroke-width="1.2"/>
  <text x="530" y="597" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a3a">「清空回收站」= Book::purge_terminal()</text>
  <text x="530" y="613" text-anchor="middle" font-size="9.8" fill="#6a6a6a">三种终态一起物理删除，不可恢复；只能手动点，不会自动清</text>

  <text x="20" y="468" font-size="10" fill="#a03030">⚠「恢复」找回的是条目库里</text>
  <text x="20" y="483" font-size="10" fill="#a03030">存好的内容（裁图/草稿/定稿），</text>
  <text x="20" y="498" font-size="10" fill="#a03030">不会让设备页面上已擦掉的</text>
  <text x="20" y="513" font-size="10" fill="#a03030">笔迹重新出现</text>

  <text x="900" y="480" text-anchor="middle" font-size="10" fill="#6a6a6a">三个终态 = is_terminal()</text>
  <text x="900" y="496" text-anchor="middle" font-size="9.5" fill="#8a8a8a">改字端点对终态拒写，</text>
  <text x="900" y="511" text-anchor="middle" font-size="9.5" fill="#8a8a8a">要先「恢复」</text>
  <text x="900" y="540" text-anchor="middle" font-size="10" fill="#6a6a6a">进投影的只有</text>
  <text x="900" y="555" text-anchor="middle" font-size="10" fill="#6a6a6a">Pending / Draft / Reviewed</text>
</svg>
