<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="es-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="es-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="es-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="es-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">条目状态机：7 个状态</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">状态只经 notecore::model::Entry 的方法改；上排 4 个是活条目，下排 3 个终态都在回收站里</text>
<rect x="30" y="130" width="200" height="84" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="130.0" y="152" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">Mined 待浏览</text>
<text x="130.0" y="172" font-size="12" fill="#1F2937" text-anchor="middle">摄取出的初始态</text>
<text x="130.0" y="190" font-size="12" fill="#6B7280" text-anchor="middle">不会被自动转写</text>
<rect x="340" y="130" width="200" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="440.0" y="152" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">Pending 待转写</text>
<text x="440.0" y="172" font-size="12" fill="#1F2937" text-anchor="middle">点了「转入笔记」</text>
<text x="440.0" y="190" font-size="12" fill="#6B7280" text-anchor="middle">转写服务会捡走</text>
<rect x="650" y="130" width="200" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="750.0" y="152" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">Draft 待校对</text>
<text x="750.0" y="172" font-size="12" fill="#1F2937" text-anchor="middle">有转写草稿</text>
<text x="750.0" y="190" font-size="12" fill="#6B7280" text-anchor="middle">还没定稿文字</text>
<rect x="960" y="130" width="200" height="84" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="1060.0" y="152" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">Reviewed 已定稿</text>
<text x="1060.0" y="172" font-size="12" fill="#1F2937" text-anchor="middle">有定稿文字 text</text>
<text x="1060.0" y="190" font-size="12" fill="#6B7280" text-anchor="middle">再转写也不覆盖</text>
<path d="M230,172.0 L338,172.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#es-arr)"/>
<rect x="259.0" y="153.0" width="52.0" height="16" fill="#FFFFFF"/>
<text x="285.0" y="164.0" font-size="11" fill="#1F2937" text-anchor="middle">转入笔记</text>
<rect x="254.2" y="182.0" width="61.6" height="15" fill="#FFFFFF"/>
<text x="285.0" y="192.0" font-size="10" fill="#6B7280" text-anchor="middle">set_triage</text>
<path d="M540,172.0 L648,172.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#es-arr)"/>
<rect x="569.0" y="153.0" width="52.0" height="16" fill="#FFFFFF"/>
<text x="595.0" y="164.0" font-size="11" fill="#1F2937" text-anchor="middle">草稿写回</text>
<rect x="557.4" y="182.0" width="75.2" height="15" fill="#FFFFFF"/>
<text x="595.0" y="192.0" font-size="10" fill="#6B7280" text-anchor="middle">accept_draft</text>
<path d="M850,172.0 L958,172.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#es-arr)"/>
<rect x="879.0" y="153.0" width="52.0" height="16" fill="#FFFFFF"/>
<text x="905.0" y="164.0" font-size="11" fill="#1F2937" text-anchor="middle">网页改字</text>
<rect x="853.8" y="182.0" width="102.4" height="15" fill="#FFFFFF"/>
<text x="905.0" y="192.0" font-size="10" fill="#6B7280" text-anchor="middle">apply_marked_text</text>
<path d="M130.0,130 C130.0,84 1060.0,84 1060.0,128" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#es-arr-blue)"/>
<rect x="356.2" y="81" width="487.6" height="16" fill="#FFFFFF"/>
<text x="600" y="92" font-size="11" fill="#2563EB" text-anchor="middle">快路径「转入笔记」：已有定稿或没有手写（纯勾画用原文定稿）→ Reviewed；只有草稿 → Draft</text>
<rect x="40" y="430" width="250" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="165.0" y="452" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">Skipped 已跳过</text>
<text x="165.0" y="472" font-size="12" fill="#1F2937" text-anchor="middle">「浏览」里点了「不需要」</text>
<rect x="475" y="430" width="250" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="600.0" y="452" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">Revoked 已撤销</text>
<text x="600.0" y="472" font-size="12" fill="#1F2937" text-anchor="middle">笔迹擦掉了 / 书进回收站或被删</text>
<text x="600.0" y="490" font-size="12" fill="#6B7280" text-anchor="middle">系统自动</text>
<rect x="910" y="430" width="250" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="1035.0" y="452" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">Archived 已删除</text>
<text x="1035.0" y="472" font-size="12" fill="#1F2937" text-anchor="middle">「整理」里点了「不要了」</text>
<path d="M100,214 L100,428" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#es-arr-red)"/>
<rect x="79.5" y="319" width="41.0" height="16" fill="#FFFFFF"/>
<text x="100" y="330" font-size="11" fill="#EF4444" text-anchor="middle">不需要</text>
<path d="M180,430 L180,216" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#es-arr-blue)"/>
<rect x="143.4" y="289" width="73.1" height="16" fill="#FFFFFF"/>
<text x="180" y="300" font-size="11" fill="#2563EB" text-anchor="middle">恢复 → Mined</text>
<path d="M70,214 L70,262" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M380,214 L380,262" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M690,214 L690,262" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M1000,214 L1000,262" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M70,262 L1000,262" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M535,262 L535,428" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#es-arr)"/>
<rect x="531.0" y="277" width="230.2" height="16" fill="#FFFFFF"/>
<text x="535" y="288" font-size="11" fill="#1F2937">revoke()：笔迹没了 / 书没了（任一非终态）</text>
<path d="M500,214 L500,352" fill="none" stroke="#EF4444" stroke-width="1.5"/>
<path d="M810,214 L810,352" fill="none" stroke="#EF4444" stroke-width="1.5"/>
<path d="M1120,214 L1120,352" fill="none" stroke="#EF4444" stroke-width="1.5"/>
<path d="M500,352 L1120,352" fill="none" stroke="#EF4444" stroke-width="1.5"/>
<path d="M1100,352 L1100,428" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#es-arr-red)"/>
<rect x="958.0" y="365" width="140.0" height="16" fill="#FFFFFF"/>
<text x="1094" y="376" font-size="11" fill="#EF4444" text-anchor="end">不要了（两处投影都摘掉）</text>
<rect x="40" y="560" width="560" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="54" y="582" font-size="13" fill="#1F2937" font-weight="bold">回收站「恢复」restore()（Revoked / Archived）</text>
<text x="54" y="602" font-size="12" fill="#1F2937">按已有内容倒推，不另存“删除前的状态”：</text>
<text x="54" y="620" font-size="12" fill="#1F2937">有定稿 → Reviewed；有草稿 → Draft；有手写 → Pending；否则 → Mined</text>
<text x="54" y="638" font-size="12" fill="#1F2937">（Skipped 固定回 Mined）</text>
<text x="54" y="656" font-size="12" fill="#6B7280">恢复的是条目库里的内容，设备上擦掉的笔迹不会回来</text>
<rect x="620" y="560" width="540" height="120" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="634" y="582" font-size="13" fill="#1F2937" font-weight="bold">笔迹回来自动「复活」revive()（只对 Revoked）</text>
<text x="634" y="602" font-size="12" fill="#1F2937">xochitl 里撤销了擦除、书从回收站恢复时，摄取认回原条目：</text>
<text x="634" y="620" font-size="12" fill="#1F2937">有定稿 → Reviewed；有草稿 → Draft；否则 → Mined</text>
<text x="634" y="638" font-size="12" fill="#1F2937">（只有手写的回 Mined，不自动进转写）</text>
<text x="634" y="656" font-size="12" fill="#EF4444">「清空回收站」purge_terminal() 才是真删除，含裁图，不可恢复</text>
<path d="M560.0,510 L560.0,558" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#es-arr-blue)"/>
<path d="M970,510 L970,545 L560,545 L560,558" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#es-arr-blue)"/>
<path d="M640.0,510 L640.0,558" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#es-arr-green)"/>
<text x="1160" y="410" font-size="11" fill="#6B7280" text-anchor="end">进投影的只有 Pending / Draft / Reviewed（is_live_for_projection，应答里的 live）</text>
</svg>
