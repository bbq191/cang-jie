<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 556" font-family="Noto Sans CJK SC, sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0451f"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker></defs>
<rect x="0" y="0" width="1240" height="556" fill="#fbfbfa"/>
<text x="620.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">笔记线的数据保护与后台韧性</text>
<text x="620.0" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a">文件坏了不冲掉内容 · 并发不产生孤儿 · 一次 panic 不停摆 · 没事做就不写盘</text>
<text x="24" y="88" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="bold">一、文件解析失败时怎么办（“读失败”和“文件不存在”分开处理）</text>
<rect x="24" y="100" width="286" height="118" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="36" y="120" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">条目库（最严格）</text>
<text x="36" y="142" text-anchor="start" font-size="10.5" fill="#3a3a3a">state/notes/books/&lt;uuid&gt;.json</text>
<text x="36" y="157" text-anchor="start" font-size="10.5" fill="#3a3a3a">写者：ink-serve</text>
<text x="36" y="172" text-anchor="start" font-size="10.5" fill="#3a3a3a">另存 &lt;uuid&gt;.json.corrupt</text>
<text x="36" y="187" text-anchor="start" font-size="10.5" fill="#3a3a3a">原文件不动，之后拒绝写入</text>
<text x="36" y="202" text-anchor="start" font-size="10.5" fill="#3a3a3a">网页打开这本书看到 500 + 原因</text>
<rect x="326" y="100" width="286" height="118" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.6"/>
<text x="338" y="120" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">AI 配置</text>
<text x="338" y="142" text-anchor="start" font-size="10.5" fill="#3a3a3a">config/notes/{transcribe,mind}.json</text>
<text x="338" y="157" text-anchor="start" font-size="10.5" fill="#3a3a3a">按缺省运行，但不落盘</text>
<text x="338" y="172" text-anchor="start" font-size="10.5" fill="#3a3a3a">另存 .corrupt（0600）</text>
<text x="338" y="187" text-anchor="start" font-size="10.5" fill="#3a3a3a">等用户在网页上保存才写新文件</text>
<text x="338" y="202" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ key 不会被缺省值冲掉</text>
<rect x="628" y="100" width="286" height="118" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="640" y="120" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">用量账本</text>
<text x="640" y="142" text-anchor="start" font-size="10.5" fill="#3a3a3a">state/notes/{transcribe,mind}.json</text>
<text x="640" y="157" text-anchor="start" font-size="10.5" fill="#3a3a3a">先另存 .corrupt（已有不重复拷）</text>
<text x="640" y="172" text-anchor="start" font-size="10.5" fill="#3a3a3a">再从零记起</text>
<text x="640" y="187" text-anchor="start" font-size="10.5" fill="#3a3a3a">→ 累计用量有据可查</text>
<rect x="930" y="100" width="286" height="118" rx="10" fill="#f3effa" stroke="#7a5cb0" stroke-width="1.6"/>
<text x="942" y="120" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">每章推送记录</text>
<text x="942" y="142" text-anchor="start" font-size="10.5" fill="#3a3a3a">state/notes/{notebooks,exports}/&lt;uuid&gt;.json</text>
<text x="942" y="157" text-anchor="start" font-size="10.5" fill="#3a3a3a">先另存 .corrupt，按空记录处理</text>
<text x="942" y="172" text-anchor="start" font-size="10.5" fill="#3a3a3a">下次推送当作首次生成：</text>
<text x="942" y="187" text-anchor="start" font-size="10.5" fill="#3a3a3a">旧笔记本不会自动进回收站，</text>
<text x="942" y="202" text-anchor="start" font-size="10.5" fill="#3a3a3a">需手动删多出的那份</text>
<text x="24" y="240" text-anchor="start" font-size="11" fill="#555">ink.json / note.json：服务只在文件不存在时写出缺省值，坏了就按缺省运行、不覆盖（本来就不写回，不需要 .corrupt）</text>
<text x="24" y="278" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="bold">二、并发、异常与省电</text>
<rect x="24" y="290" width="286" height="132" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="36" y="310" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">ink-serve 条目库</text>
<text x="36" y="332" text-anchor="start" font-size="10.5" fill="#3a3a3a">读—改—写进程内一把锁串行</text>
<text x="36" y="348" text-anchor="start" font-size="10.5" fill="#3a3a3a">解析结果按 (inode, 长度, mtime) 缓存：</text>
<text x="36" y="364" text-anchor="start" font-size="10.5" fill="#3a3a3a">文件没变不重复解析，自己写完当场换入</text>
<text x="36" y="380" text-anchor="start" font-size="10.5" fill="#3a3a3a">外部改写/删除 → 身份对不上 → 重新读盘</text>
<text x="36" y="396" text-anchor="start" font-size="10.5" fill="#3a3a3a">GET /books 5.66ms → 35µs（30 本合成数据）</text>
<rect x="326" y="290" width="286" height="132" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.6"/>
<text x="338" y="310" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">note-serve 推送</text>
<text x="338" y="332" text-anchor="start" font-size="10.5" fill="#3a3a3a">生成 / md 导入 / md 导出 共用一把锁</text>
<text x="338" y="348" text-anchor="start" font-size="10.5" fill="#3a3a3a">防双击「推送本章」各传一份，</text>
<text x="338" y="364" text-anchor="start" font-size="10.5" fill="#3a3a3a">认领到同一 uuid、另一份成孤儿</text>
<text x="338" y="380" text-anchor="start" font-size="10.5" fill="#3a3a3a">/sync 每本书的两份记录只读一次</text>
<text x="338" y="396" text-anchor="start" font-size="10.5" fill="#3a3a3a">（原来 40 章要读 80 遍）</text>
<rect x="628" y="290" width="286" height="132" rx="10" fill="#fdf1ec" stroke="#c0602d" stroke-width="1.6"/>
<text x="640" y="310" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">后台线程兜住 panic</text>
<text x="640" y="332" text-anchor="start" font-size="10.5" fill="#3a3a3a">ink：书库监听线程里每本书的摄取</text>
<text x="640" y="348" text-anchor="start" font-size="10.5" fill="#3a3a3a">transcribe：自动转写工作线程的每一轮</text>
<text x="640" y="364" text-anchor="start" font-size="10.5" fill="#3a3a3a">panic 只丢这一本 / 这一轮，线程继续</text>
<text x="640" y="380" text-anchor="start" font-size="10.5" fill="#3a3a3a">（原来线程退出后 HTTP 照常应答，</text>
<text x="640" y="396" text-anchor="start" font-size="10.5" fill="#3a3a3a">看不出异常，但再也不摄取/转写）</text>
<rect x="930" y="290" width="286" height="132" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="942" y="310" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">没事做就不干活</text>
<text x="942" y="332" text-anchor="start" font-size="10.5" fill="#3a3a3a">摄取先比页 .rm 的 mtime，</text>
<text x="942" y="348" text-anchor="start" font-size="10.5" fill="#3a3a3a">页没变就不解析 .content</text>
<text x="942" y="364" text-anchor="start" font-size="10.5" fill="#3a3a3a">页→章只读 .epub 的 zip 目录与目录条目</text>
<text x="942" y="380" text-anchor="start" font-size="10.5" fill="#3a3a3a">（120MB 书峰值 127 → 12.7MB）</text>
<text x="942" y="396" text-anchor="start" font-size="10.5" fill="#3a3a3a">转写空跑且同上轮 → 不写账本、不发事件</text>
<rect x="24" y="440" width="1192" height="92" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="36" y="460" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">前提与验证状态</text>
<text x="36" y="482" text-anchor="start" font-size="11" fill="#3a3a3a">· catch_unwind 只在 panic = "unwind" 下有效：notes/Cargo.toml 的 release profile 已设 unwind（abort 下整个进程直接退出）。</text>
<text x="36" y="499" text-anchor="start" font-size="11" fill="#3a3a3a">· 条目库、AI 配置的 .corrupt 保护是 09-24 上午加的，其余（账本、章记录、第二部分）是同日第三轮审计加的；都只经 host 单测 / 合成数据验证，未上真机。</text>
<text x="36" y="516" text-anchor="start" font-size="11" fill="#3a3a3a">· 细节见白皮书第 3.1、3.5、4、6、8.3、8.4 节。</text>
</svg>
