<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="pn-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="pn-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="pn-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="pn-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">「推送本章」怎么把一章写成设备笔记本（note-serve）</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">publish::generate_chapter；生成、md 导入、md 导出共用一把锁，同一章被并发推送两次也只传一份</text>
<rect x="20" y="84" width="780" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="106" font-size="13" fill="#1F2937" font-weight="bold">① 取书、算本章指纹</text>
<text x="34" y="126" font-size="12" fill="#1F2937">经 InkClient 取整本书；章名 + 各条目 id / 样式 / 小节名 / 文字 / 原文 / 回答 → 指纹</text>
<text x="34" y="144" font-size="12" fill="#1F2937">和上次记录一样 → unchanged，不联网</text>
<path d="M410,156 L410,168" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pn-arr)"/>
<rect x="20" y="170" width="780" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="192" font-size="13" fill="#1F2937" font-weight="bold">② 投影成段落</text>
<text x="34" y="212" font-size="12" fill="#1F2937">notecore::project：Title = 章名；小节名变化处插 Subheading 1；条目按页序、按自己的样式；</text>
<text x="34" y="230" font-size="12" fill="#1F2937">只收去处是“笔记本”或“两处”的活条目；没有可投的 → empty</text>
<path d="M410,242 L410,254" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pn-arr)"/>
<rect x="20" y="256" width="780" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="278" font-size="13" fill="#1F2937" font-weight="bold">③ 编码成一页 .rm，打包 .rmdoc</text>
<text x="34" y="298" font-size="12" fill="#1F2937">rmv6::write 只编 RootTextBlock，其余块套真机模板；几 KB，全程在内存里</text>
<path d="M410,310 L410,322" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pn-arr)"/>
<rect x="20" y="324" width="780" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="346" font-size="13" fill="#1F2937" font-weight="bold">④ 定位置和名字</text>
<text x="34" y="366" font-size="12" fill="#1F2937">folder_of_document：读书本 .metadata 的 parent → Folder（根或某个文件夹）；查不到落根</text>
<text x="34" y="384" font-size="12" fill="#1F2937">首次生成：同一文件夹内查重名、加数字后缀；重新生成：沿用上次记下的名字</text>
<path d="M410,396 L410,408" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pn-arr)"/>
<rect x="20" y="410" width="780" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="34" y="432" font-size="13" fill="#1F2937" font-weight="bold">⑤ upload_and_claim（基座 rmsvc-core）</text>
<text x="34" y="452" font-size="12" fill="#1F2937">上传前快照最近新建的文档 → 设当前文件夹 + POST /upload（跨进程上传锁）</text>
<text x="34" y="470" font-size="12" fill="#1F2937">→ 监听书库目录，在快照之外按 visibleName 认领新 uuid，最多等 5 秒；绝不“取最新一本”兜底</text>
<path d="M410,482 L410,494" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pn-arr)"/>
<rect x="20" y="496" width="780" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="518" font-size="13" fill="#1F2937" font-weight="bold">⑥ 旧版本送回收站</text>
<text x="34" y="538" font-size="12" fill="#1F2937">交给书架 book-serve 回收站队列（按名字核对 uuid）→ shelf-trash-agent.qmd 在 xochitl 里移进回收站</text>
<text x="34" y="556" font-size="12" fill="#1F2937">入队失败不算本章失败（旧的多留一份，不是数据丢失）</text>
<path d="M410,568 L410,580" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#pn-arr)"/>
<rect x="20" y="582" width="780" height="54" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="34" y="604" font-size="13" fill="#1F2937" font-weight="bold">⑦ 记下本章记录 → generated</text>
<text x="34" y="624" font-size="12" fill="#1F2937">~/.local/state/notes/notebooks/&lt;书 uuid&gt;.json：{doc_uuid, visible_name, fingerprint, generated_at}</text>
<rect x="830" y="84" width="350" height="150" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="844" y="106" font-size="13" fill="#1F2937" font-weight="bold">失败怎么回执</text>
<text x="844" y="126" font-size="12" fill="#1F2937">任何一步失败：status = failed，</text>
<text x="844" y="144" font-size="12" fill="#1F2937">原因在 message（10-10 前叫 error）；</text>
<text x="844" y="162" font-size="12" fill="#1F2937">不写记录，下次照常重试</text>
<text x="844" y="180" font-size="12" fill="#1F2937">取书失败直接是 HTTP 错误：</text>
<text x="844" y="198" font-size="12" fill="#1F2937">ink-serve 404 原样、没运行 503</text>
<rect x="830" y="250" width="350" height="150" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="844" y="272" font-size="13" fill="#1F2937" font-weight="bold">为什么只能按名字认领</text>
<text x="844" y="292" font-size="12" fill="#1F2937">xochitl 会重新分配文档 uuid，</text>
<text x="844" y="310" font-size="12" fill="#1F2937">还会把 .rmdoc 解包成页面，</text>
<text x="844" y="328" font-size="12" fill="#1F2937">书库里没有和上传字节相同的文件</text>
<text x="844" y="346" font-size="12" fill="#1F2937">仍认领不到：设备上可能多一份</text>
<text x="844" y="364" font-size="12" fill="#1F2937">同名文档，错误提示让用户手动删</text>
<rect x="830" y="416" width="350" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="844" y="438" font-size="13" fill="#1F2937" font-weight="bold">md 那一路（Obsidian）</text>
<text x="844" y="458" font-size="12" fill="#1F2937">POST …/chapters/{idx}/export：</text>
<text x="844" y="476" font-size="12" fill="#1F2937">整本重导、内容没变的章跳过，</text>
<text x="844" y="494" font-size="12" fill="#1F2937">落设备 ~/.local/share/notes/vault/&lt;书名&gt;/</text>
<text x="844" y="512" font-size="12" fill="#1F2937">GET …/chapters/{idx}/export.md：</text>
<text x="844" y="530" font-size="12" fill="#1F2937">当场生成，网页提示里给链接，</text>
<text x="844" y="548" font-size="12" fill="#1F2937">点了由浏览器下载</text>
<rect x="830" y="602" width="350" height="92" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="844" y="624" font-size="13" fill="#1F2937" font-weight="bold">本章已经没有活条目时</text>
<text x="844" y="644" font-size="12" fill="#1F2937">清掉本章记录；条目还在、只是</text>
<text x="844" y="662" font-size="12" fill="#1F2937">去处改到另一边 → 记录保留</text>
</svg>
