<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" font-family="sans-serif">
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="480" fill="#fbfbfa"/>
  <text x="540" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">notes 数据流：四步闭环</text>
  <text x="540" y="44" text-anchor="middle" font-size="11.5" fill="#8a8a8a">条目库是唯一事实源；设备笔记本与 md 都只是投影——设备只负责写，改动都在手机</text>

  <!-- box1 摄取 -->
  <rect x="35" y="70" width="230" height="260" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="1.8"/>
  <text x="150" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">① 摄取</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#8a6d00">ink-serve · 事件驱动</text>
  <line x1="50" y1="118" x2="250" y2="118" stroke="#c9971f" stroke-width="1"/>
  <text x="150" y="136" text-anchor="middle" font-size="10.3" fill="#3a3a3a">合上书 → xochitl 重写</text>
  <text x="150" y="150" text-anchor="middle" font-size="10.3" fill="#3a3a3a">.content / .metadata</text>
  <text x="150" y="170" text-anchor="middle" font-size="10.3" fill="#3a3a3a">fswatch 防抖 → 只扫</text>
  <text x="150" y="184" text-anchor="middle" font-size="10.3" fill="#3a3a3a">变更页 .rm mtime</text>
  <text x="150" y="204" text-anchor="middle" font-size="10.3" fill="#3a3a3a">rmv6：勾画 GlyphRange</text>
  <text x="150" y="218" text-anchor="middle" font-size="10.3" fill="#3a3a3a">↔ 手写笔画，同坐标系</text>
  <text x="150" y="238" text-anchor="middle" font-size="10.3" fill="#3a3a3a">notecore：聚簇 + 就近</text>
  <text x="150" y="252" text-anchor="middle" font-size="10.3" fill="#3a3a3a">配对 + 增量合并</text>
  <text x="150" y="272" text-anchor="middle" font-size="10.3" fill="#3a3a3a">裁图（960×1280 页坐标</text>
  <text x="150" y="286" text-anchor="middle" font-size="10.3" fill="#3a3a3a">→ 384×512 缩略图）</text>
  <text x="150" y="310" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d00">→ 条目库 + 裁片 PNG</text>

  <line x1="265" y1="200" x2="293" y2="200" stroke="#555" stroke-width="1.6" marker-end="url(#f1)"/>

  <!-- box2 修正 -->
  <rect x="295" y="70" width="230" height="260" rx="10" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.8"/>
  <text x="410" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">② 修正</text>
  <text x="410" y="110" text-anchor="middle" font-size="10" fill="#2f5f9a">手机网页 · 人来判断</text>
  <line x1="310" y1="118" x2="510" y2="118" stroke="#4a6fa5" stroke-width="1"/>
  <text x="410" y="140" text-anchor="middle" font-size="10.3" fill="#3a3a3a">书架网关「笔记」tab</text>
  <text x="410" y="160" text-anchor="middle" font-size="10.3" fill="#3a3a3a">左裁图、右文本框</text>
  <text x="410" y="174" text-anchor="middle" font-size="10.3" fill="#3a3a3a">（缺省填 text ?? draft）</text>
  <text x="410" y="194" text-anchor="middle" font-size="10.3" fill="#3a3a3a">核对转写、选分区、</text>
  <text x="410" y="208" text-anchor="middle" font-size="10.3" fill="#3a3a3a">选样式——改即存</text>
  <text x="410" y="228" text-anchor="middle" font-size="10.3" fill="#3a3a3a">POST /entries/{id}</text>
  <text x="410" y="248" text-anchor="middle" font-size="10.3" fill="#3a3a3a">给 text 即"已校对"</text>
  <text x="410" y="272" text-anchor="middle" font-size="10" fill="#8a3a3a">为什么在手机：e-ink 上</text>
  <text x="410" y="286" text-anchor="middle" font-size="10" fill="#8a3a3a">打字太痛苦；设备只负责</text>
  <text x="410" y="300" text-anchor="middle" font-size="10" fill="#8a3a3a">写，不负责改</text>

  <line x1="525" y1="200" x2="553" y2="200" stroke="#555" stroke-width="1.6" marker-end="url(#f1)"/>

  <!-- box3 智能 -->
  <rect x="555" y="70" width="230" height="260" rx="10" fill="#fdf3f0" stroke="#b5541f" stroke-width="1.8"/>
  <text x="670" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">③ 智能</text>
  <text x="670" y="110" text-anchor="middle" font-size="10" fill="#a04a1a">按分区调，出网</text>
  <line x1="570" y1="118" x2="770" y2="118" stroke="#b5541f" stroke-width="1"/>
  <text x="670" y="138" text-anchor="middle" font-size="10.3" fill="#3a3a3a">transcribe-serve：</text>
  <text x="670" y="152" text-anchor="middle" font-size="10.3" fill="#3a3a3a">裁图喂视觉模型</text>
  <text x="670" y="166" text-anchor="middle" font-size="10.3" fill="#3a3a3a">→ draft 写回 ink</text>
  <text x="670" y="186" text-anchor="middle" font-size="10.3" fill="#3a3a3a">mind-serve（待建）：</text>
  <text x="670" y="200" text-anchor="middle" font-size="10.3" fill="#3a3a3a">按「分区名+简述」跑</text>
  <text x="670" y="214" text-anchor="middle" font-size="10.3" fill="#3a3a3a">文本模型，"背诵"不调</text>
  <text x="670" y="234" text-anchor="middle" font-size="10" fill="#8a3a3a">增量：指纹不变不重来；</text>
  <text x="670" y="248" text-anchor="middle" font-size="10" fill="#8a3a3a">校对过的 text 永不被</text>
  <text x="670" y="262" text-anchor="middle" font-size="10" fill="#8a3a3a">draft 覆盖</text>

  <line x1="785" y1="200" x2="813" y2="200" stroke="#555" stroke-width="1.6" marker-end="url(#f1)"/>

  <!-- box4 投影 -->
  <rect x="815" y="70" width="230" height="260" rx="10" fill="#f2f2f2" stroke="#7a7a8c" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="930" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a3a3a">④ 投影（待建）</text>
  <text x="930" y="110" text-anchor="middle" font-size="10" fill="#6a6a6a">note-serve · 可选</text>
  <line x1="830" y1="118" x2="1030" y2="118" stroke="#9a9a9a" stroke-width="1"/>
  <text x="930" y="138" text-anchor="middle" font-size="10.3" fill="#4a4a4a">条目库 → 设备笔记本</text>
  <text x="930" y="152" text-anchor="middle" font-size="10.3" fill="#4a4a4a">《书名》文件夹一章一本</text>
  <text x="930" y="166" text-anchor="middle" font-size="10.3" fill="#4a4a4a">（xochitl 7 种打字样式）</text>
  <text x="930" y="186" text-anchor="middle" font-size="10.3" fill="#4a4a4a">GET-then-upload；旧本</text>
  <text x="930" y="200" text-anchor="middle" font-size="10.3" fill="#4a4a4a">走书架回收站代理软删</text>
  <text x="930" y="220" text-anchor="middle" font-size="10.3" fill="#4a4a4a">可选导出 md（反链，</text>
  <text x="930" y="234" text-anchor="middle" font-size="10.3" fill="#4a4a4a">与设备笔记本同构）</text>
  <text x="930" y="254" text-anchor="middle" font-size="10" fill="#6a6a6a">设备笔记本只读——改动</text>
  <text x="930" y="268" text-anchor="middle" font-size="10" fill="#6a6a6a">还是得回②手机上改</text>

  <!-- loop back -->
  <path d="M 930 330 C 930 400, 150 400, 150 330" fill="none" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#f2)"/>
  <text x="540" y="412" text-anchor="middle" font-size="11" fill="#8a6d00">闭环：下次合书再触发 ①；条目 id 创建时一次算定，永不重算</text>

  <text x="540" y="450" text-anchor="middle" font-size="11" fill="#8a8a8a">详见 notes/README.md「四步闭环」；增量规则/裁图坐标见白皮书 01/03f/03g 节</text>
</svg>
