<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 852" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="df-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="df-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="df-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="df-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">服务之间怎么交互</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">所有调用都是 127.0.0.1 上的 HTTP；条目库只有 ink-serve 写；实线 = 请求，虚线 = 事件或回执</text>
<rect x="14" y="92" width="152" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="90.0" y="113" font-size="12" fill="#1F2937" font-weight="bold" text-anchor="middle">网页（经网关）</text>
<path d="M90,132 L90,782" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="184" y="92" width="152" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="260.0" y="113" font-size="12" fill="#1F2937" font-weight="bold" text-anchor="middle">ink-serve</text>
<path d="M260,132 L260,782" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="354" y="92" width="152" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="430.0" y="113" font-size="12" fill="#1F2937" font-weight="bold" text-anchor="middle">transcribe-serve</text>
<path d="M430,132 L430,782" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="524" y="92" width="152" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="600.0" y="113" font-size="12" fill="#1F2937" font-weight="bold" text-anchor="middle">mind-serve</text>
<path d="M600,132 L600,782" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="694" y="92" width="152" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="770.0" y="113" font-size="12" fill="#1F2937" font-weight="bold" text-anchor="middle">note-serve</text>
<path d="M770,132 L770,782" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="864" y="92" width="152" height="40" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="940.0" y="113" font-size="12" fill="#1F2937" font-weight="bold" text-anchor="middle">xochitl</text>
<path d="M940,132 L940,782" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="1034" y="92" width="152" height="40" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="1110.0" y="113" font-size="12" fill="#1F2937" font-weight="bold" text-anchor="middle">模型厂商</text>
<path d="M1110,132 L1110,782" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="14" y="164" font-size="11" fill="#6B7280" font-weight="bold">摄取</text>
<path d="M14,169 L1186,169" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
<path d="M940,194 L262,194" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#df-arr)"/>
<rect x="482.5" y="177" width="235.0" height="16" fill="#FFFFFF"/>
<text x="600.0" y="188" font-size="11" fill="#1F2937" text-anchor="middle">合上书：书库目录变化（inotify，防抖 4 秒）</text>
<rect x="240" y="206" width="211.84" height="22" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="250" y="221" font-size="11" fill="#1F2937">解析变了的页 → 条目 Mined → 写条目库</text>
<path d="M260,254 L92,254" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#df-arr)"/>
<rect x="56.6" y="237" width="236.8" height="16" fill="#FFFFFF"/>
<text x="175.0" y="248" font-size="11" fill="#1F2937" text-anchor="middle">事件 notes / entries（/events）→ 网页刷新</text>
<text x="14" y="284" font-size="11" fill="#6B7280" font-weight="bold">浏览 → 转写</text>
<path d="M14,289 L1186,289" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
<path d="M90,314 L258,314" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="57.9" y="297" width="234.2" height="16" fill="#FFFFFF"/>
<text x="175.0" y="308" font-size="11" fill="#1F2937" text-anchor="middle">POST …/entries/{id}/request（转入笔记）</text>
<path d="M260,344 L428,344" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#df-arr)"/>
<rect x="204.2" y="327" width="281.7" height="16" fill="#FFFFFF"/>
<text x="345.0" y="338" font-size="11" fill="#1F2937" text-anchor="middle">事件 notes / entries（transcribe 订阅，防抖 3 秒）</text>
<path d="M430,374 L262,374" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="194.5" y="357" width="301.0" height="16" fill="#FFFFFF"/>
<text x="345.0" y="368" font-size="11" fill="#1F2937" text-anchor="middle">GET /books · GET /books/{uuid} · GET …/crops/{file}</text>
<path d="M430,404 L1108,404" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="649.4" y="387" width="241.2" height="16" fill="#FFFFFF"/>
<text x="770.0" y="398" font-size="11" fill="#1F2937" text-anchor="middle">视觉模型 POST {baseUrl}/chat/completions</text>
<path d="M430,434 L262,434" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="206.8" y="417" width="276.4" height="16" fill="#FFFFFF"/>
<text x="345.0" y="428" font-size="11" fill="#1F2937" text-anchor="middle">POST …/entries/{id}/draft  {text, backend, hash}</text>
<text x="14" y="464" font-size="11" fill="#6B7280" font-weight="bold">整理 → 问 AI</text>
<path d="M14,469 L1186,469" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
<path d="M90,494 L258,494" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="16.1" y="477" width="317.8" height="16" fill="#FFFFFF"/>
<text x="175.0" y="488" font-size="11" fill="#1F2937" text-anchor="middle">POST …/entries/{id}  {text, destination, askAi, question}</text>
<path d="M90,524 L598,524" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="273.2" y="507" width="143.5" height="16" fill="#FFFFFF"/>
<text x="345.0" y="518" font-size="11" fill="#1F2937" text-anchor="middle">POST …/entries/{id}/ask</text>
<path d="M600,554 L262,554" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="376.3" y="537" width="107.4" height="16" fill="#FFFFFF"/>
<text x="430.0" y="548" font-size="11" fill="#1F2937" text-anchor="middle">GET /books/{uuid}</text>
<path d="M600,584 L1108,584" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="734.4" y="567" width="241.2" height="16" fill="#FFFFFF"/>
<text x="855.0" y="578" font-size="11" fill="#1F2937" text-anchor="middle">文字模型 POST {baseUrl}/chat/completions</text>
<path d="M600,614 L262,614" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="286.1" y="597" width="287.8" height="16" fill="#FFFFFF"/>
<text x="430.0" y="608" font-size="11" fill="#1F2937" text-anchor="middle">POST …/entries/{id}/answer  {text, backend, brief}</text>
<text x="14" y="644" font-size="11" fill="#6B7280" font-weight="bold">推送</text>
<path d="M14,649 L1186,649" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
<path d="M90,674 L768,674" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="304.1" y="657" width="251.8" height="16" fill="#FFFFFF"/>
<text x="430.0" y="668" font-size="11" fill="#1F2937" text-anchor="middle">POST …/chapters/{idx}/generate · …/export</text>
<path d="M770,704 L262,704" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="461.3" y="687" width="107.4" height="16" fill="#FFFFFF"/>
<text x="515.0" y="698" font-size="11" fill="#1F2937" text-anchor="middle">GET /books/{uuid}</text>
<path d="M770,734 L938,734" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#df-arr)"/>
<rect x="725.8" y="717" width="258.4" height="16" fill="#FFFFFF"/>
<text x="855.0" y="728" font-size="11" fill="#1F2937" text-anchor="middle">POST /upload（进书所在文件夹）→ 等新文档出现</text>
<path d="M770,764 L92,764" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#df-arr)"/>
<rect x="251.5" y="747" width="356.9" height="16" fill="#FFFFFF"/>
<text x="430.0" y="758" font-size="11" fill="#1F2937" text-anchor="middle">{chapters:[{status, message?}]}；生成后发事件 notes / notebooks</text>
<rect x="14" y="796" width="1172" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="28" y="822" font-size="11" fill="#1F2937">请求 / 应答类型在 notecore::api，收发两端共用；未知字段或形状不对 → 400。终态条目（回收站里的）改字、写草稿、写回答一律拒绝。</text>
<text x="28" y="839" font-size="11" fill="#1F2937">转写 / 脑 / 本读条目库都用 notesvc::InkClient：ink-serve 回 404 就原样 404，ink-serve 没运行 → 503；模型或上传失败 → 5xx。</text>
</svg>
