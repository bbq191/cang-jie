<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d00"/></marker>
    <marker id="d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fa3"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="600" fill="#fbfbfa"/>
  <text x="590" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">notes 数据流：书页 → 条目库 → 两个投影</text>
  <text x="590" y="52" text-anchor="middle" font-size="12" fill="#6a6a6a">条目库是唯一事实源（只有 ink-serve 写）；设备笔记本与 Obsidian md 都由它重新生成；改动一律在手机上做</text>

  <!-- 来源 -->
  <text x="125" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a6a6a">来源</text>
  <rect x="20" y="96" width="210" height="104" rx="9" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="125" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl 书页 .rm</text>
  <text x="125" y="141" text-anchor="middle" font-size="10.5" fill="#3a3a3a">荧光笔勾画（原文 + 位置）</text>
  <text x="125" y="157" text-anchor="middle" font-size="10.5" fill="#3a3a3a">+ 勾画旁边的手写笔迹</text>
  <text x="125" y="181" text-anchor="middle" font-size="10" fill="#a03030">只读，绝不写回</text>

  <rect x="20" y="250" width="210" height="104" rx="9" fill="#f6f6f6" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="125" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a8a8a">KOReader（已退役）</text>
  <text x="125" y="295" text-anchor="middle" font-size="10.2" fill="#8a8a8a">09-16 起可拉高亮 / 生词</text>
  <text x="125" y="311" text-anchor="middle" font-size="10.2" fill="#8a8a8a">09-29 设备卸载 KOReader</text>
  <text x="125" y="335" text-anchor="middle" font-size="9.8" fill="#9a9a9a">网页按钮已删；旧条目照常可用</text>

  <!-- 触发箭头 -->
  <polyline points="230,148 290,148" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#d1)"/>
  <text x="260" y="136" text-anchor="middle" font-size="9.5" fill="#555">合上书</text>
  <text x="260" y="166" text-anchor="middle" font-size="9.5" fill="#555">自动</text>
  <polyline points="230,302 290,302" fill="none" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="260" y="290" text-anchor="middle" font-size="9.5" fill="#9a9a9a">已移除</text>

  <!-- ink-serve + 条目库 -->
  <rect x="290" y="96" width="250" height="384" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="2"/>
  <text x="415" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ink-serve 矿 :8795</text>
  <text x="415" y="145" text-anchor="middle" font-size="10.5" fill="#3a3a3a">只扫变过的页 → 解析 .rm</text>
  <text x="415" y="161" text-anchor="middle" font-size="10.5" fill="#3a3a3a">手写聚成簇 → 配最近的勾画</text>
  <text x="415" y="177" text-anchor="middle" font-size="10.5" fill="#3a3a3a">没配上手写的勾画也成一条</text>
  <text x="415" y="193" text-anchor="middle" font-size="10.5" fill="#3a3a3a">从笔迹矢量自画灰度裁图 PNG</text>
  <text x="415" y="209" text-anchor="middle" font-size="10.5" fill="#3a3a3a">增量合并：改好的字不被覆盖</text>
  <rect x="310" y="226" width="210" height="96" rx="7" fill="#ffffff" stroke="#c9971f" stroke-width="1.2"/>
  <text x="415" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">条目库</text>
  <text x="415" y="267" text-anchor="middle" font-size="10" fill="#4a4a4a">books/&lt;uuid&gt;.json，一书一文件</text>
  <text x="415" y="283" text-anchor="middle" font-size="10" fill="#4a4a4a">新条目状态 = Mined</text>
  <text x="415" y="299" text-anchor="middle" font-size="10" fill="#4a4a4a">解析失败 → 另存 .corrupt、拒写</text>
  <text x="415" y="314" text-anchor="middle" font-size="10" fill="#4a4a4a">（不会被空书覆盖）</text>
  <text x="415" y="350" text-anchor="middle" font-size="10.5" fill="#3a3a3a">GET /search：跨书全文搜索</text>
  <text x="415" y="372" text-anchor="middle" font-size="10.5" fill="#3a3a3a">其它服务只能经 HTTP</text>
  <text x="415" y="388" text-anchor="middle" font-size="10.5" fill="#3a3a3a">POST entries/{id} 改字段</text>
  <text x="415" y="420" text-anchor="middle" font-size="10" fill="#8a6d00">书被删/进回收站、笔迹被擦</text>
  <text x="415" y="436" text-anchor="middle" font-size="10" fill="#8a6d00">→ 条目标 Revoked，不物理删</text>

  <!-- 浏览 -->
  <rect x="600" y="96" width="210" height="104" rx="9" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="705" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">手机「浏览」</text>
  <text x="705" y="141" text-anchor="middle" font-size="10.5" fill="#3a3a3a">只列 Mined，按页看裁图/原文</text>
  <text x="705" y="159" text-anchor="middle" font-size="10.5" fill="#3a3a3a">「转入笔记」→ Pending</text>
  <text x="705" y="175" text-anchor="middle" font-size="10.5" fill="#3a3a3a">（已有定稿 / 没手写 → Reviewed）</text>
  <text x="705" y="191" text-anchor="middle" font-size="10.5" fill="#3a3a3a">「不需要」→ 回收站</text>
  <polyline points="540,148 600,148" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#d1)"/>

  <!-- 整理 -->
  <rect x="600" y="240" width="210" height="104" rx="9" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="705" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">手机「整理」</text>
  <text x="705" y="285" text-anchor="middle" font-size="10.5" fill="#3a3a3a">Pending / Draft / Reviewed</text>
  <text x="705" y="301" text-anchor="middle" font-size="10.5" fill="#3a3a3a">改字（行首标记定样式）</text>
  <text x="705" y="317" text-anchor="middle" font-size="10.5" fill="#3a3a3a">选去处、问 AI、「不要了」</text>
  <text x="705" y="333" text-anchor="middle" font-size="10.5" fill="#3a3a3a">每章一个「推送本章」</text>
  <polyline points="705,200 705,238" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#d1)"/>
  <polyline points="600,292 542,292" fill="none" stroke="#2f6fa3" stroke-width="1.5" marker-end="url(#d3)"/>
  <text x="571" y="284" text-anchor="middle" font-size="9.5" fill="#2f6fa3">改即存</text>

  <!-- transcribe / mind -->
  <rect x="600" y="376" width="180" height="62" rx="9" fill="#fdf3f0" stroke="#b5541f" stroke-width="1.5"/>
  <text x="690" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">transcribe-serve :8796</text>
  <text x="690" y="416" text-anchor="middle" font-size="10" fill="#4a4a4a">事件触发，只转 Pending</text>
  <text x="690" y="430" text-anchor="middle" font-size="10" fill="#4a4a4a">裁图 → 视觉模型 → 草稿</text>
  <polyline points="600,407 542,407" fill="none" stroke="#8a6d00" stroke-width="1.5" marker-end="url(#d2)"/>
  <text x="571" y="399" text-anchor="middle" font-size="9.5" fill="#8a6d00">draft</text>

  <rect x="600" y="458" width="180" height="62" rx="9" fill="#f5eefc" stroke="#7a4fa3" stroke-width="1.5"/>
  <text x="690" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">mind-serve :8797</text>
  <text x="690" y="498" text-anchor="middle" font-size="10" fill="#4a4a4a">点「提问」才跑一次</text>
  <text x="690" y="512" text-anchor="middle" font-size="10" fill="#4a4a4a">文字模型 → 回答</text>
  <polyline points="600,489 570,489 570,462 542,462" fill="none" stroke="#8a6d00" stroke-width="1.5" marker-end="url(#d2)"/>
  <text x="566" y="505" text-anchor="middle" font-size="9.5" fill="#8a6d00">answer</text>
  <polyline points="800,344 800,489 782,489" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#d1)"/>
  <text x="808" y="420" text-anchor="start" font-size="9.5" fill="#555">提问</text>

  <!-- note-serve -->
  <rect x="880" y="96" width="280" height="120" rx="10" fill="#eaf6ec" stroke="#3f9a55" stroke-width="1.8"/>
  <text x="1020" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">note-serve 本 :8798</text>
  <text x="1020" y="142" text-anchor="middle" font-size="10.5" fill="#3a3a3a">从条目库取这一章的活条目</text>
  <text x="1020" y="158" text-anchor="middle" font-size="10.5" fill="#3a3a3a">按每条的「去处」分两路投影</text>
  <text x="1020" y="174" text-anchor="middle" font-size="10.5" fill="#3a3a3a">内容指纹没变 → 跳过不重做</text>
  <text x="1020" y="200" text-anchor="middle" font-size="10" fill="#6a6a6a">记每章推送时间，供「已导出」判定</text>
  <polyline points="810,292 845,292 845,156 878,156" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#d1)"/>
  <text x="850" y="232" text-anchor="start" font-size="9.5" fill="#555">推送</text>
  <text x="850" y="246" text-anchor="start" font-size="9.5" fill="#555">本章</text>

  <rect x="880" y="262" width="135" height="140" rx="9" fill="#ffffff" stroke="#3f9a55" stroke-width="1.4"/>
  <text x="947" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">设备笔记本</text>
  <text x="947" y="304" text-anchor="middle" font-size="10" fill="#4a4a4a">一章一本，只读</text>
  <text x="947" y="320" text-anchor="middle" font-size="10" fill="#4a4a4a">放在书本自己的</text>
  <text x="947" y="334" text-anchor="middle" font-size="10" fill="#4a4a4a">设备文件夹里</text>
  <text x="947" y="354" text-anchor="middle" font-size="10" fill="#4a4a4a">经 /upload 上传</text>
  <text x="947" y="374" text-anchor="middle" font-size="10" fill="#6a6a6a">旧版本 → 书架</text>
  <text x="947" y="388" text-anchor="middle" font-size="10" fill="#6a6a6a">回收站代理软删</text>

  <rect x="1025" y="262" width="135" height="140" rx="9" fill="#ffffff" stroke="#7a4fa3" stroke-width="1.4"/>
  <text x="1092" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Obsidian md</text>
  <text x="1092" y="304" text-anchor="middle" font-size="10" fill="#4a4a4a">一章一个 .md</text>
  <text x="1092" y="320" text-anchor="middle" font-size="10" fill="#4a4a4a">+ 书索引页</text>
  <text x="1092" y="336" text-anchor="middle" font-size="10" fill="#4a4a4a">块锚 ^id · [[书名]]</text>
  <text x="1092" y="354" text-anchor="middle" font-size="10" fill="#4a4a4a">落设备 vault/</text>
  <text x="1092" y="374" text-anchor="middle" font-size="10" fill="#6a6a6a">同时让浏览器</text>
  <text x="1092" y="388" text-anchor="middle" font-size="10" fill="#6a6a6a">直接下载</text>
  <polyline points="947,216 947,260" fill="none" stroke="#3f9a55" stroke-width="1.6" marker-end="url(#d1)"/>
  <polyline points="1092,216 1092,260" fill="none" stroke="#7a4fa3" stroke-width="1.6" marker-end="url(#d1)"/>

  <!-- 旁路 -->
  <rect x="20" y="540" width="1140" height="44" rx="8" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="36" y="567" text-anchor="start" font-size="11" fill="#3a3a3a"><tspan font-weight="bold">旁路（不经条目库）：</tspan>「导入 md 文档」选一个 .md 文件 → note-serve → 直接生成一份新的设备笔记本。入口默认隐藏，由书架「管理 → 实验室」开关控制。</text>
</svg>
