<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ms-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ms-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="ms-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="ms-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">行首标记 → 条目样式 → 设备笔记本 / Obsidian md</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">手写转写和网页打字用同一套规则（notecore::marker）：只看第一行行首，标记从正文剥掉</text>
<rect x="20" y="80" width="300" height="36" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="170.0" y="102" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">① 行首写什么</text>
<rect x="330" y="80" width="170" height="36" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="415.0" y="102" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">② Entry.style</text>
<rect x="510" y="80" width="360" height="36" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="102" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">③ 设备笔记本（.rm 段落样式）</text>
<rect x="880" y="80" width="300" height="36" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="1030.0" y="102" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">④ Obsidian md</text>
<rect x="20" y="128" width="1160" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="150" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">## 标题</text>
<text x="36" y="170" font-size="11" fill="#6B7280">两个 #</text>
<text x="415" y="160" font-size="12" fill="#1F2937" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace">heading1</text>
<text x="526" y="150" font-size="13" fill="#1F2937" font-weight="bold">Subheading 1（大字号小标题）</text>
<text x="526" y="170" font-size="11" fill="#6B7280">码 3 + 格式子块末尾 7 字节</text>
<text x="896" y="150" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">## 标题</text>
<text x="896" y="170" font-size="11" fill="#6B7280">标题行不带 ^id 块锚</text>
<rect x="20" y="190" width="1160" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="212" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">### 标题</text>
<text x="36" y="232" font-size="11" fill="#6B7280">三个及以上 #（设备只有两级）</text>
<text x="415" y="222" font-size="12" fill="#1F2937" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace">heading2</text>
<text x="526" y="212" font-size="13" fill="#1F2937" font-weight="bold">Subheading 2（加粗小标题）</text>
<text x="526" y="232" font-size="11" fill="#6B7280">码 3，不带那 7 字节</text>
<text x="896" y="212" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">### 标题</text>
<text x="896" y="232" font-size="11" fill="#6B7280">标题行不带 ^id 块锚</text>
<rect x="20" y="252" width="1160" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="274" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">1.  2、  3)  4）</text>
<text x="36" y="294" font-size="11" fill="#6B7280">最多 3 位数字；3.14 这类小数不算</text>
<text x="415" y="284" font-size="12" fill="#1F2937" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace">numbered</text>
<text x="526" y="274" font-size="13" fill="#1F2937" font-weight="bold">编号列表 NumberedList</text>
<text x="526" y="294" font-size="11" fill="#6B7280">码 10，编号由 xochitl 自己数</text>
<text x="896" y="274" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">1. 文字 ^id</text>
<rect x="20" y="314" width="1160" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="336" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">-  •  ·  *  —</text>
<text x="36" y="356" font-size="11" fill="#6B7280">符号后带空格；-3 度 不算</text>
<text x="415" y="346" font-size="12" fill="#1F2937" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace">bullet</text>
<text x="526" y="336" font-size="13" fill="#1F2937" font-weight="bold">圆点列表 Bulletpoint</text>
<text x="526" y="356" font-size="11" fill="#6B7280">码 4</text>
<text x="896" y="336" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">- 文字 ^id</text>
<rect x="20" y="376" width="1160" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="398" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">- [ ]  [ ]  - [x]  口  □</text>
<text x="36" y="418" font-size="11" fill="#6B7280">[注] [1] 口渴了 不算</text>
<text x="415" y="408" font-size="12" fill="#1F2937" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace">checkbox</text>
<text x="526" y="398" font-size="13" fill="#1F2937" font-weight="bold">复选框 Checkbox</text>
<text x="526" y="418" font-size="11" fill="#6B7280">码 6；勾选态写不出，一律未勾</text>
<text x="896" y="398" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">- [ ] 文字 ^id</text>
<rect x="20" y="438" width="1160" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="460" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">没有标记（或单个 #）</text>
<text x="36" y="480" font-size="11" fill="#6B7280">单 # 是章名级别，条目不接</text>
<text x="415" y="470" font-size="12" fill="#1F2937" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace">body</text>
<text x="526" y="460" font-size="13" fill="#1F2937" font-weight="bold">正文 Body</text>
<text x="526" y="480" font-size="11" fill="#6B7280">码 1</text>
<text x="896" y="460" font-size="13" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">文字 ^id</text>
<rect x="20" y="508" width="1160" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="532" font-size="13" fill="#1F2937" font-weight="bold">不由标记决定、由投影自动加的段落</text>
<text x="36" y="556" font-size="12" fill="#1F2937">章名（目录顶层）</text>
<text x="526" y="556" font-size="12" fill="#1F2937">→ 笔记本开头一段 Title（码 2）</text>
<text x="896" y="556" font-size="12" fill="#1F2937">→ front-matter 的 chapter 与文件名</text>
<text x="36" y="578" font-size="12" fill="#1F2937">书的小节名（目录下一级）</text>
<text x="526" y="578" font-size="12" fill="#1F2937">→ 小节变化处先插一段 Subheading 1</text>
<text x="896" y="578" font-size="12" fill="#1F2937">→ 先出一行 ## 小节名</text>
<text x="36" y="600" font-size="12" fill="#1F2937">勾画原文 / AI 回答</text>
<text x="526" y="600" font-size="12" fill="#1F2937">→ 紧跟条目的 Body：〔原文〕… 〔AI〕…</text>
<text x="896" y="600" font-size="12" fill="#1F2937">→ 引用块</text>
<text x="36" y="622" font-size="12" fill="#6B7280">已知限制（用户 09-25 决定不改）：两条编号条目之间夹了〔原文〕/〔AI〕段，编号会从 1 重来；没转写的条目写“（待转写）”。</text>
</svg>
