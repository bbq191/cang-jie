<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ov-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ov-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="ov-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="ov-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">一条笔记的旅程：从荧光笔到设备笔记本 / Obsidian</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">设备只负责写，改在手机上做；条目库是唯一事实源，设备笔记本和 md 都由它重新生成</text>
<rect x="20" y="90" width="260" height="150" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="34" y="112" font-size="13" fill="#1F2937" font-weight="bold">① 在 reMarkable 上读书</text>
<text x="34" y="132" font-size="12" fill="#1F2937">用荧光笔勾一段原文</text>
<text x="34" y="150" font-size="12" fill="#1F2937">在旁边手写批注（可以不写）</text>
<text x="34" y="168" font-size="12" fill="#1F2937">合上书</text>
<rect x="320" y="90" width="260" height="150" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="334" y="112" font-size="13" fill="#1F2937" font-weight="bold">② 摄取 · ink-serve</text>
<text x="334" y="132" font-size="12" fill="#1F2937">只解析变了的书页 .rm</text>
<text x="334" y="150" font-size="12" fill="#1F2937">勾画 + 旁边手写 → 一个条目</text>
<text x="334" y="168" font-size="12" fill="#1F2937">画手写灰度裁图、按目录归章</text>
<text x="334" y="186" font-size="12" fill="#6B7280">状态：Mined（待浏览）</text>
<rect x="620" y="90" width="260" height="150" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="634" y="112" font-size="13" fill="#1F2937" font-weight="bold">③ 浏览 · 手机网页</text>
<text x="634" y="132" font-size="12" fill="#1F2937">「笔记 → 浏览」看裁图和原文</text>
<text x="634" y="150" font-size="12" fill="#1F2937">「转入笔记」→ 待转写</text>
<text x="634" y="168" font-size="12" fill="#1F2937">「不需要」→ 回收站（可恢复）</text>
<text x="634" y="186" font-size="12" fill="#6B7280">纯勾画转入后直接定稿</text>
<rect x="920" y="90" width="260" height="150" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="934" y="112" font-size="13" fill="#1F2937" font-weight="bold">④ 转写 · transcribe-serve</text>
<text x="934" y="132" font-size="12" fill="#1F2937">裁图交给视觉模型</text>
<text x="934" y="150" font-size="12" fill="#1F2937">识别结果写回成草稿</text>
<text x="934" y="168" font-size="12" fill="#6B7280">状态：Draft（待校对）</text>
<text x="934" y="186" font-size="12" fill="#6B7280">自动跑；也可单条「重新转写」</text>
<rect x="920" y="300" width="260" height="150" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="934" y="322" font-size="13" fill="#1F2937" font-weight="bold">⑤ 整理 · 手机网页</text>
<text x="934" y="342" font-size="12" fill="#1F2937">改字，失焦即保存（→ 定稿）</text>
<text x="934" y="360" font-size="12" fill="#1F2937">行首 ## 1. - 口 决定样式</text>
<text x="934" y="378" font-size="12" fill="#1F2937">选去处：笔记本 / Obsidian / 两处</text>
<text x="934" y="396" font-size="12" fill="#1F2937">「不要了」→ 回收站</text>
<rect x="620" y="300" width="260" height="150" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="634" y="322" font-size="13" fill="#1F2937" font-weight="bold">⑥ 问 AI · mind-serve（可选）</text>
<text x="634" y="342" font-size="12" fill="#1F2937">勾「问 AI」、填问题</text>
<text x="634" y="360" font-size="12" fill="#1F2937">点「提问」才调文字模型</text>
<text x="634" y="378" font-size="12" fill="#1F2937">回答写回这一条</text>
<rect x="320" y="300" width="260" height="150" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="334" y="322" font-size="13" fill="#1F2937" font-weight="bold">⑦ 推送 · note-serve</text>
<text x="334" y="342" font-size="12" fill="#1F2937">每章一个「推送本章」</text>
<text x="334" y="360" font-size="12" fill="#1F2937">按每条的去处分两路生成</text>
<text x="334" y="378" font-size="12" fill="#1F2937">内容没变就跳过</text>
<text x="334" y="396" font-size="12" fill="#6B7280">旧版笔记本自动进回收站</text>
<rect x="20" y="300" width="260" height="150" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="34" y="322" font-size="13" fill="#1F2937" font-weight="bold">⑧ 得到</text>
<text x="34" y="342" font-size="12" fill="#1F2937">设备笔记本：一章一本，</text>
<text x="34" y="360" font-size="12" fill="#1F2937">放在书所在的文件夹</text>
<text x="34" y="378" font-size="12" fill="#1F2937">Obsidian md：一章一个文件，</text>
<text x="34" y="396" font-size="12" fill="#1F2937">提示里点链接下载</text>
<path d="M280,165.0 L318,165.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ov-arr)"/>
<path d="M580,165.0 L618,165.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ov-arr)"/>
<path d="M880,165.0 L918,165.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ov-arr)"/>
<path d="M1050.0,240 L1050.0,298" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ov-arr)"/>
<path d="M920,375.0 L882,375.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ov-arr)"/>
<path d="M620,375.0 L582,375.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ov-arr)"/>
<path d="M320,375.0 L282,375.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ov-arr)"/>
<rect x="20" y="490" width="1160" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="512" font-size="13" fill="#1F2937" font-weight="bold">条目库  ~/.local/state/notes/books/&lt;书 uuid&gt;.json（一本书一个文件）</text>
<text x="34" y="532" font-size="12" fill="#1F2937">只有 ink-serve 能写；转写、问 AI、网页改字都经 ink-serve 的 HTTP 接口改它，推送只读它。</text>
<text x="34" y="550" font-size="12" fill="#1F2937">步骤 ②–⑥ 改的都是这里的同一条记录：原文、手写裁图、草稿、定稿、样式、去处、问题与回答。</text>
</svg>
