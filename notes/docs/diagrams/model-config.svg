<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="mc-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="mc-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="mc-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">模型管理：预置表、key 按厂商分存、用量按模型分账</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">入口：网关「管理」tab 的“模型管理”卡片（视觉 = 转写，文字 = 问 AI，各一张）；后端共享逻辑在 crates/vendorcfg</text>
<rect x="20" y="84" width="370" height="190" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="34" y="106" font-size="13" fill="#1F2937" font-weight="bold">① 选模型（两级下拉）</text>
<text x="34" y="127" font-size="12" fill="#1F2937">先选厂商：DashScope / OpenAI / Gemini /</text>
<text x="34" y="146" font-size="12" fill="#1F2937">DeepSeek / 自定义；再选该厂商的模型</text>
<text x="34" y="165" font-size="12" fill="#1F2937">PUT /config {preset} 一次改好模型名和地址</text>
<text x="34" y="184" font-size="12" fill="#1F2937">不认识的预置名 → 400，配置不变</text>
<text x="34" y="203" font-size="12" fill="#1F2937">“自定义”才露出手填模型名和接口地址</text>
<rect x="415" y="84" width="370" height="190" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="429" y="106" font-size="13" fill="#1F2937" font-weight="bold">② key 按厂商分格</text>
<text x="429" y="127" font-size="12" fill="#1F2937">keys：厂商 → key（transcribe.json / mind.json，</text>
<text x="429" y="146" font-size="12" fill="#1F2937">权限 0600）；同厂商换模型不用重新粘贴</text>
<text x="429" y="165" font-size="12" fill="#1F2937">切到没配 key 的厂商就显示“没配”</text>
<text x="429" y="184" font-size="12" fill="#1F2937">预置查不到时按接口地址认厂商（PROVIDERS 表）</text>
<text x="429" y="203" font-size="12" fill="#1F2937">网页只显示后四位；环境变量只给 DashScope 兜底</text>
<rect x="810" y="84" width="370" height="190" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="824" y="106" font-size="13" fill="#1F2937" font-weight="bold">③ 用量与花费</text>
<text x="824" y="127" font-size="12" fill="#1F2937">按预置 id（自定义：custom:&lt;模型名&gt;）分账：</text>
<text x="824" y="146" font-size="12" fill="#1F2937">次数、成功失败、输入输出 token、最近错误</text>
<text x="824" y="165" font-size="12" fill="#1F2937">单价自己填：price {inputPer1k, outputPer1k}</text>
<text x="824" y="184" font-size="12" fill="#1F2937">没填 → 花费显示为空（不是 0）</text>
<text x="824" y="203" font-size="12" fill="#1F2937">转写一轮只写一次账本（Ledger::hold）</text>
<path d="M390,179 L413,179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#mc-arr)"/>
<path d="M785,179 L808,179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#mc-arr)"/>
<rect x="20" y="296" width="1160" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="600" y="320" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">现行预置表（以 services/*/src/config.rs 为准；第一项是缺省）</text>
<text x="40" y="348" font-size="12" fill="#6B7280" font-weight="bold">厂商</text>
<text x="220" y="348" font-size="12" fill="#6B7280" font-weight="bold">视觉（transcribe）</text>
<text x="700" y="348" font-size="12" fill="#6B7280" font-weight="bold">文字（mind）</text>
<text x="40" y="374" font-size="12" fill="#1F2937">DashScope</text>
<text x="220" y="374" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">qwen3-vl-plus · qwen-vl-max · qwen-vl-plus</text>
<text x="700" y="374" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">qwen-plus · qwen-max · qwen-turbo</text>
<text x="40" y="396" font-size="12" fill="#1F2937">OpenAI</text>
<text x="220" y="396" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">gpt-5.6-terra · gpt-6-astra</text>
<text x="700" y="396" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">gpt-5.6-luna · gpt-5.6-terra</text>
<text x="40" y="418" font-size="12" fill="#1F2937">Gemini</text>
<text x="220" y="418" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">gemini-3.8-flash</text>
<text x="700" y="418" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">gemini-3.8-flash</text>
<text x="40" y="440" font-size="12" fill="#1F2937">DeepSeek</text>
<text x="220" y="440" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">deepseek-flash</text>
<text x="700" y="440" font-size="12" fill="#1F2937" font-family="DejaVu Sans Mono, Menlo, monospace">deepseek-flash · deepseek-v4-pro</text>
<rect x="20" y="484" width="570" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="506" font-size="13" fill="#1F2937" font-weight="bold">调用端（vendorcfg::chat）</text>
<text x="34" y="526" font-size="12" fill="#1F2937">配置不变复用连接；闲置超过 45 秒重建；429 / 5xx / 连不上：等一下重试一次</text>
<rect x="610" y="484" width="570" height="60" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="624" y="506" font-size="13" fill="#1F2937" font-weight="bold">配置文件坏了</text>
<text x="624" y="526" font-size="12" fill="#1F2937">按缺省运行但不写回，旁边另存 .corrupt；用户在网页上保存才写新文件</text>
</svg>
