<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="op-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="op-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="op-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="op-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">「笔记」页的布局</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">页面代码在 gateway/ui/notes.js 的 renderNotes；目标：屏幕上同一时刻最多只有一章的内容</text>
<rect x="20" y="84" width="560" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="34" y="106" font-size="13" fill="#1F2937" font-weight="bold">顶部：选书 · 「重扫」 · 搜索框</text>
<text x="34" y="126" font-size="12" fill="#1F2937">子视图：浏览 · 整理 · 回收站 · 导入 md 文档</text>
<text x="34" y="144" font-size="12" fill="#6B7280">（导入 md 默认隐藏，由「管理 → 实验室」开关控制）</text>
<rect x="20" y="182" width="560" height="104" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="204" font-size="13" fill="#1F2937" font-weight="bold">「整理」第一层：未导出 / 已导出</text>
<text x="34" y="224" font-size="12" fill="#1F2937">一章归哪边只看“推送过没有”（everExported）</text>
<text x="34" y="242" font-size="12" fill="#1F2937">推送过就稳定留在「已导出」；之后又改了，章头徽章 ✓ 变 …</text>
<text x="34" y="260" font-size="12" fill="#1F2937">没有章的条目（未归章）永远在「未导出」、没有推送按钮</text>
<rect x="20" y="308" width="560" height="86" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="34" y="330" font-size="13" fill="#1F2937" font-weight="bold">第二层：章节标签</text>
<text x="34" y="350" font-size="12" fill="#1F2937">只列当前 tab 下有条目的章；点哪章只显示哪章</text>
<text x="34" y="368" font-size="12" fill="#1F2937">编辑不会把画面甩到别的章；点 tab 或推送成功后才跳下一章</text>
<rect x="20" y="416" width="560" height="104" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="34" y="438" font-size="13" fill="#1F2937" font-weight="bold">章头</text>
<text x="34" y="458" font-size="12" fill="#1F2937">章名 · 条数 · 同步徽章（设备笔记本 / Obsidian，✓ = 与当前内容一致）</text>
<text x="34" y="476" font-size="12" fill="#1F2937">「推送本章」：按每条的去处生成笔记本、导出 md</text>
<text x="34" y="494" font-size="12" fill="#1F2937">md 下载链接在提示里给（避免被浏览器当弹窗拦）</text>
<path d="M300,160 L300,180" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#op-arr)"/>
<path d="M300,286 L300,306" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#op-arr)"/>
<path d="M300,394 L300,414" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#op-arr)"/>
<rect x="610" y="84" width="570" height="490" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="626" y="106" font-size="13" fill="#1F2937" font-weight="bold">条目卡片（每条一张）</text>
<rect x="626" y="120" width="538" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="640" y="142" font-size="13" fill="#1F2937" font-weight="bold">卡片头</text>
<text x="640" y="162" font-size="12" fill="#1F2937">页码 · 小节 · 样式 · 本条去处的同步徽章 · 状态</text>
<rect x="626" y="192" width="538" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="640" y="214" font-size="13" fill="#1F2937" font-weight="bold">裁图 + 勾画原文</text>
<text x="640" y="234" font-size="12" fill="#1F2937">手写的灰度裁图（纯勾画没有）；原文来自 .rm，不经识别</text>
<rect x="626" y="264" width="538" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="640" y="286" font-size="13" fill="#1F2937" font-weight="bold">文本框</text>
<text x="640" y="306" font-size="12" fill="#1F2937">显示“定稿，没有就用最新草稿”；失焦即保存；行首标记定样式</text>
<rect x="626" y="336" width="538" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="640" y="358" font-size="13" fill="#1F2937" font-weight="bold">去处按钮（循环）</text>
<text x="640" y="378" font-size="12" fill="#1F2937">设备笔记本 → Obsidian → 两处（缺省两处）</text>
<rect x="626" y="408" width="538" height="62" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="640" y="430" font-size="13" fill="#1F2937" font-weight="bold">问 AI 区</text>
<text x="640" y="450" font-size="12" fill="#1F2937">勾「问 AI」+ 问题框 +「提问」；回答直接显示</text>
<rect x="626" y="480" width="538" height="62" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
<text x="640" y="502" font-size="13" fill="#1F2937" font-weight="bold">「重新转写」·「不要了」</text>
<text x="640" y="522" font-size="12" fill="#1F2937">转写失败时卡片标红、按钮显示“转写失败”；不要了 → 回收站</text>
<text x="20" y="548" font-size="12" fill="#6B7280">「浏览」只列 Mined，按页分组、最近变动的页在前，每条「转入笔记」「不需要」；</text>
<text x="20" y="568" font-size="12" fill="#6B7280">「回收站」列三种终态的内容，每条「恢复」，另有「全部恢复」「清空回收站」（都要确认）。</text>
</svg>
