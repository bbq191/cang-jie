<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d00"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#fbfbfa"/>
  <text x="520" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">notes 架构：条目库唯一写者 = ink-serve</text>
  <text x="520" y="47" text-anchor="middle" font-size="11.5" fill="#8a8a8a">挂靠书架同一网关 shelf-gateway :8778（复用注册表/事件汇聚，不自建），见 shelf/docs/diagrams/architecture.svg</text>

  <!-- xochitl 书库 -->
  <rect x="50" y="150" width="230" height="96" rx="9" fill="#f1f1f6" stroke="#7a7a8c" stroke-width="1.5"/>
  <text x="165" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">xochitl 书库（只读）</text>
  <text x="165" y="195" text-anchor="middle" font-size="10.5" fill="#4a4a4a">~/.local/share/remarkable/</text>
  <text x="165" y="210" text-anchor="middle" font-size="10.5" fill="#4a4a4a">xochitl/&lt;uuid&gt;/&lt;page&gt;.rm</text>
  <text x="165" y="228" text-anchor="middle" font-size="10.2" fill="#a03030">notes 全线绝不写这里</text>

  <line x1="280" y1="198" x2="378" y2="198" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="329" y="185" text-anchor="middle" font-size="10.5" fill="#5a5a5a">fswatch 防抖</text>
  <text x="329" y="216" text-anchor="middle" font-size="10.5" fill="#5a5a5a">只扫变更页</text>

  <!-- ink-serve (central) -->
  <rect x="382" y="130" width="280" height="140" rx="10" fill="#fff3d6" stroke="#c9971f" stroke-width="2"/>
  <text x="522" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ink-serve 矿 :8795</text>
  <text x="522" y="178" text-anchor="middle" font-size="11" fill="#4a4a4a">rmv6 解析 → notecore 聚簇/配对/增量合并</text>
  <text x="522" y="195" text-anchor="middle" font-size="11" fill="#4a4a4a">→ 裁图 → 条目库；零网络</text>
  <rect x="402" y="206" width="240" height="52" rx="6" fill="#ffffff" stroke="#c9971f" stroke-width="1.1"/>
  <text x="522" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">条目库（唯一写者）</text>
  <text x="522" y="240" text-anchor="middle" font-size="9.8" fill="#5a5a5a">~/.local/state/notes/books/&lt;uuid&gt;.json</text>
  <text x="522" y="253" text-anchor="middle" font-size="9.5" fill="#8a8a8a">原子写；裁片 PNG 落 crops/</text>

  <!-- consumers row -->
  <rect x="30" y="330" width="200" height="100" rx="9" fill="#fdf3f0" stroke="#b5541f" stroke-width="1.5"/>
  <text x="130" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">transcribe-serve</text>
  <text x="130" y="372" text-anchor="middle" font-size="10.5" fill="#4a4a4a">:8796 转写</text>
  <text x="130" y="390" text-anchor="middle" font-size="10.2" fill="#5a5a5a">订阅 ink /events</text>
  <text x="130" y="405" text-anchor="middle" font-size="10.2" fill="#5a5a5a">取裁图喂视觉模型</text>
  <text x="130" y="420" text-anchor="middle" font-size="10.2" fill="#5a5a5a">draft 写回；出网之一</text>

  <rect x="255" y="330" width="200" height="100" rx="9" fill="#eaf3fb" stroke="#2f6fa3" stroke-width="1.5"/>
  <text x="355" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">note-serve 本</text>
  <text x="355" y="372" text-anchor="middle" font-size="10.5" fill="#4a4a4a">:8798，注册「笔记」tab</text>
  <text x="355" y="390" text-anchor="middle" font-size="10.2" fill="#5a5a5a">投影→设备笔记本</text>
  <text x="355" y="405" text-anchor="middle" font-size="10.2" fill="#5a5a5a">+ md 导出（已上线，可下载）</text>

  <rect x="480" y="330" width="200" height="100" rx="9" fill="#f5eefc" stroke="#7a4fa3" stroke-width="1.5"/>
  <text x="580" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">mind-serve 脑</text>
  <text x="580" y="372" text-anchor="middle" font-size="10.5" fill="#4a4a4a">:8797，无后台线程</text>
  <text x="580" y="390" text-anchor="middle" font-size="10.2" fill="#5a5a5a">按条目单发问 AI（纯被动）</text>
  <text x="580" y="405" text-anchor="middle" font-size="10.2" fill="#5a5a5a">answer 写回；出网见下</text>

  <rect x="800" y="330" width="210" height="100" rx="9" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="905" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">手机网页「笔记」tab</text>
  <text x="905" y="374" text-anchor="middle" font-size="10.5" fill="#4a4a4a">经 shelf-gateway</text>
  <text x="905" y="392" text-anchor="middle" font-size="10.2" fill="#5a5a5a">改字/去处/问AI，改即存</text>
  <text x="905" y="408" text-anchor="middle" font-size="10.2" fill="#5a5a5a">e-ink 打字太痛苦，设备只读</text>

  <!-- arrows to ink-serve -->
  <line x1="150" y1="330" x2="450" y2="272" stroke="#555" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="370" y1="330" x2="495" y2="272" stroke="#555" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="580" y1="330" x2="545" y2="272" stroke="#555" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="880" y1="330" x2="605" y2="272" stroke="#555" stroke-width="1.4" marker-end="url(#a1)"/>

  <text x="522" y="300" text-anchor="middle" font-size="10.8" fill="#5a5a5a">全部经 ink-serve 的 HTTP 改字段（GET 条目 / POST text·destination·style·draft·answer·askAi·question）</text>

  <!-- transcribe + mind -> cloud -->
  <line x1="130" y1="430" x2="130" y2="470" stroke="#8a6d00" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <line x1="580" y1="430" x2="580" y2="452" stroke="#8a6d00" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="580" y1="452" x2="150" y2="452" stroke="#8a6d00" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="150" y1="452" x2="150" y2="470" stroke="#8a6d00" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <rect x="20" y="472" width="220" height="66" rx="9" fill="#fdf6e3" stroke="#8a6d00" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="130" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a3a00">四厂商模型 API</text>
  <text x="130" y="511" text-anchor="middle" font-size="10" fill="#6a5a2a">DashScope/OpenAI/Gemini/DeepSeek 预置</text>
  <text x="130" y="526" text-anchor="middle" font-size="9.8" fill="#8a7a4a">key 按厂商分存；设备自己 WiFi 直连出网</text>

  <!-- legend -->
  <rect x="700" y="480" width="16" height="12" rx="3" fill="#fdf6e3" stroke="#8a6d00" stroke-dasharray="3 2"/>
  <text x="722" y="490" font-size="10.5" fill="#5a5a5a">虚线 = 出网（四厂商模型 API）</text>

  <text x="520" y="580" text-anchor="middle" font-size="12" fill="#6a6a6a">四服务失败面分离：矿零网络（解析错只影响新条目）· 转写/脑出网（断网只是积压，脑连事件订阅都没有）· 本只碰输出物（xochitl /upload）</text>
  <text x="520" y="600" text-anchor="middle" font-size="11" fill="#8a8a8a">API 细节见 notes/README.md「主要 API」；架构决策见 notes/docs/reMarkable笔记白皮书.md 01 节</text>
</svg>
