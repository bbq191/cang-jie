<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ar-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ar-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="ar-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="ar-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">笔记线的组成：四个服务 + 五个库</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">都在设备上运行；服务只监听 127.0.0.1，浏览器经网关访问</text>
<rect x="470" y="80" width="260" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="600.0" y="102" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">手机 / 电脑浏览器</text>
<text x="600.0" y="120" font-size="11" fill="#1F2937" text-anchor="middle">「笔记」页 · 「管理 → 模型管理」</text>
<rect x="20" y="160" width="1160" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="600.0" y="182" font-size="13" fill="#1F2937" font-weight="bold" text-anchor="middle">网关 gateway（HTTPS :443，登录、转发、事件汇聚）</text>
<text x="600.0" y="202" font-size="12" fill="#1F2937" text-anchor="middle">/api/ink  ·  /api/transcribe  ·  /api/mind  ·  /api/notes  →  127.0.0.1 上对应端口</text>
<path d="M600,128 L600,158" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<rect x="20" y="260" width="260" height="130" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="34" y="282" font-size="13" fill="#1F2937" font-weight="bold">ink-serve（矿）:8795</text>
<text x="34" y="302" font-size="12" fill="#1F2937">条目库的唯一写者</text>
<text x="34" y="320" font-size="12" fill="#1F2937">监听书库 → 摄取 → 裁图</text>
<text x="34" y="338" font-size="12" fill="#1F2937">全文搜索</text>
<text x="34" y="356" font-size="12" fill="#6B7280">不出网</text>
<rect x="320" y="260" width="260" height="130" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="334" y="282" font-size="13" fill="#1F2937" font-weight="bold">transcribe-serve（转写）:8796</text>
<text x="334" y="302" font-size="12" fill="#1F2937">订阅 ink 的条目事件</text>
<text x="334" y="320" font-size="12" fill="#1F2937">手写裁图 → 视觉模型 → 草稿</text>
<text x="334" y="338" font-size="12" fill="#1F2937">用量账本</text>
<text x="334" y="356" font-size="12" fill="#6B7280">出网</text>
<rect x="620" y="260" width="260" height="130" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="634" y="282" font-size="13" fill="#1F2937" font-weight="bold">mind-serve（脑）:8797</text>
<text x="634" y="302" font-size="12" fill="#1F2937">用户点「提问」才运行</text>
<text x="634" y="320" font-size="12" fill="#1F2937">文字模型 → 回答</text>
<text x="634" y="338" font-size="12" fill="#1F2937">没有后台线程、不发事件</text>
<text x="634" y="356" font-size="12" fill="#6B7280">出网</text>
<rect x="920" y="260" width="260" height="130" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="934" y="282" font-size="13" fill="#1F2937" font-weight="bold">note-serve（本）:8798</text>
<text x="934" y="302" font-size="12" fill="#1F2937">注册「笔记」tab</text>
<text x="934" y="320" font-size="12" fill="#1F2937">生成设备笔记本、导出 md</text>
<text x="934" y="338" font-size="12" fill="#1F2937">单篇 md 导入</text>
<text x="934" y="356" font-size="12" fill="#6B7280">不出网（只调 xochitl /upload）</text>
<path d="M150.0,216 L150.0,258" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<path d="M450.0,216 L450.0,258" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<path d="M750.0,216 L750.0,258" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<path d="M1050.0,216 L1050.0,258" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<path d="M1050.0,390 L1050.0,420 L190.0,420 L190.0,392" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar-arr)"/>
<path d="M450.0,390 L450.0,420" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M750.0,390 L750.0,420" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="398.4" y="403" width="403.1" height="16" fill="#FFFFFF"/>
<text x="600" y="414" font-size="11" fill="#1F2937" text-anchor="middle">经 notesvc::InkClient 调 ink-serve 的 HTTP：读书、取裁图、写草稿 / 回答</text>
<rect x="20" y="460" width="260" height="76" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="34" y="482" font-size="13" fill="#1F2937" font-weight="bold">xochitl 书库（只读）</text>
<text x="34" y="500" font-size="11" fill="#1F2937">.rm 笔迹 · .content · .metadata</text>
<text x="34" y="516" font-size="11" fill="#1F2937">.epub · .epubindex</text>
<rect x="320" y="460" width="560" height="76" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="334" y="482" font-size="13" fill="#1F2937" font-weight="bold">模型厂商（OpenAI 兼容 /chat/completions）</text>
<text x="334" y="500" font-size="11" fill="#1F2937">DashScope · OpenAI · Gemini · DeepSeek · 自定义地址</text>
<text x="334" y="516" font-size="11" fill="#1F2937">设备自己的 WiFi 直连</text>
<rect x="920" y="460" width="260" height="76" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="934" y="482" font-size="13" fill="#1F2937" font-weight="bold">xochitl /upload · book-serve</text>
<text x="934" y="500" font-size="11" fill="#1F2937">上传笔记本 .rmdoc</text>
<text x="934" y="516" font-size="11" fill="#1F2937">旧版本进回收站队列</text>
<path d="M90,460 L90,392" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<rect x="57.8" y="436" width="64.4" height="15" fill="#FFFFFF"/>
<text x="90" y="446" font-size="10" fill="#6B7280" text-anchor="middle">inotify + 读</text>
<path d="M450.0,390 L450.0,458" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<path d="M750.0,390 L750.0,458" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<path d="M1120,390 L1120,458" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar-arr)"/>
<rect x="20" y="560" width="1160" height="110" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36" y="580" font-size="12" fill="#6B7280" font-weight="bold">共用的库（notes/crates，外加基座 rmsvc-core）</text>
<rect x="34" y="592" width="178" height="66" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="44" y="614" font-size="13" fill="#1F2937" font-weight="bold">rmv6</text>
<text x="44" y="632" font-size="11" fill="#1F2937">.rm v6 解析 + 写入</text>
<text x="44" y="648" font-size="11" fill="#1F2937">（ink 读页，note 写页）</text>
<rect x="226" y="592" width="178" height="66" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="236" y="614" font-size="13" fill="#1F2937" font-weight="bold">epubmap</text>
<text x="236" y="632" font-size="11" fill="#1F2937">页号 → 章 / 小节名</text>
<text x="236" y="648" font-size="11" fill="#1F2937">（ink）</text>
<rect x="418" y="592" width="178" height="66" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="428" y="614" font-size="13" fill="#1F2937" font-weight="bold">notecore</text>
<text x="428" y="632" font-size="11" fill="#1F2937">条目模型 · 状态转移</text>
<text x="428" y="648" font-size="11" fill="#1F2937">投影 · md · HTTP 契约</text>
<rect x="610" y="592" width="178" height="66" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="614" font-size="13" fill="#1F2937" font-weight="bold">vendorcfg</text>
<text x="620" y="632" font-size="11" fill="#1F2937">预置 · key · 用量账本</text>
<text x="620" y="648" font-size="11" fill="#1F2937">模型调用端（转写 / 脑）</text>
<rect x="802" y="592" width="178" height="66" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="812" y="614" font-size="13" fill="#1F2937" font-weight="bold">notesvc</text>
<text x="812" y="632" font-size="11" fill="#1F2937">InkClient</text>
<text x="812" y="648" font-size="11" fill="#1F2937">（转写 / 脑 / 本）</text>
<rect x="994" y="592" width="178" height="66" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1004" y="614" font-size="13" fill="#1F2937" font-weight="bold">rmsvc-core</text>
<text x="1004" y="632" font-size="11" fill="#1F2937">基座：HTTP · 注册表</text>
<text x="1004" y="648" font-size="11" fill="#1F2937">事件 · xochitl 上传认领</text>
</svg>
