<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ig-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="ig-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="ig-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="600.0" y="36" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">摄取：从书页 .rm 到条目（ink-serve）</text>
<text x="600.0" y="60" font-size="12" fill="#6B7280" text-anchor="middle">每本书单独处理、套 catch_unwind；书库只读，绝不写</text>
<rect x="20" y="84" width="266" height="128" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="34" y="106" font-size="13" fill="#1F2937" font-weight="bold">1 触发</text>
<text x="34" y="126" font-size="12" fill="#1F2937">书库目录 inotify（非递归）</text>
<text x="34" y="144" font-size="12" fill="#1F2937">防抖 debounceSecs = 4 秒</text>
<text x="34" y="162" font-size="12" fill="#1F2937">启动时把已知的书追平一遍</text>
<text x="34" y="180" font-size="12" fill="#6B7280">页 .rm 的写入不监听</text>
<rect x="318" y="84" width="266" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="332" y="106" font-size="13" fill="#1F2937" font-weight="bold">2 选页</text>
<text x="332" y="126" font-size="12" fill="#1F2937">只扫 .rm 修改时间变了的页</text>
<text x="332" y="144" font-size="12" fill="#1F2937">都没变：连 .content 都不读</text>
<text x="332" y="162" font-size="12" fill="#1F2937">正被写的页这次跳过</text>
<text x="332" y="180" font-size="12" fill="#6B7280">只收活的 EPUB</text>
<rect x="616" y="84" width="266" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="630" y="106" font-size="13" fill="#1F2937" font-weight="bold">3 解析（rmv6::page）</text>
<text x="630" y="126" font-size="12" fill="#1F2937">手写笔画</text>
<text x="630" y="144" font-size="12" fill="#1F2937">勾画：原文 + 每行矩形</text>
<text x="630" y="162" font-size="12" fill="#1F2937">擦掉的项剔除</text>
<text x="630" y="180" font-size="12" fill="#6B7280">长度字段先和剩余字节比</text>
<rect x="914" y="84" width="266" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="928" y="106" font-size="13" fill="#1F2937" font-weight="bold">4 聚簇（notecore::geom）</text>
<text x="928" y="126" font-size="12" fill="#1F2937">两笔包围盒间距 ≤ clusterGap 40</text>
<text x="928" y="144" font-size="12" fill="#1F2937">→ 同一片手写</text>
<text x="928" y="162" font-size="12" fill="#1F2937">不看笔序和时间</text>
<text x="928" y="180" font-size="12" fill="#6B7280">荧光笔自己的笔画排除</text>
<rect x="914" y="262" width="266" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="928" y="284" font-size="13" fill="#1F2937" font-weight="bold">5 配对</text>
<text x="928" y="304" font-size="12" fill="#1F2937">每簇配最近的勾画</text>
<text x="928" y="322" font-size="12" fill="#1F2937">距离 ≤ pairGap 160</text>
<text x="928" y="340" font-size="12" fill="#1F2937">配不上 → 本页批注</text>
<text x="928" y="358" font-size="12" fill="#1F2937">没配上手写的勾画单独成条</text>
<rect x="616" y="262" width="266" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="630" y="284" font-size="13" fill="#1F2937" font-weight="bold">6 归章（epubmap）</text>
<text x="630" y="304" font-size="12" fill="#1F2937">.epubindex：章节文件起始页</text>
<text x="630" y="322" font-size="12" fill="#1F2937">目录 nav / NCX：章与小节</text>
<text x="630" y="340" font-size="12" fill="#1F2937">页号 → 章 + 小节名</text>
<text x="630" y="358" font-size="12" fill="#6B7280">不在目录里的文件归前一章</text>
<rect x="318" y="262" width="266" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="332" y="284" font-size="13" fill="#1F2937" font-weight="bold">7 增量合并（notecore::ingest）</text>
<text x="332" y="304" font-size="12" fill="#1F2937">指纹没变：不动你改过的字</text>
<text x="332" y="322" font-size="12" fill="#1F2937">新条目：状态 Mined</text>
<text x="332" y="340" font-size="12" fill="#1F2937">笔迹没了：Revoked</text>
<text x="332" y="358" font-size="12" fill="#1F2937">笔迹回来：复活原条目</text>
<rect x="20" y="262" width="266" height="128" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="34" y="284" font-size="13" fill="#1F2937" font-weight="bold">8 裁图、落盘、发事件</text>
<text x="34" y="304" font-size="12" fill="#1F2937">按条目自己的笔画画灰度 PNG</text>
<text x="34" y="322" font-size="12" fill="#1F2937">留白 24、最多约 400 万像素</text>
<text x="34" y="340" font-size="12" fill="#1F2937">写条目库（有改动才写）</text>
<text x="34" y="358" font-size="12" fill="#1F2937">发事件 notes / entries</text>
<path d="M286,148.0 L316,148.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ig-arr)"/>
<path d="M584,148.0 L614,148.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ig-arr)"/>
<path d="M882,148.0 L912,148.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ig-arr)"/>
<path d="M1047.0,212 L1047.0,260" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ig-arr)"/>
<path d="M914,326.0 L884,326.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ig-arr)"/>
<path d="M616,326.0 L586,326.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ig-arr)"/>
<path d="M318,326.0 L288,326.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ig-arr)"/>
<text x="600" y="420" font-size="11" fill="#6B7280" text-anchor="middle">坐标：EPUB 页 .rm 用排版引擎的虚拟画布 960×1280（原点在 x 中间），不是物理屏 1404×1872；勾画与手写在同一坐标系，配对不用换算。</text>
</svg>
